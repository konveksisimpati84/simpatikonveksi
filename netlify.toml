[build]
  publish = "."

# Program server absensi (dipakai di PC konveksi) tidak ikut dibuka di website
[[redirects]]
  from = "/server-absensi/*"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Aplikasi boleh disimpan di perangkat, tapi selalu dicek ke server tiap dibuka (must-revalidate):
# bila tidak ada versi baru, server cukup menjawab "tidak berubah" (tanpa mengunduh ulang ±1,9 MB);
# bila ada versi baru, langsung diunduh. Jadi versi baru tetap langsung terpakai.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Pasang di HP seperti aplikasi: service worker & manifest selalu dicek ke server (pembaruan langsung terpakai)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
