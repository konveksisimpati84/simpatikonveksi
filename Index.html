                if (currentIndex === 0) return order.sizes[size] || 0;
                for (let i = currentIndex - 1; i >= 0; i--) {
                    const prevStageId = stagesOrder[i];
                    const prevStageData = order.progress[prevStageId];
                    const prevStageTotals = getStageSizeTotals(prevStageData);
                    const hasOutput = Object.values(prevStageTotals).some(v => parseInt(v) > 0);
                    if (prevStageData?.status !== 'Belum' || hasOutput) {
                        return prevStageTotals[size] || 0;
                    }
                }
                return 0;
            };

            const recalculateOrderStatuses = (order) => {
                const newProgress = { ...order.progress };
                const stagesOrder = ['cutting', 'sablon', 'jahit', 'kancing', 'finishing'];
                
                stagesOrder.forEach(stageId => {
                    const stageData = newProgress[stageId];
                    if (!stageData) return;
                    
                    let isAllSizesCompleted = true;
                    let totalCompletedAllSizes = 0;
                    Object.keys(order.sizes).forEach(size => {
                        const target = order.sizes[size];
                        let completedForSize = 0;
                        if (stageData.workLogs) {
                            stageData.workLogs.forEach(log => { if (log.size === size) completedForSize += (parseInt(log.qty) || 0); });
                        }
                        totalCompletedAllSizes += completedForSize;
                        if (completedForSize < target) isAllSizesCompleted = false;
                    });
                    if (totalCompletedAllSizes === 0) stageData.status = 'Belum';
                    else if (isAllSizesCompleted) stageData.status = 'Selesai';
                    else stageData.status = 'Proses';
                });

                let isFullyShipped = true;
                Object.keys(order.sizes).forEach(sz => { if ((order.shipped?.[sz] || 0) < order.sizes[sz]) isFullyShipped = false; });
                
                let overallStatus = order.status; 
                if (isFullyShipped) overallStatus = 'Terkirim';
                else if (newProgress.finishing.status === 'Selesai') overallStatus = 'Siap Kirim';
                else if (newProgress.finishing.status === 'Proses') overallStatus = 'Proses Finishing';
                else if (newProgress.kancing?.status === 'Selesai') overallStatus = 'Proses Finishing';
                else if (newProgress.kancing?.status === 'Proses') overallStatus = 'Proses Pasang Kancing';
                else if (newProgress.jahit.status === 'Selesai') overallStatus = 'Proses Pasang Kancing';
                else if (newProgress.jahit.status === 'Proses') overallStatus = 'Proses Jahit';
                else if (newProgress.sablon.status === 'Selesai') overallStatus = 'Proses Jahit';
                else if (newProgress.sablon.status === 'Proses') overallStatus = 'Proses Sablon/Bordir';
                else if (newProgress.cutting.status === 'Selesai') overallStatus = 'Proses Sablon/Bordir';
                else if (newProgress.cutting.status === 'Proses') overallStatus = 'Proses Cutting';
                else overallStatus = 'Pending'; 

                return { ...order, progress: newProgress, status: overallStatus };
            };

            const handleUpdateLog = (orderId, stageId, logId, value) => {
                setOrders(safeOrders.map(o => {
                    if (o.id === orderId) {
                        const stageData = o.progress[stageId];
                        const logs = stageData.workLogs || [];
                        const logToUpdate = logs.find(l => l.id === logId);
                        if(!logToUpdate) return o;

                        const size = logToUpdate.size;
                        let otherLogsTotal = 0;
                        logs.forEach(l => { if (l.size === size && l.id !== logId) otherLogsTotal += (parseInt(l.qty) || 0); });

                        const maxAllowedGlobal = getMaxAllowed(o, stageId, size);
                        const maxForThisLog = maxAllowedGlobal - otherLogsTotal;
                        let val = parseInt(value) || 0;
                        if (val > maxForThisLog) val = maxForThisLog;
                        
                        const newLogs = logs.map(l => l.id === logId ? { ...l, qty: val } : l);
                        return recalculateOrderStatuses({ ...o, progress: { ...o.progress, [stageId]: { ...stageData, workLogs: newLogs } } });
                    }
                    return o;
                }));
            };

            const handleToggleEmployee = (orderId, stageId, empId, isChecked) => {
                setOrders(safeOrders.map(o => {
                    if (o.id === orderId) {
                        const stageData = o.progress[stageId];
                        let newEmps = [...stageData.employees];
                        let newLogs = [...(stageData.workLogs || [])];
                        if (isChecked) newEmps.push(empId);
                        else {
                            if (newLogs.some(l => l.empId === empId && l.isReported)) {
                                showToast("Karyawan memiliki riwayat permanen.", "error"); return o;
                            }
                            newEmps = newEmps.filter(id => id !== empId);
                            newLogs = newLogs.filter(l => l.empId !== empId);
                        }
                        return recalculateOrderStatuses({ ...o, progress: { ...o.progress, [stageId]: { ...stageData, employees: newEmps, workLogs: newLogs } } });
                    }
                    return o;
                }));
            };

            const handleAddLog = (orderId, stageId, empId, size) => {
                setOrders(safeOrders.map(o => {
                    if (o.id === orderId) {
                        const newLog = { id: `wl-${Date.now()}`, empId, size, qty: 0, isReported: false, checkBefore: false, checkAfter: false };
                        const stageData = o.progress[stageId];
                        return recalculateOrderStatuses({ ...o, progress: { ...o.progress, [stageId]: { ...stageData, workLogs: [...(stageData.workLogs || []), newLog] } } });
                    }
                    return o;
                }));
            };
            
            const handleToggleLogCheck = (orderId, stageId, logId, checkType, isChecked) => {
                setOrders(safeOrders.map(o => {
                    if (o.id === orderId) {
                        const stageData = o.progress[stageId];
                        const newLogs = (stageData.workLogs || []).map(l => {
                            if (l.id === logId) {
                                let updatedLog = { ...l, [checkType]: isChecked };
                                if (checkType === 'checkBefore' && !isChecked) updatedLog.checkAfter = false;
                                return updatedLog;
                            }
                            return l;
                        });
                        return { ...o, progress: { ...o.progress, [stageId]: { ...stageData, workLogs: newLogs } } };
                    }
                    return o;
                }));
            };

            const handleDeleteLog = (orderId, stageId, logId) => {
                setOrders(safeOrders.map(o => {
                    if (o.id === orderId) {
                        const stageData = o.progress[stageId];
                        const newLogs = (stageData.workLogs || []).filter(l => l.id !== logId);
                        return recalculateOrderStatuses({ ...o, progress: { ...o.progress, [stageId]: { ...stageData, workLogs: newLogs } } });
                    }
                    return o;
                }));
            };

            const printLembarKerja = (order) => {
                const sizesHtml = Object.entries(order.sizes).map(([s, q]) => `
                    <div style="border: 1px solid #000; text-align: center; padding: 4px;">
                        <div style="font-weight: bold; border-bottom: 1px solid #ccc; background: #eee; font-size: 12px;">${s}</div>
                        <div style="padding: 6px; font-size: 16px; font-weight: bold;">${q}</div>
                    </div>
                `).join('');

                const imagesHtml = `
                    <div style="display: flex; gap: 15px; justify-content: center; margin-top: 10px; page-break-inside: avoid;">
                        ${order.designImage1 ? `<div style="text-align:center;"><p style="margin-bottom:3px; font-weight:bold; font-size:11px;">Desain Depan</p><img src="${order.designImage1}" style="max-width: 250px; max-height: 200px; border: 1px solid #ccc; padding: 3px; object-fit: contain;" /></div>` : ''}
                        ${order.designImage2 ? `<div style="text-align:center;"><p style="margin-bottom:3px; font-weight:bold; font-size:11px;">Desain Belakang</p><img src="${order.designImage2}" style="max-width: 250px; max-height: 200px; border: 1px solid #ccc; padding: 3px; object-fit: contain;" /></div>` : ''}
                    </div>
                `;

                const printContent = `
                <!DOCTYPE html>
                <html>
                <head>
                    <title>Lembar Kerja - ${order.id}</title>
                    <style>
                        @page { margin: 10mm; size: A4 portrait; }
                        body { font-family: 'Arial', sans-serif; padding: 0; margin: 0; color: #000; line-height: 1.4; }
                        .container { max-width: 100%; box-sizing: border-box; }
                        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px double #000; padding-bottom: 8px; margin-bottom: 12px; }
                        .header-left { display: flex; align-items: center; gap: 12px; }
                        .header-left h1 { margin: 0; font-size: 20px; text-transform: uppercase; color: #000; }
                        .header-left p { margin: 4px 0 0 0; font-size: 11px; }
                        .header-right { text-align: right; }
                        .header-right h2 { margin: 0; font-size: 18px; font-weight: 900; background: #000; color: #fff; padding: 4px 12px; display: inline-block;}
                        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
                        .info-box { border: 1px solid #000; padding: 8px; }
                        .info-label { font-size: 11px; color: #555; text-transform: uppercase; font-weight: bold; margin-bottom: 4px;}
                        .info-value { font-size: 16px; font-weight: bold; }
                        .sizes-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(50px, 1fr)); gap: 8px; margin-top: 8px; }
                        .notes-box { border: 1px solid #000; padding: 10px; min-height: 50px; margin-top: 15px; font-size: 13px; page-break-inside: avoid;}
                        .signatures { display: flex; justify-content: space-around; margin-top: 25px; text-align: center; page-break-inside: avoid;}
                        .sig-line { width: 130px; border-bottom: 1px solid #000; margin-top: 45px; }
                    </style>
                </head>
                <body>
                    <div class="container">
                        <div class="header">
                            <div class="header-left">
                                ${templates?.companyLogo ? `<img src="${templates.companyLogo}" style="max-height: 50px; object-fit: contain;" />` : ''}
                                <div>
                                    <h1>${templates?.companyName || 'SIMPATI KONVEKSI'}</h1>
                                    <p>${templates?.companyContact || ''}</p>
                                </div>
                            </div>
                            <div class="header-right">
                                <h2>SPK PRODUKSI</h2>
                                <p style="font-size: 14px; font-weight: bold; margin-top: 4px;">${order.id}</p>
                            </div>
                        </div>
                        
                        <div class="info-grid">
                            <div class="info-box">
                                <div class="info-label">Klien / Instansi</div>
                                <div class="info-value">${order.client}</div>
                                <div class="info-label" style="margin-top: 8px;">Tanggal Masuk</div>
                                <div style="font-size: 13px;">${order.date}</div>
                            </div>
                            <div class="info-box">
                                <div class="info-label">Jenis Produksi</div>
                                <div class="info-value">${order.type} <span style="font-size: 13px; font-weight: normal;">(Total: ${order.total} pcs)</span></div>
                                <div class="info-label" style="margin-top: 8px;">Deadline Produksi</div>
                                <div style="font-size: 13px; color: #d32f2f; font-weight: bold;">${order.deadline}</div>
                            </div>
                        </div>

                        <div style="margin-bottom: 15px; page-break-inside: avoid;">
                            <div style="font-size: 11px; color: #555; text-transform: uppercase; font-weight: bold; margin-bottom: 4px;">Rincian Ukuran & Jumlah</div>
                            <div class="sizes-container">
                                ${sizesHtml}
                            </div>
                        </div>

                        <div class="notes-box">
                            <div class="info-label">Catatan Tambahan & Spesifikasi</div>
                            <div style="white-space: pre-wrap; margin-top: 4px;">${order.notes || '- Tidak ada catatan -'}</div>
                        </div>

                        ${(order.designImage1 || order.designImage2) ? imagesHtml : ''}

                        ${templates?.spkNote ? `<p style="font-size: 11px; font-style: italic; margin-top: 15px;">* ${templates.spkNote}</p>` : ''}

                        <div class="signatures">
                            <div>
                                <p style="font-size: 13px; font-weight: bold;">${templates?.spkSignatureLeft || 'Diserahkan Oleh, Admin'}</p>
                                <div class="sig-line"></div>
                            </div>
                            <div>
                                <p style="font-size: 13px; font-weight: bold;">${templates?.spkSignatureRight || 'Diterima Oleh, Mandor'}</p>
                                <div class="sig-line"></div>
                            </div>
                        </div>
                    </div>
                </body>
                </html>
                `;

                let printWindow = window.open('', '_blank');
                if (printWindow) {
                    printWindow.document.open();
                    printWindow.document.write(printContent);
                    printWindow.document.close();
                    printWindow.focus();
                    setTimeout(() => { printWindow.print(); }, 250);
                } else {
                    showToast("Gagal mencetak. Harap izinkan Pop-up di browser Anda!", "error");
                }
            };

            if (selectedOrder) {
                const order = safeOrders.find(o => o.id === selectedOrder);
                if (!order) { setSelectedOrder(null); return null; }
                const currentStageData = order.progress[activeStage];
                const stageEmployees = employees.filter(e => e.division === stages.find(s=>s.id === activeStage).div);
                const currentTotals = getStageSizeTotals(currentStageData);

                return (
                    <div className="space-y-4">
                        <button onClick={() => setSelectedOrder(null)} className="text-blue-600 font-bold mb-4 flex items-center gap-1">&larr; Kembali ke Daftar Produksi</button>
                        
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                            <h2 className="text-2xl font-bold">Produksi: {order.id}</h2>
                            <button onClick={() => printLembarKerja(order)} className="bg-blue-100 hover:bg-blue-200 text-blue-800 px-4 py-2 rounded-lg font-bold flex items-center gap-2 transition-colors border border-blue-300">
                                <IconDocument /> Cetak Lembar Kerja SPK
                            </button>
                        </div>
                        
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                            <div className="col-span-1 space-y-4">
                                <Card className="bg-blue-50 border-blue-100">
                                    <h3 className="font-semibold text-blue-800 mb-2 border-b border-blue-200 pb-2">Info Order</h3>
                                    <p className="text-sm"><b>Klien:</b> {order.client}</p>
                                    <p className="text-sm"><b>Barang:</b> {order.type} ({order.total} pcs)</p>
                                    <p className="text-sm text-red-600"><b>Deadline:</b> {order.deadline}</p>
                                    {order.notes && <p className="text-xs bg-white p-2 rounded mt-2 border border-blue-100 italic">"{order.notes}"</p>}
                                    <div className="mt-4 space-y-2">
                                        {stages.map(s => (
                                            <button key={s.id} onClick={() => setActiveStage(s.id)} className={`w-full text-left px-4 py-2 rounded text-sm font-medium ${activeStage === s.id ? 'bg-blue-600 text-white' : 'bg-white hover:bg-gray-100'}`}>
                                                {s.label} <span className="float-right text-xs mt-0.5"><Badge status={order.progress[s.id].status} /></span>
                                            </button>
                                        ))}
                                    </div>
                                </Card>
                            </div>
                            
                            <div className="col-span-1 lg:col-span-2">
                                <Card>
                                    <h3 className="text-xl font-bold border-b pb-2 mb-4">Proses {activeStage}</h3>
                                    <div className="space-y-4">
                                        <div>
                                            <label className="block text-sm font-medium mb-2">Status Saat Ini</label>
                                            <Badge status={currentStageData.status} />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium mb-2">Pilih Karyawan Aktif</label>
                                            <div className="grid grid-cols-2 md:grid-cols-3 gap-2">
                                                {stageEmployees.map(emp => (
                                                    <label key={emp.id} className="flex items-center space-x-2 text-sm border p-2 rounded cursor-pointer hover:bg-gray-50">
                                                        <input type="checkbox" checked={currentStageData.employees.includes(emp.id)} onChange={(e) => handleToggleEmployee(order.id, activeStage, emp.id, e.target.checked)} />
                                                        <span>{emp.name}</span>
                                                    </label>
                                                ))}
                                                {stageEmployees.length === 0 && <span className="text-xs text-red-500 col-span-full">Tidak ada karyawan di divisi ini. Tambahkan di menu Data Karyawan.</span>}
                                            </div>
                                        </div>

                                        {currentStageData.employees.map(empId => {
                                            const emp = employees.find(e => e.id === empId);
                                            if (!emp) return null; // Fallback jika karyawan dihapus
                                            const empLogs = (currentStageData.workLogs || []).filter(l => l.empId === empId);
                                            
                                            return (
                                                <div key={empId} className="bg-white border border-blue-200 rounded-lg overflow-hidden mt-4 shadow-sm">
                                                    <div className="bg-blue-50 p-2 font-bold text-blue-900 border-b border-blue-200 flex justify-between items-center">
                                                        <span>{emp.name}</span>
                                                        <span className="text-xs bg-white px-2 py-1 rounded shadow-sm">Total: {empLogs.reduce((a, b) => a + (parseInt(b.qty) || 0), 0)} pcs</span>
                                                    </div>
                                                    <div className="overflow-x-auto">
                                                        <table className="w-full text-sm text-left">
                                                            <thead className="bg-gray-50 border-b"><tr><th className="p-2 w-16">Size</th><th className="p-2 w-16 text-center">Max</th><th className="p-2">Pekerjaan</th></tr></thead>
                                                            <tbody>
                                                                {Object.keys(order.sizes).map(size => {
                                                                    const maxAllowed = getMaxAllowed(order, activeStage, size);
                                                                    const currentStageTotal = currentTotals[size] || 0;
                                                                    const empLogsForSize = empLogs.filter(l => l.size === size);
                                                                    const empQty = empLogsForSize.reduce((sum, l) => sum + (parseInt(l.qty) || 0), 0);
                                                                    const availableToAdd = maxAllowed - currentStageTotal;
                                                                    
                                                                    return (
                                                                        <tr key={size} className="border-b hover:bg-gray-50/50">
                                                                            <td className="p-2 font-bold align-top">{size}</td>
                                                                            <td className="p-2 text-gray-500 text-center align-top">{maxAllowed}</td>
                                                                            <td className="p-2">
                                                                                {empLogsForSize.map((log, i) => {
                                                                                    const otherLogsTotal = empLogsForSize.filter(l => l.id !== log.id).reduce((sum, l) => sum + (parseInt(l.qty)||0), 0);
                                                                                    const maxForThisLog = maxAllowed - (currentStageTotal - empQty) - otherLogsTotal;
                                                                                    return (
                                                                                        <div key={log.id} className="flex gap-2 items-center mb-1 bg-white border border-gray-200 p-1.5 rounded shadow-sm">
                                                                                            <input type="number" min="0" max={maxForThisLog} disabled={log.isReported} className="w-16 border rounded p-1 text-center font-bold" value={log.qty===0?'':log.qty} onChange={e => handleUpdateLog(order.id, activeStage, log.id, e.target.value)} /> <span className="text-xs text-gray-500">pcs</span>
                                                                                            <div className="flex gap-2 border-l pl-2 ml-1">
                                                                                                <label className="flex items-center gap-1 text-xs cursor-pointer"><input type="checkbox" checked={log.checkBefore} disabled={log.isReported} onChange={e=>handleToggleLogCheck(order.id,activeStage,log.id,'checkBefore',e.target.checked)}/> Ambil</label>
                                                                                                <label className="flex items-center gap-1 text-xs cursor-pointer"><input type="checkbox" checked={log.checkAfter} disabled={!log.checkBefore || log.isReported} onChange={e=>handleToggleLogCheck(order.id,activeStage,log.id,'checkAfter',e.target.checked)}/> Setor</label>
                                                                                            </div>
                                                                                            {!log.isReported && <button onClick={() => handleDeleteLog(order.id, activeStage, log.id)} className="text-red-400 hover:text-red-600 font-bold ml-auto px-2">&times;</button>}
                                                                                            {log.isReported && <span className="text-green-500 ml-auto px-2" title="Sudah Direkap">✓</span>}
                                                                                        </div>
                                                                                    )
                                                                                })}
                                                                                {availableToAdd > 0 && <button onClick={() => handleAddLog(order.id, activeStage, empId, size)} className="text-xs text-blue-600 font-bold mt-1 bg-blue-50 px-2 py-1 rounded">+ Tambah Setoran</button>}
                                                                            </td>
                                                                        </tr>
                                                                    )
                                                                })}
                                                            </tbody>
                                                        </table>
                                                    </div>
                                                </div>
                                            )
                                        })}
                                    </div>
                                </Card>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="space-y-6">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <h2 className="text-2xl font-bold text-gray-800">Pantau Alur Produksi</h2>
                            <p className="text-gray-500 text-sm mt-1">Lacak dan catat progress masing-masing divisi.</p>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        {safeOrders.filter(o => !o?.isArchived).map(order => {
                            const today = new Date();
                            const deadlineDate = new Date(order.deadline);
                            const diffTime = deadlineDate - today;
                            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                            
                            let cardColor = "bg-white border-gray-200";
                            let indicatorColor = "bg-blue-500 group-hover:bg-blue-600";
                            let textColor = "text-gray-800";
                            
                            if (order.status === 'Terkirim') {
                                cardColor = "bg-purple-50 border-purple-300 shadow-purple-100";
                                indicatorColor = "bg-purple-500";
                                textColor = "text-purple-900";
                            } else if (order.status === 'Siap Kirim') {
                                cardColor = "bg-green-50 border-green-300 shadow-green-100";
                                indicatorColor = "bg-green-500";
                                textColor = "text-green-900";
                            } else if (diffDays <= 7) {
                                cardColor = "bg-red-50 border-red-200";
                                indicatorColor = "bg-red-500 group-hover:bg-red-600";
                                textColor = "text-red-900";
                            } else if (diffDays <= 14) {
                                cardColor = "bg-yellow-50 border-yellow-200";
                                indicatorColor = "bg-yellow-500 group-hover:bg-yellow-600";
                                textColor = "text-yellow-900";
                            }

                            const mainImage = order.designImage1 || order.designImage2 || null;

                            return (
                                <Card key={order.id} className={`hover:shadow-lg transition-shadow relative overflow-hidden group border ${cardColor} flex flex-col h-full !p-0`}>
                                    <div className={`absolute top-0 left-0 w-1.5 h-full transition-colors ${indicatorColor} z-10`}></div>
                                    
                                    {mainImage ? (
                                        <div className="w-full h-32 bg-gray-100 border-b border-gray-200 relative overflow-hidden">
                                            <img src={mainImage} className="w-full h-full object-cover opacity-90 group-hover:opacity-100 transition-opacity" alt="Desain Order" />
                                            {order.designImage2 && order.designImage1 && (
                                                <div className="absolute bottom-2 right-2 bg-black/50 text-white text-[10px] px-2 py-0.5 rounded font-bold">+1 Gambar</div>
                                            )}
                                        </div>
                                    ) : (
                                        <div className="w-full h-8 bg-gray-50 border-b border-gray-100"></div> 
                                    )}

                                    <div className="p-5 flex-1 flex flex-col">
                                        <div className="flex justify-between items-start mb-2 pl-1">
                                            <h3 className={`font-black text-lg ${textColor}`}>{order.id}</h3>
                                            <Badge status={order.status} />
                                        </div>
                                        <div className="pl-1 space-y-1 mb-4 flex-1">
                                            <p className="text-sm font-bold text-gray-800">{order.client}</p>
                                            <p className="text-xs text-gray-600">{order.type} - {order.total} pcs</p>
                                            <p className={`text-xs font-bold mt-1.5 ${diffDays <= 7 ? 'text-red-600' : diffDays <= 14 ? 'text-green-700' : 'text-gray-500'}`}>
                                                DL: {order.deadline} ({diffDays > 0 ? `${diffDays} hari lagi` : 'Terlewat/Hari ini'})
                                            </p>
                                            {order.notes && (
                                                <div className="mt-3 p-2 bg-white/60 rounded border border-black/5 text-[11px] text-gray-700 leading-tight">
                                                    <span className="font-bold text-gray-800 block mb-0.5">Catatan:</span>
                                                    <span className="line-clamp-2">{order.notes}</span>
                                                </div>
                                            )}
                                        </div>
                                        <div className="flex gap-2 mt-auto z-10">
                                            <button onClick={() => setSelectedOrder(order.id)} className="flex-1 bg-white hover:bg-blue-600 hover:text-white text-blue-700 py-2.5 rounded-lg font-bold text-sm transition-all border border-blue-200 shadow-sm">
                                                Update Pengerjaan
                                            </button>
                                        </div>
                                    </div>
                                </Card>
                            );
                        })}
                        {safeOrders.filter(o => !o?.isArchived).length === 0 && (
                            <div className="col-span-full p-8 text-center text-gray-500 bg-white rounded-xl shadow-sm border border-gray-100">Tidak ada order yang sedang diproses.</div>
                        )}
                    </div>
                </div>
            );
        };

        const PengirimanView = ({ orders, setOrders, showToast, templates, riwayatPengiriman, setRiwayatPengiriman }) => {
            const [shippingInputs, setShippingInputs] = useState({});
            const [selectedOrders, setSelectedOrders] = useState({});
            const safeOrders = orders || [];

            const handleToggleOrderSelection = (orderId) => {
                setSelectedOrders(prev => ({ ...prev, [orderId]: !prev[orderId] }));
            };

            const handleUpdateShippingInput = (orderId, size, value) => {
                setShippingInputs(prev => ({ ...prev, [orderId]: { ...prev[orderId], [size]: value } }));
            };

            const getAvailableToShip = (order, size) => {
                const stagesOrder = ['finishing', 'kancing', 'jahit', 'sablon', 'cutting'];
                let furthestStage = 'cutting';
                for (let stage of stagesOrder) {
                    if (order.progress[stage] && order.progress[stage].workLogs && order.progress[stage].workLogs.length > 0) {
                        furthestStage = stage; break;
                    }
                }

                let totalSetor = 0;
                const stageData = order.progress[furthestStage];
                if (stageData && stageData.workLogs) {
                    stageData.workLogs.forEach(log => {
                        if (log.size === size && log.checkAfter) totalSetor += (parseInt(log.qty) || 0);
                    });
                }
                const shippedCount = (order.shipped && order.shipped[size]) || 0;
                return Math.max(0, totalSetor - shippedCount);
            };

            const printSuratJalan = (client, items, sjId) => {
                const currentDate = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
                const totalBarang = items.reduce((sum, item) => sum + item.total, 0);

                const printContent = `
                <!DOCTYPE html>
                <html>
                <head>
                    <title>Surat Jalan - ${client}</title>
                    <style>
                        body { font-family: 'Arial', sans-serif; padding: 20px; color: #000; line-height: 1.5; }
                        .header { display: flex; justify-content: space-between; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 20px; }
                        .header-left { display: flex; align-items: center; gap: 15px; }
                        .header-left h1 { margin: 0; font-size: 24px; text-transform: uppercase; color: #b91c1c; }
                        .header-left p { margin: 5px 0 0 0; font-size: 14px; }
                        .header-right { text-align: right; }
                        .header-right h2 { margin: 0; font-size: 20px; text-decoration: underline; letter-spacing: 2px;}
                        .header-right p { margin: 5px 0 0 0; font-size: 14px; }
                        .kepada { margin-bottom: 30px; font-size: 14px; }
                        .data-table { width: 100%; border-collapse: collapse; margin-bottom: 30px; font-size: 14px; }
                        .data-table th, .data-table td { border: 1px solid #000; padding: 10px; text-align: left; }
                        .data-table th { background-color: #f3f4f6; text-align: center; }
                        .text-center { text-align: center; }
                        .text-right { text-align: right; }
                        .font-bold { font-weight: bold; }
                        .footer { display: flex; justify-content: space-between; margin-top: 50px; font-size: 14px; text-align: center; padding: 0 40px; }
                        .signature { margin-top: 80px; border-bottom: 1px solid #000; width: 150px; display: inline-block; }
                    </style>
                </head>
                <body>
                    <div class="header">
                        <div class="header-left">
                            ${templates.companyLogo ? `<img src="${templates.companyLogo}" style="max-height: 70px; object-fit: contain;" />` : ''}
                            <div>
                                <h1>${templates.companyName}</h1>
                                <p>${templates.companySubtitle}<br/>${templates.companyContact}</p>
                            </div>
                        </div>
                        <div class="header-right">
                            <h2>SURAT JALAN</h2>
                            <p>No: <strong>${sjId}</strong></p>
                            <p>Tanggal: ${currentDate}</p>
                        </div>
                    </div>
                    <div class="kepada"><p>Kepada Yth,<br/><strong>${client}</strong><br/>Di Tempat</p></div>
                    <p style="font-size: 14px;">Bersama surat ini kami mengirimkan barang-barang sebagai berikut:</p>
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th style="width: 50px;">No.</th>
                                <th>ID Order</th>
                                <th>Jenis Barang</th>
                                <th>Rincian Ukuran (Qty)</th>
                                <th style="width: 100px;">Total (Pcs)</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${items.map((item, idx) => `
                                <tr>
                                    <td class="text-center">${idx + 1}</td>
                                    <td class="text-center font-bold">${item.orderId}</td>
                                    <td>${item.type}</td>
                                    <td>${item.details}</td>
                                    <td class="text-center font-bold">${item.total}</td>
                                </tr>
                            `).join('')}
                            <tr>
                                <td colspan="4" class="text-right font-bold" style="font-size: 16px;">TOTAL KESELURUHAN:</td>
                                <td class="text-center font-bold" style="font-size: 16px;">${totalBarang}</td>
                            </tr>
                        </tbody>
                    </table>
                    <p style="font-size: 12px; font-style: italic;">${templates.suratJalanNote}</p>
                    <div class="footer">
                        <div><p>${templates.sjSignatureLeft}</p><div class="signature"></div></div>
                        <div><p>${templates.sjSignatureRight}</p><div class="signature"></div></div>
                    </div>
                </body>
                </html>
                `;

                let printWindow = window.open('', '_blank');
                if (printWindow) {
                    printWindow.document.open();
                    printWindow.document.write(printContent);
                    printWindow.document.close();
                    printWindow.focus();
                    setTimeout(() => { printWindow.print(); }, 250);
                } else {
                    showToast("Gagal mencetak. Harap izinkan Pop-up di browser Anda!", "error");
                }
            };

            const executeKirimGabungan = (client, clientOrders) => {
                let anyShipped = false;
                let processedItems = [];
                const updatedOrders = [...safeOrders];

                clientOrders.forEach(order => {
                    const currentOrderInputs = shippingInputs[order.id] || {};
                    const newShipped = { ...order.shipped };
                    let orderHasNewShipment = false;
                    let shippedDetails = [];
                    let totalOrderShipment = 0;

                    Object.keys(order.sizes || {}).forEach(size => {
                        const qtyToShip = parseInt(currentOrderInputs[size]) || 0;
                        if (qtyToShip > 0) {
                            newShipped[size] = (newShipped[size] || 0) + qtyToShip;
                            orderHasNewShipment = true;
                            anyShipped = true;
                            shippedDetails.push(`${size} (${qtyToShip})`);
                            totalOrderShipment += qtyToShip;
                        }
                    });

                    if (orderHasNewShipment) {
                        let isFullyShipped = true;
                        Object.keys(order.sizes).forEach(size => {
                            if ((newShipped[size] || 0) < order.sizes[size]) isFullyShipped = false;
                        });

                        const newStatus = isFullyShipped ? 'Terkirim' : order.status;
                        const orderIndex = updatedOrders.findIndex(o => o.id === order.id);
                        if(orderIndex > -1) {
                            updatedOrders[orderIndex] = { ...order, shipped: newShipped, status: newStatus };
                        }
                        processedItems.push({ orderId: order.id, type: order.type, details: shippedDetails.join(', '), total: totalOrderShipment });
                    }
                });

                if (!anyShipped) { showToast("Masukkan setidaknya satu jumlah barang untuk dikirim.", "error"); return; }

                setOrders(updatedOrders);
                const newInputs = { ...shippingInputs };
                clientOrders.forEach(o => delete newInputs[o.id]);
                setShippingInputs(newInputs);

                const sjId = `SJ-${Date.now()}`;
                
                const newHistoryRecord = {
                    id: sjId,
                    date: new Date().toISOString().split('T')[0],
                    client: client,
                    items: processedItems,
                    total: processedItems.reduce((sum, item) => sum + item.total, 0)
                };
                setRiwayatPengiriman([...(riwayatPengiriman || []), newHistoryRecord]);

                printSuratJalan(client, processedItems, sjId);
                showToast(`Surat Jalan ${sjId} berhasil dibuat dan barang dikirim!`, "success");
            };

            const activeOrders = safeOrders.filter(o => !o?.isArchived);
            const ordersByClient = activeOrders.reduce((acc, o) => {
                if (!acc[o.client]) acc[o.client] = [];
                acc[o.client].push(o);
                return acc;
            }, {});

            if (Object.keys(ordersByClient).length === 0) {
                return (
                    <div className="space-y-6">
                        <h2 className="text-2xl font-bold text-gray-800">Manajemen Pengiriman</h2>
                        <div className="p-8 text-center text-gray-500 bg-white rounded-xl shadow-sm border border-gray-100">
                            Tidak ada antrean barang yang harus dikirim saat ini.
                        </div>
                    </div>
                );
            }

            return (
                <div className="space-y-6">
                    <h2 className="text-2xl font-bold text-gray-800">Manajemen Pengiriman</h2>
                    {Object.entries(ordersByClient).map(([client, clientOrders]) => (
                        <Card key={client} className="overflow-hidden mb-6">
                            <h3 className="text-lg font-bold text-blue-900 bg-blue-50 p-3 rounded-t-lg border-b border-blue-100 mb-4">{client}</h3>
                            <div className="space-y-6">
                                {clientOrders.map(order => {
                                    const isSelected = selectedOrders[order.id] || false;
                                    return (
                                    <div key={order.id} className={`border rounded-lg p-4 transition-colors ${isSelected ? 'border-blue-400 bg-blue-50/20' : 'border-gray-200'}`}>
                                        <div className="flex justify-between items-center mb-4 border-b border-gray-100 pb-3">
                                            <div className="flex items-center gap-3">
                                                {order.status !== 'Terkirim' && (
                                                    <input type="checkbox" checked={isSelected} onChange={() => handleToggleOrderSelection(order.id)} className="w-5 h-5 text-blue-600 rounded focus:ring-blue-500 cursor-pointer" />
                                                )}
                                                <div>
                                                    <span className="font-bold text-gray-800 text-lg">{order.id}</span>
                                                    <span className="text-gray-600 ml-2">- {order.type}</span>
                                                </div>
                                            </div>
                                            <div className="text-right">
                                                <span className="text-xs text-red-500 font-medium block">Deadline: {order.deadline}</span>
                                                <span className="text-sm font-bold text-blue-600 bg-blue-50 px-2 py-1 rounded mt-1 inline-block">Total Order: {order.total} pcs</span>
                                            </div>
                                        </div>
                                        
                                        {order.status === 'Terkirim' ? (
                                            <div className="bg-purple-50 p-4 rounded-lg border border-purple-200 flex flex-col md:flex-row justify-between items-center gap-4">
                                                <div className="text-purple-800 text-sm">
                                                    <span className="font-bold block">Pesanan Selesai Terkirim!</span>
                                                    Seluruh barang pesanan telah dikirimkan.
                                                </div>
                                                <button 
                                                    onClick={() => {
                                                        const newOrders = safeOrders.map(o => o.id === order.id ? { ...o, isArchived: true } : o);
                                                        setOrders(newOrders);
                                                        showToast("Order dipindahkan ke Riwayat!", "success");
                                                    }} 
                                                    className="w-full md:w-auto bg-purple-600 hover:bg-purple-700 text-white px-5 py-2.5 rounded-lg font-bold text-sm transition-all shadow-sm flex items-center justify-center gap-2"
                                                >
                                                    <IconArchive /> Arsipkan Order
                                                </button>
                                            </div>
                                        ) : (
                                            isSelected && (
                                                <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4 mt-4">
                                                    {Object.keys(order.sizes).map(size => {
                                                        const avail = getAvailableToShip(order, size);
                                                        const target = order.sizes[size];
                                                        const shippedCount = (order.shipped && order.shipped[size]) || 0;
                                                        const isCompleted = shippedCount >= target;

                                                        return (
                                                            <div key={size} className={`p-2.5 rounded-lg border ${isCompleted ? 'bg-green-50 border-green-200' : 'bg-gray-50 border-gray-200'}`}>
                                                                <div className="flex justify-between items-center mb-1">
                                                                    <div className="text-[11px] font-bold text-gray-500 uppercase">Size {size}</div>
                                                                    <div className="text-[10px] bg-blue-100 text-blue-800 px-1.5 py-0.5 rounded font-bold border border-blue-200">Target: {target}</div>
                                                                </div>
                                                                <div className="flex justify-between text-xs mb-2 border-b border-gray-200 pb-1">
                                                                    <span className="text-gray-500 font-medium">Sdh Kirim:</span>
                                                                    <span className="text-green-600 font-bold">{shippedCount}</span>
                                                                </div>
                                                                <div className="flex items-end justify-between mb-2">
                                                                    <div className="text-xl font-bold text-gray-800 leading-none">{avail}</div>
                                                                    <div className="text-[10px] font-medium text-gray-500 leading-none mb-0.5">Stok Siap</div>
                                                                </div>
                                                                <input 
                                                                    type="number" min="0" max={avail} disabled={isCompleted || avail === 0}
                                                                    placeholder={isCompleted ? "Lengkap" : "Kirim..."}
                                                                    className="w-full text-sm p-1.5 border rounded focus:ring-2 focus:ring-blue-500 disabled:bg-gray-200 disabled:text-gray-500 disabled:cursor-not-allowed font-medium text-center"
                                                                    value={shippingInputs[order.id]?.[size] || ''}
                                                                    onChange={(e) => handleUpdateShippingInput(order.id, size, e.target.value)}
                                                                />
                                                            </div>
                                                        )
                                                    })}
                                                </div>
                                            )
                                        )}
                                    </div>
                                )})}
                            </div>
                            <div className="mt-6 border-t border-gray-200 pt-5">
                                <button 
                                    onClick={() => executeKirimGabungan(client, clientOrders.filter(o => selectedOrders[o.id]))}
                                    disabled={clientOrders.filter(o => selectedOrders[o.id]).length === 0}
                                    className="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-gray-400 disabled:cursor-not-allowed text-white py-3.5 rounded-lg font-bold flex items-center justify-center gap-2 transition-transform active:scale-[0.98] shadow-md text-lg"
                                >
                                    <IconPrinter /> Cetak Surat Jalan & Kirim Barang
                                </button>
                            </div>
                        </Card>
                    ))}
                </div>
            )
        };

        const RiwayatPengirimanView = ({ orders, setOrders, riwayatPengiriman, setRiwayatPengiriman, templates, showToast }) => {
            const [deleteConfirmId, setDeleteConfirmId] = useState(null);

            const printSuratJalan = (client, items, sjId, dateStr) => {
                const formattedDate = new Date(dateStr).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
                const totalBarang = items.reduce((sum, item) => sum + item.total, 0);

                const printContent = `
                <!DOCTYPE html>
                <html>
                <head>
                    <title>Surat Jalan - ${client}</title>
                    <style>
                        body { font-family: 'Arial', sans-serif; padding: 20px; color: #000; line-height: 1.5; }
                        .header { display: flex; justify-content: space-between; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 20px; }
                        .header-left { display: flex; align-items: center; gap: 15px; }
                        .header-left h1 { margin: 0; font-size: 24px; text-transform: uppercase; color: #b91c1c; }
                        .header-left p { margin: 5px 0 0 0; font-size: 14px; }
                        .header-right { text-align: right; }
                        .header-right h2 { margin: 0; font-size: 20px; text-decoration: underline; letter-spacing: 2px;}
                        .header-right p { margin: 5px 0 0 0; font-size: 14px; }
                        .kepada { margin-bottom: 30px; font-size: 14px; }
                        .data-table { width: 100%; border-collapse: collapse; margin-bottom: 30px; font-size: 14px; }
                        .data-table th, .data-table td { border: 1px solid #000; padding: 10px; text-align: left; }
                        .data-table th { background-color: #f3f4f6; text-align: center; }
                        .text-center { text-align: center; }
                        .text-right { text-align: right; }
                        .font-bold { font-weight: bold; }
                        .footer { display: flex; justify-content: space-between; margin-top: 50px; font-size: 14px; text-align: center; padding: 0 40px; }
                        .signature { margin-top: 80px; border-bottom: 1px solid #000; width: 150px; display: inline-block; }
                    </style>
                </head>
                <body>
                    <div class="header">
                        <div class="header-left">
                            ${templates.companyLogo ? `<img src="${templates.companyLogo}" style="max-height: 70px; object-fit: contain;" />` : ''}
                            <div>
                                <h1>${templates.companyName}</h1>
                                <p>${templates.companySubtitle}<br/>${templates.companyContact}</p>
                            </div>
                        </div>
                        <div class="header-right">
                            <h2>SURAT JALAN</h2>
                            <p>No: <strong>${sjId}</strong></p>
                            <p>Tanggal: ${formattedDate}</p>
                        </div>
                    </div>
                    <div class="kepada"><p>Kepada Yth,<br/><strong>${client}</strong><br/>Di Tempat</p></div>
                    <p style="font-size: 14px;">Bersama surat ini kami mengirimkan barang-barang sebagai berikut:</p>
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th style="width: 50px;">No.</th>
                                <th>ID Order</th>
                                <th>Jenis Barang</th>
                                <th>Rincian Ukuran (Qty)</th>
                                <th style="width: 100px;">Total (Pcs)</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${items.map((item, idx) => `
                                <tr>
                                    <td class="text-center">${idx + 1}</td>
                                    <td class="text-center font-bold">${item.orderId}</td>
                                    <td>${item.type}</td>
                                    <td>${item.details}</td>
                                    <td class="text-center font-bold">${item.total}</td>
                                </tr>
                            `).join('')}
                            <tr>
                                <td colspan="4" class="text-right font-bold" style="font-size: 16px;">TOTAL KESELURUHAN:</td>
                                <td class="text-center font-bold" style="font-size: 16px;">${totalBarang}</td>
                            </tr>
                        </tbody>
                    </table>
                    <p style="font-size: 12px; font-style: italic;">${templates.suratJalanNote}</p>
                    <div class="footer">
                        <div><p>${templates.sjSignatureLeft}</p><div class="signature"></div></div>
                        <div><p>${templates.sjSignatureRight}</p><div class="signature"></div></div>
                    </div>
                </body>
                </html>
                `;

                let printWindow = window.open('', '_blank');
                if (printWindow) {
                    printWindow.document.open();
                    printWindow.document.write(printContent);
                    printWindow.document.close();
                    printWindow.focus();
                    setTimeout(() => { printWindow.print(); }, 250);
                } else {
                    showToast("Gagal mencetak. Harap izinkan Pop-up di browser Anda!", "error");
                }
            };

            const handleDeletePengiriman = () => {
                const riwayatToDelete = (riwayatPengiriman || []).find(r => r.id === deleteConfirmId);
                if (!riwayatToDelete) return;

                const updatedOrders = [...(orders || [])];

                (riwayatToDelete.items || []).forEach(item => {
                    const orderIndex = updatedOrders.findIndex(o => o.id === item.orderId);
                    if (orderIndex > -1) {
                        const order = { ...updatedOrders[orderIndex] };
                        const newShipped = { ...order.shipped };
                        
                        const parts = item.details.split(', ');
                        parts.forEach(part => {
                            const match = part.match(/(.+?)\s*\((\d+)\)/);
                            if (match) {
                                const size = match[1];
                                const qty = parseInt(match[2], 10);
                                if (newShipped[size]) {
                                    newShipped[size] -= qty;
                                    if (newShipped[size] < 0) newShipped[size] = 0;
                                }
                            }
                        });

                        order.shipped = newShipped;
                        
                        let isFullyShipped = true;
                        Object.keys(order.sizes).forEach(sz => {
                            if ((order.shipped[sz] || 0) < order.sizes[sz]) isFullyShipped = false;
                        });

                        const newProgress = { ...order.progress };
                        let overallStatus = order.status; 
                        if (isFullyShipped) overallStatus = 'Terkirim';
                        else if (newProgress.finishing.status === 'Selesai') overallStatus = 'Siap Kirim';
                        else if (newProgress.finishing.status === 'Proses') overallStatus = 'Proses Finishing';
                        else if (newProgress.kancing?.status === 'Selesai') overallStatus = 'Proses Finishing';
                        else if (newProgress.kancing?.status === 'Proses') overallStatus = 'Proses Pasang Kancing';
                        else if (newProgress.jahit.status === 'Selesai') overallStatus = 'Proses Pasang Kancing';
                        else if (newProgress.jahit.status === 'Proses') overallStatus = 'Proses Jahit';
                        else if (newProgress.sablon.status === 'Selesai') overallStatus = 'Proses Jahit';
                        else if (newProgress.sablon.status === 'Proses') overallStatus = 'Proses Sablon/Bordir';
                        else if (newProgress.cutting.status === 'Selesai') overallStatus = 'Proses Sablon/Bordir';
                        else if (newProgress.cutting.status === 'Proses') overallStatus = 'Proses Cutting';
                        else overallStatus = 'Pending'; 

                        order.status = overallStatus;

                        if (!isFullyShipped && order.isArchived) {
                            order.isArchived = false;
                        }

                        updatedOrders[orderIndex] = order;
                    }
                });

                setOrders(updatedOrders);
                setRiwayatPengiriman((riwayatPengiriman || []).filter(r => r.id !== deleteConfirmId));
                setDeleteConfirmId(null);
                showToast("Pengiriman dibatalkan, barang dikembalikan ke antrean.", "success");
            };

            return (
                <div className="space-y-6">
                    <h2 className="text-2xl font-bold text-gray-800">Riwayat Pengiriman</h2>
                    <p className="text-gray-600 mb-6">Daftar seluruh Surat Jalan yang pernah dicetak dan dikirim ke klien.</p>

                    <Card>
                        <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse">
                                <thead>
                                    <tr className="bg-gray-50 border-b border-gray-200">
                                        <th className="p-3 text-sm font-semibold text-gray-600">Tanggal</th>
                                        <th className="p-3 text-sm font-semibold text-gray-600">No. Surat Jalan</th>
                                        <th className="p-3 text-sm font-semibold text-gray-600">Klien</th>
                                        <th className="p-3 text-sm font-semibold text-gray-600">Item Terkirim</th>
                                        <th className="p-3 text-sm font-semibold text-gray-600">Total (Pcs)</th>
                                        <th className="p-3 text-sm font-semibold text-gray-600 text-center">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {[...(riwayatPengiriman || [])].reverse().map(riwayat => (
                                        <tr key={riwayat.id} className="border-b border-gray-100 hover:bg-gray-50 transition-colors">
                                            <td className="p-3 text-sm text-gray-600">{riwayat.date}</td>
                                            <td className="p-3 text-sm font-bold text-blue-600">{riwayat.id}</td>
                                            <td className="p-3 text-sm font-bold text-gray-800">{riwayat.client}</td>
                                            <td className="p-3 text-sm text-gray-600">
                                                <ul className="list-disc pl-4">
                                                    {(riwayat.items || []).map((item, i) => (
                                                        <li key={i}>{item.orderId} - {item.details}</li>
                                                    ))}
                                                </ul>
                                            </td>
                                            <td className="p-3 text-sm font-bold text-green-600">{riwayat.total} pcs</td>
                                            <td className="p-3 text-center flex justify-center space-x-2">
                                                <button 
                                                    onClick={() => printSuratJalan(riwayat.client, riwayat.items, riwayat.id, riwayat.date)}
                                                    className="text-gray-600 hover:text-blue-600 bg-white hover:bg-blue-50 border border-gray-200 p-2 rounded shadow-sm transition-colors flex items-center justify-center gap-1 text-xs font-bold"
                                                    title="Cetak PDF Ulang"
                                                >
                                                    <IconPrinter /> Cetak Ulang
                                                </button>
                                                <button 
                                                    onClick={() => setDeleteConfirmId(riwayat.id)}
                                                    className="text-red-500 hover:text-white bg-white hover:bg-red-500 border border-red-200 p-2 rounded shadow-sm transition-colors flex items-center justify-center gap-1 text-xs font-bold"
                                                    title="Batalkan Surat Jalan & Pengiriman"
                                                >
                                                    <IconTrash /> Batal Kirim
                                                </button>
                                            </td>
                                        </tr>
                                    ))}
                                    {(!riwayatPengiriman || riwayatPengiriman.length === 0) && (
                                        <tr>
                                            <td colSpan="6" className="p-8 text-center text-gray-500 italic border border-dashed border-gray-200">
                                                Belum ada riwayat pengiriman.
                                            </td>
                                        </tr>
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </Card>

                    {deleteConfirmId && (
                        <div className="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 transition-opacity">
                            <div className="bg-white p-6 rounded-xl shadow-xl max-w-sm w-full mx-4 transform transition-all">
                                <h3 className="text-lg font-bold text-gray-900 mb-2">Batalkan Pengiriman?</h3>
                                <p className="text-gray-600 mb-6 text-sm">Surat Jalan ini akan dihapus dan barang akan dikembalikan ke antrean 'Pengiriman'. Apakah Anda yakin?</p>
                                <div className="flex justify-end space-x-3">
                                    <button onClick={() => setDeleteConfirmId(null)} className="px-4 py-2 font-medium text-gray-600 hover:bg-gray-100 rounded-lg transition-colors text-sm">Tutup</button>
                                    <button onClick={handleDeletePengiriman} className="px-4 py-2 font-medium bg-red-600 text-white hover:bg-red-700 rounded-lg transition-colors text-sm">Batalkan Kirim</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const LaporanView = ({ orders, setOrders, employees, rekapKinerja, setRekapKinerja, showToast, templates }) => {
            const [modalData, setModalData] = useState(null);
            const [dateRange, setDateRange] = useState({ start: '', end: '' });
            const [deleteRekapConfirmId, setDeleteRekapConfirmId] = useState(null);

            const triggerPrint = (data) => {
                const printContent = `
                <!DOCTYPE html>
                <html>
                <head>
                    <title>Laporan Kinerja - ${data.empName}</title>
                    <style>
                        body { font-family: 'Arial', sans-serif; padding: 20px; color: #000; line-height: 1.5; }
                        .header { display: flex; align-items: center; justify-content: center; position: relative; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 20px; }
                        .header-logo { position: absolute; left: 0; top: 50%; transform: translateY(-50%); max-height: 60px; }
                        .header-text { text-align: center; }
                        .header h1 { margin: 0; font-size: 24px; text-transform: uppercase; color: #b91c1c; }
                        .header p { margin: 5px 0 0 0; font-size: 14px; }
                        .info { display: flex; justify-content: space-between; margin-bottom: 20px; font-size: 14px; }
                        .info table td { padding: 2px 10px 2px 0; }
                        .data-table { width: 100%; border-collapse: collapse; margin-bottom: 30px; font-size: 14px; }

                        .data-table th { background-color: #f3f4f6; text-align: center; }

                    </style>
                </head>
                <body>
                    <div class="header">
                        ${templates.companyLogo ? `<img src="${templates.companyLogo}" class="header-logo" />` : ''}
                        <div class="header-text">
                            <h1>${templates.companyName}</h1>
                            <p>Laporan Hasil Kinerja Produksi Karyawan</p>
                        </div>
                    </div>
                    
                    <div class="info">

                            <tr><td class="font-bold">Nama Karyawan</td><td>: ${data.empName}</td></tr>

                    </div>

                    <table class="data-table">

                            <tr>
                                <th style="width: 50px;">No.</th>
                                <th>ID Order</th>
                                <th>Klien / Instansi</th>
                                <th>Tahap</th>
                                <th>Rincian Ukuran Selesai</th>
                                <th style="width: 100px;">Jumlah (Pcs)</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${data.items.map((item, idx) => `
                                <tr>
                                    <td class="text-center">${idx + 1}</td>
                                    <td>${item.orderId}</td>
                                    <td>${item.client} (${item.type})</td>
