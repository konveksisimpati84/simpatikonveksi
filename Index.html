<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simpati Konveksi - Manajemen Produksi</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        @media print {
            body { background-color: white; }
            @page { margin: 1.5cm; }
            .print\:hidden { display: none !important; }
        }

        @keyframes slideInUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .toast-enter { animation: slideInUp 0.3s ease-out forwards; }
        
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.5); }
            50% { box-shadow: 0 0 0 8px rgba(59, 130, 246, 0); }
        }
        .animate-pulse-glow { animation: pulse-glow 2s infinite; }
        
        /* Animasi berkedip untuk layar TV order merah */
        @keyframes tv-urgent {
            0%, 100% { background-color: #7f1d1d; } /* red-900 */
            50% { background-color: #991b1b; } /* red-800 */
        }
        .animate-tv-urgent { animation: tv-urgent 2s infinite; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- Mock Data / Initial Variables ---
        const initialAccounts = [
            { id: 1, username: 'admin', password: '123', role: 'Admin', name: 'Super Admin' },
            { id: 2, username: 'mandor', password: '123', role: 'Mandor', name: 'Mandor Produksi' },
            { id: 3, username: 'kasir', password: '123', role: 'Kasir', name: 'Staf Kasir' }
        ];

        const initialEmployees = [
            { id: 1, name: 'Budi Santoso', division: 'Cutting', phone: '08123456789', status: 'Aktif' },
            { id: 2, name: 'Siti Aminah', division: 'Jahit', phone: '08129876543', status: 'Aktif' }
        ];

        const initialOrders = [];

        const initialTemplates = {
            companyName: 'SIMPATI KONVEKSI',
            companyLogo: '',
            companySubtitle: 'Sistem Manajemen Produksi',
            companyContact: 'Telp: 0812-3456-7890',
            suratJalanNote: '*Mohon diperiksa kembali. Barang yang sudah diterima dengan baik tidak dapat dikembalikan.',
            sjSignatureLeft: 'Penerima,',
            sjSignatureRight: 'Hormat Kami,',
            laporanSignatureLeft: 'Mengetahui, Admin / Mandor',
            laporanSignatureRight: 'Pekerja / Karyawan',
            spkSignatureLeft: 'Diserahkan Oleh, Admin',
            spkSignatureRight: 'Diterima Oleh, Mandor',
            spkNote: 'Pastikan dikerjakan sesuai dengan spesifikasi dan deadline.'
        };

        // --- Icons ---
        const IconDashboard = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>;
        const IconUsers = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>;
        const IconPlusCircle = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>;
        const IconScissors = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14.121 14.121L19 19m-7-7l7-7m-7 7l-2-2m-2 2l-2-2m-2 2l-2-2m-2 2l-2-2m-2 2l-2-2m-2 2l-2-2m-2 2l-2-2m-2 2l-2-2m-2 2l-2-2"></path></svg>;
        const IconTruck = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 14v3m4-3v3m4-3v3M3 21h18M3 10h18M3 7l9-4 9 4M4 10h16v11H4V10z"></path></svg>;
        const IconBarChart = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>;
        const IconTrash = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>;
        const IconPrinter = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>;
        const IconCheckCircle = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>;
        const IconAlertCircle = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>;
        const IconLogout = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>;
        const IconKey = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4v-3l5.257-5.257A6 6 0 1115 7h.01z"></path></svg>;
        const IconSettings = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>;
        const IconHistory = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>;
        const IconDocument = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>;
        const IconSparkles = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" /></svg>;
        const IconImage = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>;
        const IconEdit = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>;
        const IconArchive = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"></path></svg>;
        const IconRestore = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"></path></svg>;
        const IconMonitor = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>;
        const IconLock = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>;
        const IconUnlock = () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 11V7a4 4 0 118 0m-4 8v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z"></path></svg>;

        // --- Gemini API Function ---
        const generateGeminiContent = async (prompt, systemInstruction = "Anda adalah asisten AI cerdas untuk pabrik konveksi.", expectJson = false) => {
            const apiKey = ""; // Set API Key untuk produksi nyata jika ingin memakai fitur AI Input
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                systemInstruction: { parts: [{ text: systemInstruction }] }
            };
            if (expectJson) {
                payload.generationConfig = { responseMimeType: "application/json" };
            }

            const delays = [1000, 2000, 4000];
            for (let attempt = 0; attempt <= 3; attempt++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    const result = await response.json();
                    const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (!text) throw new Error('No text in response');
                    return expectJson ? JSON.parse(text) : text;
                } catch (error) {
                    if (attempt === 3) {
                        console.error("Gemini API failed", error);
                        throw new Error("Gagal menghubungi AI.");
                    }
                    await new Promise(resolve => setTimeout(resolve, delays[attempt]));
                }
            }
        };

        // --- Base Components ---
        const Card = ({ children, className = "" }) => (
            <div className={`bg-white p-6 rounded-xl shadow-sm border border-gray-100 ${className}`}>{children}</div>
        );

        const Badge = ({ status }) => {
            if (!status) return null;
            let colors = "bg-gray-100 text-gray-800";
            if (status.includes('Selesai') || status === 'Aktif') colors = "bg-green-100 text-green-800";
            if (status.includes('Proses')) colors = "bg-blue-100 text-blue-800";
            if (status === 'Pending') colors = "bg-yellow-100 text-yellow-800";
            if (status === 'Terkirim') colors = "bg-purple-100 text-purple-800";
            return <span className={`px-2 py-1 text-xs font-semibold rounded-full ${colors}`}>{status}</span>;
        };

        const Toast = ({ message, type, onClose }) => {
            if (!message) return null;
            const bgClass = type === 'error' ? 'bg-red-600' : 'bg-green-600';
            const icon = type === 'error' ? <IconAlertCircle /> : <IconCheckCircle />;
            return (
                <div className="fixed bottom-4 right-4 z-50 toast-enter">
                    <div className={`${bgClass} text-white px-4 py-3 rounded-lg shadow-lg flex items-center gap-3`}>
                        {icon}
                        <span className="font-medium text-sm">{message}</span>
                        <button onClick={onClose} className="ml-4 opacity-75 hover:opacity-100 focus:outline-none">
                            &times;
                        </button>
                    </div>
                </div>
            );
        };

        // --- App Views ---
        const LoginView = ({ onLogin, accounts, templates, showToast }) => {
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');

            const handleSubmit = (e) => {
                e.preventDefault();
                
                const validAccounts = (Array.isArray(accounts) && accounts.length > 0) ? accounts : initialAccounts;

                const user = validAccounts.find(u => 
                    String(u.username).trim().toLowerCase() === String(username).trim().toLowerCase() && 
                    String(u.password).trim() === String(password).trim()
                );
                
                if (user) {
                    onLogin(user);
                } else {
                    setError('Username atau password salah!');
                }
            };

            return (
                <div className="min-h-screen bg-slate-900 flex flex-col justify-center items-center p-4">
                    <div className="max-w-md w-full bg-white rounded-2xl shadow-2xl p-8 transform transition-all">
                        <div className="text-center mb-8">
                            {templates && templates.companyLogo ? (
                                <img src={templates.companyLogo} alt="Logo Perusahaan" className="mx-auto max-h-24 object-contain mb-4 drop-shadow-sm rounded-lg" />
                            ) : (
                                <>
                                    <div className="mx-auto w-16 h-16 bg-red-100 text-red-500 rounded-full flex items-center justify-center mb-4">
                                        <IconScissors />
                                    </div>
                                    <h1 className="text-3xl font-extrabold tracking-wider text-slate-800 mb-1">SIMPATI</h1>
                                </>
                            )}
                            <p className="text-gray-500 font-medium">{templates?.companySubtitle || "Sistem Manajemen Produksi Konveksi"}</p>
                        </div>
                        
                        {error && (
                            <div className="bg-red-50 text-red-600 p-3 rounded-lg mb-6 text-sm text-center border border-red-200 font-medium flex items-center justify-center gap-2">
                                <IconAlertCircle /> {error}
                            </div>
                        )}

                        <form onSubmit={handleSubmit} className="space-y-6">
                            <div>
                                <label className="block text-sm font-semibold text-gray-700 mb-2">Username</label>
                                <input 
                                    type="text" required
                                    className="w-full p-3.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
                                    placeholder="Masukkan username"
                                    value={username} onChange={e => setUsername(e.target.value)}
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-semibold text-gray-700 mb-2">Password</label>
                                <input 
                                    type="password" required
                                    className="w-full p-3.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
                                    placeholder="Masukkan password"
                                    value={password} onChange={e => setPassword(e.target.value)}
                                />
                            </div>
                            <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-lg transition-colors shadow-lg shadow-blue-200 mt-4 text-lg">
                                Masuk
                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        const DashboardView = ({ orders, setOrders, showToast }) => {
            const safeOrders = orders || [];
            const totalOrders = safeOrders.filter(o => !o?.isArchived).length;
            const activeOrders = safeOrders.filter(o => !o?.isArchived && o?.status !== 'Terkirim' && o?.status !== 'Siap Kirim').length;
            const doneOrders = safeOrders.filter(o => !o?.isArchived && o?.status === 'Siap Kirim').length;
            const shippedOrders = safeOrders.filter(o => !o?.isArchived && o?.status === 'Terkirim').length;

            const [deleteConfirmId, setDeleteConfirmId] = useState(null);
            
            const [editOrder, setEditOrder] = useState(null);
            const [editSizeInputs, setEditSizeInputs] = useState([]);
            
            const [insight, setInsight] = useState("");
            const [isInsightLoading, setIsInsightLoading] = useState(false);

            const executeDeleteOrder = () => {
                if (deleteConfirmId) {
                    setOrders(safeOrders.filter(o => o.id !== deleteConfirmId));
                    setDeleteConfirmId(null);
                    showToast("Order berhasil dihapus permanen.", "success");
                }
            };

            const openEditModal = (order) => {
                setEditOrder({ ...order });
                const sizesArray = Object.entries(order.sizes || {}).map(([label, qty], index) => ({ id: index, label, qty }));
                while(sizesArray.length < 4) {
                    sizesArray.push({ id: sizesArray.length, label: '', qty: '' });
                }
                setEditSizeInputs(sizesArray);
            };

            const handleImageUploadEdit = (e, imageField) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 500;
                        let width = img.width, height = img.height;
                        if (width > MAX_WIDTH) { height = Math.round(height * (MAX_WIDTH / width)); width = MAX_WIDTH; }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        setEditOrder(prev => ({ ...prev, [imageField]: canvas.toDataURL('image/jpeg', 0.6) })); 
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            };

            const handleSaveEditOrder = (e) => {
                e.preventDefault();
                const finalSizes = {};
                let total = 0;
                editSizeInputs.forEach(item => {
                    const parsedQty = parseInt(item.qty) || 0;
                    if (parsedQty > 0) {
                        finalSizes[item.label || 'Custom'] = parsedQty;
                        total += parsedQty;
                    }
                });
                if(total <= 0) { showToast("Jumlah total tidak boleh kosong.", "error"); return; }
                
                const updatedOrders = safeOrders.map(o => {
                    if (o.id === editOrder.id) {
                        return {
                            ...o,
                            client: editOrder.client,
                            type: editOrder.type,
                            deadline: editOrder.deadline,
                            notes: editOrder.notes,
                            sizes: finalSizes,
                            total: total,
                            designImage1: editOrder.designImage1,
                            designImage2: editOrder.designImage2
                        };
                    }
                    return o;
                });
                
                setOrders(updatedOrders);
                setEditOrder(null);
                showToast("Data Order berhasil diperbarui!", "success");
            };

            const handleGenerateInsight = async () => {
                setIsInsightLoading(true);
                setInsight("");
                try {
                    const activeData = safeOrders.filter(o => !o?.isArchived).map(o => ({ id: o.id, status: o.status, deadline: o.deadline }));
                    const prompt = `Data: ${JSON.stringify(activeData)}. Berikan analisis 2 kalimat terkait deadline pabrik saya.`;
                    const res = await generateGeminiContent(prompt);
                    setInsight(res);
                } catch (error) {
                    showToast("AI Sedang Sibuk / API Key Kosong", "error");
                } finally {
                    setIsInsightLoading(false);
                }
            };

            return (
                <div className="space-y-6">
                    <div className="flex justify-between items-center">
                        <h2 className="text-2xl font-bold text-gray-800">Dashboard</h2>
                        <button onClick={handleGenerateInsight} disabled={isInsightLoading} className="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-2">
                            {isInsightLoading ? <div className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div> : <IconSparkles />} AI Insight
                        </button>
                    </div>

                    {insight && (
                        <div className="bg-indigo-50 border border-indigo-200 p-4 rounded-lg flex items-start gap-3">
                            <IconSparkles className="text-indigo-600" />
                            <p className="text-sm text-indigo-800">{insight}</p>
                        </div>
                    )}

                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <Card className="border-l-4 border-l-blue-500"><h3 className="text-gray-500 text-sm font-medium">Total Order Masuk</h3><p className="text-3xl font-bold text-gray-800 mt-2">{totalOrders}</p></Card>
                        <Card className="border-l-4 border-l-yellow-500"><h3 className="text-gray-500 text-sm font-medium">Sedang Diproses</h3><p className="text-3xl font-bold text-gray-800 mt-2">{activeOrders}</p></Card>
                        <Card className="border-l-4 border-l-green-500"><h3 className="text-gray-500 text-sm font-medium">Selesai Produksi</h3><p className="text-3xl font-bold text-gray-800 mt-2">{doneOrders}</p></Card>
                        <Card className="border-l-4 border-l-purple-500"><h3 className="text-gray-500 text-sm font-medium">Menunggu Diarsipkan</h3><p className="text-3xl font-bold text-gray-800 mt-2">{shippedOrders}</p></Card>
                    </div>

                    <Card>
                        <h3 className="text-lg font-bold text-gray-800 mb-4">Progress Produksi Berjalan</h3>
                        <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse">
                                <thead>
                                    <tr className="bg-gray-50 border-b border-gray-200">
                                        <th className="p-3 text-sm font-semibold text-gray-600">ID Order</th>
                                        <th className="p-3 text-sm font-semibold text-gray-600">Instansi/Klien</th>
                                        <th className="p-3 text-sm font-semibold text-gray-600">Barang</th>
                                        <th className="p-3 text-sm font-semibold text-gray-600">Status Saat Ini</th>
                                        <th className="p-3 text-sm font-semibold text-gray-600">Deadline</th>
                                        <th className="p-3 text-sm font-semibold text-gray-600 text-center">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {safeOrders.filter(o => !o?.isArchived).map(order => (
                                        <tr key={order.id} className="border-b border-gray-100 hover:bg-gray-50 transition-colors">
                                            <td className="p-3 text-sm font-medium text-blue-600">{order.id}</td>
                                            <td className="p-3 text-sm text-gray-800">{order.client}</td>
                                            <td className="p-3 text-sm text-gray-600">{order.type} ({order.total} pcs)</td>
                                            <td className="p-3"><Badge status={order.status} /></td>
                                            <td className="p-3 text-sm text-gray-600">{order.deadline}</td>
                                            <td className="p-3 text-center flex justify-center space-x-2">
                                                <button onClick={() => openEditModal(order)} className="text-blue-500 hover:text-blue-700 bg-blue-50 hover:bg-blue-100 p-1.5 rounded-md transition-colors" title="Edit Order">
                                                    <IconEdit />
                                                </button>
                                                <button onClick={() => setDeleteConfirmId(order.id)} className="text-red-500 hover:text-red-700 bg-red-50 hover:bg-red-100 p-1.5 rounded-md transition-colors" title="Hapus Order">
                                                    <IconTrash />
                                                </button>
                                                {order.status === 'Terkirim' && (
                                                    <button 
                                                        onClick={() => {
                                                            const newOrders = safeOrders.map(o => o.id === order.id ? { ...o, isArchived: true } : o);
                                                            setOrders(newOrders);
                                                            showToast("Order dipindahkan ke Riwayat!", "success");
                                                        }} 
                                                        className="text-purple-600 hover:text-purple-800 bg-purple-50 hover:bg-purple-100 p-1.5 rounded-md transition-colors" 
                                                        title="Arsipkan Order"
                                                    >
                                                        <IconArchive />
                                                    </button>
                                                )}
                                            </td>
                                        </tr>
                                    ))}
                                    {safeOrders.filter(o => !o?.isArchived).length === 0 && (
                                        <tr><td colSpan="6" className="p-4 text-center text-sm text-gray-500 italic">Tidak ada order yang sedang berjalan.</td></tr>
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </Card>

                    {editOrder && (
                        <div className="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white p-6 rounded-xl shadow-xl w-full max-w-4xl max-h-[95vh] overflow-y-auto">
                                <h3 className="text-xl font-bold text-gray-900 mb-4 border-b pb-2">Edit Data Order: {editOrder.id}</h3>
                                <form onSubmit={handleSaveEditOrder} className="space-y-4">
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div><label className="block text-sm mb-1 font-semibold">Nama Klien / Instansi</label><input required type="text" className="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500" value={editOrder.client} onChange={e => setEditOrder({...editOrder, client: e.target.value})} /></div>
                                        <div><label className="block text-sm mb-1 font-semibold">Jenis Barang</label><input required type="text" className="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500" value={editOrder.type} onChange={e => setEditOrder({...editOrder, type: e.target.value})} /></div>
                                        <div><label className="block text-sm mb-1 font-semibold">Tanggal Masuk</label><input required type="date" disabled className="w-full p-2 border rounded bg-gray-100 text-gray-500" value={editOrder.date} /></div>
                                        <div><label className="block text-sm mb-1 font-semibold">Deadline Produksi</label><input required type="date" className="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500" value={editOrder.deadline} onChange={e => setEditOrder({...editOrder, deadline: e.target.value})} /></div>
                                    </div>

                                    <div className="p-4 bg-gray-50 rounded border">
                                        <label className="block font-bold mb-2 text-sm">Ubah Rincian Ukuran</label>
                                        <div className="grid grid-cols-4 md:grid-cols-8 gap-2">
                                            {editSizeInputs.map((s, i) => (
                                                <div key={s.id}>
                                                    <input type="text" className="w-full text-center text-xs font-bold bg-transparent border-b border-gray-300 outline-none focus:border-blue-500" value={s.label} onChange={e => {const n=[...editSizeInputs]; n[i].label=e.target.value; setEditSizeInputs(n)}} placeholder="Size"/>
                                                    <input type="number" min="0" className="w-full p-1 text-center border rounded mt-1 focus:ring-1 focus:ring-blue-500" value={s.qty === 0 ? '' : s.qty} onChange={e => {const n=[...editSizeInputs]; n[i].qty=e.target.value; setEditSizeInputs(n)}} placeholder="0"/>
                                                </div>
                                            ))}
                                        </div>
                                        <button type="button" onClick={() => setEditSizeInputs([...editSizeInputs, { id: Date.now(), label: '', qty: '' }])} className="text-xs text-blue-600 font-bold mt-2">+ Tambah Kolom</button>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">Ganti Desain Depan</label>
                                            <div className="border border-dashed border-gray-300 p-2 rounded text-center relative hover:bg-gray-50">
                                                {editOrder.designImage1 ? (
                                                    <div className="relative inline-block">
                                                        <img src={editOrder.designImage1} className="max-h-24 rounded object-contain mx-auto" />
                                                        <button type="button" onClick={() => setEditOrder({...editOrder, designImage1: ''})} className="absolute top-1 right-1 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs font-bold shadow-md">&times;</button>
                                                    </div>
                                                ) : (
                                                    <div className="py-2"><IconImage className="mx-auto text-gray-400 mb-1" /><span className="text-xs text-blue-600 font-medium">Unggah Desain 1</span></div>
                                                )}
                                                <input type="file" accept="image/*" onChange={(e) => handleImageUploadEdit(e, 'designImage1')} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
                                            </div>
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">Ganti Desain Belakang</label>
                                            <div className="border border-dashed border-gray-300 p-2 rounded text-center relative hover:bg-gray-50">
                                                {editOrder.designImage2 ? (
                                                    <div className="relative inline-block">
                                                        <img src={editOrder.designImage2} className="max-h-24 rounded object-contain mx-auto" />
                                                        <button type="button" onClick={() => setEditOrder({...editOrder, designImage2: ''})} className="absolute top-1 right-1 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs font-bold shadow-md">&times;</button>
                                                    </div>
                                                ) : (
                                                    <div className="py-2"><IconImage className="mx-auto text-gray-400 mb-1" /><span className="text-xs text-blue-600 font-medium">Unggah Desain 2</span></div>
                                                )}
                                                <input type="file" accept="image/*" onChange={(e) => handleImageUploadEdit(e, 'designImage2')} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
                                            </div>
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-sm font-semibold mb-1">Catatan Tambahan</label>
                                        <textarea rows="3" className="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500" value={editOrder.notes} onChange={e => setEditOrder({...editOrder, notes: e.target.value})}></textarea>
                                    </div>

                                    <div className="flex justify-end space-x-3 pt-4 border-t">
                                        <button type="button" onClick={() => setEditOrder(null)} className="px-5 py-2 font-medium text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">Batal</button>
                                        <button type="submit" className="px-5 py-2 font-medium bg-blue-600 text-white hover:bg-blue-700 rounded-lg transition-colors">Simpan Perubahan</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {deleteConfirmId && (
                        <div className="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 transition-opacity">
                            <div className="bg-white p-6 rounded-xl shadow-xl max-w-sm w-full mx-4 transform transition-all">
                                <h3 className="text-lg font-bold text-gray-900 mb-2">Konfirmasi Hapus</h3>
                                <p className="text-gray-600 mb-6">Apakah Anda yakin ingin menghapus order ini secara permanen?</p>
                                <div className="flex justify-end space-x-3">
                                    <button onClick={() => setDeleteConfirmId(null)} className="px-4 py-2 font-medium text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">Batal</button>
                                    <button onClick={executeDeleteOrder} className="px-4 py-2 font-medium bg-red-600 text-white hover:bg-red-700 rounded-lg transition-colors">Hapus</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const AntreanProduksiView = ({ orders, isTVMode, setIsTVMode }) => {
            const [isLocked, setIsLocked] = useState(false);

            const safeOrders = orders || [];
            const sortedOrders = [...safeOrders]
                .filter(o => !o?.isArchived && o?.status !== 'Terkirim')
                .sort((a, b) => new Date(a.deadline || 0) - new Date(b.deadline || 0));

            const renderCards = (isDark = false) => {
                return sortedOrders.map((order, index) => {
                    const today = new Date();
                    today.setHours(0, 0, 0, 0); 
                    const deadlineDate = new Date(order.deadline || Date.now());
                    const diffTime = deadlineDate - today;
                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                    
                    let urgencyClass = isDark ? "border-slate-700 bg-slate-800" : "border-gray-200 bg-white";
                    let statusColor = isDark ? "text-slate-300" : "text-gray-500";
                    let titleColor = isDark ? "text-white" : "text-gray-800";
                    
                    if (order.status === 'Siap Kirim') {
                        urgencyClass = isDark ? "border-green-600 bg-green-900/30" : "border-green-400 bg-green-50";
                        statusColor = isDark ? "text-green-400" : "text-green-600";
                        titleColor = isDark ? "text-green-100" : "text-green-900";
                    } else if (diffDays <= 3) {
                        urgencyClass = isDark ? "border-red-600 bg-red-900/40 animate-tv-urgent" : "border-red-400 bg-red-50";
                        statusColor = isDark ? "text-red-300" : "text-red-600";
                        titleColor = isDark ? "text-red-100" : "text-red-900";
                    } else if (diffDays <= 7) {
                        urgencyClass = isDark ? "border-orange-500 bg-orange-900/30" : "border-orange-300 bg-orange-50";
                        statusColor = isDark ? "text-orange-300" : "text-orange-600";
                        titleColor = isDark ? "text-orange-100" : "text-orange-900";
                    }

                    return (
                        <div key={order.id} className={`p-4 rounded-xl border-2 shadow-sm flex flex-col md:flex-row gap-4 items-start md:items-center transition-all ${urgencyClass}`}>
                            <div className={`text-4xl font-black opacity-30 w-12 text-center shrink-0 ${isDark ? 'text-white' : 'text-gray-900'}`}>#{index + 1}</div>
                            
                            {/* Kotak Thumbnail Gambar Desain */}
                            <div className={`w-20 h-20 md:w-24 md:h-24 shrink-0 rounded-lg border-2 flex items-center justify-center overflow-hidden bg-white ${isDark ? 'border-slate-600' : 'border-gray-200'}`}>
                                {order.designImage1 ? (
                                    <img src={order.designImage1} alt="Desain" className="w-full h-full object-cover" />
                                ) : order.designImage2 ? (
                                    <img src={order.designImage2} alt="Desain" className="w-full h-full object-cover" />
                                ) : (
                                    <IconImage className={`w-8 h-8 opacity-20 ${isDark ? 'text-black' : 'text-gray-800'}`} />
                                )}
                            </div>
                            
                            <div className="flex-1">
                                <div className="flex items-center gap-2 mb-1">
                                    <h3 className={`text-xl font-bold ${titleColor}`}>{order.client}</h3>
                                    <span className={`px-2 py-0.5 rounded text-xs font-bold ${isDark ? 'bg-black/50 text-white' : 'bg-gray-200 text-gray-800'}`}>
                                        {order.id}
                                    </span>
                                </div>
                                <p className={`text-sm font-medium ${isDark ? 'text-gray-300' : 'text-gray-700'}`}>
                                    {order.type} &bull; <span className="font-bold">{order.total} pcs</span>
                                </p>
                                {order.notes && (
                                    <p className={`mt-2 text-sm italic border-l-2 pl-2 py-0.5 ${isDark ? 'border-slate-500 text-slate-400' : 'border-gray-300 text-gray-500'}`}>
                                        "{order.notes}"
                                    </p>
                                )}
                            </div>

                            <div className="md:text-right shrink-0 min-w-[200px]">
                                <div className={`text-sm font-bold mb-1 ${statusColor}`}>
                                    Sisa Waktu: {diffDays < 0 ? 'TERLEWAT' : diffDays === 0 ? 'HARI INI' : `${diffDays} Hari`}
                                </div>
                                <div className={`text-2xl font-black ${titleColor}`}>{order.deadline}</div>
                                <div className="mt-2 inline-block">
                                    <Badge status={order.status} />
                                </div>
                            </div>
                        </div>
                    );
                });
            };

            if (isTVMode) {
                return (
                    <div className={`fixed inset-0 z-[100] bg-slate-950 overflow-y-auto hide-scrollbar text-white p-6 md:p-12 font-sans ${isLocked ? 'cursor-none' : ''}`}>
                        <div className="max-w-7xl mx-auto">
                            {!isLocked && (
                                <div className="flex justify-between items-end mb-8 border-b border-slate-800 pb-4">
                                    <div>
                                        <h1 className="text-4xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-300">
                                            ANTREAN PRODUKSI
                                        </h1>
                                        <p className="text-slate-400 mt-2 text-lg">Pabrik Simpati Konveksi &bull; Diurutkan berdasarkan deadline terdekat</p>
                                    </div>
                                    <div className="flex flex-col items-end gap-4">
                                        <div className="text-2xl font-bold text-slate-300 bg-slate-800 px-4 py-2 rounded-lg">
                                            {new Date().toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}
                                        </div>
                                        <div className="flex gap-2">
                                            <button 
                                                onClick={() => setIsLocked(true)}
                                                className="text-sm bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition-colors shadow-lg shadow-blue-900/50 flex items-center gap-2 font-bold"
                                            >
                                                <IconLock /> Kunci Layar TV
                                            </button>
                                            <button 
                                                onClick={() => setIsTVMode(false)}
                                                className="text-sm bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-lg transition-colors border border-slate-700"
                                            >
                                                &times; Tutup TV Mode
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {isLocked && (
                                <div className="flex justify-between items-center mb-8">
                                    <h1 className="text-3xl font-black tracking-widest text-slate-500 uppercase">
                                        MONITOR PRODUKSI
                                    </h1>
                                    <button 
                                        onClick={() => setIsLocked(false)}
                                        className="opacity-10 hover:opacity-100 transition-opacity p-2 bg-slate-800 rounded-full cursor-pointer pointer-events-auto"
                                        title="Buka Kunci Layar"
                                    >
                                        <IconUnlock />
                                    </button>
                                </div>
                            )}

                            <div className="flex flex-wrap gap-4 md:gap-6 mb-6 text-sm font-bold text-slate-400 bg-slate-900 p-4 rounded-xl border border-slate-800">
                                <div className="flex items-center gap-2"><span className="w-3 h-3 rounded-full bg-red-600 animate-pulse"></span> Sangat Urgent (&lt; 3 Hari)</div>
                                <div className="flex items-center gap-2"><span className="w-3 h-3 rounded-full bg-orange-500"></span> Waspada (&lt; 7 Hari)</div>
                                <div className="flex items-center gap-2"><span className="w-3 h-3 rounded-full bg-slate-700"></span> Aman</div>
                                <div className="flex items-center gap-2"><span className="w-3 h-3 rounded-full bg-green-500"></span> Siap Kirim</div>
                            </div>

                            {sortedOrders.length > 0 ? (
                                <div className="flex flex-col gap-4 pb-20">
                                    {renderCards(true)}
                                </div>
                            ) : (
                                <div className="text-center py-20 text-slate-500 text-xl font-bold border-2 border-dashed border-slate-800 rounded-2xl">
                                    Tidak ada antrean order produksi saat ini.
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            return (
                <div className="space-y-6">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <h2 className="text-2xl font-bold text-gray-800">Monitor Antrean Produksi</h2>
                            <p className="text-gray-500 text-sm mt-1">Urutan prioritas pengerjaan berdasarkan target tanggal selesai.</p>
                        </div>
                        <button 
                            onClick={() => setIsTVMode(true)}
                            className="bg-slate-900 hover:bg-slate-800 text-white px-5 py-2.5 rounded-lg font-bold shadow-lg transition-colors flex items-center gap-2"
                        >
                            <IconMonitor /> Buka Mode Layar TV (Monitor)
                        </button>
                    </div>

                    <Card className="bg-blue-50/50">
                        {sortedOrders.length > 0 ? (
                            <div className="flex flex-col gap-4">
                                {renderCards(false)}
                            </div>
                        ) : (
                            <div className="text-center py-10 text-gray-500 italic">Belum ada pesanan aktif.</div>
                        )}
                    </Card>
                </div>
            );
        };

        const KaryawanView = ({ employees, setEmployees, showToast }) => {
            const [showForm, setShowForm] = useState(false);
            const [newEmp, setNewEmp] = useState({ name: '', division: 'Cutting', phone: '', status: 'Aktif' });
            
            const [editEmp, setEditEmp] = useState(null);
            const [deleteConfirmId, setDeleteConfirmId] = useState(null);

            const safeEmployees = employees || [];

            const handleAdd = (e) => {
                e.preventDefault();
                setEmployees([...safeEmployees, { ...newEmp, id: Date.now() }]);
                setShowForm(false);
                setNewEmp({ name: '', division: 'Cutting', phone: '', status: 'Aktif' });
                showToast("Karyawan ditambahkan!", "success");
            };

            const handleSaveEdit = (e) => {
                e.preventDefault();
                setEmployees(safeEmployees.map(emp => emp.id === editEmp.id ? editEmp : emp));
                setEditEmp(null);
                showToast("Data Karyawan diperbarui!", "success");
            };

            const executeDeleteKaryawan = () => {
                if(deleteConfirmId) {
                    setEmployees(safeEmployees.filter(emp => emp.id !== deleteConfirmId));
                    setDeleteConfirmId(null);
                    showToast("Karyawan dihapus.", "success");
                }
            };

            return (
                <div className="space-y-6">
                    <div className="flex justify-between items-center">
                        <h2 className="text-2xl font-bold text-gray-800">Data Karyawan</h2>
                        <button onClick={() => setShowForm(!showForm)} className="bg-blue-600 text-white px-4 py-2 rounded-lg flex items-center gap-2 text-sm font-medium"><IconPlusCircle /> Tambah Karyawan</button>
                    </div>

                    {showForm && (
                        <Card className="bg-blue-50 border-blue-100">
                            <h3 className="font-bold text-blue-900 mb-3 border-b pb-2">Tambah Karyawan Baru</h3>
                            <form onSubmit={handleAdd} className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div><label className="block text-sm mb-1 font-semibold">Nama</label><input required type="text" className="w-full p-2 border rounded" value={newEmp.name} onChange={e => setNewEmp({...newEmp, name: e.target.value})} /></div>
                                <div>
                                    <label className="block text-sm mb-1 font-semibold">Divisi</label>
                                    <select className="w-full p-2 border rounded" value={newEmp.division} onChange={e => setNewEmp({...newEmp, division: e.target.value})}>
                                        <option>Cutting</option>
                                        <option>Sablon/Bordir</option>
                                        <option>Jahit</option>
                                        <option>Pasang Kancing</option>
                                        <option>Finishing</option>
                                    </select>
                                </div>
                                <div><label className="block text-sm mb-1 font-semibold">No HP</label><input type="text" className="w-full p-2 border rounded" value={newEmp.phone} onChange={e => setNewEmp({...newEmp, phone: e.target.value})} /></div>
                                <div><label className="block text-sm mb-1 font-semibold">Status</label><select className="w-full p-2 border rounded" value={newEmp.status} onChange={e => setNewEmp({...newEmp, status: e.target.value})}><option>Aktif</option><option>Nonaktif</option></select></div>
                                <div className="md:col-span-2 flex justify-end"><button type="submit" className="bg-blue-600 text-white px-6 py-2 rounded">Simpan Data</button></div>
                            </form>
                        </Card>
                    )}

                    <Card>
                        <table className="w-full text-left border-collapse">
                            <thead><tr className="bg-gray-50 border-b">
                                <th className="p-3 text-sm">Nama</th><th className="p-3 text-sm">Divisi</th><th className="p-3 text-sm">No. HP</th><th className="p-3 text-sm">Status</th><th className="p-3 text-sm text-center">Aksi</th>
                            </tr></thead>
                            <tbody>
                                {safeEmployees.map(emp => (
                                    <tr key={emp.id} className="border-b hover:bg-gray-50 transition-colors">
                                        <td className="p-3 text-sm font-medium text-gray-800">{emp.name}</td>
                                        <td className="p-3 text-sm text-gray-600">{emp.division}</td>
                                        <td className="p-3 text-sm text-gray-600">{emp.phone}</td>
                                        <td className="p-3"><Badge status={emp.status || 'Aktif'} /></td>
                                        <td className="p-3 text-center flex justify-center space-x-2">
                                            <button onClick={() => setEditEmp({...emp, status: emp.status || 'Aktif'})} className="text-blue-500 hover:text-blue-700 bg-blue-50 p-1.5 rounded" title="Edit Karyawan"><IconEdit /></button>
                                            <button onClick={() => setDeleteConfirmId(emp.id)} className="text-red-500 hover:text-red-700 bg-red-50 p-1.5 rounded" title="Hapus Karyawan"><IconTrash /></button>
                                        </td>
                                    </tr>
                                ))}
                                {safeEmployees.length === 0 && <tr><td colSpan="5" className="p-6 text-center text-gray-500 italic">Belum ada data karyawan.</td></tr>}
                            </tbody>
                        </table>
                    </Card>

                    {editEmp && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
                            <div className="bg-white p-6 rounded-xl w-full max-w-md shadow-xl">
                                <h3 className="font-bold text-lg mb-4 border-b pb-2">Edit Data Karyawan</h3>
                                <form onSubmit={handleSaveEdit} className="space-y-4">
                                    <div><label className="block text-sm mb-1 font-semibold">Nama Karyawan</label><input required type="text" className="w-full p-2 border rounded focus:ring-blue-500" value={editEmp.name} onChange={e => setEditEmp({...editEmp, name: e.target.value})} /></div>
                                    <div>
                                        <label className="block text-sm mb-1 font-semibold">Divisi</label>
                                        <select className="w-full p-2 border rounded focus:ring-blue-500" value={editEmp.division} onChange={e => setEditEmp({...editEmp, division: e.target.value})}>
                                            <option>Cutting</option>
                                            <option>Sablon/Bordir</option>
                                            <option>Jahit</option>
                                            <option>Pasang Kancing</option>
                                            <option>Finishing</option>
                                        </select>
                                    </div>
                                    <div><label className="block text-sm mb-1 font-semibold">Nomor HP</label><input type="text" className="w-full p-2 border rounded focus:ring-blue-500" value={editEmp.phone} onChange={e => setEditEmp({...editEmp, phone: e.target.value})} /></div>
                                    <div><label className="block text-sm mb-1 font-semibold">Status Pekerja</label><select className="w-full p-2 border rounded focus:ring-blue-500" value={editEmp.status} onChange={e => setEditEmp({...editEmp, status: e.target.value})}><option>Aktif</option><option>Nonaktif</option></select></div>
                                    <div className="flex justify-end space-x-3 pt-4 border-t">
                                        <button type="button" onClick={() => setEditEmp(null)} className="px-4 py-2 bg-gray-200 rounded font-medium">Batal</button>
                                        <button type="submit" className="px-4 py-2 bg-blue-600 text-white rounded font-medium">Simpan Perubahan</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {deleteConfirmId && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50">
                            <div className="bg-white p-6 rounded-xl w-80">
                                <h3 className="font-bold mb-2">Hapus?</h3>
                                <div className="flex justify-end space-x-2">
                                    <button onClick={() => setDeleteConfirmId(null)} className="px-4 py-2 bg-gray-200 rounded">Batal</button>
                                    <button onClick={executeDeleteKaryawan} className="px-4 py-2 bg-red-600 text-white rounded">Hapus</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const InputOrderView = ({ orders, setOrders, setActiveTab, showToast }) => {
            const safeOrders = orders || [];
            const [newOrder, setNewOrder] = useState({ client: '', type: '', date: new Date().toISOString().split('T')[0], deadline: '', notes: '', designImage1: '', designImage2: '' });
            const [sizeInputs, setSizeInputs] = useState([{ id: 1, label: 'S', qty: '' }, { id: 2, label: 'M', qty: '' }, { id: 3, label: 'L', qty: '' }, { id: 4, label: 'XL', qty: '' }]);
            
            const [aiInputText, setAiInputText] = useState("");
            const [isAiLoading, setIsAiLoading] = useState(false);

            const totalQty = sizeInputs.reduce((sum, item) => sum + (parseInt(item.qty) || 0), 0);

            const handleSizeLabelChange = (index, val) => {
                const newSizes = [...sizeInputs];
                newSizes[index].label = val;
                setSizeInputs(newSizes);
            };

            const handleSizeQtyChange = (index, val) => {
                const newSizes = [...sizeInputs];
                newSizes[index].qty = val;
                setSizeInputs(newSizes);
            };

            const handleAddSize = () => setSizeInputs([...sizeInputs, { id: Date.now(), label: 'Custom', qty: '' }]);

            const handleImageUpload = (e, imageField) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 500; 
                        let width = img.width, height = img.height;
                        if (width > MAX_WIDTH) { height = Math.round(height * (MAX_WIDTH / width)); width = MAX_WIDTH; }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        setNewOrder(prev => ({ ...prev, [imageField]: canvas.toDataURL('image/jpeg', 0.6) })); 
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            };

            const handleAiAutofill = async () => {
                if(!aiInputText.trim()) return;
                setIsAiLoading(true);
                try {
                    const today = new Date().toISOString().split('T')[0];
                    const prompt = `Ekstrak informasi pesanan ini ke format JSON ketat. Hari ini tanggal ${today}.
                    Jika deadline disebutkan bulan depan/minggu depan, konversi ke format YYYY-MM-DD.
                    Format JSON: { "client": string, "type": string (cth: Kaos, Kemeja, Jaket), "deadline": "YYYY-MM-DD", "notes": string, "sizes": { "S": number, "M": number, "L": number, "XL": number, "XXL": number, "3XL": number, "4XL": number, "5XL": number } }
                    Teks dari user: "${aiInputText}"`;
                    
                    const extractedData = await generateGeminiContent(prompt, "Anda adalah ekstraktor data JSON.", true);
                    
                    if (extractedData) {
                        setNewOrder({
                            ...newOrder,
                            client: extractedData.client || newOrder.client,
                            type: extractedData.type || newOrder.type,
                            deadline: extractedData.deadline || newOrder.deadline,
                            notes: extractedData.notes || newOrder.notes
                        });
                        
                        if (extractedData.sizes) {
                            const updatedSizes = [...sizeInputs];
                            updatedSizes.forEach(item => {
                                if (extractedData.sizes[item.label] !== undefined) {
                                    item.qty = extractedData.sizes[item.label];
                                }
                            });
                            setSizeInputs(updatedSizes);
                        }
                        showToast("Form berhasil diisi oleh AI ✨", "success");
                        setAiInputText(""); 
                    }
                } catch (error) {
                    showToast("Gagal memproses teks dengan AI.", "error");
                } finally {
                    setIsAiLoading(false);
                }
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if(totalQty <= 0) { showToast("Jumlah total tidak boleh kosong atau nol.", "error"); return; }
                
                const finalSizes = {};
                sizeInputs.forEach(item => {
                    const parsedQty = parseInt(item.qty) || 0;
                    if (parsedQty > 0) finalSizes[item.label || 'Custom'] = parsedQty;
                });

                const orderToAdd = {
                    ...newOrder,
                    id: `ORD-${String(safeOrders.length + 1).padStart(3, '0')}`,
                    sizes: finalSizes,
                    total: totalQty,
                    status: 'Pending',
                    progress: {
                        cutting: { status: 'Belum', employees: [], workLogs: [] },
                        sablon: { status: 'Belum', employees: [], workLogs: [] },
                        jahit: { status: 'Belum', employees: [], workLogs: [] },
                        kancing: { status: 'Belum', employees: [], workLogs: [] },
                        finishing: { status: 'Belum', employees: [], workLogs: [] }
                    }
                };
                
                const newOrders = [orderToAdd, ...safeOrders];
                setOrders(newOrders);
                showToast("Order ditambahkan ke antrean!", "success");
                setActiveTab('produksi');
            };

            return (
                <div className="space-y-6 max-w-4xl">
                    <h2 className="text-2xl font-bold text-gray-800">Input Order Produksi</h2>
                    
                    <div className="bg-gradient-to-r from-indigo-500 to-purple-600 rounded-xl p-1 shadow-md">
                        <div className="bg-white rounded-lg p-5">
                            <label className="flex items-center gap-2 text-sm font-bold text-indigo-800 mb-2">
                                <IconSparkles /> Asisten Input Pintar AI
                            </label>
                            <p className="text-xs text-gray-500 mb-3">Ketik deskripsi pesanan secara bebas, AI Gemini akan mengisikan form di bawah otomatis untuk Anda.</p>
                            <div className="flex gap-3 items-end">
                                <textarea 
                                    className="flex-1 p-3 border border-indigo-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-sm resize-none" 
                                    rows="2"
                                    placeholder="Contoh: Pesanan dari PT Sejahtera buat 30 Kemeja kerja, ukurannya M 10, L 15, XL 5. Deadline tanggal 25 Desember. Catatan: logo bordir di dada kiri."
                                    value={aiInputText}
                                    onChange={e => setAiInputText(e.target.value)}
                                ></textarea>
                                <button 
                                    type="button"
                                    onClick={handleAiAutofill}
                                    disabled={!aiInputText.trim() || isAiLoading}
                                    className="bg-indigo-600 hover:bg-indigo-700 disabled:bg-indigo-300 text-white px-5 py-3 rounded-lg font-bold shadow-sm transition-all h-[62px] flex items-center gap-2 whitespace-nowrap shrink-0"
                                >
                                    {isAiLoading ? <div className="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div> : <IconSparkles />}
                                    Isi Form Otomatis
                                </button>
                            </div>
                        </div>
                    </div>

                    <Card>
                        <form onSubmit={handleSubmit} className="space-y-6">
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div><label className="block text-sm font-medium text-gray-700 mb-1">Tanggal Masuk</label><input required type="date" className="w-full p-2 border border-gray-300 rounded-lg focus:ring-blue-500" value={newOrder.date} onChange={e => setNewOrder({...newOrder, date: e.target.value})} /></div>
                                <div><label className="block text-sm font-medium text-gray-700 mb-1">Deadline Produksi</label><input required type="date" className="w-full p-2 border border-gray-300 rounded-lg focus:ring-blue-500" value={newOrder.deadline} onChange={e => setNewOrder({...newOrder, deadline: e.target.value})} /></div>
                                <div><label className="block text-sm font-medium text-gray-700 mb-1">Nama Instansi / Sekolah</label><input required type="text" placeholder="Misal: SMP 1 Harapan" className="w-full p-2 border border-gray-300 rounded-lg focus:ring-blue-500" value={newOrder.client} onChange={e => setNewOrder({...newOrder, client: e.target.value})} /></div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Jenis Produksi</label>
                                    <input required list="jenis-produksi-list" className="w-full p-2 border border-gray-300 rounded-lg focus:ring-blue-500" placeholder="Pilih atau ketik jenis produksi..." value={newOrder.type} onChange={e => setNewOrder({...newOrder, type: e.target.value})} />
                                    <datalist id="jenis-produksi-list"><option value="Kaos" /><option value="Kemeja" /><option value="Jaket" /><option value="Wearpack" /><option value="Wangki / Polo Shirt" /><option value="Celana" /><option value="Topi" /></datalist>
                                </div>
                            </div>

                            <div className="p-4 bg-gray-50 rounded-lg border border-gray-200">
                                <div className="flex justify-between items-center mb-3">
                                    <label className="block text-sm font-semibold text-gray-800">Input Ukuran dan Jumlah (Pcs)</label>
                                    <button type="button" onClick={handleAddSize} className="text-xs bg-blue-100 hover:bg-blue-200 text-blue-700 px-3 py-1 rounded-md font-medium transition-colors">+ Tambah Kolom Ukuran</button>
                                </div>
                                <div className="grid grid-cols-4 md:grid-cols-8 gap-4">
                                    {sizeInputs.map((size, index) => (
                                        <div key={size.id}>
                                            <input type="text" className="w-full text-xs text-center font-bold text-gray-700 mb-1 bg-transparent border-b border-gray-300 focus:border-blue-500 focus:outline-none" value={size.label} onChange={e => handleSizeLabelChange(index, e.target.value)} placeholder="Ukuran" />
                                            <input type="number" min="0" placeholder="0" className="w-full p-2 text-center border border-gray-300 rounded-lg focus:ring-blue-500" value={size.qty === 0 ? '' : size.qty} onChange={e => handleSizeQtyChange(index, e.target.value)} />
                                        </div>
                                    ))}
                                </div>
                                <div className="mt-4 flex justify-between items-center bg-white p-3 rounded border border-gray-200">
                                    <span className="font-medium text-gray-700">Total Keseluruhan:</span><span className="text-xl font-bold text-blue-600">{totalQty} Pcs</span>
                                </div>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Gambar Desain Depan (Opsional)</label>
                                    <div className="border border-dashed border-gray-300 p-2 rounded-lg text-center relative hover:bg-gray-50 transition-colors">
                                        {newOrder.designImage1 ? (
                                            <div className="relative inline-block">
                                                <img src={newOrder.designImage1} className="max-h-32 rounded object-contain mx-auto" />
                                                <button type="button" onClick={() => setNewOrder({...newOrder, designImage1: ''})} className="absolute top-1 right-1 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs font-bold shadow-md">&times;</button>
                                            </div>
                                        ) : (
                                            <div className="py-4">
                                                <IconImage className="mx-auto text-gray-400 mb-1" />
                                                <span className="text-sm text-blue-600 font-medium">Unggah Desain 1</span>
                                            </div>
                                        )}
                                        <input type="file" accept="image/*" onChange={(e) => handleImageUpload(e, 'designImage1')} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" title="Klik untuk unggah gambar" />
                                    </div>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Gambar Desain Belakang (Opsional)</label>
                                    <div className="border border-dashed border-gray-300 p-2 rounded-lg text-center relative hover:bg-gray-50 transition-colors">
                                        {newOrder.designImage2 ? (
                                            <div className="relative inline-block">
                                                <img src={newOrder.designImage2} className="max-h-32 rounded object-contain mx-auto" />
                                                <button type="button" onClick={() => setNewOrder({...newOrder, designImage2: ''})} className="absolute top-1 right-1 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs font-bold shadow-md">&times;</button>
                                            </div>
                                        ) : (
                                            <div className="py-4">
                                                <IconImage className="mx-auto text-gray-400 mb-1" />
                                                <span className="text-sm text-blue-600 font-medium">Unggah Desain 2</span>
                                            </div>
                                        )}
                                        <input type="file" accept="image/*" onChange={(e) => handleImageUpload(e, 'designImage2')} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" title="Klik untuk unggah gambar" />
                                    </div>
                                </div>
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Catatan Tambahan Produksi</label>
                                <textarea rows="3" className="w-full p-2 border border-gray-300 rounded-lg focus:ring-blue-500" placeholder="Detail desain, warna sablon, bordir, dll..." value={newOrder.notes} onChange={e => setNewOrder({...newOrder, notes: e.target.value})}></textarea>
                            </div>

                            <div className="flex justify-end pt-4">
                                <button type="submit" className="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-lg font-bold text-lg shadow-md transition-colors">Simpan Order Masuk</button>
                            </div>
                        </form>
                    </Card>
                </div>
            );
        };

        const ProduksiView = ({ orders, setOrders, employees, showToast, templates }) => {
            const [selectedOrder, setSelectedOrder] = useState(null);
            const [activeStage, setActiveStage] = useState('cutting');
            const safeOrders = orders || [];

            const stages = [
                { id: 'cutting', label: '1. Cutting', div: 'Cutting' },
                { id: 'sablon', label: '2. Sablon', div: 'Sablon/Bordir' },
                { id: 'jahit', label: '3. Jahit', div: 'Jahit' },
                { id: 'kancing', label: '4. Kancing', div: 'Pasang Kancing' },
                { id: 'finishing', label: '5. Finishing', div: 'Finishing' }
            ];

            const getStageSizeTotals = (stageData) => {
                const totals = {};
                if (stageData && stageData.workLogs) {
                    stageData.workLogs.forEach(log => { totals[log.size] = (totals[log.size] || 0) + (parseInt(log.qty) || 0); });
                }
                return totals;
            };

            const getMaxAllowed = (order, stageId, size) => {
                if (!order) return 0;
                const stagesOrder = ['cutting', 'sablon', 'jahit', 'kancing', 'finishing'];
                const currentIndex = stagesOrder.indexOf(stageId);
