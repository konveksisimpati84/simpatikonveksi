                                    <td>${item.sizes}</td>
                                    <td class="text-center font-bold">${item.qty}</td>
                                </tr>
                            `).join('')}
                            <tr>
                                <td colspan="5" class="text-right font-bold" style="font-size: 16px;">TOTAL KESELURUHAN:</td>
                                <td class="text-center font-bold" style="font-size: 16px;">${data.total}</td>
                            </tr>
                        </tbody>
                    </table>

                    <div class="footer">
                        <div>
                            <p>${templates.laporanSignatureLeft}</p>
                            <div class="signature">(...................................)</div>
                        </div>
                        <div>
                            <p>${templates.laporanSignatureRight}</p>
                            <div class="signature">(${data.empName})</div>
                        </div>
                    </div>
                </body>
                </html>
                `;

                let printWindow = window.open('', '_blank');
                if (printWindow) {
                    printWindow.document.open();
                    printWindow.document.write(printContent);
                    printWindow.document.close();
                    printWindow.focus();
                    setTimeout(() => { printWindow.print(); }, 250);
                } else {
                    showToast("Gagal mencetak. Harap izinkan Pop-up di browser Anda!", "error");
                }
            };

            const handleDeleteRekap = () => {
                const rekapToDelete = (rekapKinerja || []).find(r => r.id === deleteRekapConfirmId);
                if (!rekapToDelete) return;
                
                const logsToUnlock = (rekapToDelete.items || []).flatMap(item => 
                    (item.logIds || []).map(l => ({ orderId: item.orderId, stageId: l.stageId, logId: l.logId }))
                );
                
                // MENGGUNAKAN FORMAT ARRAY YANG BENAR AGAR TIDAK ERROR "map is not a function"
                const newOrders = [...(orders || [])];
                logsToUnlock.forEach(target => {
                    const orderIndex = newOrders.findIndex(o => o.id === target.orderId);
                    if (orderIndex > -1) {
                        const order = { ...newOrders[orderIndex] };
                        const stageData = { ...order.progress[target.stageId] };
                        const workLogs = [...(stageData.workLogs || [])];
                        
                        const logIndex = workLogs.findIndex(l => l.id === target.logId);
                        if (logIndex > -1) {
                            workLogs[logIndex] = { ...workLogs[logIndex], isReported: false };
                        }
                        
                        stageData.workLogs = workLogs;
                        order.progress = { ...order.progress, [target.stageId]: stageData };
                        newOrders[orderIndex] = order;
                    }
                });
                setOrders(newOrders);
                
                setRekapKinerja((rekapKinerja || []).filter(r => r.id !== deleteRekapConfirmId));
                setDeleteRekapConfirmId(null);
                showToast("Rekap dibatalkan, pekerjaan kembali bisa diedit.", "success");
            };

            const handleOpenRekapModal = (empId, items, total) => {
                setModalData({ empId, items, total });
            };

            const executeRekapAndPrint = () => {
                if(!dateRange.start || !dateRange.end) {
                    showToast("Pilih rentang tanggal terlebih dahulu", "error");
                    return;
                }
                if(!modalData) return;

                const newRekap = {
                    id: `RKP-${Date.now()}`,
                    empId: modalData.empId,
                    startDate: dateRange.start,
                    endDate: dateRange.end,
                    dateProcessed: new Date().toISOString().split('T')[0],
                    items: modalData.items || [],
                    total: modalData.total || 0
                };
                
                setRekapKinerja([...(rekapKinerja || []), newRekap]);
                
                const logsToUpdate = (modalData.items || []).flatMap(item => 
                    (item.logIds || []).map(l => ({ orderId: item.orderId, stageId: l.stageId, logId: l.logId }))
                );

                // MENGGUNAKAN FORMAT ARRAY YANG BENAR
                const newOrders = [...(orders || [])];
                logsToUpdate.forEach(target => {
                    const orderIndex = newOrders.findIndex(o => o.id === target.orderId);
                    if (orderIndex > -1) {
                        const order = { ...newOrders[orderIndex] };
                        const stageData = { ...order.progress[target.stageId] };
                        const workLogs = [...(stageData.workLogs || [])];
                        
                        const logIndex = workLogs.findIndex(l => l.id === target.logId);
                        if (logIndex > -1) {
                            workLogs[logIndex] = { ...workLogs[logIndex], isReported: true };
                        }
                        
                        stageData.workLogs = workLogs;
                        order.progress = { ...order.progress, [target.stageId]: stageData };
                        newOrders[orderIndex] = order;
                    }
                });
                setOrders(newOrders);

                setModalData(null);
                const emp = (employees || []).find(e => e.id === newRekap.empId);
                showToast("Laporan direkap dan siap dicetak.", "success");
                if (emp) {
                    triggerPrint({ ...newRekap, empName: emp.name, division: emp.division });
                }
            };

            const printExistingRekap = (rekap) => {
                const emp = (employees || []).find(e => e.id === rekap.empId);
                if (emp) {
                    triggerPrint({ ...rekap, empName: emp.name, division: emp.division });
                }
            };

            return (
                <div className="space-y-6">
                    <div className="space-y-6">
                        <h2 className="text-2xl font-bold text-gray-800">Laporan & Rekap Kinerja Karyawan</h2>
                        <div className="space-y-8">
                            {(employees || []).map(emp => {
                                const unsettledItems = [];
                                let totalUnsettled = 0;

                                (orders || []).forEach(order => {
                                    if(order.progress) {
                                        Object.entries(order.progress).forEach(([stage, data]) => {
                                            if (data && data.workLogs) {
                                                const empLogs = data.workLogs.filter(l => l.empId === emp.id && !l.isReported && l.qty > 0 && l.checkAfter);
                                                if (empLogs.length > 0) {
                                                    const sizeMap = {};
                                                    empLogs.forEach(l => { sizeMap[l.size] = (sizeMap[l.size] || 0) + (parseInt(l.qty) || 0); });
                                                    const sizesInfo = Object.entries(sizeMap).map(([s, q]) => `${s} (${q})`).join(', ');
                                                    const stageTotalQty = empLogs.reduce((sum, l) => sum + (parseInt(l.qty) || 0), 0);
                                                    
                                                    unsettledItems.push({
                                                        orderId: order.id, client: order.client, type: order.type,
                                                        stage: stage, sizes: sizesInfo, qty: stageTotalQty,
                                                        logIds: empLogs.map(l => ({ stageId: stage, logId: l.id }))
                                                    });
                                                    totalUnsettled += stageTotalQty;
                                                }
                                            }
                                        });
                                    }
                                });

                                const myHistory = (rekapKinerja || []).filter(r => r.empId === emp.id).reverse();

                                return (
                                    <div key={emp.id} className="bg-white border border-gray-200 rounded-xl overflow-hidden shadow-sm hover:shadow-md transition-shadow">
                                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center bg-blue-50 p-4 border-b border-blue-100">
                                            <div>
                                                <h3 className="font-bold text-lg text-blue-900">{emp.name}</h3>
                                                <span className="text-xs font-semibold bg-blue-200 text-blue-800 px-3 py-1 rounded-full">{emp.division}</span>
                                            </div>
                                        </div>
                                        
                                        <div className="p-4 space-y-6">
                                            <div>
                                                <div className="flex justify-between items-end mb-3">
                                                    <h4 className="font-bold text-gray-700 flex items-center gap-2">
                                                        <span className="w-2 h-2 rounded-full bg-yellow-500 animate-pulse"></span> Pekerjaan Selesai (Siap Direkap)
                                                    </h4>
                                                    {totalUnsettled > 0 && (
                                                        <button onClick={() => handleOpenRekapModal(emp.id, unsettledItems, totalUnsettled)} className="text-sm bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded shadow-sm font-medium transition flex items-center gap-2">
                                                            <IconCheckCircle /> Rekap & Cetak Laporan
                                                        </button>
                                                    )}
                                                </div>
                                                
                                                {unsettledItems.length > 0 ? (
                                                    <div className="overflow-x-auto border border-gray-200 rounded-lg">
                                                        <table className="w-full text-sm text-left border-collapse">
                                                            <thead className="bg-gray-50 text-gray-600">
                                                                <tr>
                                                                    <th className="py-2 px-3 font-semibold border-b border-gray-200">ID Order</th>
                                                                    <th className="py-2 px-3 font-semibold border-b border-gray-200">Klien (Barang)</th>
                                                                    <th className="py-2 px-3 font-semibold border-b border-gray-200">Tahap</th>
                                                                    <th className="py-2 px-3 font-semibold border-b border-gray-200">Rincian Ukuran</th>
                                                                    <th className="py-2 px-3 font-semibold text-right border-b border-gray-200">Jumlah</th>
                                                                </tr>
                                                            </thead>
                                                            <tbody>
                                                                {unsettledItems.map((item, idx) => (
                                                                    <tr key={idx} className="border-b border-gray-50 hover:bg-blue-50/30">
                                                                        <td className="py-2 px-3 font-medium text-blue-600">{item.orderId}</td>
                                                                        <td className="py-2 px-3 text-gray-700">{item.client} <span className="text-gray-400 text-xs">({item.type})</span></td>
                                                                        <td className="py-2 px-3 text-gray-600 capitalize">{item.stage}</td>
                                                                        <td className="py-2 px-3 text-gray-800 font-medium">{item.sizes}</td>
                                                                        <td className="py-2 px-3 text-right font-bold text-gray-800">{item.qty} pcs</td>
                                                                    </tr>
                                                                ))}
                                                                <tr className="bg-blue-50/50">
                                                                    <td colSpan="4" className="py-3 px-3 text-right font-semibold text-gray-700">Total Siap Rekap:</td>
                                                                    <td className="py-3 px-3 text-right font-bold text-blue-700 text-base">{totalUnsettled} pcs</td>
                                                                </tr>
                                                            </tbody>
                                                        </table>
                                                    </div>
                                                ) : (
                                                    <p className="text-sm text-gray-500 italic p-3 bg-gray-50 rounded text-center">Tidak ada pekerjaan siap rekap.</p>
                                                )}
                                            </div>

                                            {myHistory.length > 0 && (
                                                <div>
                                                    <h4 className="font-bold text-gray-700 mb-3">Riwayat Laporan</h4>
                                                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                                                        {myHistory.map(rekap => (
                                                            <div key={rekap.id} className="border border-green-200 bg-green-50/50 rounded-lg p-4 flex justify-between items-center">
                                                                <div>
                                                                    <div className="text-xs text-gray-500">ID: {rekap.id}</div>
                                                                    <div className="font-bold text-sm">{rekap.startDate} s/d {rekap.endDate}</div>
                                                                    <div className="text-sm font-medium text-green-700">{rekap.total} pcs terselesaikan</div>
                                                                </div>
                                                                <div className="flex gap-2">
                                                                    <button onClick={() => printExistingRekap(rekap)} className="text-gray-600 hover:text-blue-600 p-2 border rounded bg-white" title="Cetak PDF"><IconPrinter /></button>
                                                                    <button onClick={() => setDeleteRekapConfirmId(rekap.id)} className="text-red-500 hover:text-white hover:bg-red-500 p-2 border border-red-200 rounded bg-white flex items-center gap-1 text-xs font-bold transition-colors" title="Batalkan Rekap"><IconTrash /> Batal Rekap</button>
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                )
                            })}
                        </div>
                    </div>

                    {modalData && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50">
                            <div className="bg-white p-6 rounded-xl shadow-xl w-full max-w-sm mx-4">
                                <h3 className="font-bold text-lg mb-4">Simpan & Cetak Laporan</h3>
                                <div className="space-y-4 mb-6">
                                    <div><label className="block text-xs font-semibold mb-1">Mulai Tanggal</label><input type="date" className="w-full p-2 border rounded text-sm" value={dateRange.start} onChange={e => setDateRange({...dateRange, start: e.target.value})} /></div>
                                    <div><label className="block text-xs font-semibold mb-1">Sampai Tanggal</label><input type="date" className="w-full p-2 border rounded text-sm" value={dateRange.end} onChange={e => setDateRange({...dateRange, end: e.target.value})} /></div>
                                </div>
                                <div className="flex justify-end space-x-3">
                                    <button onClick={() => setModalData(null)} className="px-4 py-2 bg-gray-200 rounded text-sm">Batal</button>
                                    <button onClick={executeRekapAndPrint} className="px-4 py-2 bg-blue-600 text-white rounded text-sm flex items-center gap-2"><IconPrinter /> Cetak</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {deleteRekapConfirmId && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50">
                            <div className="bg-white p-6 rounded-xl w-80 shadow-xl">
                                <h3 className="font-bold mb-2">Batalkan Rekap?</h3>
                                <p className="text-sm text-gray-600 mb-4">Laporan ini akan dihapus dan pekerjaan karyawan yang terkait akan dikkembalikan ke status "Belum Direkap".</p>
                                <div className="flex justify-end space-x-2">
                                    <button onClick={() => setDeleteRekapConfirmId(null)} className="px-4 py-2 bg-gray-200 rounded text-sm font-medium">Tutup</button>
                                    <button onClick={handleDeleteRekap} className="px-4 py-2 bg-red-600 text-white rounded text-sm font-medium">Batalkan Rekap</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            )
        };

        const RiwayatProduksiView = ({ orders, setOrders, showToast }) => {
            const finishedOrders = (orders || []).filter(o => o?.isArchived);

            return (
                <div className="space-y-6">
                    <h2 className="text-2xl font-bold text-gray-800">Riwayat Produksi Selesai</h2>
                    <p className="text-gray-600 mb-6">Berikut adalah daftar seluruh pesanan produksi yang telah 100% selesai dikerjakan, terkirim ke klien, dan sudah diarsipkan.</p>

                    <Card>
                        <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse">
                                <thead>
                                    <tr className="bg-gray-50 border-b border-gray-200">
                                        <th className="p-3 text-sm font-semibold text-gray-600">Tanggal Masuk</th>
                                        <th className="p-3 text-sm font-semibold text-gray-600">ID Order</th>
                                        <th className="p-3 text-sm font-semibold text-gray-600">Klien</th>
                                        <th className="p-3 text-sm font-semibold text-gray-600">Barang</th>
                                        <th className="p-3 text-sm font-semibold text-gray-600">Rincian</th>
                                        <th className="p-3 text-sm font-semibold text-gray-600">Total Terkirim</th>
                                        <th className="p-3 text-sm font-semibold text-gray-600 text-center">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {finishedOrders.map(order => {
                                        const sizesDetails = Object.entries(order.sizes || {})
                                            .map(([size, qty]) => `${size}(${qty})`)
                                            .join(', ');
                                            
                                        return (
                                            <tr key={order.id} className="border-b border-gray-100 hover:bg-gray-50 transition-colors">
                                                <td className="p-3 text-sm text-gray-600">{order.date}</td>
                                                <td className="p-3 text-sm font-medium text-blue-600">{order.id}</td>
                                                <td className="p-3 text-sm font-bold text-gray-800">{order.client}</td>
                                                <td className="p-3 text-sm text-gray-600">{order.type}</td>
                                                <td className="p-3 text-sm text-gray-600">{sizesDetails}</td>
                                                <td className="p-3 text-sm font-bold text-green-600 bg-green-50/50">{order.total} pcs</td>
                                                <td className="p-3 text-center">
                                                    <button 
                                                        onClick={() => {
                                                            const newOrders = orders.map(o => o.id === order.id ? { ...o, isArchived: false } : o);
                                                            setOrders(newOrders);
                                                            showToast("Order dikembalikan ke proses aktif.", "success");
                                                        }}
                                                        className="text-orange-600 hover:text-orange-800 bg-orange-50 hover:bg-orange-100 p-2 rounded-md transition-colors"
                                                        title="Batalkan Arsip / Kembalikan ke Proses"
                                                    >
                                                        <IconRestore />
                                                    </button>
                                                </td>
                                            </tr>
                                        )
                                    })}
                                    {finishedOrders.length === 0 && (
                                        <tr>
                                            <td colSpan="7" className="p-8 text-center text-gray-500 italic border border-dashed border-gray-200">
                                                Belum ada data produksi yang telah diarsipkan.
                                            </td>
                                        </tr>
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </Card>
                </div>
            );
        };

        const LaporanOrderView = ({ orders, employees, templates, showToast }) => {
            const [selectedOrderId, setSelectedOrderId] = useState('');
            const safeOrders = orders || [];
            const order = safeOrders.find(o => o.id === selectedOrderId);

            const generateReportData = () => {
                if (!order) return [];
                let reportData = [];
                const stagesInfo = [{ id: 'cutting', label: 'Cutting' }, { id: 'sablon', label: 'Sablon / Bordir' }, { id: 'jahit', label: 'Jahit' }, { id: 'kancing', label: 'Pasang Kancing' }, { id: 'finishing', label: 'Finishing' }];
                
                stagesInfo.forEach(stage => {
                    const stageData = order.progress?.[stage.id];
                    if (stageData && stageData.workLogs) {
                        const empGroup = {};
                        stageData.workLogs.forEach(log => {
                            if (log.qty > 0) {
                                if (!empGroup[log.empId]) empGroup[log.empId] = {};
                                empGroup[log.empId][log.size] = (empGroup[log.empId][log.size] || 0) + (parseInt(log.qty) || 0);
                            }
                        });

                        Object.keys(empGroup).forEach(empId => {
                            const emp = (employees || []).find(e => e.id == empId);
                            const sizes = empGroup[empId];
                            const sizeString = Object.entries(sizes).map(([s, q]) => `${s}(${q})`).join(', ');
                            const totalQty = Object.values(sizes).reduce((a, b) => a + (Number(b) || 0), 0);
                            reportData.push({ stage: stage.label, empName: emp ? emp.name : 'Dihapus', sizes: sizeString, total: totalQty });
                        });
                    }
                });
                return reportData;
            };

            const reportData = generateReportData();

            const handlePrint = () => {
                const printContent = `
                <!DOCTYPE html>
                <html>
                <head>
                    <title>Laporan Detail Order - ${order.id}</title>
                    <style>
                        body { font-family: 'Arial', sans-serif; padding: 20px; color: #000; line-height: 1.5; }
                        .header { display: flex; align-items: center; justify-content: center; position: relative; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 20px; }
                        .header-logo { position: absolute; left: 0; top: 50%; transform: translateY(-50%); max-height: 60px; }
                        .header-text { text-align: center; }
                        .header h1 { margin: 0; font-size: 24px; text-transform: uppercase; color: #b91c1c; }
                        .header p { margin: 5px 0 0 0; font-size: 14px; }
                        .info { margin-bottom: 20px; font-size: 14px; }
                        .info table td { padding: 2px 10px 2px 0; }
                        .data-table { width: 100%; border-collapse: collapse; margin-bottom: 30px; font-size: 14px; }
                        .data-table th, .data-table td { border: 1px solid #000; padding: 8px; text-align: left; }
                        .data-table th { background-color: #f3f4f6; text-align: center; }
                        .text-center { text-align: center; }
                        .font-bold { font-weight: bold; }
                        .footer { display: flex; justify-content: space-between; margin-top: 50px; font-size: 14px; text-align: center; padding: 0 40px; }
                        .signature { margin-top: 80px; font-weight: bold; text-decoration: underline; }
                    </style>
                </head>
                <body>
                    <div class="header">
                        ${templates.companyLogo ? `<img src="${templates.companyLogo}" class="header-logo" />` : ''}
                        <div class="header-text">
                            <h1>${templates.companyName}</h1>
                            <p>Laporan Detail Pengerjaan Karyawan per Order</p>
                        </div>
                    </div>
                    <div class="info">
                        <table>
                            <tr><td class="font-bold">ID Order</td><td>: ${order.id}</td></tr>
                            <tr><td class="font-bold">Klien / Instansi</td><td>: ${order.client}</td></tr>
                            <tr><td class="font-bold">Jenis Barang</td><td>: ${order.type}</td></tr>
                            <tr><td class="font-bold">Total Order</td><td>: ${order.total} pcs</td></tr>
                            <tr><td class="font-bold">Tanggal Cetak</td><td>: ${new Date().toLocaleDateString('id-ID')}</td></tr>
                        </table>
                    </div>
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th style="width: 50px;">No.</th><th>Tahap Produksi</th><th>Nama Karyawan</th><th>Rincian Ukuran Dikerjakan</th><th style="width: 100px;">Total (Pcs)</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${reportData.length > 0 ? reportData.map((item, idx) => `<tr><td class="text-center">${idx + 1}</td><td class="font-bold text-blue-800">${item.stage}</td><td>${item.empName}</td><td>${item.sizes}</td><td class="text-center font-bold">${item.total}</td></tr>`).join('') : '<tr><td colspan="5" class="text-center italic">Belum ada data pengerjaan.</td></tr>'}
                        </tbody>
                    </table>
                    <div class="footer"><div><p>${templates.laporanSignatureLeft}</p><div class="signature">(...................................)</div></div></div>
                </body>
                </html>
                `;

                let printWindow = window.open('', '_blank');
                if (printWindow) {
                    printWindow.document.open();
                    printWindow.document.write(printContent);
                    printWindow.document.close();
                    printWindow.focus();
                    setTimeout(() => { printWindow.print(); }, 250);
                } else {
                    showToast("Gagal mencetak. Harap izinkan Pop-up di browser Anda!", "error");
                }
            };

            return (
                <div className="space-y-6">
                    <h2 className="text-2xl font-bold text-gray-800">Laporan Detail Per Order</h2>
                    <Card className="bg-blue-50 border-blue-100">
                        <label className="block text-sm font-bold text-blue-900 mb-2">Pilih Order Produksi</label>
                        <select className="w-full md:w-1/2 p-2 border border-blue-300 rounded-lg focus:ring-blue-500 outline-none" value={selectedOrderId} onChange={e => setSelectedOrderId(e.target.value)}>
                            <option value="">-- Pilih ID Order --</option>
                            {safeOrders.map(o => <option key={o.id} value={o.id}>{o.id} - {o.client} ({o.type})</option>)}
                        </select>
                    </Card>

                    {order && (
                        <Card>
                            <div className="flex justify-between items-center mb-6 border-b pb-4">
                                <div><h3 className="text-xl font-bold text-gray-800">{order.id}</h3><p className="text-sm text-gray-600">{order.client} | {order.type} ({order.total} pcs)</p></div>
                                {reportData.length > 0 && <button onClick={handlePrint} className="bg-blue-600 text-white px-5 py-2 rounded-lg font-medium flex gap-2"><IconPrinter /> Cetak</button>}
                            </div>
                            <div className="overflow-x-auto">
                                <table className="w-full text-left border-collapse">
                                    <thead><tr className="bg-gray-50 border-b">
                                        <th className="p-3 text-sm">Tahap Produksi</th><th className="p-3 text-sm">Nama Karyawan</th><th className="p-3 text-sm">Rincian Ukuran</th><th className="p-3 text-sm text-center">Jumlah</th>
                                    </tr></thead>
                                    <tbody>
                                        {reportData.map((item, idx) => (
                                            <tr key={idx} className="border-b"><td className="p-3 text-sm font-bold text-blue-800">{item.stage}</td><td className="p-3 text-sm font-medium">{item.empName}</td><td className="p-3 text-sm">{item.sizes}</td><td className="p-3 text-sm font-bold text-center">{item.total} pcs</td></tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </Card>
                    )}
                </div>
            );
        };

        const TemplateView = ({ templates, setTemplates, showToast }) => {
            const [localTemplates, setLocalTemplates] = useState(templates || initialTemplates);
            
            useEffect(() => {
                if (templates) setLocalTemplates(templates);
            }, [templates]);

            const handleChange = (e) => {
                const { name, value } = e.target;
                setLocalTemplates(prev => ({ ...prev, [name]: value }));
            };

            const handleLogoUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width, height = img.height;
                        if (height > 100) { width = Math.round(width * (100 / height)); height = 100; }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        setLocalTemplates(prev => ({ ...prev, companyLogo: canvas.toDataURL('image/png') }));
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                setTemplates(localTemplates);
                showToast("Pengaturan disimpan!", "success");
            };

            return (
                <div className="space-y-6 max-w-4xl">
                    <h2 className="text-2xl font-bold text-gray-800">Pengaturan Cetak</h2>
                    <form onSubmit={handleSubmit} className="space-y-6">
                        <Card>
                            <h3 className="font-bold border-b pb-2 mb-4">Kop Surat</h3>
                            <div className="mb-4">
                                <label className="block text-sm mb-1">Logo</label>
                                <div className="flex items-center gap-4">
                                    {localTemplates.companyLogo ? <img src={localTemplates.companyLogo} className="h-16" /> : <div className="w-16 h-16 border border-dashed flex items-center justify-center text-xs text-gray-400">No Logo</div>}
                                    <input type="file" accept="image/*" onChange={handleLogoUpload} className="text-sm border p-1 rounded" />
                                    {localTemplates.companyLogo && <button type="button" onClick={() => setLocalTemplates(prev => ({ ...prev, companyLogo: '' }))} className="text-red-500 border p-1 text-sm rounded">Hapus</button>}
                                </div>
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div><label className="block text-sm mb-1">Nama Perusahaan</label><input type="text" name="companyName" className="w-full p-2 border rounded" value={localTemplates.companyName || ''} onChange={handleChange} required /></div>
                                <div><label className="block text-sm mb-1">Slogan</label><input type="text" name="companySubtitle" className="w-full p-2 border rounded" value={localTemplates.companySubtitle || ''} onChange={handleChange} required /></div>
                                <div className="md:col-span-2"><label className="block text-sm mb-1">Kontak/Alamat</label><textarea name="companyContact" className="w-full p-2 border rounded" value={localTemplates.companyContact || ''} onChange={handleChange} required></textarea></div>
                            </div>
                        </Card>
                        <Card>
                            <h3 className="font-bold border-b pb-2 mb-4">Surat Jalan</h3>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div className="md:col-span-2"><label className="block text-sm mb-1">Catatan Bawah</label><input type="text" name="suratJalanNote" className="w-full p-2 border rounded" value={localTemplates.suratJalanNote || ''} onChange={handleChange} /></div>
                                <div><label className="block text-sm mb-1">TTD Kiri</label><input type="text" name="sjSignatureLeft" className="w-full p-2 border rounded" value={localTemplates.sjSignatureLeft || ''} onChange={handleChange} /></div>
                                <div><label className="block text-sm mb-1">TTD Kanan</label><input type="text" name="sjSignatureRight" className="w-full p-2 border rounded" value={localTemplates.sjSignatureRight || ''} onChange={handleChange} /></div>
                            </div>
                        </Card>
                        <Card>
                            <h3 className="font-bold border-b pb-2 mb-4">Laporan Kinerja</h3>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div><label className="block text-sm mb-1">TTD Kiri</label><input type="text" name="laporanSignatureLeft" className="w-full p-2 border rounded" value={localTemplates.laporanSignatureLeft || ''} onChange={handleChange} required /></div>
                                <div><label className="block text-sm mb-1">TTD Kanan</label><input type="text" name="laporanSignatureRight" className="w-full p-2 border rounded" value={localTemplates.laporanSignatureRight || ''} onChange={handleChange} required /></div>
                            </div>
                        </Card>
                        <Card>
                            <h3 className="font-bold border-b pb-2 mb-4">Lembar Kerja Produksi (SPK)</h3>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div className="md:col-span-2"><label className="block text-sm mb-1">Catatan Bawah (Opsional)</label><input type="text" name="spkNote" className="w-full p-2 border rounded" value={localTemplates.spkNote || ''} onChange={handleChange} /></div>
                                <div><label className="block text-sm mb-1">TTD Kiri</label><input type="text" name="spkSignatureLeft" className="w-full p-2 border rounded" value={localTemplates.spkSignatureLeft || ''} onChange={handleChange} required /></div>
                                <div><label className="block text-sm mb-1">TTD Kanan</label><input type="text" name="spkSignatureRight" className="w-full p-2 border rounded" value={localTemplates.spkSignatureRight || ''} onChange={handleChange} required /></div>
                            </div>
                        </Card>
                        <button type="submit" className="bg-blue-600 text-white px-8 py-3 rounded-lg font-bold float-right">Simpan Pengaturan</button>
                    </form>
                </div>
            );
        };

        const MasterAkunView = ({ accounts, setAccounts, showToast }) => {
            const [showForm, setShowForm] = useState(false);
            const [newAcc, setNewAcc] = useState({ username: '', password: '', name: '', role: 'Mandor' });
            
            const [editAcc, setEditAcc] = useState(null);
            const [deleteConfirmId, setDeleteConfirmId] = useState(null);
            
            const safeAccounts = accounts || [];

            const handleAdd = (e) => {
                e.preventDefault();
                if(safeAccounts.some(a => String(a.username).toLowerCase() === String(newAcc.username).toLowerCase())) { 
                    showToast("Username terdaftar!", "error"); return; 
                }
                setAccounts([...safeAccounts, { ...newAcc, id: Date.now() }]);
                setShowForm(false);
                setNewAcc({ username: '', password: '', name: '', role: 'Mandor' });
                showToast("Akun ditambahkan!", "success");
            };

            const handleSaveEdit = (e) => {
                e.preventDefault();
                if(safeAccounts.some(a => String(a.username).toLowerCase() === String(editAcc.username).toLowerCase() && a.id !== editAcc.id)) { 
                    showToast("Username ini sudah dipakai oleh akun lain!", "error"); 
                    return; 
                }
                setAccounts(safeAccounts.map(acc => acc.id === editAcc.id ? editAcc : acc));
                setEditAcc(null);
                showToast("Data Akun diperbarui!", "success");
            };

            const executeDeleteAccount = () => {
                if(deleteConfirmId) {
                    const accToDelete = safeAccounts.find(a => a.id === deleteConfirmId);
                    if (accToDelete?.username === 'admin') { showToast("Akun admin utama tidak bisa dihapus!", "error"); setDeleteConfirmId(null); return; }
                    setAccounts(safeAccounts.filter(a => a.id !== deleteConfirmId));
                    setDeleteConfirmId(null);
                    showToast("Akun dihapus.", "success");
                }
            };

            return (
                <div className="space-y-6">
                    <div className="flex justify-between items-center">
                        <h2 className="text-2xl font-bold text-gray-800">Master Akun</h2>
                        <button onClick={() => setShowForm(!showForm)} className="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium"><IconPlusCircle /> Tambah Akun</button>
                    </div>

                    {showForm && (
                        <Card className="bg-blue-50 border-blue-100">
                            <h3 className="font-bold text-blue-900 mb-3 border-b pb-2">Tambah Akun Baru</h3>
                            <form onSubmit={handleAdd} className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div><label className="block text-sm mb-1 font-semibold">Nama Pemilik</label><input required type="text" className="w-full p-2 border rounded" value={newAcc.name} onChange={e => setNewAcc({...newAcc, name: e.target.value})} /></div>
                                <div><label className="block text-sm mb-1 font-semibold">Role</label><select className="w-full p-2 border rounded" value={newAcc.role} onChange={e => setNewAcc({...newAcc, role: e.target.value})}><option>Admin</option><option>Mandor</option><option>Kasir</option></select></div>
                                <div><label className="block text-sm mb-1 font-semibold">Username Login</label><input required type="text" className="w-full p-2 border rounded" value={newAcc.username} onChange={e => setNewAcc({...newAcc, username: e.target.value})} /></div>
                                <div><label className="block text-sm mb-1 font-semibold">Password</label><input required type="password" className="w-full p-2 border rounded" value={newAcc.password} onChange={e => setNewAcc({...newAcc, password: e.target.value})} /></div>
                                <div className="md:col-span-2 flex justify-end mt-2"><button type="submit" className="bg-blue-600 text-white px-6 py-2 rounded">Simpan Akun</button></div>
                            </form>
                        </Card>
                    )}

                    <Card>
                        <table className="w-full text-left border-collapse">
                            <thead><tr className="bg-gray-50 border-b"><th className="p-3 text-sm">Username</th><th className="p-3 text-sm">Nama</th><th className="p-3 text-sm">Role</th><th className="p-3 text-sm text-center">Aksi</th></tr></thead>
                            <tbody>
                                {safeAccounts.map(acc => (
                                    <tr key={acc.id} className="border-b hover:bg-gray-50 transition-colors">
                                        <td className="p-3 text-sm font-bold">{acc.username}</td><td className="p-3 text-sm">{acc.name}</td><td className="p-3 text-sm"><span className="bg-gray-200 text-gray-700 px-2 py-1 text-xs font-semibold rounded">{acc.role}</span></td>
                                        <td className="p-3 text-center flex justify-center space-x-2">
                                            <button onClick={() => setEditAcc(acc)} className="text-blue-500 hover:text-blue-700 bg-blue-50 p-1.5 rounded" title="Edit Akun"><IconEdit /></button>
                                            {acc.username !== 'admin' ? (
                                                <button onClick={() => setDeleteConfirmId(acc.id)} className="text-red-500 hover:text-red-700 bg-red-50 p-1.5 rounded" title="Hapus Akun"><IconTrash /></button>
                                            ) : <span className="text-xs text-gray-400 italic flex items-center">Protected</span>}
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </Card>

                    {editAcc && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
                            <div className="bg-white p-6 rounded-xl w-full max-w-md shadow-xl">
                                <h3 className="font-bold text-lg mb-4 border-b pb-2">Edit Master Akun</h3>
                                <form onSubmit={handleSaveEdit} className="space-y-4">
                                    <div><label className="block text-sm mb-1 font-semibold">Nama Pemilik</label><input required type="text" className="w-full p-2 border rounded focus:ring-blue-500" value={editAcc.name} onChange={e => setEditAcc({...editAcc, name: e.target.value})} /></div>
                                    <div>
                                        <label className="block text-sm mb-1 font-semibold">Role / Hak Akses</label>
                                        <select disabled={editAcc.username === 'admin'} className="w-full p-2 border rounded focus:ring-blue-500 disabled:bg-gray-100" value={editAcc.role} onChange={e => setEditAcc({...editAcc, role: e.target.value})}><option>Admin</option><option>Mandor</option><option>Kasir</option></select>
                                    </div>
                                    <div>
                                        <label className="block text-sm mb-1 font-semibold">Username Login</label>
                                        <input required disabled={editAcc.username === 'admin'} type="text" className="w-full p-2 border rounded focus:ring-blue-500 disabled:bg-gray-100" value={editAcc.username} onChange={e => setEditAcc({...editAcc, username: e.target.value})} />
                                    </div>
                                    <div><label className="block text-sm mb-1 font-semibold">Password Baru</label><input required type="text" className="w-full p-2 border rounded focus:ring-blue-500" value={editAcc.password} onChange={e => setEditAcc({...editAcc, password: e.target.value})} /></div>
                                    {editAcc.username === 'admin' && <p className="text-xs text-red-500 italic">*Username & Role akun utama (admin) tidak dapat diubah.</p>}
                                    <div className="flex justify-end space-x-3 pt-4 border-t">
                                        <button type="button" onClick={() => setEditAcc(null)} className="px-4 py-2 bg-gray-200 rounded font-medium">Batal</button>
                                        <button type="submit" className="px-4 py-2 bg-blue-600 text-white rounded font-medium">Simpan Perubahan</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {deleteConfirmId && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50">
                            <div className="bg-white p-6 rounded-xl w-80">
                                <h3 className="font-bold mb-2">Hapus Akun?</h3>
                                <div className="flex justify-end space-x-2">
                                    <button onClick={() => setDeleteConfirmId(null)} className="px-4 py-2 bg-gray-200 rounded">Batal</button>
                                    <button onClick={executeDeleteAccount} className="px-4 py-2 bg-red-600 text-white rounded">Hapus</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            const [isReady, setIsReady] = useState(false);
            const [authUser, setAuthUser] = useState(null);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [isTVMode, setIsTVMode] = useState(false);
            
            const [accounts, setAccounts] = useState([]);
            const [orders, setOrders] = useState([]);
            const [employees, setEmployees] = useState([]);
            const [rekapKinerja, setRekapKinerja] = useState([]); 
            const [riwayatPengiriman, setRiwayatPengiriman] = useState([]);
            const [templates, setTemplates] = useState({});
            
            const [toast, setToast] = useState(null);
            
            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3000);
            };

            const handleLogout = () => {
                setAuthUser(null);
                localStorage.removeItem('simpati_auth_session');
                setActiveTab('dashboard');
            };

            // Memastikan data pesanan selalu berformat Array yang aman (Mencegah Blank Screen)
            const patchOrders = (ordersList) => {
                if (!Array.isArray(ordersList)) return [];
                return ordersList.filter(o => o && typeof o === 'object').map(o => {
                    const updatedO = { ...o };
                    if (!updatedO.sizes || typeof updatedO.sizes !== 'object') updatedO.sizes = {};
                    if (!updatedO.progress || typeof updatedO.progress !== 'object') updatedO.progress = {};
                    if (!updatedO.shipped || typeof updatedO.shipped !== 'object') updatedO.shipped = {};
                    
                    const stagesOrder = ['cutting', 'sablon', 'jahit', 'kancing', 'finishing'];
                    stagesOrder.forEach(stage => {
                        if (!updatedO.progress[stage] || typeof updatedO.progress[stage] !== 'object') {
                            updatedO.progress[stage] = { status: 'Belum', employees: [], workLogs: [] };
                        }
                        if (!Array.isArray(updatedO.progress[stage].employees)) updatedO.progress[stage].employees = [];
                        if (!Array.isArray(updatedO.progress[stage].workLogs)) updatedO.progress[stage].workLogs = [];
                    });
                    return updatedO;
                });
            };

            const loadLocalData = (key, initial) => {
                const saved = localStorage.getItem(key);
                if (saved) {
                    try { 
                        const parsed = JSON.parse(saved); 
                        return parsed != null ? parsed : initial;
                    } catch(e) { return initial; }
                }
                return initial;
            };

            useEffect(() => {
                const handleStorageChange = (e) => {
                    if (e.key === 'simpati_orders_sync' && e.newValue) {
                        try {
                            setOrders(patchOrders(JSON.parse(e.newValue)));
                        } catch(err) {}
                    }
                };
                window.addEventListener('storage', handleStorageChange);
                return () => window.removeEventListener('storage', handleStorageChange);
            }, []);

            useEffect(() => {
                const savedSession = localStorage.getItem('simpati_auth_session');
                if (savedSession) {
                    try { setAuthUser(JSON.parse(savedSession)); } catch(e) {}
                }

                if (typeof google !== 'undefined' && google.script) {
                    google.script.run.withSuccessHandler(data => {
                        try {
                            const parsed = typeof data === 'string' ? JSON.parse(data) : data;
                            setAccounts(Array.isArray(parsed?.accounts) && parsed.accounts.length ? parsed.accounts : loadLocalData('simpati_accounts_sync', initialAccounts));
                            setEmployees(Array.isArray(parsed?.employees) && parsed.employees.length ? parsed.employees : loadLocalData('simpati_employees_sync', initialEmployees));
                            setOrders(patchOrders(Array.isArray(parsed?.orders) && parsed.orders.length ? parsed.orders : loadLocalData('simpati_orders_sync', initialOrders)));
                            setRekapKinerja(Array.isArray(parsed?.rekapKinerja) ? parsed.rekapKinerja : loadLocalData('simpati_rekap_sync', []));
                            setRiwayatPengiriman(Array.isArray(parsed?.riwayatPengiriman) ? parsed.riwayatPengiriman : loadLocalData('simpati_riwayat_sj_sync', []));
                            setTemplates(parsed?.templates && typeof parsed.templates === 'object' ? parsed.templates : loadLocalData('simpati_templates_sync', initialTemplates));
                        } catch (err) {
                            console.error("Gagal parse data dari Apps Script", err);
                        } finally {
                            setIsReady(true);
                        }
                    }).withFailureHandler(error => {
                        console.error("Gagal terhubung ke Google Apps Script:", error);
                        setAccounts(loadLocalData('simpati_accounts_sync', initialAccounts));
                        setEmployees(loadLocalData('simpati_employees_sync', initialEmployees));
                        setOrders(patchOrders(loadLocalData('simpati_orders_sync', initialOrders)));
                        setRekapKinerja(loadLocalData('simpati_rekap_sync', []));
                        setRiwayatPengiriman(loadLocalData('simpati_riwayat_sj_sync', []));
                        setTemplates(loadLocalData('simpati_templates_sync', initialTemplates));
                        setIsReady(true);
                        showToast("Memakai data offline/sementara.", "error");
                    }).getInitialData();
                } else {
                    setAccounts(loadLocalData('simpati_accounts_sync', initialAccounts));
                    setEmployees(loadLocalData('simpati_employees_sync', initialEmployees));
                    setOrders(patchOrders(loadLocalData('simpati_orders_sync', initialOrders)));
                    setRekapKinerja(loadLocalData('simpati_rekap_sync', []));
                    setRiwayatPengiriman(loadLocalData('simpati_riwayat_sj_sync', []));
                    setTemplates(loadLocalData('simpati_templates_sync', initialTemplates));
                    setIsReady(true);
                }
            }, []);

            // Fungsi penyimpanan paralel yang aman
            const updateOrders = (newOrders) => { 
                const patched = patchOrders(newOrders);
                setOrders(patched); 
                localStorage.setItem('simpati_orders_sync', JSON.stringify(patched));
                if (typeof google !== 'undefined' && google.script) google.script.run.saveOrders(JSON.stringify(patched)); 
            };
            const updateEmployees = (newEmps) => { 
                const valid = Array.isArray(newEmps) ? newEmps : [];
                setEmployees(valid); 
                localStorage.setItem('simpati_employees_sync', JSON.stringify(valid));
                if (typeof google !== 'undefined' && google.script) google.script.run.saveEmployees(JSON.stringify(valid)); 
            };
            const updateAccounts = (newAccs) => { 
                const valid = Array.isArray(newAccs) ? newAccs : [];
                setAccounts(valid); 
                localStorage.setItem('simpati_accounts_sync', JSON.stringify(valid));
                if (typeof google !== 'undefined' && google.script) google.script.run.saveAccounts(JSON.stringify(valid)); 
            };
            const updateRekapKinerja = (newRekap) => { 
                const valid = Array.isArray(newRekap) ? newRekap : [];
                setRekapKinerja(valid); 
                localStorage.setItem('simpati_rekap_sync', JSON.stringify(valid));
                if (typeof google !== 'undefined' && google.script) google.script.run.saveRekapKinerja(JSON.stringify(valid)); 
            };
            const updateRiwayatPengiriman = (newRiwayat) => { 
                const valid = Array.isArray(newRiwayat) ? newRiwayat : [];
                setRiwayatPengiriman(valid); 
                localStorage.setItem('simpati_riwayat_sj_sync', JSON.stringify(valid));
                if (typeof google !== 'undefined' && google.script) google.script.run.saveRiwayatPengiriman(JSON.stringify(valid)); 
            };
            const updateTemplates = (newTemplates) => { 
                const valid = (newTemplates && typeof newTemplates === 'object') ? newTemplates : initialTemplates;
                setTemplates(valid); 
                localStorage.setItem('simpati_templates_sync', JSON.stringify(valid));
                if (typeof google !== 'undefined' && google.script) google.script.run.saveTemplates(JSON.stringify(valid)); 
            };

            if (!isReady) {
                return (
                    <div className="flex h-screen items-center justify-center bg-slate-900 text-white flex-col">
                        <div className="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                        <h2 className="text-xl font-bold tracking-wider">Memuat Data Aplikasi...</h2>
                    </div>
                );
            }

            if (!authUser) {
                return (
                    <>
                        <LoginView 
                            onLogin={(user) => { 
                                setAuthUser(user); 
                                localStorage.setItem('simpati_auth_session', JSON.stringify(user));
                                showToast(`Selamat datang, ${user.name}!`, 'success'); 
                            }} 
                            accounts={accounts} 
                            templates={templates} 
                            showToast={showToast}
                        />
                        {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                    </>
                );
            }

            // --- JIKA DALAM MODE TV, RENDER FULLSCREEN KHUSUS ANTREAN ---
            if (isTVMode) {
                return (
                    <React.Fragment>
                        <AntreanProduksiView orders={orders} isTVMode={isTVMode} setIsTVMode={setIsTVMode} />
                        {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                    </React.Fragment>
                );
            }

            const navItems = [
                { id: 'dashboard', label: 'Dashboard', icon: <IconDashboard /> },
                { id: 'antrean', label: 'Monitor Antrean', icon: <IconMonitor /> },
                { id: 'input_order', label: 'Input Order', icon: <IconPlusCircle /> },
                { id: 'produksi', label: 'Proses Produksi', icon: <IconScissors /> },
                { id: 'karyawan', label: 'Data Karyawan', icon: <IconUsers /> },
                { id: 'laporan', label: 'Laporan Kinerja', icon: <IconBarChart /> },
                { id: 'laporan_order', label: 'Laporan Per Order', icon: <IconDocument /> },
                { id: 'pengiriman', label: 'Pengiriman', icon: <IconTruck /> },
                { id: 'riwayat_pengiriman', label: 'Riwayat Pengiriman', icon: <IconHistory /> },
                { id: 'riwayat', label: 'Riwayat Produksi', icon: <IconHistory /> },
            ];

            if (authUser?.role === 'Admin') {
                navItems.push({ id: 'pengaturan', label: 'Pengaturan Cetak', icon: <IconSettings /> });
                navItems.push({ id: 'master_akun', label: 'Master Akun', icon: <IconKey /> });
            }

            return (
                <div className="flex h-screen bg-gray-100 font-sans print:bg-white print:h-auto">
                    <div className="w-64 bg-slate-900 text-white flex flex-col hidden md:flex shrink-0 print:hidden shadow-xl z-10">
                        <div className="p-6 bg-slate-950 text-center border-b border-slate-800">
                            {templates?.companyLogo ? (
                                <img src={templates.companyLogo} alt="Logo" className="mx-auto max-h-16 object-contain mb-2 bg-white/5 p-1 rounded" />
                            ) : (
                                <h1 className="text-2xl font-bold tracking-wider text-red-500">SIMPATI</h1>
                            )}
                            <p className="text-xs text-gray-400 mt-2 uppercase tracking-widest">Sistem Konveksi</p>
                        </div>
                        <nav className="flex-1 overflow-y-auto py-4">
                            <ul className="space-y-1 px-3">
                                {navItems.map(item => (
                                    <li key={item.id}>
                                        <button onClick={() => setActiveTab(item.id)} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-lg text-sm font-medium transition-colors ${activeTab === item.id ? 'bg-blue-600 text-white shadow' : 'text-gray-400 hover:bg-slate-800 hover:text-white'}`}>
                                            {item.icon}<span>{item.label}</span>
                                        </button>
                                    </li>
                                ))}
                            </ul>
                        </nav>
                        <div className="p-4 border-t border-slate-800 text-xs text-center text-gray-500">
                            v1.2 - Rock Solid Build
                        </div>
                    </div>

                    <div className="flex-1 flex flex-col overflow-hidden print:overflow-visible">
                        <div className="md:hidden bg-slate-900 text-white p-4 flex justify-between items-center shadow-md print:hidden">
                            <div className="flex items-center">
                                {templates?.companyLogo ? (
                                    <img src={templates.companyLogo} alt="Logo" className="max-h-8 object-contain bg-white/5 p-0.5 rounded" />
                                ) : (
                                    <h1 className="font-bold text-red-500 text-lg tracking-wider">SIMPATI</h1>
                                )}
                            </div>
                            <div className="flex items-center space-x-2">
                                <select className="bg-slate-800 text-white border border-slate-700 text-sm p-1.5 rounded outline-none" value={activeTab} onChange={(e) => setActiveTab(e.target.value)}>
                                    {navItems.map(i => <option key={i.id} value={i.id}>{i.label}</option>)}
                                </select>
                                <button onClick={handleLogout} className="text-red-400 p-1.5 bg-slate-800 rounded border border-slate-700"><IconLogout /></button>
                            </div>
                        </div>

                        <header className="hidden md:flex bg-white h-16 border-b border-gray-200 items-center px-6 justify-between shrink-0 print:hidden shadow-sm z-0">
                            <h2 className="text-lg font-bold text-gray-700 capitalize">{activeTab.replace('_', ' ')}</h2>
                            <div className="flex items-center space-x-4">
                                <div className="text-right hidden md:block">
                                    <div className="text-sm font-bold text-gray-700">{authUser.name}</div>
                                    <div className="text-xs text-gray-500">{authUser.role}</div>
                                </div>
                                <div className="w-9 h-9 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold">
                                    {authUser.name.charAt(0).toUpperCase()}
                                </div>
                                <button onClick={handleLogout} className="text-red-500 hover:bg-red-50 p-2 rounded-lg transition-colors ml-2" title="Keluar"><IconLogout /></button>
                            </div>
                        </header>

                        <main className="flex-1 overflow-x-hidden overflow-y-auto bg-gray-50/50 p-4 md:p-8 print:p-0 print:bg-white print:overflow-visible relative">
                            <div className="max-w-6xl mx-auto print:max-w-none print:mx-0 pb-12 relative z-0">
                                {activeTab === 'dashboard' && <DashboardView orders={orders} setOrders={updateOrders} showToast={showToast} />}
                                {activeTab === 'antrean' && <AntreanProduksiView orders={orders} isTVMode={isTVMode} setIsTVMode={setIsTVMode} />}
                                {activeTab === 'karyawan' && <KaryawanView employees={employees} setEmployees={updateEmployees} showToast={showToast} />}
                                {activeTab === 'input_order' && <InputOrderView orders={orders} setOrders={updateOrders} setActiveTab={setActiveTab} showToast={showToast} />}
                                {activeTab === 'produksi' && <ProduksiView orders={orders} setOrders={updateOrders} employees={employees} showToast={showToast} templates={templates} />}
                                {activeTab === 'laporan' && <LaporanView orders={orders} setOrders={updateOrders} employees={employees} rekapKinerja={rekapKinerja} setRekapKinerja={updateRekapKinerja} showToast={showToast} templates={templates} />}
                                {activeTab === 'laporan_order' && <LaporanOrderView orders={orders} employees={employees} templates={templates} showToast={showToast} />}
                                {activeTab === 'pengiriman' && <PengirimanView orders={orders} setOrders={updateOrders} showToast={showToast} templates={templates} riwayatPengiriman={riwayatPengiriman} setRiwayatPengiriman={updateRiwayatPengiriman} />}
                                {activeTab === 'riwayat_pengiriman' && <RiwayatPengirimanView orders={orders} setOrders={updateOrders} riwayatPengiriman={riwayatPengiriman} setRiwayatPengiriman={updateRiwayatPengiriman} templates={templates} showToast={showToast} />}
                                {activeTab === 'riwayat' && <RiwayatProduksiView orders={orders} setOrders={updateOrders} showToast={showToast} />}
                                {activeTab === 'pengaturan' && <TemplateView templates={templates} setTemplates={updateTemplates} showToast={showToast} />}
                                {activeTab === 'master_akun' && <MasterAkunView accounts={accounts} setAccounts={updateAccounts} showToast={showToast} />}
                            </div>
                        </main>
                    </div>
                    {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
