                                                                                                        stageName: roleLabels[effectiveActiveStage] || effectiveActiveStage,
                                                                                                        logId: log.id,
                                                                                                        empName: emp.name,
                                                                                                        size,
                                                                                                        qty: checked ? (takenQty || '') : takenQty
                                                                                                    });
                                                                                                }}/> Ambil</label>
                                                                                                <label className="flex items-center gap-1 text-sm font-bold cursor-pointer"><input type="checkbox" className="w-4 h-4 text-green-600" checked={log.checkAfter} disabled={!log.checkBefore || log.isReported} onChange={e => {
                                                                                                    const checked = e.target.checked;
                                                                                                    const actionAt = new Date().toISOString();
                                                                                                    setPendingWorkConfirm({
                                                                                                        title: checked ? 'Konfirmasi Setor Pekerjaan' : 'Konfirmasi Batal Setor',
                                                                                                        description: checked ? 'Isi jumlah pcs yang benar-benar disetor. Jika berbeda dari Ambil, stok tahap berikutnya mengikuti jumlah Setor.' : 'Status Setor akan dibatalkan dan pekerjaan kembali tercatat baru Ambil.',
                                                                                                        confirmLabel: checked ? 'Ya, Setor' : 'Ya, Batalkan Setor',
                                                                                                        confirmClass: checked ? 'bg-green-600 hover:bg-green-700' : 'bg-red-600 hover:bg-red-700',
                                                                                                        dateLabel: checked ? 'Tanggal Setor' : 'Tanggal Batal Setor',
                                                                                                        checkType: 'checkAfter',
                                                                                                        isChecked: checked,
                                                                                                        needsQty: checked,
                                                                                                        maxQty: takenQty,
                                                                                                        qtyLabel: 'Jumlah Setor',
                                                                                                        actionAt,
                                                                                                            orderId: order.id,
                                                                                                            client: order.client,
                                                                                                            type: order.type,
                                                                                                            stageId: effectiveActiveStage,
                                                                                                            stageName: roleLabels[effectiveActiveStage] || effectiveActiveStage,
                                                                                                            logId: log.id,
                                                                                                            empName: emp.name,
                                                                                                            size,
                                                                                                        qty: checked ? (submittedQty || takenQty || '') : (submittedQty || takenQty)
                                                                                                    });
                                                                                                }}/> Setor</label>
                                                                                                
                                                                                                {log.checkBefore && (
                                                                                                    <button onClick={() => printSticker(roleLabels[effectiveActiveStage] || 'Pekerja', emp.name, order.client, order.type, size, log.qty)} disabled={log.qty <= 0} className="ml-auto text-[10px] bg-slate-800 text-white hover:bg-slate-700 px-2 py-1 rounded shadow-sm font-bold flex items-center gap-1 transition-colors disabled:opacity-50" title="Cetak Stiker Label (6x4 cm)">
                                                                                                        <IconPrinter /> Stiker
                                                                                                    </button>
                                                                                                )}
                                                                                                {log.takenAt && <span className="text-[10px] text-blue-700 bg-blue-50 border border-blue-100 rounded px-2 py-0.5 font-bold">Ambil: {formatWorkDate(log.takenAt)} ({takenQty} pcs)</span>}
                                                                                                {log.submittedAt && <span className="text-[10px] text-green-700 bg-green-50 border border-green-100 rounded px-2 py-0.5 font-bold">Setor: {formatWorkDate(log.submittedAt)} ({submittedQty} pcs)</span>}
                                                                                            </div>
                                                                                            {!log.isReported && <button onClick={() => handleDeleteLog(order.id, effectiveActiveStage, log.id)} className="text-red-400 hover:text-red-600 hover:bg-red-50 w-6 h-6 rounded-full flex items-center justify-center font-bold ml-1 transition-colors" title="Hapus Kolom">&times;</button>}
                                                                                            {log.isReported && <span className="text-green-600 ml-1 px-1 font-bold bg-green-50 rounded text-xs" title="Sudah Direkap">OK</span>}
                                                                                        </div>
                                                                                    )
                                                                                })}
                                                                                {availableToAdd > 0 ? (
                                                                                    <button onClick={() => handleAddLog(order.id, effectiveActiveStage, empId, size)} className="text-xs text-blue-600 font-bold mt-1 bg-blue-50 px-3 py-1.5 rounded-md hover:bg-blue-100 transition-colors">+ Setoran</button>
                                                                                ) : empLogsForSize.length === 0 ? (
                                                                                    <div className="text-[11px] text-gray-400 italic">Belum ada sisa qty untuk diambil pada ukuran ini.</div>
                                                                                ) : null}
                                                                            </td>
                                                                        </tr>
                                                                    )
                                                                })}
                                                            </tbody>
                                                        </table>
                                                    </div>
                                                </div>
                                            )
                                        })}

                                        {employeesToRender.length > 0 && (
                                            <div className="mt-8 border-t border-gray-200 pt-5">
                                                <button onClick={() => showToast("Semua aktivitas berhasil disimpan ke Cloud!", "success")} className="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3.5 rounded-xl font-bold flex items-center justify-center gap-2 transition-transform active:scale-[0.98] shadow-lg text-lg">
                                                    <IconCheckCircle /> Simpan & Konfirmasi Pekerjaan
                                                </button>
                                            </div>
                                        )}

                                    </div>
                                </Card>
                            </div>
                        </div>
                        {pendingEmployeeConfirm && (
                            <div className="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-[120] p-4">
                                <div className="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden">
                                    <div className={`${pendingEmployeeConfirm.isChecked ? 'bg-blue-600' : 'bg-red-600'} text-white px-5 py-4`}>
                                        <h3 className="text-lg font-black">{pendingEmployeeConfirm.isChecked ? 'Konfirmasi Pilih Karyawan' : 'Konfirmasi Lepas Karyawan'}</h3>
                                        <p className="text-xs text-white/85 mt-1">{pendingEmployeeConfirm.isChecked ? 'Karyawan ini akan ditambahkan ke tahap produksi.' : 'Karyawan ini akan dilepas dari tahap produksi aktif.'}</p>
                                    </div>
                                    <div className="p-5 space-y-3 text-sm">
                                        <div className="grid grid-cols-2 gap-3">
                                            <div className="bg-gray-50 border border-gray-200 rounded-lg p-3">
                                                <span className="block text-xs text-gray-500 font-bold">Order</span>
                                                <span className="font-black text-gray-900">{pendingEmployeeConfirm.orderId}</span>
                                            </div>
                                            <div className="bg-gray-50 border border-gray-200 rounded-lg p-3">
                                                <span className="block text-xs text-gray-500 font-bold">Tahap</span>
                                                <span className="font-black text-gray-900">{pendingEmployeeConfirm.stageName}</span>
                                            </div>
                                        </div>
                                        <div className="bg-gray-50 border border-gray-200 rounded-lg p-3">
                                            <span className="block text-xs text-gray-500 font-bold">Karyawan</span>
                                            <span className="font-black text-gray-900">{pendingEmployeeConfirm.empName}</span>
                                        </div>
                                        <div className="bg-gray-50 border border-gray-200 rounded-lg p-3">
                                            <span className="block text-xs text-gray-500 font-bold">Klien / Barang</span>
                                            <span className="font-black text-gray-900">{pendingEmployeeConfirm.client} - {pendingEmployeeConfirm.type}</span>
                                        </div>
                                        <div className={`${pendingEmployeeConfirm.isChecked ? 'bg-blue-50 border-blue-100' : 'bg-red-50 border-red-100'} border rounded-lg p-3`}>
                                            <span className={`block text-xs font-bold ${pendingEmployeeConfirm.isChecked ? 'text-blue-700' : 'text-red-700'}`}>Tanggal Aksi</span>
                                            <span className={`font-black ${pendingEmployeeConfirm.isChecked ? 'text-blue-900' : 'text-red-900'}`}>{formatWorkDate(pendingEmployeeConfirm.actionAt, 'medium')}</span>
                                        </div>
                                    </div>
                                    <div className="flex justify-end gap-2 px-5 py-4 bg-gray-50 border-t border-gray-200">
                                        <button onClick={() => setPendingEmployeeConfirm(null)} className="px-4 py-2 rounded-lg border border-gray-300 font-bold text-gray-600 bg-white hover:bg-gray-100">Batal</button>
                                        <button onClick={() => {
                                            handleToggleEmployee(pendingEmployeeConfirm.orderId, pendingEmployeeConfirm.stageId, pendingEmployeeConfirm.empId, pendingEmployeeConfirm.isChecked, pendingEmployeeConfirm.actionAt);
                                            setPendingEmployeeConfirm(null);
                                        }} className={`px-4 py-2 rounded-lg text-white font-black ${pendingEmployeeConfirm.isChecked ? 'bg-blue-600 hover:bg-blue-700' : 'bg-red-600 hover:bg-red-700'}`}>{pendingEmployeeConfirm.isChecked ? 'Ya, Pilih' : 'Ya, Lepas'}</button>
                                    </div>
                                </div>
                            </div>
                        )}
                        {pendingWorkConfirm && (
                            <div className="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-[120] p-4">
                                <div className="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden">
                                    <div className={`${pendingWorkConfirm.isChecked ? (pendingWorkConfirm.checkType === 'checkAfter' ? 'bg-green-600' : 'bg-blue-600') : 'bg-red-600'} text-white px-5 py-4`}>
                                        <h3 className="text-lg font-black">{pendingWorkConfirm.title}</h3>
                                        <p className="text-xs text-white/85 mt-1">{pendingWorkConfirm.description}</p>
                                    </div>
                                    <div className="p-5 space-y-3 text-sm">
                                        <div className="grid grid-cols-2 gap-3">
                                            <div className="bg-gray-50 border border-gray-200 rounded-lg p-3">
                                                <span className="block text-xs text-gray-500 font-bold">Order</span>
                                                <span className="font-black text-gray-900">{pendingWorkConfirm.orderId}</span>
                                            </div>
                                            <div className="bg-gray-50 border border-gray-200 rounded-lg p-3">
                                                <span className="block text-xs text-gray-500 font-bold">Tahap</span>
                                                <span className="font-black text-gray-900">{pendingWorkConfirm.stageName}</span>
                                            </div>
                                            <div className="bg-gray-50 border border-gray-200 rounded-lg p-3">
                                                <span className="block text-xs text-gray-500 font-bold">Ukuran</span>
                                                <span className="font-black text-gray-900">{pendingWorkConfirm.size}</span>
                                            </div>
                                            <div className="bg-gray-50 border border-gray-200 rounded-lg p-3">
                                                <span className="block text-xs text-gray-500 font-bold">{pendingWorkConfirm.qtyLabel || 'Jumlah'}</span>
                                                {pendingWorkConfirm.needsQty ? (
                                                    <div className="mt-1">
                                                        <div className="flex items-center gap-2">
                                                            <input
                                                                type="number"
                                                                min="1"
                                                                max={pendingWorkConfirm.maxQty}
                                                                className="w-full border border-blue-300 rounded-lg px-3 py-2 text-lg font-black text-center focus:ring-2 focus:ring-blue-500 outline-none"
                                                                value={pendingWorkConfirm.qty}
                                                                onChange={e => {
                                                                    const maxQty = parseInt(pendingWorkConfirm.maxQty) || 0;
                                                                    let nextQty = parseInt(e.target.value) || '';
                                                                    if (nextQty && maxQty > 0 && nextQty > maxQty) nextQty = maxQty;
                                                                    setPendingWorkConfirm(prev => ({ ...prev, qty: nextQty }));
                                                                }}
                                                                autoFocus
                                                            />
                                                            <span className="font-black text-gray-700">pcs</span>
                                                        </div>
                                                        <div className="text-[10px] text-gray-500 font-bold mt-1">Maks: {pendingWorkConfirm.maxQty} pcs</div>
                                                    </div>
                                                ) : (
                                                    <span className="font-black text-gray-900">{pendingWorkConfirm.qty} pcs</span>
                                                )}
                                            </div>
                                        </div>
                                        <div className="bg-gray-50 border border-gray-200 rounded-lg p-3">
                                            <span className="block text-xs text-gray-500 font-bold">Pekerja</span>
                                            <span className="font-black text-gray-900">{pendingWorkConfirm.empName}</span>
                                        </div>
                                        <div className="bg-gray-50 border border-gray-200 rounded-lg p-3">
                                            <span className="block text-xs text-gray-500 font-bold">Klien / Barang</span>
                                            <span className="font-black text-gray-900">{pendingWorkConfirm.client} - {pendingWorkConfirm.type}</span>
                                        </div>
                                        <div className={`${pendingWorkConfirm.isChecked ? (pendingWorkConfirm.checkType === 'checkAfter' ? 'bg-green-50 border-green-100' : 'bg-blue-50 border-blue-100') : 'bg-red-50 border-red-100'} border rounded-lg p-3`}>
                                            <span className={`block text-xs font-bold ${pendingWorkConfirm.isChecked ? (pendingWorkConfirm.checkType === 'checkAfter' ? 'text-green-700' : 'text-blue-700') : 'text-red-700'}`}>{pendingWorkConfirm.dateLabel}</span>
                                            <span className={`font-black ${pendingWorkConfirm.isChecked ? (pendingWorkConfirm.checkType === 'checkAfter' ? 'text-green-900' : 'text-blue-900') : 'text-red-900'}`}>{formatWorkDate(pendingWorkConfirm.actionAt, 'medium')}</span>
                                        </div>
                                    </div>
                                    <div className="flex justify-end gap-2 px-5 py-4 bg-gray-50 border-t border-gray-200">
                                        <button onClick={() => setPendingWorkConfirm(null)} className="px-4 py-2 rounded-lg border border-gray-300 font-bold text-gray-600 bg-white hover:bg-gray-100">Batal</button>
                                        <button disabled={pendingWorkConfirm.needsQty && (((parseInt(pendingWorkConfirm.qty) || 0) <= 0) || ((parseInt(pendingWorkConfirm.qty) || 0) > (parseInt(pendingWorkConfirm.maxQty) || 0)))} onClick={() => {
                                            handleToggleLogCheck(pendingWorkConfirm.orderId, pendingWorkConfirm.stageId, pendingWorkConfirm.logId, pendingWorkConfirm.checkType, pendingWorkConfirm.isChecked, pendingWorkConfirm.actionAt, pendingWorkConfirm.needsQty ? pendingWorkConfirm.qty : null);
                                            setPendingWorkConfirm(null);
                                        }} className={`px-4 py-2 rounded-lg text-white font-black disabled:opacity-50 disabled:cursor-not-allowed ${pendingWorkConfirm.confirmClass}`}>{pendingWorkConfirm.confirmLabel}</button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            return (
                <div className="space-y-6">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <h2 className="text-2xl font-bold text-gray-800">Pantau Alur Produksi</h2>
                            <p className="text-gray-500 text-sm mt-1">Lacak dan catat progress masing-masing divisi.</p>
                        </div>
                    </div>
                    <div className="flex gap-4 border-b border-gray-200 pb-2">
                        <button onClick={() => setActiveProductionTab('proses')} className="pb-2 px-1 font-bold text-sm border-b-2 border-blue-600 text-blue-600">Proses Produksi</button>
                        <button onClick={() => setActiveProductionTab('riwayat')} className="pb-2 px-1 font-bold text-sm border-b-2 border-transparent text-gray-500 hover:text-gray-700">Riwayat Produksi</button>
                    </div>
                    <Card>
                        <SearchField value={searchTerm} onChange={setSearchTerm} placeholder="Cari ID order, klien, barang, status, deadline..." />
                    </Card>
                    {isKaryawanMode && myEmployeeProblem && (
                        <Card className="border-red-200 bg-red-50">
                            <div className="flex items-start gap-3 text-red-800">
                                <IconAlertCircle />
                                <div>
                                    <h3 className="font-black text-lg">Akun Karyawan Perlu Diperbaiki</h3>
                                    <p className="text-sm mt-1">{myEmployeeProblem}</p>
                                </div>
                            </div>
                        </Card>
                    )}

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        {filteredProductionOrders.map(order => {
                            const today = new Date();
                            const deadlineDate = new Date(order.deadline);
                            const diffTime = deadlineDate - today;
                            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                            
                            let cardColor = "bg-white border-gray-200";
                            let indicatorColor = "bg-blue-500 group-hover:bg-blue-600";
                            let textColor = "text-gray-800";
                            
                            if (order.status === 'Terkirim') {
                                cardColor = "bg-purple-50 border-purple-300 shadow-purple-100";
                                indicatorColor = "bg-purple-500";
                                textColor = "text-purple-900";
                            } else if (order.status === 'Siap Kirim') {
                                cardColor = "bg-green-50 border-green-300 shadow-green-100";
                                indicatorColor = "bg-green-500";
                                textColor = "text-green-900";
                            } else if (diffDays <= 7) {
                                cardColor = "bg-red-50 border-red-200";
                                indicatorColor = "bg-red-500 group-hover:bg-red-600";
                                textColor = "text-red-900";
                            } else if (diffDays <= 14) {
                                cardColor = "bg-yellow-50 border-yellow-200";
                                indicatorColor = "bg-yellow-500 group-hover:bg-yellow-600";
                                textColor = "text-yellow-900";
                            }

                            const mainImage = order.designImage1 || order.designImage2 || null;

                            return (
                                <Card key={order.id} className={`hover:shadow-lg transition-shadow relative overflow-hidden group border ${cardColor} flex flex-col h-full !p-0`}>
                                    <div className={`absolute top-0 left-0 w-1.5 h-full transition-colors ${indicatorColor} z-10`}></div>
                                    
                                    {mainImage ? (
                                        <div className="w-full h-32 bg-gray-100 border-b border-gray-200 relative overflow-hidden">
                                            <img src={mainImage} className="w-full h-full object-cover opacity-90 group-hover:opacity-100 transition-opacity" alt="Desain Order" />
                                            {order.designImage2 && order.designImage1 && (
                                                <div className="absolute bottom-2 right-2 bg-black/50 text-white text-[10px] px-2 py-0.5 rounded font-bold">+1 Gambar</div>
                                            )}
                                        </div>
                                    ) : (
                                        <div className="w-full h-8 bg-gray-50 border-b border-gray-100"></div> 
                                    )}

                                    <div className="p-5 flex-1 flex flex-col">
                                        <div className="flex justify-between items-start mb-2 pl-1">
                                            <h3 className={`font-black text-lg ${textColor}`}>{order.id}</h3>
                                            <Badge status={order.status} />
                                        </div>
                                        <div className="pl-1 space-y-1 mb-4 flex-1">
                                            <p className="text-sm font-bold text-gray-800">{order.client}</p>
                                            <p className="text-xs text-gray-600">{order.type} - {order.total} pcs</p>
                                            <p className={`text-xs font-bold mt-1.5 ${diffDays <= 7 ? 'text-red-600' : diffDays <= 14 ? 'text-green-700' : 'text-gray-500'}`}>
                                                DL: {order.deadline} ({diffDays > 0 ? `${diffDays} hari lagi` : 'Terlewat/Hari ini'})
                                            </p>
                                            {order.notes && (
                                                <div className="mt-3 p-2 bg-white/60 rounded border border-black/5 text-[11px] text-gray-700 leading-tight">
                                                    <span className="font-bold text-gray-800 block mb-0.5">Catatan:</span>
                                                    <span className="line-clamp-2">{order.notes}</span>
                                                </div>
                                            )}
                                        </div>
                                        <div className="flex gap-2 mt-auto z-10">
                                            <button onClick={() => setSelectedOrder(order.id)} className="flex-1 bg-white hover:bg-blue-600 hover:text-white text-blue-700 py-2.5 rounded-lg font-bold text-sm transition-all border border-blue-200 shadow-sm">
                                                {authUser?.role === 'Karyawan' ? 'Mulai Kerjakan / Setor' : 'Update Pengerjaan'}
                                            </button>
                                        </div>
                                    </div>
                                </Card>
                            );
                        })}
                        {filteredProductionOrders.length === 0 && (
                            <div className="col-span-full p-8 text-center text-gray-500 bg-white rounded-xl shadow-sm border border-gray-100">{searchTerm ? 'Tidak ada order yang cocok dengan pencarian.' : 'Tidak ada order yang sedang diproses.'}</div>
                        )}
                    </div>
                </div>
            );
        };

        const PengirimanView = ({ orders, setOrders, showToast, templates, riwayatPengiriman, setRiwayatPengiriman }) => {
            const [shippingInputs, setShippingInputs] = useState({});
            const [selectedOrders, setSelectedOrders] = useState({});
            const [searchTerm, setSearchTerm] = useState('');
            const [activeShippingTab, setActiveShippingTab] = useState('manajemen');
            const safeOrders = (orders || []).filter(isVisibleOrder);

            const handleToggleOrderSelection = (orderId) => {
                setSelectedOrders(prev => ({ ...prev, [orderId]: !prev[orderId] }));
            };

            const handleUpdateShippingInput = (orderId, size, value) => {
                setShippingInputs(prev => ({ ...prev, [orderId]: { ...prev[orderId], [size]: value } }));
            };

            const getAvailableToShip = (order, size) => {
                const activeStages = getActiveProductionStageIds(order);
                const furthestStage = activeStages[activeStages.length - 1] || 'cutting';

                let totalSetor = 0;
                const stageData = order.progress?.[furthestStage] || {};
                if (stageData && stageData.workLogs) {
                    stageData.workLogs.forEach(log => {
                        if (!log.isDeleted && log.size === size && log.checkAfter) totalSetor += getWorkLogSubmittedQty(log);
                    });
                }
                const shippedCount = (order.shipped && order.shipped[size]) || 0;
                return Math.max(0, totalSetor - shippedCount);
            };

            const printSuratJalan = (client, items, sjId) => {
                const currentDate = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
                const totalBarang = items.reduce((sum, item) => sum + item.total, 0);

                const printContent = `
                <!DOCTYPE html>
                <html>
                <head>
                    <title>Surat Jalan - ${client}</title>
                    <style>
                        body { font-family: 'Arial', sans-serif; padding: 20px; color: #000; line-height: 1.5; }
                        .header { display: flex; justify-content: space-between; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 20px; }
                        .header-left { display: flex; align-items: center; gap: 15px; }
                        .header-left h1 { margin: 0; font-size: 24px; text-transform: uppercase; color: #b91c1c; }
                        .header-left p { margin: 5px 0 0 0; font-size: 14px; }
                        .header-right { text-align: right; }
                        .header-right h2 { margin: 0; font-size: 20px; text-decoration: underline; letter-spacing: 2px;}
                        .header-right p { margin: 5px 0 0 0; font-size: 14px; }
                        .kepada { margin-bottom: 30px; font-size: 14px; }
                        .data-table { width: 100%; border-collapse: collapse; margin-bottom: 30px; font-size: 14px; }
                        .data-table th, .data-table td { border: 1px solid #000; padding: 10px; text-align: left; }
                        .data-table th { background-color: #f3f4f6; text-align: center; }
                        .text-center { text-align: center; }
                        .text-right { text-align: right; }
                        .font-bold { font-weight: bold; }
                        .footer { display: flex; justify-content: space-between; margin-top: 50px; font-size: 14px; text-align: center; padding: 0 40px; }
                        .signature { margin-top: 80px; border-bottom: 1px solid #000; width: 150px; display: inline-block; }
                    </style>
                </head>
                <body>
                    <div class="header">
                        <div class="header-left">
                            ${templates?.companyLogo ? `<img src="${templates.companyLogo}" style="max-height: 70px; object-fit: contain;" />` : ''}
                            <div>
                                <h1>${templates?.companyName || 'SIMPATI KONVEKSI'}</h1>
                                <p>${templates?.companySubtitle || ''}<br/>${templates?.companyContact || ''}</p>
                            </div>
                        </div>
                        <div class="header-right">
                            <h2>SURAT JALAN</h2>
                            <p>No: <strong>${sjId}</strong></p>
                            <p>Tanggal: ${currentDate}</p>
                        </div>
                    </div>
                    <div class="kepada"><p>Kepada Yth,<br/><strong>${client}</strong><br/>Di Tempat</p></div>
                    <p style="font-size: 14px;">Bersama surat ini kami mengirimkan barang-barang sebagai berikut:</p>
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th style="width: 50px;">No.</th>
                                <th>ID Order</th>
                                <th>Jenis Barang</th>
                                <th>Rincian Ukuran (Qty)</th>
                                <th style="width: 100px;">Total (Pcs)</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${items.map((item, idx) => `
                                <tr>
                                    <td class="text-center">${idx + 1}</td>
                                    <td class="text-center font-bold">${item.orderId}</td>
                                    <td>${item.type}</td>
                                    <td>${item.details}</td>
                                    <td class="text-center font-bold">${item.total}</td>
                                </tr>
                            `).join('')}
                            <tr>
                                <td colspan="4" class="text-right font-bold" style="font-size: 16px;">TOTAL KESELURUHAN:</td>
                                <td class="text-center font-bold" style="font-size: 16px;">${totalBarang}</td>
                            </tr>
                        </tbody>
                    </table>
                    <p style="font-size: 12px; font-style: italic;">${templates.suratJalanNote}</p>
                    <div class="footer">
                        <div><p>${templates.sjSignatureLeft}</p><div class="signature"></div></div>
                        <div><p>${templates.sjSignatureRight}</p><div class="signature"></div></div>
                    </div>
                </body>
                </html>
                `;

                let printWindow = window.open('', '_blank');
                if (printWindow) {
                    printWindow.document.open();
                    printWindow.document.write(printContent);
                    printWindow.document.close();
                    printWindow.focus();
                    setTimeout(() => { printWindow.print(); }, 250);
                } else {
                    showToast("Gagal mencetak. Harap izinkan Pop-up di browser Anda!", "error");
                }
            };

            const executeKirimGabungan = (client, clientOrders) => {
                let anyShipped = false;
                let processedItems = [];

                setOrders(prevOrders => {
                    const updatedOrders = [...prevOrders];
                    
                    clientOrders.forEach(order => {
                        const currentOrderInputs = shippingInputs[order.id] || {};
                        const newShipped = { ...order.shipped };
                        let orderHasNewShipment = false;
                        let shippedDetails = [];
                        let totalOrderShipment = 0;

                        Object.keys(order.sizes || {}).forEach(size => {
                            const qtyToShip = parseInt(currentOrderInputs[size]) || 0;
                            if (qtyToShip > 0) {
                                newShipped[size] = (newShipped[size] || 0) + qtyToShip;
                                orderHasNewShipment = true;
                                anyShipped = true;
                                shippedDetails.push(`${size} (${qtyToShip})`);
                                totalOrderShipment += qtyToShip;
                            }
                        });

                        if (orderHasNewShipment) {
                            let isFullyShipped = true;
                            Object.keys(order.sizes).forEach(size => {
                                if ((newShipped[size] || 0) < order.sizes[size]) isFullyShipped = false;
                            });

                            const newStatus = isFullyShipped ? 'Terkirim' : order.status;
                            const orderIndex = updatedOrders.findIndex(o => String(o.id) === String(order.id));
                            if(orderIndex > -1) {
                                updatedOrders[orderIndex] = { ...order, shipped: newShipped, status: newStatus };
                            }
                            processedItems.push({ orderId: order.id, type: order.type, details: shippedDetails.join(', '), total: totalOrderShipment });
                        }
                    });
                    return updatedOrders;
                });

                if (!anyShipped) { showToast("Masukkan setidaknya satu jumlah barang untuk dikirim.", "error"); return; }

                const newInputs = { ...shippingInputs };
                clientOrders.forEach(o => delete newInputs[o.id]);
                setShippingInputs(newInputs);

                const sjId = `SJ-${Date.now()}`;
                
                const newHistoryRecord = {
                    id: sjId,
                    date: new Date().toISOString().split('T')[0],
                    client: client,
                    items: processedItems,
                    total: processedItems.reduce((sum, item) => sum + item.total, 0)
                };
                
                setRiwayatPengiriman(prev => [...(prev || []), { ...newHistoryRecord, _syncUpdatedAt: new Date().toISOString() }]);

                printSuratJalan(client, processedItems, sjId);
                showToast(`Surat Jalan ${sjId} berhasil dibuat dan barang dikirim!`, "success");
            };

            const activeOrders = safeOrders.filter(o => !o?.isArchived);
            const filteredActiveOrders = activeOrders.filter(o => matchesSearch(orderSearchFields(o), searchTerm));
            const ordersByClient = filteredActiveOrders.reduce((acc, o) => {
                if (!acc[o.client]) acc[o.client] = [];
                acc[o.client].push(o);
                return acc;
            }, {});

            if (activeShippingTab === 'riwayat') {
                return (
                    <div className="space-y-6">
                        <div>
                            <h2 className="text-2xl font-bold text-gray-800">Pengiriman</h2>
                            <p className="text-sm text-gray-500 mt-1">Manajemen dan riwayat surat jalan dalam satu menu.</p>
                        </div>
                        <div className="flex gap-4 border-b border-gray-200 pb-2">
                            <button onClick={() => setActiveShippingTab('manajemen')} className="pb-2 px-1 font-bold text-sm border-b-2 border-transparent text-gray-500 hover:text-gray-700">Manajemen Pengiriman</button>
                            <button onClick={() => setActiveShippingTab('riwayat')} className="pb-2 px-1 font-bold text-sm border-b-2 border-blue-600 text-blue-600">Riwayat Pengiriman</button>
                        </div>
                        <RiwayatPengirimanView orders={orders} setOrders={setOrders} riwayatPengiriman={riwayatPengiriman} setRiwayatPengiriman={setRiwayatPengiriman} templates={templates} showToast={showToast} />
                    </div>
                );
            }

            if (activeOrders.length === 0) {
                return (
                    <div className="space-y-6">
                        <div>
                            <h2 className="text-2xl font-bold text-gray-800">Pengiriman</h2>
                            <p className="text-sm text-gray-500 mt-1">Manajemen dan riwayat surat jalan dalam satu menu.</p>
                        </div>
                        <div className="flex gap-4 border-b border-gray-200 pb-2">
                            <button onClick={() => setActiveShippingTab('manajemen')} className="pb-2 px-1 font-bold text-sm border-b-2 border-blue-600 text-blue-600">Manajemen Pengiriman</button>
                            <button onClick={() => setActiveShippingTab('riwayat')} className="pb-2 px-1 font-bold text-sm border-b-2 border-transparent text-gray-500 hover:text-gray-700">Riwayat Pengiriman</button>
                        </div>
                        <div className="p-8 text-center text-gray-500 bg-white rounded-xl shadow-sm border border-gray-100">Tidak ada antrean barang yang harus dikirim saat ini.</div>
                    </div>
                );
            }

            return (
                <div className="space-y-6">
                    <div>
                        <h2 className="text-2xl font-bold text-gray-800">Pengiriman</h2>
                        <p className="text-sm text-gray-500 mt-1">Manajemen dan riwayat surat jalan dalam satu menu.</p>
                    </div>
                    <div className="flex gap-4 border-b border-gray-200 pb-2">
                        <button onClick={() => setActiveShippingTab('manajemen')} className="pb-2 px-1 font-bold text-sm border-b-2 border-blue-600 text-blue-600">Manajemen Pengiriman</button>
                        <button onClick={() => setActiveShippingTab('riwayat')} className="pb-2 px-1 font-bold text-sm border-b-2 border-transparent text-gray-500 hover:text-gray-700">Riwayat Pengiriman</button>
                    </div>
                    <Card>
                        <SearchField value={searchTerm} onChange={setSearchTerm} placeholder="Cari instansi, ID order, barang, status..." />
                    </Card>
                    {Object.keys(ordersByClient).length === 0 && (
                        <Card className="p-8 text-center text-gray-500 italic border-dashed border-2">
                            Tidak ada order pengiriman yang cocok dengan pencarian.
                        </Card>
                    )}
                    {Object.entries(ordersByClient).map(([client, clientOrders]) => (
                        <Card key={client} className="overflow-hidden mb-6">
                            <h3 className="text-lg font-bold text-blue-900 bg-blue-50 p-3 rounded-t-lg border-b border-blue-100 mb-4">{client}</h3>
                            <div className="space-y-6">
                                {clientOrders.map(order => {
                                    const isSelected = selectedOrders[order.id] || false;
                                    return (
                                    <div key={order.id} className={`border rounded-lg p-4 transition-colors ${isSelected ? 'border-blue-400 bg-blue-50/20' : 'border-gray-200'}`}>
                                        <div className="flex justify-between items-center mb-4 border-b border-gray-100 pb-3">
                                            <div className="flex items-center gap-3">
                                                {order.status !== 'Terkirim' && (
                                                    <input type="checkbox" checked={isSelected} onChange={() => handleToggleOrderSelection(order.id)} className="w-5 h-5 text-blue-600 rounded focus:ring-blue-500 cursor-pointer" />
                                                )}
                                                <div>
                                                    <span className="font-bold text-gray-800 text-lg">{order.id}</span>
                                                    <span className="text-gray-600 ml-2">- {order.type}</span>
                                                </div>
                                            </div>
                                            <div className="text-right">
                                                <span className="text-xs text-red-500 font-medium block">Deadline: {order.deadline}</span>
                                                <span className="text-sm font-bold text-blue-600 bg-blue-50 px-2 py-1 rounded mt-1 inline-block">Total Order: {order.total} pcs</span>
                                            </div>
                                        </div>
                                        
                                        {order.status === 'Terkirim' ? (
                                            <div className="bg-purple-50 p-4 rounded-lg border border-purple-200 flex flex-col md:flex-row justify-between items-center gap-4">
                                                <div className="text-purple-800 text-sm">
                                                    <span className="font-bold block">Pesanan Selesai Terkirim!</span>
                                                    Seluruh barang pesanan telah dikirimkan.
                                                </div>
                                                <button 
                                                    onClick={() => {
                                                        setOrders(prev => prev.map(o => String(o.id) === String(order.id) ? { ...o, isArchived: true } : o));
                                                            showToast("Order dipindahkan ke Riwayat!", "success");
                                                    }} 
                                                    className="w-full md:w-auto bg-purple-600 hover:bg-purple-700 text-white px-5 py-2.5 rounded-lg font-bold text-sm transition-all shadow-sm flex items-center justify-center gap-2"
                                                >
                                                    <IconArchive /> Arsipkan Order
                                                </button>
                                            </div>
                                        ) : (
                                            isSelected && (
                                                <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4 mt-4">
                                                    {sortSizeKeys(Object.keys(order.sizes || {})).map(size => {
                                                        const avail = getAvailableToShip(order, size);
                                                        const target = order.sizes[size];
                                                        const shippedCount = (order.shipped && order.shipped[size]) || 0;
                                                        const isCompleted = shippedCount >= target;

                                                        return (
                                                            <div key={size} className={`p-2.5 rounded-lg border ${isCompleted ? 'bg-green-50 border-green-200' : 'bg-gray-50 border-gray-200'}`}>
                                                                <div className="flex justify-between items-center mb-1">
                                                                    <div className="text-[11px] font-bold text-gray-500 uppercase">Size {size}</div>
                                                                    <div className="text-[10px] bg-blue-100 text-blue-800 px-1.5 py-0.5 rounded font-bold border border-blue-200">Target: {target}</div>
                                                                </div>
                                                                <div className="flex justify-between text-xs mb-2 border-b border-gray-200 pb-1">
                                                                    <span className="text-gray-500 font-medium">Sdh Kirim:</span>
                                                                    <span className="text-green-600 font-bold">{shippedCount}</span>
                                                                </div>
                                                                <div className="flex items-end justify-between mb-2">
                                                                    <div className="text-xl font-bold text-gray-800 leading-none">{avail}</div>
                                                                    <div className="text-[10px] font-medium text-gray-500 leading-none mb-0.5">Stok Siap</div>
                                                                </div>
                                                                <input 
                                                                    type="number" min="0" max={avail} disabled={isCompleted || avail === 0}
                                                                    placeholder={isCompleted ? "Lengkap" : "Kirim..."}
                                                                    className="w-full text-sm p-1.5 border rounded focus:ring-2 focus:ring-blue-500 disabled:bg-gray-200 disabled:text-gray-500 disabled:cursor-not-allowed font-medium text-center"
                                                                    value={shippingInputs[order.id]?.[size] || ''}
                                                                    onChange={(e) => handleUpdateShippingInput(order.id, size, e.target.value)}
                                                                />
                                                            </div>
                                                        )
                                                    })}
                                                </div>
                                            )
                                        )}
                                    </div>
                                )})}
                            </div>
                            <div className="mt-6 border-t border-gray-200 pt-5">
                                <button 
                                    onClick={() => executeKirimGabungan(client, clientOrders.filter(o => selectedOrders[o.id]))}
                                    disabled={clientOrders.filter(o => selectedOrders[o.id]).length === 0}
                                    className="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-gray-400 disabled:cursor-not-allowed text-white py-3.5 rounded-lg font-bold flex items-center justify-center gap-2 transition-transform active:scale-[0.98] shadow-md text-lg"
                                >
                                    <IconPrinter /> Cetak Surat Jalan & Kirim Barang
                                </button>
                            </div>
                        </Card>
                    ))}
                </div>
            )
        };

        const RiwayatPengirimanView = ({ orders, setOrders, riwayatPengiriman, setRiwayatPengiriman, templates, showToast }) => {
            const [deleteConfirmId, setDeleteConfirmId] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');
            const [expandedIds, setExpandedIds] = useState({});
            const filteredRiwayatPengiriman = [...(riwayatPengiriman || []).filter(isVisibleRecord)]
                .reverse()
                .filter(riwayat => matchesSearch([riwayat.id, riwayat.date, riwayat.client, riwayat.total, riwayat.items], searchTerm));

            const printSuratJalan = (client, items, sjId, dateStr) => {
                const formattedDate = new Date(dateStr).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
                const totalBarang = items.reduce((sum, item) => sum + (parseInt(item.total) || 0), 0);

                const printContent = `
                <!DOCTYPE html>
                <html>
                <head>
                    <title>Surat Jalan - ${client}</title>
                    <style>
                        body { font-family: 'Arial', sans-serif; padding: 20px; color: #000; line-height: 1.5; }
                        .header { display: flex; justify-content: space-between; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 20px; }
                        .header-left { display: flex; align-items: center; gap: 15px; }
                        .header-left h1 { margin: 0; font-size: 24px; text-transform: uppercase; color: #b91c1c; }
                        .header-left p { margin: 5px 0 0 0; font-size: 14px; }
                        .header-right { text-align: right; }
                        .header-right h2 { margin: 0; font-size: 20px; text-decoration: underline; letter-spacing: 2px;}
                        .header-right p { margin: 5px 0 0 0; font-size: 14px; }
                        .kepada { margin-bottom: 30px; font-size: 14px; }
                        .data-table { width: 100%; border-collapse: collapse; margin-bottom: 30px; font-size: 14px; }
                        .data-table th, .data-table td { border: 1px solid #000; padding: 10px; text-align: left; }
                        .data-table th { background-color: #f3f4f6; text-align: center; }
                        .text-center { text-align: center; }
                        .text-right { text-align: right; }
                        .font-bold { font-weight: bold; }
                        .footer { display: flex; justify-content: space-between; margin-top: 50px; font-size: 14px; text-align: center; padding: 0 40px; }
                        .signature { margin-top: 80px; border-bottom: 1px solid #000; width: 150px; display: inline-block; }
                    </style>
                </head>
                <body>
                    <div class="header">
                        <div class="header-left">
                            ${templates?.companyLogo ? `<img src="${templates.companyLogo}" style="max-height: 70px; object-fit: contain;" />` : ''}
                            <div>
                                <h1>${templates?.companyName || 'SIMPATI KONVEKSI'}</h1>
                                <p>${templates?.companySubtitle || ''}<br/>${templates?.companyContact || ''}</p>
                            </div>
                        </div>
                        <div class="header-right">
                            <h2>SURAT JALAN</h2>
                            <p>No: <strong>${sjId}</strong></p>
                            <p>Tanggal: ${formattedDate}</p>
                        </div>
                    </div>
                    <div class="kepada"><p>Kepada Yth,<br/><strong>${client}</strong><br/>Di Tempat</p></div>
                    <p style="font-size: 14px;">Bersama surat ini kami mengirimkan barang-barang sebagai berikut:</p>
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th style="width: 50px;">No.</th>
                                <th>ID Order</th>
                                <th>Jenis Barang</th>
                                <th>Rincian Ukuran (Qty)</th>
                                <th style="width: 100px;">Total (Pcs)</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${items.map((item, idx) => `
                                <tr>
                                    <td class="text-center">${idx + 1}</td>
                                    <td class="text-center font-bold">${item.orderId}</td>
                                    <td>${item.type}</td>
                                    <td>${item.details}</td>
                                    <td class="text-center font-bold">${item.total}</td>
                                </tr>
                            `).join('')}
                            <tr>
                                <td colspan="4" class="text-right font-bold" style="font-size: 16px;">TOTAL KESELURUHAN:</td>
                                <td class="text-center font-bold" style="font-size: 16px;">${totalBarang}</td>
                            </tr>
                        </tbody>
                    </table>
                    <p style="font-size: 12px; font-style: italic;">${templates.suratJalanNote}</p>
                    <div class="footer">
                        <div><p>${templates.sjSignatureLeft}</p><div class="signature"></div></div>
                        <div><p>${templates.sjSignatureRight}</p><div class="signature"></div></div>
                    </div>
                </body>
                </html>
                `;

                let printWindow = window.open('', '_blank');
                if (printWindow) {
                    printWindow.document.open();
                    printWindow.document.write(printContent);
                    printWindow.document.close();
                    printWindow.focus();
                    setTimeout(() => { printWindow.print(); }, 250);
                } else {
                    showToast("Gagal mencetak. Harap izinkan Pop-up di browser Anda!", "error");
                }
            };

            const handleDeletePengiriman = () => {
                const riwayatToDelete = (riwayatPengiriman || []).find(r => String(r.id) === String(deleteConfirmId));
                if (!riwayatToDelete) return;

                setOrders(prevOrders => {
                    const updatedOrders = [...(prevOrders || [])];
                    (riwayatToDelete.items || []).forEach(item => {
                        const orderIndex = updatedOrders.findIndex(o => String(o.id) === String(item.orderId));
                        if (orderIndex > -1) {
                            const order = { ...updatedOrders[orderIndex] };
                            const newShipped = { ...order.shipped };
                            
                            const parts = item.details.split(', ');
                            parts.forEach(part => {
                                const match = part.match(/(.+?)\s*\((\d+)\)/);
                                if (match) {
                                    const size = match[1];
                                    const qty = parseInt(match[2], 10) || 0;
                                    if (newShipped[size]) {
                                        newShipped[size] -= qty;
                                        if (newShipped[size] < 0) newShipped[size] = 0;
                                    }
                                }
                            });

                            order.shipped = newShipped;
                            
                            let isFullyShipped = true;
                            Object.keys(order.sizes).forEach(sz => {
                                if ((order.shipped[sz] || 0) < order.sizes[sz]) isFullyShipped = false;
                            });

                            const newProgress = { ...order.progress };
                            const activeStages = getActiveProductionStageIds(order);
                            const stageLabel = (stageId) => productionStageOptions.find(stage => stage.id === stageId)?.label || stageId;
                            let overallStatus = order.materialStatus === 'Selesai' ? 'Pembelian Bahan' : 'Pending'; 
                            if (isFullyShipped) overallStatus = 'Terkirim';
                            else {
                                for (let i = activeStages.length - 1; i >= 0; i--) {
                                    const stageId = activeStages[i];
                                    const status = newProgress[stageId]?.status;
                                    if (status === 'Selesai') {
                                        overallStatus = i === activeStages.length - 1 ? 'Siap Kirim' : `Proses ${stageLabel(activeStages[i + 1])}`;
                                        break;
                                    }
                                    if (status === 'Proses') {
                                        overallStatus = `Proses ${stageLabel(stageId)}`;
                                        break;
                                    }
                                }
                            }

                            order.status = overallStatus;

                            if (!isFullyShipped && order.isArchived) {
                                order.isArchived = false;
                            }

                            updatedOrders[orderIndex] = order;
                        }
                    });
                    return updatedOrders;
                });

                const now = new Date().toISOString();
                setRiwayatPengiriman(prev => (prev || []).map(r => String(r.id) === String(deleteConfirmId) ? { ...r, isDeleted: true, deletedAt: now, _syncUpdatedAt: now } : r));
                setDeleteConfirmId(null);
                showToast("Pengiriman dibatalkan, barang dikembalikan ke antrean.", "success");
            };

            return (
                <div className="space-y-6">
                    <h2 className="text-2xl font-bold text-gray-800">Riwayat Pengiriman</h2>
                    <p className="text-gray-600 mb-6">Daftar seluruh Surat Jalan yang pernah dicetak dan dikirim ke klien.</p>

                    <Card>
                        <div className="mb-4 max-w-lg">
                            <SearchField value={searchTerm} onChange={setSearchTerm} placeholder="Cari nomor surat, tanggal, klien, ID order..." />
                        </div>
                        <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse">
                                <thead>
                                    <tr className="bg-gray-50 border-b border-gray-200">
                                        <th className="p-3 text-sm font-semibold text-gray-600">Tanggal</th>
                                        <th className="p-3 text-sm font-semibold text-gray-600">No. Surat Jalan</th>
                                        <th className="p-3 text-sm font-semibold text-gray-600">Klien</th>
                                        <th className="p-3 text-sm font-semibold text-gray-600">Status</th>
                                        <th className="p-3 text-sm font-semibold text-gray-600">Total (Pcs)</th>
                                        <th className="p-3 text-sm font-semibold text-gray-600 text-center">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {filteredRiwayatPengiriman.map(riwayat => (
                                        <React.Fragment key={riwayat.id}>
                                        <tr className="border-b border-gray-100 hover:bg-gray-50 transition-colors">
                                            <td className="p-3 text-sm text-gray-600">{riwayat.date}</td>
                                            <td className="p-3 text-sm font-bold text-blue-600">{riwayat.id}</td>
                                            <td className="p-3 text-sm font-bold text-gray-800">{riwayat.client}</td>
                                            <td className="p-3 text-sm text-gray-600"><Badge status="Terkirim" /></td>
                                            <td className="p-3 text-sm font-bold text-green-600">{riwayat.total} pcs</td>
                                            <td className="p-3 text-center flex justify-center space-x-2">
                                                <button onClick={() => setExpandedIds(prev => ({ ...prev, [riwayat.id]: !prev[riwayat.id] }))} className="text-blue-600 hover:text-white hover:bg-blue-600 p-2 border border-blue-200 rounded bg-white flex items-center gap-1 text-xs font-bold transition-colors">
                                                    {expandedIds[riwayat.id] ? 'Sembunyikan Rincian' : 'Lihat Rincian'}
                                                </button>
                                                <button 
                                                    onClick={() => printSuratJalan(riwayat.client, riwayat.items, riwayat.id, riwayat.date)}
                                                    className="text-gray-600 hover:text-blue-600 bg-white hover:bg-blue-50 border border-gray-200 p-2 rounded shadow-sm transition-colors flex items-center justify-center gap-1 text-xs font-bold"
                                                    title="Cetak PDF Ulang"
                                                >
                                                    <IconPrinter /> Cetak Ulang
                                                </button>
                                                <button 
                                                    onClick={() => setDeleteConfirmId(riwayat.id)}
                                                    className="text-red-500 hover:text-white bg-white hover:bg-red-500 border border-red-200 p-2 rounded shadow-sm transition-colors flex items-center justify-center gap-1 text-xs font-bold"
                                                    title="Batalkan Surat Jalan & Pengiriman"
                                                >
                                                    <IconTrash /> Batal Kirim
                                                </button>
                                            </td>
                                        </tr>
                                        {expandedIds[riwayat.id] && (
                                            <tr className="bg-gray-50">
                                                <td colSpan="6" className="p-3 text-sm text-gray-700">
                                                    <ul className="list-disc pl-4">
                                                        {(riwayat.items || []).map((item, i) => <li key={i}><b>{item.orderId}</b> - {item.type || '-'} - {item.details}</li>)}
                                                    </ul>
                                                </td>
                                            </tr>
                                        )}
                                        </React.Fragment>
                                    ))}
                                    {filteredRiwayatPengiriman.length === 0 && (
                                        <tr>
                                            <td colSpan="6" className="p-8 text-center text-gray-500 italic border border-dashed border-gray-200">
                                                {searchTerm ? 'Tidak ada riwayat pengiriman yang cocok dengan pencarian.' : 'Belum ada riwayat pengiriman.'}
                                            </td>
                                        </tr>
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </Card>

                    {deleteConfirmId && (
                        <div className="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-[100] transition-opacity">
                            <div className="bg-white p-6 rounded-xl shadow-xl max-w-sm w-full mx-4 transform transition-all">
                                <h3 className="text-lg font-bold text-gray-900 mb-2">Batalkan Pengiriman?</h3>
                                <p className="text-gray-600 mb-6 text-sm">Surat Jalan ini akan dihapus dan barang akan dikembalikan ke antrean 'Pengiriman'. Apakah Anda yakin?</p>
                                <div className="flex justify-end space-x-3">
                                    <button onClick={() => setDeleteConfirmId(null)} className="px-4 py-2 font-medium text-gray-600 hover:bg-gray-100 rounded-lg transition-colors text-sm">Tutup</button>
                                    <button onClick={handleDeletePengiriman} className="px-4 py-2 font-medium bg-red-600 text-white hover:bg-red-700 rounded-lg transition-colors text-sm">Batalkan Kirim</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const PembelianBahanView = ({ orders, setOrders, showToast, templates }) => {
            const [selectedOrder, setSelectedOrder] = useState(null);
            const [materials, setMaterials] = useState([]);
            const [activeTab, setActiveTab] = useState('daftar_order'); // 'daftar_order' atau 'rekap_vendor'
            const [searchTerm, setSearchTerm] = useState('');
            const [statusFilter, setStatusFilter] = useState('Semua');
            const [paymentStatusFilter, setPaymentStatusFilter] = useState('Semua');
            const [dateFilter, setDateFilter] = useState('');
            const [paymentInputs, setPaymentInputs] = useState({});
            const [previewImage, setPreviewImage] = useState(null);
            const [expandedPurchaseKeys, setExpandedPurchaseKeys] = useState({});
            const [deletePurchaseConfirm, setDeletePurchaseConfirm] = useState(null);

            const materialOrders = (orders || []).filter(isVisibleOrder);
            const activeOrders = materialOrders.filter(o => {
                const status = o?.materialStatus || 'Belum';
                const orderStatus = o?.status || 'Pending';
                return orderNeedsMaterials(o) && !o?.isArchived && orderStatus !== 'Terkirim' && ['Belum', 'Dibeli Sebagian', 'Direkap', 'Dicetak'].includes(status);
            });
            const rekapOrders = materialOrders.filter(o => orderNeedsMaterials(o) && !o?.isArchived && o?.status !== 'Terkirim' && getActiveMaterials(o).length > 0);
            const filterOrder = (order) => {
                const materialStatus = order?.materialStatus || 'Belum';
                const matchesStatus = statusFilter === 'Semua' || materialStatus === statusFilter;
                const matchesDate = !dateFilter || String(order?.date || '').slice(0, 10) === dateFilter || String(order?.deadline || '').slice(0, 10) === dateFilter || getActiveMaterials(order).some(mat => String(mat.purchaseDate || '').slice(0, 10) === dateFilter);
                return matchesSearch(orderSearchFields(order), searchTerm) && matchesStatus && matchesDate;
            };
            const filteredActiveOrders = activeOrders.filter(filterOrder);
            const filteredRekapOrders = rekapOrders.filter(filterOrder);
            const materialNameSuggestions = [...new Set(materialOrders.flatMap(order => getActiveMaterials(order).map(mat => String(mat.name || '').trim()).filter(Boolean)))].sort();
            const vendorSuggestions = [...new Set(materialOrders.flatMap(order => getActiveMaterials(order).map(mat => String(mat.vendor || '').trim()).filter(Boolean)))].sort();
            const specSuggestions = [...new Set(materialOrders.flatMap(order => getActiveMaterials(order).map(mat => String(mat.spec || mat.color || '').trim()).filter(Boolean)))].sort();

            const openMaterialModal = (order) => {
                setSelectedOrder(order);
                const existingActiveMaterials = getActiveMaterials(order);
                const existingMaterials = existingActiveMaterials.length > 0 
                    ? [...existingActiveMaterials] 
                    : [{ id: Date.now(), name: '', spec: '', qty: '', unit: 'Kg', price: '', vendor: '', purchaseDate: new Date().toISOString().slice(0, 10), note: '', purchaseStatus: 'Sudah Dibeli' }];
                setMaterials(existingMaterials);
            };

            const handleMaterialChange = (index, field, value) => {
                const newMats = [...materials];
                newMats[index] = { ...newMats[index], [field]: value };
                setMaterials(newMats);
            };

            const addMaterialRow = () => {
                setMaterials([...materials, { id: Date.now(), name: '', spec: '', qty: '', unit: 'Meter', price: '', vendor: '', purchaseDate: new Date().toISOString().slice(0, 10), note: '', purchaseStatus: 'Sudah Dibeli' }]);
            };

            const removeMaterialRow = (idToRemove) => {
                const existed = getActiveMaterials(selectedOrder).some(m => String(m.id) === String(idToRemove));
                if (existed) {
                    const now = new Date().toISOString();
                    setMaterials(materials.map(m => String(m.id) === String(idToRemove) ? { ...m, isDeleted: true, deletedAt: now, _syncUpdatedAt: now } : m));
                    return;
                }
                setMaterials(materials.filter(m => String(m.id) !== String(idToRemove)));
            };

            const saveMaterials = (statusBeli) => {
                const now = new Date().toISOString();
                const validMaterials = materials
                    .filter(m => m?.isDeleted || String(m?.name || '').trim() !== '')
                    .map(m => ({
                        ...m,
                        id: m.id || `MAT-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
                        name: String(m.name || '').trim(),
                        spec: String(m.spec || m.color || '').trim(),
                        qty: m.qty ?? '',
                        unit: m.unit || 'Pcs',
                        price: m.price ?? '',
                        vendor: String(m.vendor || '').trim() || 'Tanpa Vendor',
                        purchaseDate: m.purchaseDate || now.slice(0, 10),
                        note: String(m.note || '').trim(),
                        purchaseStatus: m.purchaseStatus || 'Sudah Dibeli',
                        materialBatchDate: m.purchaseDate || m.materialBatchDate || now.slice(0, 10),
                        _syncUpdatedAt: now
                    }));
                const activeMaterialCount = validMaterials.filter(m => !m.isDeleted).length;
                
                setOrders(prevOrders => prevOrders.map(o => {
                    if (String(o.id) === String(selectedOrder.id)) {
                        const nextStatus = activeMaterialCount === 0 ? 'Belum' : 'Selesai';
                        const nextOrderStatus = activeMaterialCount === 0 ? (hasProductionStarted(o) ? o.status : 'Pending') : getOrderStatusAfterMaterialPurchase(o);
                        return { 
                            ...o, 
                            materials: validMaterials, 
                            materialStatus: nextStatus,
                            materialPurchasedAt: nextStatus === 'Selesai' ? (o.materialPurchasedAt || now) : o.materialPurchasedAt,
                            materialLastActionAt: now,
                            materialLastAction: nextStatus === 'Selesai' ? 'Bahan Diinput dan Sudah Dibelanjakan' : 'Disimpan',
                            status: nextOrderStatus
                        };
                    }
                    return o;
                }));
                
                setSelectedOrder(null);
                showToast(`Data kebutuhan bahan berhasil disimpan.`, 'success');
            };

            const markOrderMaterialsPrinted = (orderIds, materialsByOrder = {}) => {
                const now = new Date().toISOString();
                const ids = Array.isArray(orderIds) ? orderIds : [orderIds];
                setOrders(prevOrders => prevOrders.map(o => {
                    if (!ids.some(id => String(id) === String(o.id))) return o;
                    const nextMaterials = materialsByOrder[o.id] || o.materials || [];
                    return {
                        ...o,
                        materials: nextMaterials,
                        materialStatus: getActiveMaterials({ materials: nextMaterials }).length > 0 ? 'Selesai' : 'Belum',
                        status: getActiveMaterials({ materials: nextMaterials }).length > 0 ? getOrderStatusAfterMaterialPurchase(o) : o.status,
                        materialPrintedAt: now,
                        materialLastActionAt: now,
                        materialLastAction: 'Direkap dan Sudah Dibelanjakan',
                        materialPrintCount: (parseInt(o.materialPrintCount) || 0) + 1
                    };
                }));
            };

            const hasProductionStarted = (order) => {
