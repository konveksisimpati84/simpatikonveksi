                const periodLabel = period ? new Date(`${period}-01`).toLocaleDateString('id-ID', { month: 'long', year: 'numeric' }) : 'Semua Periode';
                const rowsHtml = orderCostRows.map((row, index) => `
                    <tr>
                        <td class="text-center">${index + 1}</td>
                        <td>${row.orderId}</td>
                        <td>${row.client}</td>
                        <td>${row.type}</td>
                        <td>${formatDate(row.date)}</td>
                        <td class="text-right">${formatRupiah(row.materialCost)}</td>
                        <td class="text-right">${formatRupiah(row.wageCost)}</td>
                        <td class="text-right font-bold">${formatRupiah(row.totalCost)}</td>
                    </tr>
                `).join('');
                const printContent = `
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <title>Laporan Keuangan</title>
                        <style>
                            body { font-family: Arial, sans-serif; padding: 20px; color: #000; }
                            .header { text-align: center; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 18px; position: relative; }
                            .header-logo { position: absolute; left: 0; top: 0; max-height: 58px; }
                            h1 { margin: 0; font-size: 24px; color: #b91c1c; }
                            p { margin: 4px 0; }
                            .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 18px 0; }
                            .box { border: 1px solid #000; padding: 10px; }
                            .box span { display: block; font-size: 12px; }
                            .box strong { font-size: 18px; }
                            table { width: 100%; border-collapse: collapse; font-size: 13px; }
                            th, td { border: 1px solid #000; padding: 7px; }
                            th { background: #e5e7eb; }
                            .text-center { text-align: center; }
                            .text-right { text-align: right; }
                            .font-bold { font-weight: bold; }
                        </style>
                    </head>
                    <body>
                        <div class="header">
                            ${templates?.companyLogo ? `<img src="${templates.companyLogo}" class="header-logo" />` : ''}
                            <h1>${templates?.companyName || 'SIMPATI KONVEKSI'}</h1>
                            <p>Laporan Keuangan Produksi</p>
                            <p>Periode: ${periodLabel}</p>
                        </div>
                        <div class="summary">
                            <div class="box"><span>Pembelian Bahan</span><strong>${formatRupiah(totalMaterial)}</strong></div>
                            <div class="box"><span>Gaji Bersih Produksi</span><strong>${formatRupiah(totalWage)}</strong></div>
                            <div class="box"><span>Total Pengeluaran</span><strong>${formatRupiah(totalExpense)}</strong></div>
                            <div class="box"><span>Kasbon Diberikan</span><strong>${formatRupiah(totalCashAdvanceGiven)}</strong></div>
                            <div class="box"><span>Kasbon Dipotong</span><strong>${formatRupiah(totalCashAdvanceDeductionInPeriod)}</strong></div>
                            <div class="box"><span>Sisa Kasbon</span><strong>${formatRupiah(totalCashAdvanceRemaining)}</strong></div>
                        </div>
                        <table>
                            <thead>
                                <tr><th>No</th><th>ID Order</th><th>Instansi</th><th>Jenis Produksi</th><th>Tanggal</th><th>Bahan</th><th>Gaji</th><th>Total</th></tr>
                            </thead>
                            <tbody>
                                ${rowsHtml || '<tr><td colspan="8" class="text-center">Tidak ada data.</td></tr>'}
                            </tbody>
                        </table>
                    </body>
                    </html>
                `;
                const printWindow = window.open('', '_blank');
                if (printWindow) {
                    printWindow.document.open();
                    printWindow.document.write(printContent);
                    printWindow.document.close();
                    printWindow.focus();
                    setTimeout(() => printWindow.print(), 250);
                } else {
                    showToast("Gagal mencetak. Harap izinkan Pop-up di browser Anda!", "error");
                }
            };

            return (
                <div className="space-y-6">
                    <div className="flex flex-col md:flex-row md:items-end md:justify-between gap-4">
                        <div>
                            <h2 className="text-2xl font-bold text-gray-800">Laporan Keuangan</h2>
                            <p className="text-gray-500 text-sm mt-1">Ringkasan biaya dari pembelian bahan dan gaji produksi karyawan.</p>
                        </div>
                        <button onClick={handlePrint} className="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-lg font-bold flex items-center justify-center gap-2 text-sm">
                            <IconPrinter /> Cetak
                        </button>
                    </div>

                    <Card>
                        <div className="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
                            <div>
                                <label className="block text-xs font-bold text-gray-600 mb-1">Periode</label>
                                <input type="month" className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm" value={period} onChange={e => setPeriod(e.target.value)} />
                            </div>
                            <div className="md:col-span-2">
                                <label className="block text-xs font-bold text-gray-600 mb-1">Cari Data</label>
                                <input type="text" className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm" placeholder="Cari order, instansi, vendor, karyawan..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)} />
                            </div>
                            <button type="button" onClick={() => { setPeriod(''); setSearchTerm(''); setEmployeeFilter('Semua'); setDivisionFilter('Semua'); setCashAdvanceStatusFilter('Semua'); }} className="p-3 border border-gray-300 rounded-lg font-bold text-gray-700 hover:bg-gray-50">Reset Filter</button>
                            <div>
                                <label className="block text-xs font-bold text-gray-600 mb-1">Karyawan</label>
                                <select className="w-full p-3 border border-gray-300 rounded-lg text-sm" value={employeeFilter} onChange={e => setEmployeeFilter(e.target.value)}>
                                    <option value="Semua">Semua Karyawan</option>
                                    {visibleEmployees.map(emp => <option key={emp.id} value={emp.id}>{emp.name}</option>)}
                                </select>
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-gray-600 mb-1">Divisi</label>
                                <select className="w-full p-3 border border-gray-300 rounded-lg text-sm" value={divisionFilter} onChange={e => setDivisionFilter(e.target.value)}>
                                    <option value="Semua">Semua Divisi</option>
                                    {[...new Set(visibleEmployees.map(emp => emp.division).filter(Boolean))].map(div => <option key={div} value={div}>{div}</option>)}
                                </select>
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-gray-600 mb-1">Status Kasbon</label>
                                <select className="w-full p-3 border border-gray-300 rounded-lg text-sm" value={cashAdvanceStatusFilter} onChange={e => setCashAdvanceStatusFilter(e.target.value)}>
                                    <option value="Semua">Semua Status</option>
                                    <option value="Belum Dipotong">Belum Dipotong</option>
                                    <option value="Dipotong Sebagian">Dipotong Sebagian</option>
                                    <option value="Lunas">Lunas</option>
                                </select>
                            </div>
                        </div>
                    </Card>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <Card className="border-l-4 border-l-green-500">
                            <h3 className="text-sm font-bold text-gray-500">Total Uang Masuk</h3>
                            <p className="text-2xl font-black text-green-700 mt-2">{formatRupiah(totalIncomeAll)}</p>
                            <p className="text-xs text-gray-500 mt-1">Invoice + input uang masuk</p>
                        </Card>
                        <Card className="border-l-4 border-l-red-500">
                            <h3 className="text-sm font-bold text-gray-500">Total Uang Keluar</h3>
                            <p className="text-2xl font-black text-red-700 mt-2">{formatRupiah(totalExpense)}</p>
                            <p className="text-xs text-gray-500 mt-1">Bahan, gaji, kasbon, biaya, komisi</p>
                        </Card>
                        <Card className="border-l-4 border-l-blue-500">
                            <h3 className="text-sm font-bold text-gray-500">Saldo Bersih</h3>
                            <p className={`text-2xl font-black mt-2 ${netBalance >= 0 ? 'text-blue-700' : 'text-red-700'}`}>{formatRupiah(netBalance)}</p>
                            <p className="text-xs text-gray-500 mt-1">Uang masuk dikurangi uang keluar</p>
                        </Card>
                        <Card className="border-l-4 border-l-yellow-500">
                            <h3 className="text-sm font-bold text-gray-500">Piutang Invoice</h3>
                            <p className="text-2xl font-black text-yellow-700 mt-2">{formatRupiah(totalInvoiceReceivable)}</p>
                            <p className="text-xs text-gray-500 mt-1">Sisa tagihan customer</p>
                        </Card>
                        <Card className="border-l-4 border-l-slate-500">
                            <h3 className="text-sm font-bold text-gray-500">Biaya Operasional</h3>
                            <p className="text-2xl font-black text-slate-700 mt-2">{formatRupiah(totalOperationalExpense)}</p>
                            <p className="text-xs text-gray-500 mt-1">Dari menu Biaya</p>
                        </Card>
                        <Card className="border-l-4 border-l-purple-500">
                            <h3 className="text-sm font-bold text-gray-500">Komisi Marketing</h3>
                            <p className="text-2xl font-black text-purple-700 mt-2">{formatRupiah(totalMarketingCommission)}</p>
                            <p className="text-xs text-gray-500 mt-1">Dihitung dari invoice</p>
                        </Card>
                        <Card className="border-l-4 border-l-emerald-500">
                            <h3 className="text-sm font-bold text-gray-500">DP Klien Non Invoice</h3>
                            <p className="text-2xl font-black text-emerald-700 mt-2">{formatRupiah(totalClientDpIncome)}</p>
                            <p className="text-xs text-gray-500 mt-1">Dari menu Klien / Instansi</p>
                        </Card>
                        <Card className="border-l-4 border-l-green-500">
                            <h3 className="text-sm font-bold text-gray-500">Pembayaran Invoice</h3>
                            <p className="text-2xl font-black text-green-700 mt-2">{formatRupiah(totalInvoiceIncome)}</p>
                            <p className="text-xs text-gray-500 mt-1">Termasuk DP pada invoice</p>
                        </Card>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <Card className="border-l-4 border-l-red-500">
                            <h3 className="text-sm font-bold text-gray-500">Pembelian Bahan</h3>
                            <p className="text-2xl font-black text-red-700 mt-2">{formatRupiah(totalMaterial)}</p>
                            <p className="text-xs text-gray-500 mt-1">{materialRows.length} order pembelian</p>
                        </Card>
                        <Card className="border-l-4 border-l-green-500">
                            <h3 className="text-sm font-bold text-gray-500">Gaji Produksi</h3>
                            <p className="text-2xl font-black text-green-700 mt-2">{formatRupiah(totalWage)}</p>
                            <p className="text-xs text-gray-500 mt-1">{wageRows.length} rekap kinerja</p>
                        </Card>
                        <Card className="border-l-4 border-l-blue-500">
                            <h3 className="text-sm font-bold text-gray-500">Total Pengeluaran</h3>
                            <p className="text-2xl font-black text-blue-700 mt-2">{formatRupiah(totalExpense)}</p>
                            <p className="text-xs text-gray-500 mt-1">{orderCostRows.length} order tercatat</p>
                        </Card>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <Card className="border-l-4 border-l-orange-500">
                            <h3 className="text-sm font-bold text-gray-500">Total Kasbon Diberikan</h3>
                            <p className="text-2xl font-black text-orange-700 mt-2">{formatRupiah(totalCashAdvanceGiven)}</p>
                            <p className="text-xs text-gray-500 mt-1">Uang keluar untuk kasbon karyawan</p>
                        </Card>
                        <Card className="border-l-4 border-l-emerald-500">
                            <h3 className="text-sm font-bold text-gray-500">Total Kasbon Dipotong</h3>
                            <p className="text-2xl font-black text-emerald-700 mt-2">{formatRupiah(totalCashAdvanceDeducted)}</p>
                            <p className="text-xs text-gray-500 mt-1">Akumulasi potongan dari rekap gaji</p>
                        </Card>
                        <Card className="border-l-4 border-l-yellow-500">
                            <h3 className="text-sm font-bold text-gray-500">Total Sisa Kasbon</h3>
                            <p className="text-2xl font-black text-yellow-700 mt-2">{formatRupiah(totalCashAdvanceRemaining)}</p>
                            <p className="text-xs text-gray-500 mt-1">Piutang internal karyawan</p>
                        </Card>
                        <Card className="border-l-4 border-l-purple-500">
                            <h3 className="text-sm font-bold text-gray-500">Potongan Kasbon Periode</h3>
                            <p className="text-2xl font-black text-purple-700 mt-2">{formatRupiah(totalCashAdvanceDeductionInPeriod)}</p>
                            <p className="text-xs text-gray-500 mt-1">Berdasarkan periode rekap gaji</p>
                        </Card>
                        <Card className="border-l-4 border-l-green-500">
                            <h3 className="text-sm font-bold text-gray-500">Total Gaji Bruto</h3>
                            <p className="text-2xl font-black text-green-700 mt-2">{formatRupiah(totalGrossWage)}</p>
                            <p className="text-xs text-gray-500 mt-1">Sebelum potongan kasbon</p>
                        </Card>
                        <Card className="border-l-4 border-l-blue-500">
                            <h3 className="text-sm font-bold text-gray-500">Total Gaji Bersih</h3>
                            <p className="text-2xl font-black text-blue-700 mt-2">{formatRupiah(totalWage)}</p>
                            <p className="text-xs text-gray-500 mt-1">Setelah potongan kasbon</p>
                        </Card>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <Card className="border-l-4 border-l-slate-500">
                            <h3 className="text-sm font-bold text-gray-500">Total Tagihan Vendor</h3>
                            <p className="text-2xl font-black text-slate-700 mt-2">{formatRupiah(totalMaterialBill)}</p>
                            <p className="text-xs text-gray-500 mt-1">{materialBillingRows.length} nota/order bahan</p>
                        </Card>
                        <Card className="border-l-4 border-l-emerald-500">
                            <h3 className="text-sm font-bold text-gray-500">Sudah Dibayar Vendor</h3>
                            <p className="text-2xl font-black text-emerald-700 mt-2">{formatRupiah(totalVendorPaid)}</p>
                            <p className="text-xs text-gray-500 mt-1">Akumulasi termin pembayaran</p>
                        </Card>
                        <Card className="border-l-4 border-l-orange-500">
                            <h3 className="text-sm font-bold text-gray-500">Sisa Hutang Vendor</h3>
                            <p className="text-2xl font-black text-orange-700 mt-2">{formatRupiah(totalVendorDebt)}</p>
                            <p className="text-xs text-gray-500 mt-1">Tagihan dikurangi termin</p>
                        </Card>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <Card className="border-l-4 border-l-green-500">
                            <h3 className="text-sm font-bold text-gray-500">Pembelian Lunas</h3>
                            <p className="text-2xl font-black text-green-700 mt-2">{formatRupiah(totalPaidOffPurchase)}</p>
                            <p className="text-xs text-gray-500 mt-1">Tagihan vendor yang sudah lunas</p>
                        </Card>
                        <Card className="border-l-4 border-l-yellow-500">
                            <h3 className="text-sm font-bold text-gray-500">Pembelian Belum Lunas</h3>
                            <p className="text-2xl font-black text-yellow-700 mt-2">{formatRupiah(totalUnpaidPurchase)}</p>
                            <p className="text-xs text-gray-500 mt-1">Sisa pembayaran vendor</p>
                        </Card>
                    </div>

                    <Card>
                        <h3 className="text-lg font-bold text-gray-800 mb-4">Grafik Uang Masuk vs Uang Keluar</h3>
                        {[
                            { label: 'Uang Masuk', value: totalIncomeAll, color: 'bg-green-600' },
                            { label: 'Uang Keluar', value: totalExpense, color: 'bg-red-600' },
                            { label: 'Saldo Bersih', value: Math.max(0, netBalance), color: 'bg-blue-600' }
                        ].map(row => {
                            const maxVal = Math.max(totalIncomeAll, totalExpense, Math.abs(netBalance), 1);
                            const width = Math.max(4, Math.round((row.value / maxVal) * 100));
                            return (
                                <div key={row.label} className="mb-3">
                                    <div className="flex justify-between text-sm font-bold mb-1"><span>{row.label}</span><span>{formatRupiah(row.value)}</span></div>
                                    <div className="h-5 bg-gray-100 rounded overflow-hidden"><div className={`h-full ${row.color}`} style={{ width: `${width}%` }}></div></div>
                                </div>
                            );
                        })}
                    </Card>

                    <Card>
                        <h3 className="text-lg font-bold text-gray-800 mb-4">Biaya per Order</h3>
                        <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse">
                                <thead>
                                    <tr className="bg-gray-50 border-b border-gray-200">
                                        <th className="p-3 text-sm font-semibold text-gray-600">Order</th>
                                        <th className="p-3 text-sm font-semibold text-gray-600">Instansi</th>
                                        <th className="p-3 text-sm font-semibold text-gray-600">Jenis Produksi</th>
                                        <th className="p-3 text-sm font-semibold text-gray-600">Tanggal</th>
                                        <th className="p-3 text-sm font-semibold text-gray-600 text-right">Bahan</th>
                                        <th className="p-3 text-sm font-semibold text-gray-600 text-right">Gaji</th>
                                        <th className="p-3 text-sm font-semibold text-gray-600 text-right">Total</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {orderCostRows.map(row => (
                                        <tr key={row.orderId} className="border-b border-gray-100 hover:bg-gray-50">
                                            <td className="p-3 text-sm font-bold text-blue-600">{row.orderId}</td>
                                            <td className="p-3 text-sm text-gray-800">{row.client}</td>
                                            <td className="p-3 text-sm text-gray-600">{row.type}</td>
                                            <td className="p-3 text-sm text-gray-500">{formatDate(row.date)}</td>
                                            <td className="p-3 text-sm text-right text-red-600 font-bold">{formatRupiah(row.materialCost)}</td>
                                            <td className="p-3 text-sm text-right text-green-700 font-bold">{formatRupiah(row.wageCost)}</td>
                                            <td className="p-3 text-sm text-right text-blue-700 font-black">{formatRupiah(row.totalCost)}</td>
                                        </tr>
                                    ))}
                                    {orderCostRows.length === 0 && (
                                        <tr><td colSpan="7" className="p-6 text-center text-gray-500 italic">Belum ada data keuangan pada periode ini.</td></tr>
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </Card>

                    <Card>
                        <h3 className="text-lg font-bold text-gray-800 mb-4">Riwayat DP Customer</h3>
                        <div className="overflow-x-auto">
                            <table className="w-full text-sm text-left">
                                <thead className="bg-gray-50">
                                    <tr><th className="p-3">Tanggal</th><th className="p-3">Klien</th><th className="p-3">Order</th><th className="p-3">Invoice</th><th className="p-3 text-right">Nominal DP</th><th className="p-3">Metode</th><th className="p-3 text-center">Status</th><th className="p-3">Keterangan</th></tr>
                                </thead>
                                <tbody>
                                    {allClientDpRows.map(dp => <tr key={dp.id || dp.date} className="border-t"><td className="p-3">{dp.date || '-'}</td><td className="p-3 font-bold">{dp.clientName}</td><td className="p-3 font-mono text-xs">{dp.orderId || '-'}</td><td className="p-3 font-mono text-xs">{dp.invoiceId || '-'}</td><td className="p-3 text-right font-black text-green-700">{formatRupiah(dp.amount)}</td><td className="p-3">{dp.method || '-'}</td><td className="p-3 text-center"><span className={`px-2 py-0.5 rounded-full text-xs font-bold ${dp.invoiceId ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800'}`}>{dp.invoiceId ? 'Terhubung Invoice' : 'Belum Terhubung'}</span></td><td className="p-3 text-sm text-gray-600">{dp.note || '-'}</td></tr>)}
                                    {allClientDpRows.length === 0 && <tr><td colSpan="8" className="p-6 text-center text-gray-500 italic">Belum ada data DP customer pada periode ini.</td></tr>}
                                </tbody>
                            </table>
                        </div>
                    </Card>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <Card>
                            <h3 className="text-lg font-bold text-gray-800 mb-4">Pembelian per Vendor</h3>
                            <div className="space-y-3">
                                {vendorSummary.slice(0, 10).map(vendor => (
                                    <div key={vendor.name} className="flex items-center justify-between border border-gray-100 rounded-lg p-3 bg-gray-50">
                                        <div>
                                            <div className="font-bold text-gray-800">{vendor.name}</div>
                                            <div className="text-xs text-gray-500">{vendor.items} item bahan</div>
                                        </div>
                                        <div className="font-black text-red-600">{formatRupiah(vendor.total)}</div>
                                    </div>
                                ))}
                                {vendorSummary.length === 0 && <div className="text-sm text-gray-500 italic text-center p-6">Belum ada pembelian bahan.</div>}
                            </div>
                        </Card>

                        <Card>
                            <h3 className="text-lg font-bold text-gray-800 mb-4">Gaji per Karyawan</h3>
                            <div className="space-y-3">
                                {employeeSummary.slice(0, 10).map(emp => (
                                    <div key={`${emp.name}-${emp.division}`} className="flex items-center justify-between border border-gray-100 rounded-lg p-3 bg-gray-50">
                                        <div>
                                            <div className="font-bold text-gray-800">{emp.name}</div>
                                            <div className="text-xs text-gray-500">{emp.division} | {emp.pcs} pcs | {emp.rekap} rekap</div>
                                        </div>
                                        <div className="font-black text-green-700">{formatRupiah(emp.total)}</div>
                                    </div>
                                ))}
                                {employeeSummary.length === 0 && <div className="text-sm text-gray-500 italic text-center p-6">Belum ada rekap gaji produksi.</div>}
                            </div>
                        </Card>
                    </div>
                </div>
            );
        };

        const LaporanView = ({ orders, setOrders, employees, setEmployees, rekapKinerja, setRekapKinerja, invoices = [], setInvoices, showToast, templates }) => {
            const [modalData, setModalData] = useState(null);
            const [deleteRekapConfirmId, setDeleteRekapConfirmId] = useState(null);
            const [selectionConfirm, setSelectionConfirm] = useState(null);
            const [selectedItemKeys, setSelectedItemKeys] = useState(new Set());
            const [searchTerm, setSearchTerm] = useState('');
            const [activeReportTab, setActiveReportTab] = useState('input');
            const [cashAdvanceDeduction, setCashAdvanceDeduction] = useState('');
            const [cashAdvanceDeductionNote, setCashAdvanceDeductionNote] = useState('');
            const [printOptions, setPrintOptions] = useState({ marketing: true, production: true, daily: true, overtime: true });
            const [expandedRekapIds, setExpandedRekapIds] = useState({});
            const [expandedInputIds, setExpandedInputIds] = useState({});
            const safeOrdersForReport = Array.isArray(orders) ? orders : [];
            const safeEmployeesForReport = Array.isArray(employees) ? employees : [];
            const safeRekapForReport = Array.isArray(rekapKinerja) ? rekapKinerja : [];
            const safeInvoicesForReport = Array.isArray(invoices) ? invoices : [];
            const visibleEmployees = safeEmployeesForReport.filter(isVisibleRecord);
            const filteredReportEmployees = visibleEmployees.filter(emp => matchesSearch([emp.name, emp.division, emp.phone, emp.status], searchTerm));

            const toggleSelection = (key) => {
                setSelectedItemKeys(prev => {
                    const next = new Set(prev);
                    if (next.has(key)) next.delete(key);
                    else next.add(key);
                    return next;
                });
            };

            const toggleSelectAll = (items) => {
                const allSelected = items.length > 0 && items.every(item => selectedItemKeys.has(`${item.orderId}-${item.stage}`));
                setSelectedItemKeys(prev => {
                    const next = new Set(prev);
                    items.forEach(item => {
                        const key = `${item.orderId}-${item.stage}`;
                        if (allSelected) next.delete(key);
                        else next.add(key);
                    });
                    return next;
                });
            };

            const requestToggleSelection = (item) => {
                const itemKey = `${item.orderId}-${item.stage}`;
                const isSelected = selectedItemKeys.has(itemKey);
                setSelectionConfirm({
                    action: isSelected ? 'remove' : 'add',
                    title: isSelected ? 'Batalkan Pilihan Rekap?' : 'Pilih Pekerjaan untuk Rekap?',
                    description: isSelected ? 'Pekerjaan ini akan dikeluarkan dari daftar yang akan dicetak.' : 'Pekerjaan ini akan masuk ke daftar laporan kinerja yang akan direkap.',
                    confirmLabel: isSelected ? 'Ya, Batalkan Pilihan' : 'Ya, Pilih',
                    confirmClass: isSelected ? 'bg-red-600 hover:bg-red-700' : 'bg-blue-600 hover:bg-blue-700',
                    items: [item],
                    total: item.qty || 0
                });
            };

            const requestToggleSelectAll = (items) => {
                const allSelected = items.length > 0 && items.every(item => selectedItemKeys.has(`${item.orderId}-${item.stage}`));
                const targetItems = allSelected ? items : items.filter(item => !selectedItemKeys.has(`${item.orderId}-${item.stage}`));
                if (targetItems.length === 0) return;
                setSelectionConfirm({
                    action: allSelected ? 'removeAll' : 'addAll',
                    title: allSelected ? 'Batalkan Semua Pilihan?' : 'Pilih Semua Pekerjaan?',
                    description: allSelected ? 'Semua pekerjaan pada karyawan ini akan dikeluarkan dari daftar cetak.' : 'Semua pekerjaan yang belum dipilih akan masuk ke daftar laporan kinerja.',
                    confirmLabel: allSelected ? 'Ya, Batalkan Semua' : 'Ya, Pilih Semua',
                    confirmClass: allSelected ? 'bg-red-600 hover:bg-red-700' : 'bg-blue-600 hover:bg-blue-700',
                    items: targetItems,
                    total: targetItems.reduce((sum, item) => sum + (parseInt(item.qty) || 0), 0)
                });
            };

            const executeSelectionConfirm = () => {
                if (!selectionConfirm) return;
                setSelectedItemKeys(prev => {
                    const next = new Set(prev);
                    (selectionConfirm.items || []).forEach(item => {
                        const key = `${item.orderId}-${item.stage}`;
                        if (selectionConfirm.action === 'remove' || selectionConfirm.action === 'removeAll') next.delete(key);
                        else next.add(key);
                    });
                    return next;
                });
                setSelectionConfirm(null);
            };

            const triggerPrint = (data) => {
                const formatReceiptMoney = (num) => formatRupiah(num || 0).replace(/\s/g, '');
                const relatedInvoices = safeInvoicesForReport.filter(inv => (data.marketingInvoiceIds || []).some(id => String(id) === String(inv.id)));
                const dailyLogs = Array.isArray(data.dailySalaryLogs) ? data.dailySalaryLogs : [];
                const dailyOnlyLogs = dailyLogs.filter(log => getDailySalaryLogTotal(log).daily > 0);
                const overtimeLogs = dailyLogs.filter(log => getDailySalaryLogTotal(log).overtime > 0);
                const sectionRows = (title, rows, emptyText = 'Tidak ada data.') => `
                    <div class="section-title">${title}</div>
                    <div class="section-list">
                        ${rows.length ? rows.join('') : `<div class="item-row muted"><span>${emptyText}</span><span>-</span></div>`}
                    </div>
                `;
                const marketingRows = relatedInvoices.map(inv => `
                    <div class="item-row">
                        <span><b>${inv.id || '-'}</b><small>${inv.customer || '-'} | ${inv.date || data.dateProcessed || '-'}</small></span>
                        <span>${formatReceiptMoney(getInvoiceCommissionTotal(inv))}</span>
                    </div>
                `);
                const productionRows = (data.items || []).map(item => `
                    <div class="item-row">
                        <span><b>${item.orderId || '-'} - ${item.stageLabel || item.stage || '-'}</b><small>${item.type || '-'} | ${item.qty || 0} x ${formatReceiptMoney(item.unitPrice || 0)}</small></span>
                        <span>${formatReceiptMoney(item.wageTotal || 0)}</span>
                    </div>
                `);
                const dailyRows = dailyOnlyLogs.map(log => `
                    <div class="item-row">
                        <span><b>${log.date || '-'}</b><small>${log.note || 'Gaji harian'} | ${log.workDays || 0} hari</small></span>
                        <span>${formatReceiptMoney(getDailySalaryLogTotal(log).daily)}</span>
                    </div>
                `);
                const overtimeRows = overtimeLogs.map(log => `
                    <div class="item-row">
                        <span><b>${log.date || '-'}</b><small>${log.note || 'Lembur'} | ${log.overtimeCount || 0} jam</small></span>
                        <span>${formatReceiptMoney(getDailySalaryLogTotal(log).overtime)}</span>
                    </div>
                `);
                const printContent = `
                <!DOCTYPE html>
                <html>
                <head>
                    <title>Struk Gaji Karyawan - ${data.empName}</title>
                    <style>
                        @page { size: 80mm 210mm; margin: 4mm; }
                        html, body { width: 72mm; }
                        body { font-family: Arial, sans-serif; color: #000; line-height: 1.28; margin: 0 auto; padding: 0; font-size: 11.5px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
                        .receipt { width: 72mm; margin: 0 auto; box-sizing: border-box; }
                        .header { text-align: center; border-bottom: 1px dashed #000; padding-bottom: 7px; margin-bottom: 7px; }
                        .header-logo { max-height: 38px; max-width: 64px; object-fit: contain; margin-bottom: 3px; }
                        .header h1 { margin: 0; font-size: 14px; text-transform: uppercase; color: #000; line-height: 1.15; }
                        .header p { margin: 2px 0 0 0; font-size: 10.5px; }
                        .meta { border-bottom: 1px dashed #000; padding-bottom: 7px; margin-bottom: 7px; }
                        .meta-row { display: flex; justify-content: space-between; gap: 6px; margin: 2px 0; }
                        .meta-label { color: #444; white-space: nowrap; }
                        .meta-value { font-weight: bold; text-align: right; }
                        .text-center { text-align: center; }
                        .text-right { text-align: right; }
                        .font-bold { font-weight: bold; }
                        .muted { color: #555; font-size: 8.6px; line-height: 1.15; }
                        .section-title { margin-top: 8px; padding: 4px 0 3px; border-top: 1px dashed #000; border-bottom: 1px dashed #bbb; font-size: 10px; font-weight: 900; text-transform: uppercase; }
                        .section-list { margin-bottom: 2px; }
                        .item-row { display: flex; justify-content: space-between; gap: 6px; padding: 4px 0; border-bottom: 1px dashed #ddd; }
                        .item-row span:first-child { max-width: 44mm; overflow-wrap: anywhere; }
                        .item-row span:last-child { text-align: right; font-weight: bold; white-space: nowrap; }
                        .item-row small { display: block; color: #555; font-size: 8.6px; font-weight: normal; margin-top: 1px; }
                        .total-box { border-top: 1px dashed #000; border-bottom: 1px dashed #000; padding: 7px 0; margin-top: 6px; }
                        .total-row { display: flex; justify-content: space-between; gap: 6px; margin: 3px 0; }
                        .grand-total { font-size: 13px; font-weight: 900; }
                        .signature { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; text-align: center; font-size: 9px; }
                        .signature-line { margin-top: 28px; border-top: 1px solid #000; padding-top: 3px; }
                        .footer-note { text-align: center; font-size: 9px; margin-top: 9px; color: #444; }
                        @media screen {
                            body { background: #f3f4f6; padding: 12px 0; }
                            .receipt { background: #fff; padding: 4mm; box-shadow: 0 10px 30px rgba(0,0,0,0.12); }
                        }
                    </style>
                </head>
                <body>
                    <div class="receipt">
                        <div class="header">
                            ${templates?.companyLogo ? `<img src="${templates.companyLogo}" class="header-logo" />` : ''}
                            <h1>${templates?.companyName || 'SIMPATI KONVEKSI'}</h1>
                            <p>STRUK GAJI KARYAWAN</p>
                        </div>

                        <div class="meta">
                            <div class="meta-row"><span class="meta-label">Nama</span><span class="meta-value">${data.empName}</span></div>
                            <div class="meta-row"><span class="meta-label">Jabatan</span><span class="meta-value">${data.division}</span></div>
                            <div class="meta-row"><span class="meta-label">Tanggal Cetak</span><span class="meta-value">${data.dateProcessed}</span></div>
                            <div class="meta-row"><span class="meta-label">ID Rekap</span><span class="meta-value">${data.id}</span></div>
                        </div>

                        ${sectionRows('Komisi Marketing', marketingRows)}
                        ${sectionRows('Gaji Produksi', productionRows)}
                        ${sectionRows('Gaji Harian', dailyRows)}
                        ${sectionRows('Lembur', overtimeRows)}
                        ${sectionRows('Potongan - Kasbon', [`<div class="item-row"><span><b>Bayar kasbon sekarang</b><small>Sisa kasbon setelah cetak: ${formatReceiptMoney(Math.max(0, safeMoney(data.employeeCashAdvanceSnapshot?.remaining) - safeMoney(data.cashAdvanceDeduction)))}</small></span><span>${formatReceiptMoney(data.cashAdvanceDeduction || 0)}</span></div>`])}

                        <div class="total-box">
                            <div class="total-row"><span>Total Pendapatan</span><span class="font-bold">${formatReceiptMoney(data.grossSalary || data.totalWage || 0)}</span></div>
                            <div class="total-row"><span>Total Potongan</span><span class="font-bold">${formatReceiptMoney(data.cashAdvanceDeduction || 0)}</span></div>
                            <div class="total-row grand-total"><span>Total Diterima</span><span>${formatReceiptMoney(data.netSalary ?? data.totalWage ?? 0)}</span></div>
                        </div>

                        <div class="signature">
                            <div><div>Penerima</div><div class="signature-line">${data.empName || ''}</div></div>
                            <div><div>Admin</div><div class="signature-line">${templates?.laporanSignatureLeft || 'Admin'}</div></div>
                        </div>
                        <div class="footer-note">Simpan struk ini sebagai bukti rekap gaji karyawan.</div>
                    </div>
                </body>
                </html>
                `;

                let printWindow = window.open('', '_blank');
                if (printWindow) {
                    printWindow.document.open();
                    printWindow.document.write(printContent);
                    printWindow.document.close();
                    printWindow.focus();
                    setTimeout(() => { printWindow.print(); }, 250);
                } else {
                    showToast("Gagal mencetak. Harap izinkan Pop-up di browser Anda!", "error");
                }
            };

            const handleDeleteRekap = () => {
                const rekapToDelete = (rekapKinerja || []).find(r => String(r.id) === String(deleteRekapConfirmId));
                if (!rekapToDelete) return;
                
                const logsToUnlock = (rekapToDelete.items || []).flatMap(item => 
                    (item.logIds || []).map(l => ({ orderId: item.orderId, stageId: l.stageId, logId: l.logId }))
                );
                
                setOrders(prevOrders => {
                    const newOrders = [...(prevOrders || [])];
                    logsToUnlock.forEach(target => {
                        const orderIndex = newOrders.findIndex(o => String(o.id) === String(target.orderId));
                        if (orderIndex > -1) {
                            const order = { ...newOrders[orderIndex] };
                            const stageData = { ...(order.progress?.[target.stageId] || { workLogs: [] }) };
                            const workLogs = [...(stageData.workLogs || [])];
                            
                            const logIndex = workLogs.findIndex(l => String(l.id) === String(target.logId));
                            if (logIndex > -1) {
                                const now = new Date().toISOString();
                                workLogs[logIndex] = { ...workLogs[logIndex], isReported: false, isReportedChangedAt: now, _syncUpdatedAt: now };
                            }
                            
                            stageData.workLogs = workLogs;
                            order.progress = { ...(order.progress || {}), [target.stageId]: stageData };
                            newOrders[orderIndex] = order;
                        }
                    });
                    return newOrders;
                });
                
                const now = new Date().toISOString();
                if (safeMoney(rekapToDelete.cashAdvanceDeduction) > 0 || Array.isArray(rekapToDelete.dailySalaryLogs)) {
                    setEmployees(prev => (prev || []).map(emp => {
                        if (String(emp.id) !== String(rekapToDelete.empId)) return emp;
                        const nextCashAdvances = (emp.cashAdvances || []).map(item => {
                            const history = Array.isArray(item.deductionHistory) ? item.deductionHistory : [];
                            const removedAmount = history
                                .filter(entry => String(entry.rekapId) === String(rekapToDelete.id))
                                .reduce((sum, entry) => sum + safeMoney(entry.amount), 0);
                            if (removedAmount <= 0) return item;
                            const nextItem = {
                                ...item,
                                deductedAmount: Math.max(0, getCashAdvanceDeducted(item) - removedAmount),
                                deductionHistory: history.filter(entry => String(entry.rekapId) !== String(rekapToDelete.id)),
                                updatedAt: now
                            };
                            return { ...nextItem, status: normalizeCashAdvanceStatus(nextItem) };
                        });
                        const nextDailySalaryLogs = (emp.dailySalaryLogs || []).map(log => String(log.rekapId) === String(rekapToDelete.id) ? { ...log, rekapId: '', rekapDate: '', _syncUpdatedAt: now } : log);
                        return { ...emp, cashAdvances: nextCashAdvances, dailySalaryLogs: nextDailySalaryLogs, _syncUpdatedAt: now };
                    }));
                }
                if (Array.isArray(rekapToDelete.marketingInvoiceIds) && setInvoices) {
                    setInvoices(prev => (prev || []).map(inv => rekapToDelete.marketingInvoiceIds.some(id => String(id) === String(inv.id)) ? { ...inv, commissionRekapId: '', commissionRekapDate: '', _syncUpdatedAt: now } : inv));
                }
                setRekapKinerja(prev => (prev || []).map(r => String(r.id) === String(deleteRekapConfirmId) ? { ...r, isDeleted: true, deletedAt: now, _syncUpdatedAt: now } : r));
                setDeleteRekapConfirmId(null);
                showToast("Rekap dibatalkan, pekerjaan kembali bisa diedit.", "success");
            };

            const getRekapItemKey = (item) => `${item.orderId}-${item.stage}`;

            const handleOpenRekapModal = (empId, items) => {
                const selectedKeys = new Set((items || []).map(getRekapItemKey));
                setModalData({ empId, allItems: items || [], selectedKeys });
                setCashAdvanceDeduction('');
                setCashAdvanceDeductionNote('');
            };

            const toggleModalRekapItem = (item) => {
                const itemKey = getRekapItemKey(item);
                setModalData(prev => {
                    if (!prev) return prev;
                    const nextKeys = new Set(prev.selectedKeys || []);
                    if (nextKeys.has(itemKey)) nextKeys.delete(itemKey);
                    else nextKeys.add(itemKey);
                    return { ...prev, selectedKeys: nextKeys };
                });
            };

            const toggleAllModalRekapItems = () => {
                setModalData(prev => {
                    if (!prev) return prev;
                    const allKeys = (prev.allItems || []).map(getRekapItemKey);
                    const allSelected = allKeys.length > 0 && allKeys.every(key => prev.selectedKeys?.has(key));
                    return { ...prev, selectedKeys: allSelected ? new Set() : new Set(allKeys) };
                });
            };

            const executeRekapAndPrint = () => {
                if(!modalData) return;
                const selectedItems = (modalData.allItems || []).filter(item => modalData.selectedKeys?.has(getRekapItemKey(item)));
                if(selectedItems.length === 0 && printOptions.production) {
                    showToast("Pilih minimal 1 pekerjaan untuk direkap.", "error");
                    return;
                }
                const selectedTotal = printOptions.production ? selectedItems.reduce((sum, item) => sum + (parseInt(item.qty) || 0), 0) : 0;
                const selectedWage = printOptions.production ? selectedItems.reduce((sum, item) => sum + (parseInt(item.wageTotal) || 0), 0) : 0;

                const empForRekap = visibleEmployees.find(e => String(e.id) === String(modalData.empId));
                const dailySalaryLogsForRekap = getEmployeeDailySalaryLogs(empForRekap).filter(log => !log.rekapId);
                const dailySalary = printOptions.daily ? dailySalaryLogsForRekap.reduce((sum, log) => sum + getDailySalaryLogTotal(log).daily, 0) : 0;
                const overtimeSalary = printOptions.overtime ? dailySalaryLogsForRekap.reduce((sum, log) => sum + getDailySalaryLogTotal(log).overtime, 0) : 0;
                const marketingInvoicesForRekap = printOptions.marketing ? safeArray(safeInvoicesForReport).filter(isVisibleRecord).filter(inv => normalizeText(inv.marketing) === normalizeText(empForRekap?.name) && !inv.commissionRekapId && getInvoicePaidTotal(inv) > 0) : [];
                const marketingCommission = printOptions.marketing ? marketingInvoicesForRekap.reduce((sum, inv) => sum + getInvoiceCommissionTotal(inv), 0) : 0;
                const grossSalary = selectedWage + dailySalary + overtimeSalary + marketingCommission;
                const empCashAdvanceSummary = getEmployeeCashAdvanceSummary(empForRekap);
                const deduction = Math.min(safeMoney(cashAdvanceDeduction), grossSalary, empCashAdvanceSummary.remaining);
                if (safeMoney(cashAdvanceDeduction) > grossSalary) {
                    showToast("Potongan kasbon tidak boleh melebihi gaji bruto.", "error");
                    return;
                }
                if (safeMoney(cashAdvanceDeduction) > empCashAdvanceSummary.remaining) {
                    showToast("Potongan kasbon tidak boleh melebihi sisa kasbon.", "error");
                    return;
                }
                const netSalary = Math.max(0, grossSalary - deduction);
                const newRekap = {
                    id: `RKP-${Date.now()}`,
                    empId: modalData.empId,
                    empName: empForRekap?.name || '',
                    division: empForRekap?.division || '',
                    dateProcessed: new Date().toISOString().split('T')[0],
                    items: selectedItems,
                    total: selectedTotal,
                    totalWage: selectedWage,
                    grossSalary,
                    productionSalary: selectedWage,
                    dailySalary,
                    overtimeSalary,
                    dailySalaryLogs: dailySalaryLogsForRekap,
                    marketingCommission,
                    marketingInvoiceIds: marketingInvoicesForRekap.map(inv => inv.id),
                    printOptions: { ...printOptions },
                    cashAdvanceDeduction: deduction,
                    cashAdvanceDeductionNote: cashAdvanceDeductionNote || '',
                    netSalary,
                    employeeCashAdvanceSnapshot: empCashAdvanceSummary,
                    _syncUpdatedAt: new Date().toISOString()
                };
                
                setRekapKinerja(prev => [...(prev || []), newRekap]);
                if ((deduction > 0 || ((printOptions.daily || printOptions.overtime) && dailySalaryLogsForRekap.length > 0)) && empForRekap) {
                    const now = new Date().toISOString();
                    setEmployees(prev => (prev || []).map(emp => {
                        if (String(emp.id) !== String(empForRekap.id)) return emp;
                        let remainingDeduction = deduction;
                        const nextCashAdvances = (emp.cashAdvances || []).map(item => {
                            if (remainingDeduction <= 0 || item.isDeleted) return item;
                            const itemRemaining = getCashAdvanceRemaining(item);
                            if (itemRemaining <= 0) return { ...item, status: 'Lunas' };
                            const applied = Math.min(itemRemaining, remainingDeduction);
                            remainingDeduction -= applied;
                            const nextItem = {
                                ...item,
                                deductedAmount: getCashAdvanceDeducted(item) + applied,
                                deductionHistory: [
                                    ...(Array.isArray(item.deductionHistory) ? item.deductionHistory : []),
                                    { rekapId: newRekap.id, date: newRekap.dateProcessed, amount: applied, note: cashAdvanceDeductionNote || '' }
                                ],
                                updatedAt: now
                            };
                            return { ...nextItem, status: normalizeCashAdvanceStatus(nextItem) };
                        });
                        const nextDailySalaryLogs = (emp.dailySalaryLogs || []).map(log => ((printOptions.daily || printOptions.overtime) && dailySalaryLogsForRekap.some(row => String(row.id) === String(log.id))) ? { ...log, rekapId: newRekap.id, rekapDate: newRekap.dateProcessed, _syncUpdatedAt: now } : log);
                        return { ...emp, cashAdvances: nextCashAdvances, dailySalaryLogs: nextDailySalaryLogs, _syncUpdatedAt: now };
                    }));
                }
                if (marketingInvoicesForRekap.length > 0 && setInvoices) {
                    const now = new Date().toISOString();
                    setInvoices(prev => (prev || []).map(inv => marketingInvoicesForRekap.some(row => String(row.id) === String(inv.id)) ? { ...inv, commissionRekapId: newRekap.id, commissionRekapDate: newRekap.dateProcessed, _syncUpdatedAt: now } : inv));
                }
                
                const logsToUpdate = selectedItems.flatMap(item => 
                    (item.logIds || []).map(l => ({ orderId: item.orderId, stageId: l.stageId, logId: l.logId }))
                );

                setOrders(prevOrders => {
                    const newOrders = [...(prevOrders || [])];
                    logsToUpdate.forEach(target => {
                        const orderIndex = newOrders.findIndex(o => String(o.id) === String(target.orderId));
                        if (orderIndex > -1) {
                            const order = { ...newOrders[orderIndex] };
                            const stageData = { ...(order.progress?.[target.stageId] || { workLogs: [] }) };
                            const workLogs = [...(stageData.workLogs || [])];
                            
                            const logIndex = workLogs.findIndex(l => String(l.id) === String(target.logId));
                            if (logIndex > -1) {
                                const now = new Date().toISOString();
                                workLogs[logIndex] = { ...workLogs[logIndex], isReported: true, isReportedChangedAt: now, _syncUpdatedAt: now };
                            }
                            
                            stageData.workLogs = workLogs;
                            order.progress = { ...(order.progress || {}), [target.stageId]: stageData };
                            newOrders[orderIndex] = order;
                        }
                    });
                    return newOrders;
                });

                setSelectedItemKeys(prev => {
                    const next = new Set(prev);
                    selectedItems.forEach(item => next.delete(getRekapItemKey(item)));
                    return next;
                });
                
                setModalData(null);
                setCashAdvanceDeduction('');
                setCashAdvanceDeductionNote('');
                const emp = visibleEmployees.find(e => String(e.id) === String(newRekap.empId));
                showToast("Laporan direkap dan siap dicetak.", "success");
                if (emp) {
                    triggerPrint({ ...newRekap, empName: emp.name, division: emp.division });
                }
            };

            const printExistingRekap = (rekap) => {
                const emp = visibleEmployees.find(e => String(e.id) === String(rekap.empId));
                triggerPrint({ ...rekap, empName: emp?.name || rekap.empName || '-', division: emp?.division || rekap.division || '-' });
            };

            const getRekapShareLink = (rekap) => `${window.location.href.split('#')[0]}#rekap-gaji=${encodeURIComponent(rekap.id)}`;

            const copyRekapShareLink = async (rekap) => {
                const link = getRekapShareLink(rekap);
                try {
                    await navigator.clipboard.writeText(link);
                    showToast("Link preview gaji berhasil disalin.", "success");
                } catch (error) {
                    window.prompt("Salin link preview gaji:", link);
                    showToast("Silakan salin link dari kotak yang muncul.", "success");
                }
            };

            const editExistingRekap = (rekap) => {
                const grossSalary = safeMoney(rekap.grossSalary ?? rekap.totalWage);
                const emp = visibleEmployees.find(e => String(e.id) === String(rekap.empId));
                const currentSummary = getEmployeeCashAdvanceSummary(emp);
                const currentDeduction = safeMoney(rekap.cashAdvanceDeduction);
                const maxDeduction = Math.min(grossSalary, currentSummary.remaining + currentDeduction);
                const amountInput = window.prompt('Potongan kasbon rekap ini', currentDeduction);
                if (amountInput === null) return;
                const nextDeduction = safeMoney(amountInput);
                if (nextDeduction > grossSalary) {
                    showToast("Potongan kasbon tidak boleh melebihi gaji bruto.", "error");
                    return;
                }
                if (nextDeduction > maxDeduction) {
                    showToast("Potongan kasbon tidak boleh melebihi sisa kasbon.", "error");
                    return;
                }
                const noteInput = window.prompt('Catatan potongan kasbon', rekap.cashAdvanceDeductionNote || '');
                if (noteInput === null) return;
                const now = new Date().toISOString();
                if (emp) {
                    setEmployees(prev => (prev || []).map(employee => {
                        if (String(employee.id) !== String(emp.id)) return employee;
                        let remainingToApply = nextDeduction;
                        const clearedAdvances = (employee.cashAdvances || []).map(item => {
                            const history = Array.isArray(item.deductionHistory) ? item.deductionHistory : [];
                            const removedAmount = history.filter(entry => String(entry.rekapId) === String(rekap.id)).reduce((sum, entry) => sum + safeMoney(entry.amount), 0);
                            const nextItem = {
                                ...item,
                                deductedAmount: Math.max(0, getCashAdvanceDeducted(item) - removedAmount),
                                deductionHistory: history.filter(entry => String(entry.rekapId) !== String(rekap.id))
                            };
                            return { ...nextItem, status: normalizeCashAdvanceStatus(nextItem) };
                        }).map(item => {
                            if (remainingToApply <= 0 || item.isDeleted) return item;
                            const itemRemaining = getCashAdvanceRemaining(item);
                            if (itemRemaining <= 0) return item;
                            const applied = Math.min(itemRemaining, remainingToApply);
                            remainingToApply -= applied;
                            const nextItem = {
                                ...item,
                                deductedAmount: getCashAdvanceDeducted(item) + applied,
                                deductionHistory: [
                                    ...(Array.isArray(item.deductionHistory) ? item.deductionHistory : []),
                                    { rekapId: rekap.id, date: rekap.dateProcessed, amount: applied, note: noteInput || '' }
                                ],
                                updatedAt: now
                            };
                            return { ...nextItem, status: normalizeCashAdvanceStatus(nextItem) };
                        });
                        return { ...employee, cashAdvances: clearedAdvances, _syncUpdatedAt: now };
                    }));
                }
                setRekapKinerja(prev => (prev || []).map(item => String(item.id) === String(rekap.id)
                    ? { ...item, grossSalary, cashAdvanceDeduction: nextDeduction, cashAdvanceDeductionNote: noteInput || '', netSalary: Math.max(0, grossSalary - nextDeduction), _syncUpdatedAt: now }
                    : item
                ));
                showToast("Rekap diperbarui.", "success");
            };

            const restoreRekapToInput = (rekap) => {
                if (!rekap || !window.confirm('Kembalikan rekap ini ke Input Laporan Kinerja untuk diperbaiki?')) return;
                const now = new Date().toISOString();
                const logsToUnlock = (rekap.items || []).flatMap(item => (item.logIds || []).map(l => ({ orderId: item.orderId, stageId: l.stageId, logId: l.logId })));
                setOrders(prevOrders => {
                    const nextOrders = [...(prevOrders || [])];
                    logsToUnlock.forEach(target => {
                        const orderIndex = nextOrders.findIndex(o => String(o.id) === String(target.orderId));
                        if (orderIndex < 0) return;
                        const order = { ...nextOrders[orderIndex] };
                        const stageData = { ...(order.progress?.[target.stageId] || { workLogs: [] }) };
                        stageData.workLogs = (stageData.workLogs || []).map(log => String(log.id) === String(target.logId) ? { ...log, isReported: false, isReportedChangedAt: now, _syncUpdatedAt: now } : log);
                        order.progress = { ...(order.progress || {}), [target.stageId]: stageData };
                        nextOrders[orderIndex] = order;
                    });
                    return nextOrders;
                });
                setEmployees(prev => (prev || []).map(emp => {
                    if (String(emp.id) !== String(rekap.empId)) return emp;
                    const nextCashAdvances = (emp.cashAdvances || []).map(item => {
                        const history = Array.isArray(item.deductionHistory) ? item.deductionHistory : [];
                        const removedAmount = history.filter(entry => String(entry.rekapId) === String(rekap.id)).reduce((sum, entry) => sum + safeMoney(entry.amount), 0);
                        const nextItem = { ...item, deductedAmount: Math.max(0, getCashAdvanceDeducted(item) - removedAmount), deductionHistory: history.filter(entry => String(entry.rekapId) !== String(rekap.id)), updatedAt: now };
                        return removedAmount > 0 ? { ...nextItem, status: normalizeCashAdvanceStatus(nextItem) } : item;
                    });
                    const nextDailySalaryLogs = (emp.dailySalaryLogs || []).map(log => String(log.rekapId) === String(rekap.id) ? { ...log, rekapId: '', rekapDate: '', _syncUpdatedAt: now } : log);
                    return { ...emp, cashAdvances: nextCashAdvances, dailySalaryLogs: nextDailySalaryLogs, _syncUpdatedAt: now };
                }));
                if (Array.isArray(rekap.marketingInvoiceIds) && setInvoices) {
                    setInvoices(prev => (prev || []).map(inv => rekap.marketingInvoiceIds.some(id => String(id) === String(inv.id)) ? { ...inv, commissionRekapId: '', commissionRekapDate: '', _syncUpdatedAt: now } : inv));
                }
                setRekapKinerja(prev => (prev || []).map(item => String(item.id) === String(rekap.id) ? { ...item, isDeleted: true, deletedAt: now, restoredForEdit: true, _syncUpdatedAt: now } : item));
                setActiveReportTab('input');
                showToast("Rekap dikembalikan ke Input Laporan Kinerja.", "success");
            };

            const modalSelectedItems = modalData ? (modalData.allItems || []).filter(item => modalData.selectedKeys?.has(getRekapItemKey(item))) : [];
            const modalSelectedTotal = modalSelectedItems.reduce((sum, item) => sum + (parseInt(item.qty) || 0), 0);
            const modalSelectedWage = modalSelectedItems.reduce((sum, item) => sum + (parseInt(item.wageTotal) || 0), 0);
            const modalEmployee = modalData ? visibleEmployees.find(emp => String(emp.id) === String(modalData.empId)) : null;
            const modalDailySalaryLogs = getEmployeeDailySalaryLogs(modalEmployee).filter(log => !log.rekapId);
            const modalDailySalary = modalDailySalaryLogs.reduce((sum, log) => sum + getDailySalaryLogTotal(log).daily, 0);
            const modalOvertimeSalary = modalDailySalaryLogs.reduce((sum, log) => sum + getDailySalaryLogTotal(log).overtime, 0);
            const modalMarketingInvoices = safeArray(safeInvoicesForReport).filter(isVisibleRecord).filter(inv => normalizeText(inv.marketing) === normalizeText(modalEmployee?.name) && !inv.commissionRekapId && getInvoicePaidTotal(inv) > 0);
            const modalMarketingCommission = modalMarketingInvoices.reduce((sum, inv) => sum + getInvoiceCommissionTotal(inv), 0);
            const modalCashAdvanceSummary = getEmployeeCashAdvanceSummary(modalEmployee);
            const modalPrintableGross = (printOptions.production ? modalSelectedWage : 0) + (printOptions.daily ? modalDailySalary : 0) + (printOptions.overtime ? modalOvertimeSalary : 0) + (printOptions.marketing ? modalMarketingCommission : 0);
            const modalGrossSalary = modalPrintableGross;
            const modalDeduction = Math.min(safeMoney(cashAdvanceDeduction), modalGrossSalary, modalCashAdvanceSummary.remaining);
            const modalHasPrintableIncome = modalPrintableGross > 0;
            const visibleRekaps = safeRekapForReport
                .filter(isVisibleRecord)
                .filter(rekap => {
                    const emp = visibleEmployees.find(e => String(e.id) === String(rekap.empId));
                    const itemText = (rekap.items || []).map(item => `${item.orderId} ${item.client} ${item.type} ${item.stageLabel || item.stage} ${item.sizes} ${item.qty} ${item.wageTotal}`).join(' ');
                    const statusText = safeMoney(rekap.netSalary ?? rekap.totalWage) > 0 ? 'Sudah Dibayar' : 'Belum Dibayar';
                    return matchesSearch([
                        rekap.id, rekap.empName, emp?.name, rekap.division || emp?.division, rekap.dateProcessed,
                        rekap.total, rekap.totalWage, rekap.grossSalary, rekap.cashAdvanceDeduction,
                        rekap.cashAdvanceDeductionNote, statusText, itemText
                    ], searchTerm);
                })
                .sort((a, b) => String(b.id).localeCompare(String(a.id)));
            const rekapSummary = {
                employees: new Set(visibleRekaps.map(r => String(r.empId || r.empName))).size,
                pcs: visibleRekaps.reduce((sum, r) => sum + safeMoney(r.total), 0),
                production: visibleRekaps.reduce((sum, r) => sum + safeMoney(r.productionSalary ?? r.totalWage), 0),
                daily: visibleRekaps.reduce((sum, r) => sum + safeMoney(r.dailySalary), 0),
                overtime: visibleRekaps.reduce((sum, r) => sum + safeMoney(r.overtimeSalary), 0),
                commission: visibleRekaps.reduce((sum, r) => sum + safeMoney(r.marketingCommission), 0),
                kasbon: visibleRekaps.reduce((sum, r) => sum + safeMoney(r.cashAdvanceDeduction), 0),
                net: visibleRekaps.reduce((sum, r) => sum + safeMoney(r.netSalary ?? r.totalWage), 0)
            };

            return (
                <div className="space-y-6">
                    <div>
                        <h2 className="text-2xl font-bold text-gray-800">Laporan & Rekap Kinerja Karyawan</h2>
                        <p className="text-sm text-gray-500 mt-1">Input laporan kinerja dan rekap gaji produksi berada dalam satu menu.</p>
                    </div>
                    <div className="flex gap-4 border-b border-gray-200 pb-2">
                        <button onClick={() => setActiveReportTab('input')} className={`pb-2 px-1 font-bold text-sm border-b-2 transition-colors ${activeReportTab === 'input' ? 'border-blue-600 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700'}`}>Input / Laporan Kinerja</button>
                        <button onClick={() => setActiveReportTab('rekap')} className={`pb-2 px-1 font-bold text-sm border-b-2 transition-colors ${activeReportTab === 'rekap' ? 'border-blue-600 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700'}`}>Rekap Kinerja</button>
                    </div>
                    <Card>
                        <SearchField value={searchTerm} onChange={setSearchTerm} placeholder="Cari karyawan, divisi, order, instansi, jenis produksi, tahap, tanggal, status, kasbon, catatan..." />
                    </Card>
                    {activeReportTab === 'input' ? (
                    <div className="space-y-6">
                        <div className="space-y-8">
                            {filteredReportEmployees.map(emp => {
                                const unsettledItems = [];
                                let totalUnsettled = 0;
                                let totalUnsettledWage = 0;

                                safeArray(safeOrdersForReport).filter(isVisibleOrder).forEach(order => {
                                    if(order.progress) {
                                        Object.entries(safeObject(order.progress)).forEach(([stage, data]) => {
                                            if (!getActiveProductionStageIds(order).includes(stage)) return;
                                            if (data && data.workLogs) {
                                                const empLogs = safeArray(data.workLogs).filter(l => !l.isDeleted && String(l.empId) === String(emp.id) && !l.isReported && getWorkLogSubmittedQty(l) > 0 && l.checkAfter);
                                                if (empLogs.length > 0) {
                                                    const sizeMap = {};
                                                    empLogs.forEach(l => { sizeMap[l.size] = (sizeMap[l.size] || 0) + getWorkLogSubmittedQty(l); });
                                                    const sizesInfo = sortSizeKeys(Object.keys(sizeMap)).map(s => `${s} (${sizeMap[s]})`).join(', ');
                                                    const stageTotalQty = empLogs.reduce((sum, l) => sum + getWorkLogSubmittedQty(l), 0);
                                                    const unitPrice = getProductionUnitPrice(order, stage);
                                                    const wageTotal = stageTotalQty * unitPrice;
                                                    const stageLabel = productionStageOptions.find(opt => opt.id === stage)?.label || stage;
                                                    
                                                    unsettledItems.push({
                                                        orderId: order.id, client: order.client, type: order.type,
                                                        stage: stage, stageLabel, sizes: sizesInfo, qty: stageTotalQty, unitPrice, wageTotal,
                                                        logIds: empLogs.map(l => ({ stageId: stage, logId: l.id }))
                                                    });
                                                    totalUnsettled += stageTotalQty;
                                                    totalUnsettledWage += wageTotal;
                                                }
                                            }
                                        });
                                    }
                                });

                                const myHistory = safeArray(rekapKinerja).filter(r => !r.isDeleted && String(r.empId) === String(emp.id)).reverse();
                                const dailySalaryRows = safeArray(getEmployeeDailySalaryLogs(emp)).filter(log => !log.rekapId && getDailySalaryLogTotal(log).daily > 0);
                                const overtimeRows = safeArray(getEmployeeDailySalaryLogs(emp)).filter(log => !log.rekapId && getDailySalaryLogTotal(log).overtime > 0);
                                const cashAdvanceRows = safeArray(getEmployeeCashAdvances(emp));
                                const marketingRows = safeArray(safeInvoicesForReport)
                                    .filter(isVisibleRecord)
                                    .filter(inv => normalizeText(inv?.marketing) === normalizeText(emp?.name) && !inv?.commissionRekapId)
                                    .map(inv => ({ ...inv, totalInvoice: safeNumber(getInvoiceTotals(inv).total), paidTotal: safeNumber(getInvoicePaidTotal(inv)), commissionTotal: safeNumber(getInvoiceCommissionTotal(inv)), status: getInvoicePaymentStatus(inv) }));
                                const totalDailySalary = dailySalaryRows.reduce((sum, log) => sum + safeNumber(getDailySalaryLogTotal(log).daily), 0);
                                const totalOvertimeSalary = overtimeRows.reduce((sum, log) => sum + safeNumber(getDailySalaryLogTotal(log).overtime), 0);
                                const totalMarketingCommission = marketingRows.reduce((sum, inv) => sum + safeNumber(inv.commissionTotal), 0);
                                const cashAdvanceSummary = getEmployeeCashAdvanceSummary(emp);
                                const totalIncome = safeNumber(totalUnsettledWage) + safeNumber(totalMarketingCommission) + safeNumber(totalDailySalary) + safeNumber(totalOvertimeSalary);
                                const projectedCashAdvanceDeduction = Math.min(safeNumber(cashAdvanceSummary.remaining), safeNumber(totalIncome));
                                const projectedNetSalary = Math.max(0, safeNumber(totalIncome) - safeNumber(projectedCashAdvanceDeduction));
                                
                                const empSelectedItems = unsettledItems.filter(item => selectedItemKeys.has(`${item.orderId}-${item.stage}`));
                                const empSelectedTotal = empSelectedItems.reduce((sum, item) => sum + item.qty, 0);
                                const empSelectedWage = empSelectedItems.reduce((sum, item) => sum + (parseInt(item.wageTotal) || 0), 0);

                                return (
                                    <div key={emp.id} className="bg-white border border-gray-200 rounded-xl overflow-hidden shadow-sm hover:shadow-md transition-shadow">
                                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center bg-blue-50 p-4 border-b border-blue-100">
                                            <div>
                                                <h3 className="font-bold text-lg text-blue-900">{emp.name}</h3>
                                                <span className="text-xs font-semibold bg-blue-200 text-blue-800 px-3 py-1 rounded-full">{emp.division}</span>
                                            </div>
                                            <button onClick={() => setExpandedInputIds(prev => ({ ...prev, [emp.id]: !prev[emp.id] }))} className="mt-2 md:mt-0 text-xs font-bold px-3 py-1.5 rounded-lg border border-blue-300 bg-white text-blue-700 hover:bg-blue-100 transition-colors">
                                                {expandedInputIds[emp.id] ? '▲ Sembunyikan Rincian' : '▼ Tampilkan Rincian'}
                                            </button>
                                        </div>

                                        <div className="p-4 space-y-4">
                                            <div className="grid grid-cols-2 md:grid-cols-7 gap-3">
                                                <div className="bg-green-50 border border-green-100 rounded-lg p-3"><div className="text-[11px] font-black text-green-700 uppercase">Total Produksi</div><div className="text-sm font-black text-green-900 mt-1">{formatRupiah(totalUnsettledWage)}</div></div>
                                                <div className="bg-purple-50 border border-purple-100 rounded-lg p-3"><div className="text-[11px] font-black text-purple-700 uppercase">Total Marketing</div><div className="text-sm font-black text-purple-900 mt-1">{formatRupiah(totalMarketingCommission)}</div></div>
                                                <div className="bg-indigo-50 border border-indigo-100 rounded-lg p-3"><div className="text-[11px] font-black text-indigo-700 uppercase">Total Harian</div><div className="text-sm font-black text-indigo-900 mt-1">{formatRupiah(totalDailySalary)}</div></div>
                                                <div className="bg-sky-50 border border-sky-100 rounded-lg p-3"><div className="text-[11px] font-black text-sky-700 uppercase">Total Lembur</div><div className="text-sm font-black text-sky-900 mt-1">{formatRupiah(totalOvertimeSalary)}</div></div>
                                                <div className="bg-slate-50 border border-slate-200 rounded-lg p-3"><div className="text-[11px] font-black text-slate-600 uppercase">Pendapatan</div><div className="text-sm font-black text-slate-900 mt-1">{formatRupiah(totalIncome)}</div></div>
                                                <div className="bg-orange-50 border border-orange-100 rounded-lg p-3"><div className="text-[11px] font-black text-orange-700 uppercase">Kasbon</div><div className="text-sm font-black text-orange-900 mt-1">{formatRupiah(cashAdvanceSummary.remaining)}</div></div>
                                                <div className="bg-blue-50 border border-blue-100 rounded-lg p-3"><div className="text-[11px] font-black text-blue-700 uppercase">Bersih</div><div className="text-sm font-black text-blue-900 mt-1">{formatRupiah(projectedNetSalary)}</div></div>
                                            </div>
