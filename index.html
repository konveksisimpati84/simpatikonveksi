                                <div><label className="block text-sm mb-1">Slogan</label><input type="text" name="companySubtitle" className="w-full p-2 border rounded" value={localTemplates.companySubtitle || ''} onChange={handleChange} required /></div>
                                <div className="md:col-span-2"><label className="block text-sm mb-1">Kontak/Alamat</label><textarea name="companyContact" className="w-full p-2 border rounded" value={localTemplates.companyContact || ''} onChange={handleChange} required></textarea></div>
                            </div>
                        </Card>
                        <Card>
                            <h3 className="font-bold border-b pb-2 mb-4">Surat Jalan</h3>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div className="md:col-span-2"><label className="block text-sm mb-1">Catatan Bawah</label><input type="text" name="suratJalanNote" className="w-full p-2 border rounded" value={localTemplates.suratJalanNote || ''} onChange={handleChange} /></div>
                                <div><label className="block text-sm mb-1">TTD Kiri</label><input type="text" name="sjSignatureLeft" className="w-full p-2 border rounded" value={localTemplates.sjSignatureLeft || ''} onChange={handleChange} /></div>
                                <div><label className="block text-sm mb-1">TTD Kanan</label><input type="text" name="sjSignatureRight" className="w-full p-2 border rounded" value={localTemplates.sjSignatureRight || ''} onChange={handleChange} /></div>
                            </div>
                        </Card>
                        <Card>
                            <h3 className="font-bold border-b pb-2 mb-4">Laporan Kinerja</h3>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div><label className="block text-sm mb-1">TTD Kiri</label><input type="text" name="laporanSignatureLeft" className="w-full p-2 border rounded" value={localTemplates.laporanSignatureLeft || ''} onChange={handleChange} required /></div>
                                <div><label className="block text-sm mb-1">TTD Kanan</label><input type="text" name="laporanSignatureRight" className="w-full p-2 border rounded" value={localTemplates.laporanSignatureRight || ''} onChange={handleChange} required /></div>
                            </div>
                        </Card>
                        <Card>
                            <h3 className="font-bold border-b pb-2 mb-4">Lembar Kerja Produksi (SPK)</h3>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div className="md:col-span-2"><label className="block text-sm mb-1">Catatan Bawah (Opsional)</label><input type="text" name="spkNote" className="w-full p-2 border rounded" value={localTemplates.spkNote || ''} onChange={handleChange} /></div>
                                <div className="md:col-span-2"><label className="block text-sm mb-1">Nama Direktur</label><input type="text" name="spkDirectorName" className="w-full p-2 border rounded" value={localTemplates.spkDirectorName || ''} onChange={handleChange} placeholder="Masukkan nama direktur" /></div>
                            </div>
                        </Card>
                        <button type="submit" className="bg-blue-600 text-white px-8 py-3 rounded-lg font-bold float-right">Simpan Pengaturan</button>
                    </form>
                </div>
            );
        };

        const MasterAkunView = ({ accounts, setAccounts, employees, showToast }) => {
            const [showForm, setShowForm] = useState(false);
            const [newAcc, setNewAcc] = useState({ username: '', password: '', name: '', role: 'Mandor', linkedEmpId: '', menuAccess: getDefaultMenuAccess('Mandor') });
            
            const [editAcc, setEditAcc] = useState(null);
            const [deleteConfirmId, setDeleteConfirmId] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');
            
            const safeAccounts = (accounts || []).filter(isVisibleRecord);
            const safeEmployees = (employees || []).filter(isVisibleRecord);
            const activeEmployees = safeEmployees.filter(e => String(e.status || '').trim().toLowerCase() !== 'nonaktif');
            const findEmployeeById = (empId) => safeEmployees.find(e => String(e.id) === String(empId));
            const filteredAccounts = safeAccounts.filter(acc => {
                const linkedEmp = acc.role === 'Karyawan' ? findEmployeeById(acc.linkedEmpId) : null;
                return matchesSearch([acc.username, acc.name, acc.role, linkedEmp?.name, linkedEmp?.division], searchTerm);
            });
            const toggleMenuAccess = (target, setTarget, menuId) => {
                if (target.role === 'Admin') return;
                const current = Array.isArray(target.menuAccess) ? target.menuAccess : getDefaultMenuAccess(target.role);
                const nextAccess = current.includes(menuId) ? current.filter(id => id !== menuId) : [...current, menuId];
                setTarget({ ...target, menuAccess: nextAccess });
            };
            const handleRoleChange = (target, setTarget, role) => {
                setTarget({ ...target, role, linkedEmpId: '', menuAccess: getDefaultMenuAccess(role) });
            };
            const renderMenuAccessControls = (target, setTarget) => {
                const currentAccess = getAccountMenuAccess(target);
                const isAdminRole = target.role === 'Admin';
                return (
                    <div className="md:col-span-2 bg-white/80 border border-blue-100 rounded-lg p-3">
                        <div className="flex justify-between items-center mb-2">
                            <label className="block text-sm font-bold text-blue-900">Hak Akses Menu</label>
                            {isAdminRole && <span className="text-[11px] font-bold text-green-700 bg-green-50 border border-green-100 px-2 py-1 rounded">Admin akses penuh</span>}
                        </div>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                            {menuAccessOptions.map(menu => (
                                <label key={menu.id} className={`flex items-center gap-2 text-xs border rounded p-2 ${isAdminRole ? 'bg-gray-50 text-gray-500' : 'bg-white hover:bg-blue-50 cursor-pointer'}`}>
                                    <input type="checkbox" disabled={isAdminRole} checked={currentAccess.includes(menu.id)} onChange={() => toggleMenuAccess(target, setTarget, menu.id)} />
                                    <span className="font-semibold">{menu.label}</span>
                                </label>
                            ))}
                        </div>
                    </div>
                );
            };

            const handleAdd = (e) => {
                e.preventDefault();
                if(safeAccounts.some(a => String(a.username).toLowerCase() === String(newAcc.username).toLowerCase())) { 
                    showToast("Username terdaftar!", "error"); return; 
                }
                if (newAcc.role === 'Karyawan' && !newAcc.linkedEmpId) {
                    showToast("Pilih Karyawan yang akan dihubungkan dengan akun ini!", "error"); return;
                }
                
                const now = new Date().toISOString();
                setAccounts(prev => [...(prev||[]), { ...newAcc, id: Date.now(), _syncUpdatedAt: now }]);
                setShowForm(false);
                setNewAcc({ username: '', password: '', name: '', role: 'Mandor', linkedEmpId: '', menuAccess: getDefaultMenuAccess('Mandor') });
                showToast("Akun ditambahkan!", "success");
            };

            const handleSaveEdit = (e) => {
                e.preventDefault();
                if(safeAccounts.some(a => String(a.username).toLowerCase() === String(editAcc.username).toLowerCase() && String(a.id) !== String(editAcc.id))) { 
                    showToast("Username ini sudah dipakai oleh akun lain!", "error"); 
                    return; 
                }
                if (editAcc.role === 'Karyawan' && !editAcc.linkedEmpId) {
                    showToast("Pilih Karyawan yang akan dihubungkan dengan akun ini!", "error"); return;
                }
                const now = new Date().toISOString();
                setAccounts(prev => prev.map(acc => String(acc.id) === String(editAcc.id) ? { ...editAcc, _syncUpdatedAt: now } : acc));
                setEditAcc(null);
                showToast("Data Akun diperbarui!", "success");
            };

            const executeDeleteAccount = () => {
                if(deleteConfirmId !== null && deleteConfirmId !== undefined) {
                    const accToDelete = safeAccounts.find(a => String(a.id) === String(deleteConfirmId));
                    if (accToDelete?.username === 'admin') { showToast("Akun admin utama tidak bisa dihapus!", "error"); setDeleteConfirmId(null); return; }
                    const now = new Date().toISOString();
                    setAccounts(prev => (prev || []).map(a => String(a.id) === String(deleteConfirmId) ? { ...a, isDeleted: true, deletedAt: now, _syncUpdatedAt: now } : a));
                    setDeleteConfirmId(null);
                    showToast("Akun dihapus.", "success");
                }
            };

            return (
                <div className="space-y-6">
                    <div className="flex justify-between items-center">
                        <h2 className="text-2xl font-bold text-gray-800">Master Akun Login</h2>
                        <button onClick={() => setShowForm(!showForm)} className="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium"><IconPlusCircle /> Tambah Akun</button>
                    </div>

                    {showForm && (
                        <Card className="bg-blue-50 border-blue-100">
                            <h3 className="font-bold text-blue-900 mb-3 border-b pb-2">Tambah Akun Baru</h3>
                            <form onSubmit={handleAdd} className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div><label className="block text-sm mb-1 font-semibold">Nama Pemilik</label><input required type="text" className="w-full p-2 border rounded" value={newAcc.name} onChange={e => setNewAcc({...newAcc, name: e.target.value})} /></div>
                                <div>
                                    <label className="block text-sm mb-1 font-semibold">Role</label>
                                    <select className="w-full p-2 border rounded" value={newAcc.role} onChange={e => handleRoleChange(newAcc, setNewAcc, e.target.value)}>
                                        <option>Admin</option>
                                        <option>Mandor</option>
                                        <option>Kasir</option>
                                        <option>Karyawan</option>
                                    </select>
                                </div>
                                {newAcc.role === 'Karyawan' && (
                                    <div className="md:col-span-2">
                                        <label className="block text-sm mb-1 font-semibold text-blue-800">Pilih Data Karyawan (Sesuai dengan Menu Data Karyawan)</label>
                                        <select className="w-full p-2 border rounded border-blue-400 bg-blue-50" value={newAcc.linkedEmpId || ''} onChange={e => setNewAcc({...newAcc, linkedEmpId: parseInt(e.target.value) || ''})} required>
                                            <option value="">-- Pilih Pekerja --</option>
                                            {activeEmployees.map(emp => <option key={emp.id} value={emp.id}>{emp.name} (Divisi: {emp.division})</option>)}
                                        </select>
                                    </div>
                                )}
                                <div><label className="block text-sm mb-1 font-semibold">Username Login</label><input required type="text" className="w-full p-2 border rounded" value={newAcc.username} onChange={e => setNewAcc({...newAcc, username: e.target.value})} /></div>
                                <div><label className="block text-sm mb-1 font-semibold">Password</label><input required type="password" className="w-full p-2 border rounded" value={newAcc.password} onChange={e => setNewAcc({...newAcc, password: e.target.value})} /></div>
                                {renderMenuAccessControls(newAcc, setNewAcc)}
                                <div className="md:col-span-2 flex justify-end mt-2"><button type="submit" className="bg-blue-600 text-white px-6 py-2 rounded">Simpan Akun</button></div>
                            </form>
                        </Card>
                    )}

                    <Card>
                        <div className="mb-4 max-w-md">
                            <SearchField value={searchTerm} onChange={setSearchTerm} placeholder="Cari username, nama, role, karyawan..." />
                        </div>
                        <table className="w-full text-left border-collapse">
                            <thead><tr className="bg-gray-50 border-b"><th className="p-3 text-sm">Username</th><th className="p-3 text-sm">Nama</th><th className="p-3 text-sm">Role</th><th className="p-3 text-sm text-center">Aksi</th></tr></thead>
                            <tbody>
                                {filteredAccounts.map(acc => {
                                    const linkedEmp = acc.role === 'Karyawan' ? findEmployeeById(acc.linkedEmpId) : null;
                                    return (
                                        <tr key={acc.id} className="border-b hover:bg-gray-50 transition-colors">
                                            <td className="p-3 text-sm font-bold">{acc.username}</td>
                                            <td className="p-3 text-sm">
                                                {acc.name}
                                                {linkedEmp && <div className="text-xs text-blue-600 font-medium">Terhubung ke: {linkedEmp.name} ({linkedEmp.division})</div>}
                                            </td>
                                            <td className="p-3 text-sm"><span className={`px-2 py-1 text-xs font-semibold rounded ${acc.role === 'Karyawan' ? 'bg-blue-100 text-blue-800' : 'bg-gray-200 text-gray-700'}`}>{acc.role}</span></td>
                                            <td className="p-3 text-center flex justify-center space-x-2">
                                                <button onClick={() => setEditAcc(acc)} className="text-blue-500 hover:text-blue-700 bg-blue-50 p-1.5 rounded" title="Edit Akun"><IconEdit /></button>
                                                {acc.username !== 'admin' ? (
                                                    <button onClick={() => setDeleteConfirmId(acc.id)} className="text-red-500 hover:text-red-700 bg-red-50 p-1.5 rounded" title="Hapus Akun"><IconTrash /></button>
                                                ) : <span className="text-xs text-gray-400 italic flex items-center">Protected</span>}
                                            </td>
                                        </tr>
                                    )
                                })}
                                {filteredAccounts.length === 0 && (
                                    <tr><td colSpan="4" className="p-6 text-center text-gray-500 italic">Tidak ada akun yang cocok dengan pencarian.</td></tr>
                                )}
                            </tbody>
                        </table>
                    </Card>

                    {editAcc && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-[100] p-4">
                            <div className="bg-white p-6 rounded-xl w-full max-w-md shadow-xl">
                                <h3 className="font-bold text-lg mb-4 border-b pb-2">Edit Master Akun</h3>
                                <form onSubmit={handleSaveEdit} className="space-y-4">
                                    <div><label className="block text-sm mb-1 font-semibold">Nama Pemilik</label><input required type="text" className="w-full p-2 border rounded focus:ring-blue-500" value={editAcc.name} onChange={e => setEditAcc({...editAcc, name: e.target.value})} /></div>
                                    <div>
                                        <label className="block text-sm mb-1 font-semibold">Role / Hak Akses</label>
                                        <select disabled={editAcc.username === 'admin'} className="w-full p-2 border rounded focus:ring-blue-500 disabled:bg-gray-100" value={editAcc.role} onChange={e => handleRoleChange(editAcc, setEditAcc, e.target.value)}>
                                            <option>Admin</option>
                                            <option>Mandor</option>
                                            <option>Kasir</option>
                                            <option>Karyawan</option>
                                        </select>
                                    </div>
                                    {editAcc.role === 'Karyawan' && (
                                        <div>
                                            <label className="block text-sm mb-1 font-semibold text-blue-800">Hubungkan ke Pekerja</label>
                                            <select className="w-full p-2 border rounded border-blue-400 bg-blue-50" value={editAcc.linkedEmpId || ''} onChange={e => setEditAcc({...editAcc, linkedEmpId: parseInt(e.target.value) || ''})} required>
                                                <option value="">-- Pilih Pekerja --</option>
                                                {activeEmployees.map(emp => <option key={emp.id} value={emp.id}>{emp.name} (Divisi: {emp.division})</option>)}
                                            </select>
                                        </div>
                                    )}
                                    <div>
                                        <label className="block text-sm mb-1 font-semibold">Username Login</label>
                                        <input required disabled={editAcc.username === 'admin'} type="text" className="w-full p-2 border rounded focus:ring-blue-500 disabled:bg-gray-100" value={editAcc.username} onChange={e => setEditAcc({...editAcc, username: e.target.value})} />
                                    </div>
                                    <div><label className="block text-sm mb-1 font-semibold">Password Baru</label><input required type="text" className="w-full p-2 border rounded focus:ring-blue-500" value={editAcc.password} onChange={e => setEditAcc({...editAcc, password: e.target.value})} /></div>
                                    {renderMenuAccessControls(editAcc, setEditAcc)}
                                    {editAcc.username === 'admin' && <p className="text-xs text-red-500 italic">*Username & Role akun utama (admin) tidak dapat diubah.</p>}
                                    <div className="flex justify-end space-x-3 pt-4 border-t">
                                        <button type="button" onClick={() => setEditAcc(null)} className="px-4 py-2 bg-gray-200 rounded font-medium">Batal</button>
                                        <button type="submit" className="px-4 py-2 bg-blue-600 text-white rounded font-medium">Simpan Perubahan</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {deleteConfirmId && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-[100]">
                            <div className="bg-white p-6 rounded-xl w-80">
                                <h3 className="font-bold mb-2">Hapus Akun?</h3>
                                <div className="flex justify-end space-x-2">
                                    <button onClick={() => setDeleteConfirmId(null)} className="px-4 py-2 bg-gray-200 rounded">Batal</button>
                                    <button onClick={executeDeleteAccount} className="px-4 py-2 bg-red-600 text-white rounded">Hapus</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            const [isReady, setIsReady] = useState(false);
            const [authUser, setAuthUser] = useState(null);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [isTVMode, setIsTVMode] = useState(false);
            
            const [accounts, setAccounts] = useState([]);
            const [orders, setOrders] = useState([]);
            const [employees, setEmployees] = useState([]);
            const [rekapKinerja, setRekapKinerja] = useState([]); 
            const [riwayatPengiriman, setRiwayatPengiriman] = useState([]);
            const [expenses, setExpenses] = useState([]);
            const [invoices, setInvoices] = useState([]);
            const [clients, setClients] = useState([]);
            const [templates, setTemplates] = useState({});
            const [customerTrackingClient, setCustomerTrackingClient] = useState(getCustomerTrackingClientFromHash());
            const [rekapGajiShareId, setRekapGajiShareId] = useState(getRekapGajiIdFromHash());
            
            const [toast, setToast] = useState(null);
            const toastTimerRef = useRef(null);
            const AUTH_SESSION_TIMEOUT_MS = 30 * 60 * 1000;

            const showToast = (message, type = 'success') => {
                if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
                setToast({ message, type });
                toastTimerRef.current = setTimeout(() => setToast(null), 3500);
            };

            const saveAuthSession = (user, lastActiveAt = new Date().toISOString()) => {
                if (!user) return;
                localStorage.setItem('simpati_auth_session', JSON.stringify({
                    user,
                    lastActiveAt
                }));
            };

            const clearAuthSession = () => {
                localStorage.removeItem('simpati_auth_session');
            };

            const getAuthSessionLastActiveAt = () => {
                try {
                    const parsed = JSON.parse(localStorage.getItem('simpati_auth_session') || '{}');
                    return parsed?.lastActiveAt || '';
                } catch (error) {
                    return '';
                }
            };

            const readValidAuthSession = () => {
                const savedSession = localStorage.getItem('simpati_auth_session');
                if (!savedSession) return null;
                try {
                    const parsed = JSON.parse(savedSession);
                    const sessionUser = parsed?.user || null;
                    const lastActiveAt = parsed?.lastActiveAt;
                    const lastActiveTime = new Date(lastActiveAt || 0).getTime();
                    if (!sessionUser || !lastActiveTime || Date.now() - lastActiveTime > AUTH_SESSION_TIMEOUT_MS) {
                        clearAuthSession();
                        return null;
                    }
                    return sessionUser;
                } catch (error) {
                    clearAuthSession();
                    return null;
                }
            };

            const handleLogout = () => {
                setAuthUser(null);
                clearAuthSession();
                setActiveTab('dashboard');
            };

            useEffect(() => {
                const syncPublicHash = () => {
                    setCustomerTrackingClient(getCustomerTrackingClientFromHash());
                    setRekapGajiShareId(getRekapGajiIdFromHash());
                };
                syncPublicHash();
                window.addEventListener('hashchange', syncPublicHash);
                return () => window.removeEventListener('hashchange', syncPublicHash);
            }, []);

            // --- Fitur Auto Logout (30 Menit Tanpa Aktivitas) ---
            useEffect(() => {
                let timeoutId;
                let lastSessionTouch = 0;

                const autoLogout = () => {
                    handleLogout();
                    showToast("Sesi habis karena tidak ada aktivitas selama 30 menit. Silakan login kembali.", "error");
                };

                const resetTimer = () => {
                    clearTimeout(timeoutId);
                    const now = Date.now();
                    if (authUser && now - lastSessionTouch > 60000) {
                        saveAuthSession(authUser);
                        lastSessionTouch = now;
                    }
                    // Setel ulang timer ke 30 menit (30 menit * 60 detik * 1000 milidetik)
                    timeoutId = setTimeout(autoLogout, AUTH_SESSION_TIMEOUT_MS); 
                };

                if (authUser) {
                    // Mulai perhitungan timer saat pengguna berhasil login
                    resetTimer();
                    
                    // Daftar aktivitas yang dianggap sebagai "Pengguna Masih Aktif"
                    const events = ['mousemove', 'mousedown', 'keydown', 'touchstart', 'scroll'];
                    
                    // Pasang deteksi aktivitas ke seluruh layar aplikasi
                    events.forEach(event => window.addEventListener(event, resetTimer, true));

                    // Bersihkan memori dan pendeteksi jika pengguna logout manual
                    return () => {
                        clearTimeout(timeoutId);
                        events.forEach(event => window.removeEventListener(event, resetTimer, true));
                    };
                }
            }, [authUser]);

            const patchOrders = (ordersList) => {
                if (!Array.isArray(ordersList)) return [];
                const seenIds = new Set();
                return ordersList.filter(o => o && typeof o === 'object').map((o, index) => {
                    const updatedO = { ...o };
                    if (!updatedO.id) {
                        const fallbackDate = String(updatedO.date || updatedO.createdAt || new Date().toISOString()).replace(/[^0-9]/g, '').slice(0, 14) || Date.now();
                        updatedO.id = `ORD-${fallbackDate}-${index + 1}`;
                    }
                    
                    if (seenIds.has(updatedO.id)) {
                        const fallbackDate = String(updatedO.date || updatedO.createdAt || new Date().toISOString()).replace(/[^0-9]/g, '').slice(0, 14) || Date.now();
                        updatedO.id = `${updatedO.id}-${fallbackDate}-${index + 1}`;
                    }
                    if (updatedO.id) seenIds.add(updatedO.id);

                    if (!updatedO.sizes || typeof updatedO.sizes !== 'object') updatedO.sizes = {};
                    if (!updatedO.progress || typeof updatedO.progress !== 'object') updatedO.progress = {};
                    if (!updatedO.shipped || typeof updatedO.shipped !== 'object') updatedO.shipped = {};
                    // Menyiapkan field bahan (materials) agar order lama tidak error
                    if (!updatedO.materials || !Array.isArray(updatedO.materials)) updatedO.materials = [];
                    if (!updatedO.materialStatus) updatedO.materialStatus = 'Belum';
                    if (!updatedO.materialPrintCount) updatedO.materialPrintCount = 0;
                    if (!updatedO.materialPayments || typeof updatedO.materialPayments !== 'object') updatedO.materialPayments = {};
                    if (!Array.isArray(updatedO.purchaseReceipts)) updatedO.purchaseReceipts = [];
                    if (!Array.isArray(updatedO.vendorPayments)) updatedO.vendorPayments = [];
                    if (!Array.isArray(updatedO.purchaseHistory)) updatedO.purchaseHistory = [];
                    if (!updatedO.materialPurchasedVendors || typeof updatedO.materialPurchasedVendors !== 'object') updatedO.materialPurchasedVendors = {};
                    if (!updatedO.materialPurchasedBatches || typeof updatedO.materialPurchasedBatches !== 'object') updatedO.materialPurchasedBatches = {};
                    updatedO.processFlow = { ...getDefaultOrderProcessFlow(), ...(updatedO.processFlow || {}) };
                    updatedO.productionPrices = { ...getDefaultProductionPrices(), ...(updatedO.productionPrices || {}) };
                    if (updatedO.processFlow.materials === false && updatedO.materialStatus === 'Belum') updatedO.materialStatus = 'Tidak Perlu';
                    if (updatedO.materialStatus === 'Selesai' && Object.keys(updatedO.materialPurchasedVendors || {}).length === 0) {
                        getOrderMaterialVendors(updatedO).forEach(vendor => { updatedO.materialPurchasedVendors[vendor] = true; });
                    }
                    if (updatedO.materialStatus === 'Selesai' && Object.keys(updatedO.materialPurchasedBatches || {}).length === 0) {
                        getOrderMaterialBatchKeys(updatedO).forEach(batchKey => { updatedO.materialPurchasedBatches[batchKey] = true; });
                    }
                    
                    const stagesOrder = ['cutting', 'sablon', 'jahit', 'kancing', 'finishing'];
                    stagesOrder.forEach(stage => {
                        if (!updatedO.progress[stage] || typeof updatedO.progress[stage] !== 'object') {
                            updatedO.progress[stage] = { status: 'Belum', employees: [], workLogs: [] };
                        }
                        if (!Array.isArray(updatedO.progress[stage].employees)) updatedO.progress[stage].employees = [];
                        if (!Array.isArray(updatedO.progress[stage].workLogs)) updatedO.progress[stage].workLogs = [];
                    });
                    return updatedO;
                });
            };

            const PURCHASE_RESET_VERSION = '2026-06-06-purchase-clean-start-v1';

            const shouldResetPurchaseData = () => {
                return localStorage.getItem('simpati_purchase_reset_version') !== PURCHASE_RESET_VERSION;
            };

            const resetPurchaseDataForCleanStart = (ordersList) => {
                const now = new Date().toISOString();
                return patchOrders(ordersList).map(order => {
                    if (!order || order.isDeleted || order.isArchived || order.status === 'Terkirim') return order;
                    const materialStatus = order?.processFlow?.materials === false ? 'Tidak Perlu' : 'Belum';
                    return {
                        ...order,
                        materials: [],
                        materialPayments: {},
                        purchaseReceipts: [],
                        vendorPayments: [],
                        purchaseHistory: [],
                        materialPurchasedVendors: {},
                        materialPurchasedBatches: {},
                        materialBatchDate: null,
                        materialPrintedAt: null,
                        materialPurchasedAt: null,
                        materialLastActionAt: now,
                        materialLastAction: 'Reset pembelian bahan lama',
                        materialPrintCount: 0,
                        purchaseNotes: '',
                        materialStatus,
                        status: order.status === 'Pembelian Bahan' ? 'Pending' : order.status,
                        _syncUpdatedAt: now
                    };
                });
            };

            const loadLocalData = (key, initial) => {
                const saved = localStorage.getItem(key);
                if (saved) {
                    try { 
                        const parsed = JSON.parse(saved); 
                        return parsed != null ? parsed : initial;
                    } catch(e) { return initial; }
                }
                return initial;
            };

            const syncSavedAuthSession = (accountList) => {
                const savedUser = readValidAuthSession();
                if (!savedUser) {
                    setAuthUser(null);
                    return;
                }

                const latestUser = (accountList || []).find(acc => (
                    String(acc.id) === String(savedUser.id) ||
                    String(acc.username || '').toLowerCase() === String(savedUser.username || '').toLowerCase()
                ));

                if (latestUser) {
                    setAuthUser(latestUser);
                    saveAuthSession(latestUser, getAuthSessionLastActiveAt() || new Date().toISOString());
                } else {
                    setAuthUser(null);
                    clearAuthSession();
                }
            };

            const fetchStoreData = async (key, defaultVal) => {
                if (!supabaseClient) return loadLocalData(`simpati_${key}_sync`, defaultVal);

                try {
                    const { data, error } = await supabaseClient.from('app_data').select('data').eq('id', key).single();
                    if (error) {
                        if (error.code === 'PGRST116') return loadLocalData(`simpati_${key}_sync`, defaultVal);
                        if (error.code === '42P01') {
                             showToast(`PERINGATAN: TABEL BELUM DIBUAT! Pastikan tabel 'app_data' ada di Supabase.`, 'error');
                        }
                        throw error;
                    }
                    return data?.data || loadLocalData(`simpati_${key}_sync`, defaultVal);
                } catch (err) {
                    console.error(`Error fetching ${key}:`, err);
                    return loadLocalData(`simpati_${key}_sync`, defaultVal);
                }
            };

            const getOrderSyncTime = (order) => {
                const candidates = [
                    order?._syncUpdatedAt,
                    order?.deletedAt,
                    order?.materialLastActionAt,
                    order?.materialPurchasedAt,
                    order?.materialPrintedAt
                ];
                let latest = 0;
                for (const value of candidates) {
                    const time = new Date(value || 0).getTime();
                    if (!isNaN(time) && time > latest) latest = time;
                }
                return latest;
            };

            const orderSignature = (order) => {
                if (!order || typeof order !== 'object') return '';
                const clone = { ...order };
                delete clone._syncUpdatedAt;
                return JSON.stringify(clone);
            };

            const stampChangedOrders = (prevOrders, nextOrders) => {
                const now = new Date().toISOString();
                const prevById = new Map((prevOrders || []).map(order => [String(order?.id), order]));
                return (Array.isArray(nextOrders) ? nextOrders : []).map(order => {
                    if (!order || typeof order !== 'object') return order;
                    const prevOrder = prevById.get(String(order.id));
                    if (!prevOrder || orderSignature(prevOrder) !== orderSignature(order)) {
                        return { ...order, _syncUpdatedAt: now };
                    }
                    return order;
                });
            };

            const getRecordSyncTime = (record) => {
                const candidates = [record?._syncUpdatedAt, record?.deletedAt, record?.updatedAt, record?.dateProcessed, record?.date];
                let latest = 0;
                for (const value of candidates) {
                    const time = new Date(value || 0).getTime();
                    if (!isNaN(time) && time > latest) latest = time;
                }
                const numericId = Number(record?.id);
                return Math.max(latest, Number.isFinite(numericId) && numericId > 1000000000000 ? numericId : 0);
            };

            const recordSignature = (record) => {
                if (!record || typeof record !== 'object') return '';
                const clone = { ...record };
                delete clone._syncUpdatedAt;
                return JSON.stringify(clone);
            };

            const stampChangedRecords = (prevRecords, nextRecords) => {
                const now = new Date().toISOString();
                const prevById = new Map((prevRecords || []).map(record => [String(record?.id), record]));
                return (Array.isArray(nextRecords) ? nextRecords : []).map(record => {
                    if (!record || typeof record !== 'object') return record;
                    const prevRecord = prevById.get(String(record.id));
                    if (!prevRecord || recordSignature(prevRecord) !== recordSignature(record)) {
                        return { ...record, _syncUpdatedAt: now };
                    }
                    return record;
                });
            };

            const isLegacySeedEmployee = (emp) => {
                const id = String(emp?.id || '');
                const name = String(emp?.name || '').trim().toLowerCase();
                const division = String(emp?.division || '').trim().toLowerCase();
                return (id === '1' && name === 'budi santoso' && division === 'cutting') ||
                    (id === '2' && name === 'siti aminah' && division === 'jahit');
            };

            const sanitizeEmployees = (employeeList = []) => {
                const now = new Date().toISOString();
                return (Array.isArray(employeeList) ? employeeList : []).map(emp => {
                    if (!emp || typeof emp !== 'object') return emp;
                    const safeEmp = {
                        ...emp,
                        salaryType: emp.salaryType || 'Produksi',
                        salaryTypes: getEmployeeSalaryTypes(emp),
                        dailySalary: safeMoney(emp.dailySalary),
                        dailySalaryLogs: Array.isArray(emp.dailySalaryLogs) ? emp.dailySalaryLogs.map(item => ({
                            ...item,
                            workDays: safeMoney(item?.workDays),
                            dailySalary: safeMoney(item?.dailySalary),
                            overtimeCount: safeMoney(item?.overtimeCount),
                            overtimeRate: safeMoney(item?.overtimeRate)
                        })) : [],
                        cashAdvances: Array.isArray(emp.cashAdvances) ? emp.cashAdvances.map(item => ({
                            ...item,
                            amount: safeMoney(item?.amount || item?.nominal),
                            deductedAmount: safeMoney(item?.deductedAmount),
                            status: normalizeCashAdvanceStatus(item)
                        })) : []
                    };
                    if (isLegacySeedEmployee(emp) && !emp.isDeleted) {
                        return { ...safeEmp, isDeleted: true, deletedAt: emp.deletedAt || now, _syncUpdatedAt: emp._syncUpdatedAt || emp.deletedAt || now };
                    }
                    return safeEmp;
                });
            };

            const trimActivityLogs = (logs = []) => {
                return (Array.isArray(logs) ? logs : [])
                    .filter(log => log && typeof log === 'object')
                    .sort((a, b) => new Date(b.createdAt || b._syncUpdatedAt || 0) - new Date(a.createdAt || a._syncUpdatedAt || 0))
                    .slice(0, 1000);
            };

            const mergeRecordLists = (localRecords = [], remoteRecords = []) => {
                const mergedById = new Map();
                const mergeRecord = (localRecord, remoteRecord) => {
                    if (!localRecord) return remoteRecord;
                    if (!remoteRecord) return localRecord;
                    const localTime = getRecordSyncTime(localRecord);
                    const remoteTime = getRecordSyncTime(remoteRecord);
                    if (localRecord.isDeleted || remoteRecord.isDeleted) {
                        const deletedRecord = localRecord.isDeleted && remoteRecord.isDeleted
                            ? (localTime >= remoteTime ? localRecord : remoteRecord)
                            : (localRecord.isDeleted ? localRecord : remoteRecord);
                        return {
                            ...(localTime >= remoteTime ? remoteRecord : localRecord),
                            ...deletedRecord,
                            isDeleted: true,
                            deletedAt: deletedRecord.deletedAt || deletedRecord._syncUpdatedAt || new Date().toISOString()
                        };
                    }
                    return localTime >= remoteTime ? { ...remoteRecord, ...localRecord } : { ...localRecord, ...remoteRecord };
                };
                (remoteRecords || []).forEach(record => { if (record?.id) mergedById.set(String(record.id), record); });
                (localRecords || []).forEach(record => {
                    if (!record?.id) return;
                    const key = String(record.id);
                    mergedById.set(key, mergeRecord(record, mergedById.get(key)));
                });
                return [...mergedById.values()];
            };

            const getLogTime = (log, fields = []) => {
                const candidates = [
                    ...fields.map(field => log?.[field]),
                    log?._syncUpdatedAt,
                    log?.deletedAt,
                    log?.isReportedChangedAt,
                    log?.checkAfterChangedAt,
                    log?.submittedAt,
                    log?.submittedQtyUpdatedAt,
                    log?.checkBeforeChangedAt,
                    log?.takenAt,
                    log?.qtyUpdatedAt,
                    log?.createdAt
                ];
                let latest = 0;
                for (const value of candidates) {
                    const time = new Date(value || 0).getTime();
                    if (!isNaN(time) && time > latest) latest = time;
                }
                return latest;
            };

            const getLogFieldTime = (log, fields = []) => {
                for (const field of fields) {
                    const time = new Date(log?.[field] || 0).getTime();
                    if (!isNaN(time) && time > 0) return time;
                }
                return 0;
            };

            const mergeLogRecords = (localLog, remoteLog, preferLocal = true) => {
                if (!localLog) return remoteLog;
                if (!remoteLog) return localLog;

                if (localLog.isDeleted || remoteLog.isDeleted) {
                    const localDeleteTime = getLogFieldTime(localLog, ['deletedAt', '_syncUpdatedAt']);
                    const remoteDeleteTime = getLogFieldTime(remoteLog, ['deletedAt', '_syncUpdatedAt']);
                    const deletedBase = localDeleteTime >= remoteDeleteTime ? localLog : remoteLog;
                    return {
                        ...(preferLocal ? remoteLog : localLog),
                        ...(preferLocal ? localLog : remoteLog),
                        ...deletedBase,
                        isDeleted: true,
                        deletedAt: deletedBase.deletedAt || new Date().toISOString(),
                        _syncUpdatedAt: deletedBase._syncUpdatedAt || deletedBase.deletedAt || new Date().toISOString()
                    };
                }

                const localTime = getLogTime(localLog);
                const remoteTime = getLogTime(remoteLog);
                const base = localTime > remoteTime || (localTime === remoteTime && preferLocal)
                    ? { ...remoteLog, ...localLog }
                    : { ...localLog, ...remoteLog };

                const qtyLocalTime = getLogFieldTime(localLog, ['qtyUpdatedAt']);
                const qtyRemoteTime = getLogFieldTime(remoteLog, ['qtyUpdatedAt']);
                if (qtyLocalTime > qtyRemoteTime || (qtyLocalTime === qtyRemoteTime && preferLocal)) {
                    base.qty = localLog.qty;
                    base.qtyUpdatedAt = localLog.qtyUpdatedAt || base.qtyUpdatedAt;
                } else if (qtyRemoteTime > 0) {
                    base.qty = remoteLog.qty;
                    base.qtyUpdatedAt = remoteLog.qtyUpdatedAt || base.qtyUpdatedAt;
                }

                const submittedQtyLocalTime = getLogFieldTime(localLog, ['submittedQtyUpdatedAt']);
                const submittedQtyRemoteTime = getLogFieldTime(remoteLog, ['submittedQtyUpdatedAt']);
                if (submittedQtyLocalTime > submittedQtyRemoteTime || (submittedQtyLocalTime === submittedQtyRemoteTime && preferLocal)) {
                    base.submittedQty = localLog.submittedQty;
                    base.submittedQtyUpdatedAt = localLog.submittedQtyUpdatedAt || base.submittedQtyUpdatedAt;
                } else if (submittedQtyRemoteTime > 0) {
                    base.submittedQty = remoteLog.submittedQty;
                    base.submittedQtyUpdatedAt = remoteLog.submittedQtyUpdatedAt || base.submittedQtyUpdatedAt;
                }

                const reportedLocalTime = getLogFieldTime(localLog, ['isReportedChangedAt']);
                const reportedRemoteTime = getLogFieldTime(remoteLog, ['isReportedChangedAt']);
                if (reportedLocalTime > reportedRemoteTime || (reportedLocalTime === reportedRemoteTime && preferLocal)) {
                    base.isReported = !!localLog.isReported;
                    base.isReportedChangedAt = localLog.isReportedChangedAt || base.isReportedChangedAt;
                } else if (reportedRemoteTime > 0) {
                    base.isReported = !!remoteLog.isReported;
                    base.isReportedChangedAt = remoteLog.isReportedChangedAt || base.isReportedChangedAt;
                }

                const beforeLocalTime = getLogFieldTime(localLog, ['checkBeforeChangedAt', 'takenAt']);
                const beforeRemoteTime = getLogFieldTime(remoteLog, ['checkBeforeChangedAt', 'takenAt']);
                const beforeSource = beforeLocalTime > beforeRemoteTime || (beforeLocalTime === beforeRemoteTime && preferLocal) ? localLog : remoteLog;
                if (beforeLocalTime > 0 || beforeRemoteTime > 0) {
                    base.checkBefore = !!beforeSource.checkBefore;
                    base.takenAt = beforeSource.checkBefore ? (beforeSource.takenAt || base.takenAt) : null;
                    base.checkBeforeChangedAt = beforeSource.checkBeforeChangedAt || beforeSource.takenAt || base.checkBeforeChangedAt;
                } else {
                    base.checkBefore = !!(localLog.checkBefore || remoteLog.checkBefore);
                    base.takenAt = localLog.takenAt || remoteLog.takenAt || base.takenAt;
                }

                const afterLocalTime = getLogFieldTime(localLog, ['checkAfterChangedAt', 'submittedAt']);
                const afterRemoteTime = getLogFieldTime(remoteLog, ['checkAfterChangedAt', 'submittedAt']);
                const afterSource = afterLocalTime > afterRemoteTime || (afterLocalTime === afterRemoteTime && preferLocal) ? localLog : remoteLog;
                if (afterLocalTime > 0 || afterRemoteTime > 0) {
                    base.checkAfter = !!afterSource.checkAfter;
                    base.submittedAt = afterSource.checkAfter ? (afterSource.submittedAt || base.submittedAt) : null;
                    base.checkAfterChangedAt = afterSource.checkAfterChangedAt || afterSource.submittedAt || base.checkAfterChangedAt;
                } else {
                    base.checkAfter = !!(localLog.checkAfter || remoteLog.checkAfter);
                    base.submittedAt = localLog.submittedAt || remoteLog.submittedAt || base.submittedAt;
                }

                if (!base.checkBefore) {
                    base.checkAfter = false;
                    base.takenAt = null;
                    base.submittedAt = null;
                    base.submittedQty = null;
                }
                if (!base.checkAfter) {
                    base.submittedAt = null;
                    base.submittedQty = null;
                } else if (base.submittedQty === undefined || base.submittedQty === null || base.submittedQty === '') {
                    base.submittedQty = getWorkLogSubmittedQty(base);
                }
                const latestLogTime = Math.max(localTime, remoteTime);
                if (latestLogTime > 0) base._syncUpdatedAt = new Date(latestLogTime).toISOString();
                return base;
            };

            const mergeWorkLogs = (localLogs = [], remoteLogs = [], preferLocal = true) => {
                const merged = new Map();
                const pushLogs = (logs) => {
                    (logs || []).forEach(log => {
                        if (!log) return;
                        const key = log.id || `${log.empId || ''}-${log.size || ''}-${log.qty || ''}-${merged.size}`;
                        const existing = merged.get(key);
                        merged.set(key, mergeLogRecords(log, existing, preferLocal));
                    });
                };

                pushLogs(remoteLogs);
                pushLogs(localLogs);
                return [...merged.values()];
            };

            const mergeOrderProgress = (localProgress = {}, remoteProgress = {}, preferLocal = true) => {
                const merged = {};
                const stageIds = [...new Set([...Object.keys(remoteProgress || {}), ...Object.keys(localProgress || {})])];
                const mergeTimeMap = (localMap = {}, remoteMap = {}) => {
                    const result = { ...(remoteMap || {}) };
                    Object.entries(localMap || {}).forEach(([key, value]) => {
                        const localTime = new Date(value || 0).getTime();
                        const remoteTime = new Date(result[key] || 0).getTime();
                        if (!result[key] || (Number.isFinite(localTime) && (!Number.isFinite(remoteTime) || localTime >= remoteTime))) result[key] = value;
                    });
                    return result;
                };
                stageIds.forEach(stageId => {
                    const localStage = localProgress?.[stageId] || {};
                    const remoteStage = remoteProgress?.[stageId] || {};
                    const base = preferLocal ? { ...remoteStage, ...localStage } : { ...localStage, ...remoteStage };
                    base.employeeLinks = mergeTimeMap(localStage.employeeLinks || {}, remoteStage.employeeLinks || {});
                    base.removedEmployees = mergeTimeMap(localStage.removedEmployees || {}, remoteStage.removedEmployees || {});
                    const employeeIds = [...new Set([...(remoteStage.employees || []), ...(localStage.employees || [])])];
                    base.employees = employeeIds.filter(empId => {
                        const key = String(empId);
                        const addedAt = new Date(base.employeeLinks?.[key] || 0).getTime();
                        const removedAt = new Date(base.removedEmployees?.[key] || 0).getTime();
                        if (!Number.isFinite(removedAt) || removedAt <= 0) return true;
                        if (!Number.isFinite(addedAt) || addedAt <= 0) return false;
                        return addedAt > removedAt;

                    base.workLogs = mergeWorkLogs(localStage.workLogs || [], remoteStage.workLogs || [], preferLocal);
                    merged[stageId] = base;

                return merged;

            const mergeOrderRecords = (localOrder, remoteOrder) => {

                    const deletedOrder = localOrder.isDeleted && remoteOrder.isDeleted

                        saveToSupabase('rekapKinerja', merged);
                        setRekapKinerja(current => {
                            const currentMerged = mergeRecordLists(current || [], merged);
                            return JSON.stringify(currentMerged) !== JSON.stringify(current || []) ? currentMerged : current;
                        });
                    }, 0);
                    return valid;
                });
            };
            
            const updateRiwayatPengiriman = (updater) => { 
                setRiwayatPengiriman(prev => {
                    const nextVal = typeof updater === 'function' ? updater(prev) : updater;
                    const valid = stampChangedRecords(prev || [], Array.isArray(nextVal) ? nextVal : []);
                    setTimeout(async () => {
                        const merged = await mergeRemoteRecordsForSave('riwayatPengiriman', valid);
                        localStorage.setItem('simpati_riwayat_sj_sync', JSON.stringify(merged));
                        saveToSupabase('riwayatPengiriman', merged);
                        setRiwayatPengiriman(current => {
                            const currentMerged = mergeRecordLists(current || [], merged);
                            return JSON.stringify(currentMerged) !== JSON.stringify(current || []) ? currentMerged : current;
                        });
                    }, 0);
                    return valid;
                });
            };

            const updateExpenses = (updater) => {
                setExpenses(prev => {
                    const nextVal = typeof updater === 'function' ? updater(prev) : updater;
                    const valid = stampChangedRecords(prev || [], Array.isArray(nextVal) ? nextVal : []);
                    setTimeout(async () => {
                        const merged = await mergeRemoteRecordsForSave('expenses', valid);
                        localStorage.setItem('simpati_expenses_sync', JSON.stringify(merged));
                        saveToSupabase('expenses', merged);
                        setExpenses(current => {
                            const currentMerged = mergeRecordLists(current || [], merged);
                            return JSON.stringify(currentMerged) !== JSON.stringify(current || []) ? currentMerged : current;
                        });
                    }, 0);
                    return valid;
                });
            };

            const updateInvoices = (updater) => {
                setInvoices(prev => {
                    const nextVal = typeof updater === 'function' ? updater(prev) : updater;
                    const valid = stampChangedRecords(prev || [], Array.isArray(nextVal) ? nextVal : []);
                    setTimeout(async () => {
                        const merged = await mergeRemoteRecordsForSave('invoices', valid);
                        localStorage.setItem('simpati_invoices_sync', JSON.stringify(merged));
                        saveToSupabase('invoices', merged);
                        setInvoices(current => {
                            const currentMerged = mergeRecordLists(current || [], merged);
                            return JSON.stringify(currentMerged) !== JSON.stringify(current || []) ? currentMerged : current;
                        });
                    }, 0);
                    return valid;
                });
            };

            const updateClients = (updater) => {
                setClients(prev => {
                    const nextVal = typeof updater === 'function' ? updater(prev) : updater;
                    const valid = stampChangedRecords(prev || [], Array.isArray(nextVal) ? nextVal : []);
                    setTimeout(async () => {
                        const merged = await mergeRemoteRecordsForSave('clients', valid);
                        localStorage.setItem('simpati_clients_sync', JSON.stringify(merged));
                        saveToSupabase('clients', merged);
                        setClients(current => {
                            const currentMerged = mergeRecordLists(current || [], merged);
                            return JSON.stringify(currentMerged) !== JSON.stringify(current || []) ? currentMerged : current;
                        });
                    }, 0);
                    return valid;
                });
            };

            useEffect(() => {
                const legacyTabRedirects = {
                    'riwayat_rekap_kinerja': 'laporan',
                    'riwayat_pengiriman': 'pengiriman',
                    'riwayat': 'produksi'
                };
                if (legacyTabRedirects[activeTab]) {
                    setActiveTab(legacyTabRedirects[activeTab]);
                    return;
                }
                if (!authUser || !isReady) return;
                const allowedIds = getAccountMenuAccess(authUser);
                if (allowedIds.length > 0 && !allowedIds.includes(activeTab)) {
                    setActiveTab(allowedIds[0]);
                }
            }, [activeTab, authUser, isReady]);
            
            const updateTemplates = (updater) => { 
                setTemplates(prev => {
                    const nextVal = typeof updater === 'function' ? updater(prev) : updater;
                    const valid = (nextVal && typeof nextVal === 'object') ? nextVal : initialTemplates;
                    setTimeout(() => {
                        localStorage.setItem('simpati_templates_sync', JSON.stringify(valid));
                        saveToSupabase('templates', valid);
                    }, 0);
                    return valid;
                });
            };

            if (!isReady) {
                return (
                    <div className="flex h-screen items-center justify-center bg-slate-900 text-white flex-col">
                        <div className="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                        <h2 className="text-xl font-bold tracking-wider">Memuat Data Aplikasi...</h2>
                    </div>
                );
            }

            if (customerTrackingClient) {
                return (
                    <>
                        <CustomerTrackingView
                            client={customerTrackingClient}
                            orders={orders}
                            templates={templates}
                        />
                        {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                    </>
                );
            }

            if (rekapGajiShareId) {
                return (
                    <>
                        <RekapGajiShareView
                            rekapId={rekapGajiShareId}
                            employees={employees}
                            rekapKinerja={rekapKinerja}
                            templates={templates}
                        />
                        {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                    </>
                );
            }

            if (!authUser) {
                return (
                    <>
                        <LoginView 
                            onLogin={(user) => { 
                                setAuthUser(user); 
                                saveAuthSession(user);
                                showToast(`Selamat datang, ${user.name}!`, 'success'); 
                                const userAccess = getAccountMenuAccess(user);
                                if (user.role === 'Karyawan' && userAccess.includes('produksi')) {
                                    setActiveTab('produksi');
                                } else {
                                    setActiveTab(userAccess.includes('dashboard') ? 'dashboard' : (userAccess[0] || 'dashboard'));
                                }
                            }} 
                            accounts={accounts} 
                            templates={templates} 
                            showToast={showToast}
                        />
                        {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                    </>
                );
            }

            if (isTVMode) {
                return (
                    <React.Fragment>
                        <AntreanProduksiView orders={orders} isTVMode={isTVMode} setIsTVMode={setIsTVMode} />
                        {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                    </React.Fragment>
                );
            }

            const allNavItems = [
                { id: 'dashboard', label: 'Dashboard', icon: <IconDashboard /> },
                { id: 'input_order', label: 'Input Order', icon: <IconPlusCircle /> },
                { id: 'antrean', label: 'Monitor Antrean', icon: <IconMonitor /> },
                { id: 'pembelian_bahan', label: 'Pembelian Bahan', icon: <IconShoppingCart /> },
                { id: 'produksi', label: authUser?.role === 'Karyawan' ? 'Pekerjaan Saya' : 'Proses Produksi', icon: <IconScissors /> },
                { id: 'pengiriman', label: 'Pengiriman', icon: <IconTruck /> },
                { id: 'biaya', label: 'Biaya', icon: <IconDocument /> },
                { id: 'invoice', label: 'Invoice', icon: <IconDocument /> },
                { id: 'klien_instansi', label: 'Klien / Instansi', icon: <IconUsers /> },
                { id: 'tracking_instansi', label: 'Tracking Instansi', icon: <IconBarChart /> },
                { id: 'laporan', label: authUser?.role === 'Karyawan' ? 'Laporan Rekap Saya' : 'Laporan Kinerja', icon: <IconBarChart /> },
                { id: 'laporan_keuangan', label: 'Laporan Keuangan', icon: <IconBarChart /> },
                { id: 'laporan_order', label: 'Laporan Per Order', icon: <IconDocument /> },
                { id: 'karyawan', label: 'Data Karyawan', icon: <IconUsers /> },
                { id: 'pengaturan', label: 'Pengaturan Cetak', icon: <IconSettings /> },
                { id: 'master_akun', label: 'Master Akun', icon: <IconKey /> },
                
            ];
            const allowedMenuIds = new Set(getAccountMenuAccess(authUser));
            const canOpen = (menuId) => allowedMenuIds.has(menuId);
            const navItems = allNavItems.filter(item => canOpen(item.id));
            const activeMenuAllowed = navItems.some(item => item.id === activeTab);

            return (
                <div className="flex h-screen bg-gray-100 font-sans print:bg-white print:h-auto">
                    <div className="w-64 bg-slate-900 text-white flex flex-col hidden md:flex shrink-0 print:hidden shadow-xl z-10">
                        <div className="p-6 bg-slate-950 text-center border-b border-slate-800">
                            {templates?.companyLogo ? (
                                <img src={templates.companyLogo} alt="Logo" className="mx-auto max-h-16 object-contain mb-2 bg-white/5 p-1 rounded" />
                            ) : (
                                <h1 className="text-2xl font-bold tracking-wider text-red-500">SIMPATI</h1>
                            )}
                            <p className="text-xs text-gray-400 mt-2 uppercase tracking-widest">Sistem Konveksi</p>
                        </div>
                        <nav className="flex-1 overflow-y-auto py-4">
                            <ul className="space-y-1 px-3">
                                {navItems.map(item => (
                                    <li key={item.id}>
                                        <button onClick={() => setActiveTab(item.id)} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-lg text-sm font-medium transition-colors ${activeTab === item.id ? 'bg-blue-600 text-white shadow' : 'text-gray-400 hover:bg-slate-800 hover:text-white'}`}>
                                            {item.icon}<span>{item.label}</span>
                                        </button>
                                    </li>
                                ))}
                            </ul>
                        </nav>
                        <div className="p-4 border-t border-slate-800 text-xs text-center text-gray-500">
                            Simpati Konveksi &copy; 2026
                        </div>
                    </div>

                    <div className="flex-1 flex flex-col overflow-hidden print:overflow-visible">
                        <div className="md:hidden bg-slate-900 text-white p-4 flex justify-between items-center shadow-md print:hidden">
                            <div className="flex items-center">
                                {templates?.companyLogo ? (
                                    <img src={templates.companyLogo} alt="Logo" className="max-h-8 object-contain bg-white/5 p-0.5 rounded" />
                                ) : (
                                    <h1 className="font-bold text-red-500 text-lg tracking-wider">SIMPATI</h1>
                                )}
                            </div>
                            <div className="flex items-center space-x-2">
                                <select className="bg-slate-800 text-white border border-slate-700 text-sm p-1.5 rounded outline-none" value={activeTab} onChange={(e) => setActiveTab(e.target.value)}>
                                    {navItems.map(i => <option key={i.id} value={i.id}>{i.label}</option>)}
                                </select>
                                <button onClick={handleLogout} className="text-red-400 p-1.5 bg-slate-800 rounded border border-slate-700"><IconLogout /></button>
                            </div>
                        </div>

                        <header className="hidden md:flex bg-white h-16 border-b border-gray-200 items-center px-6 justify-between shrink-0 print:hidden shadow-sm z-0">
                            <h2 className="text-lg font-bold text-gray-700 capitalize">{navItems.find(n => n.id === activeTab)?.label || activeTab.split('_').join(' ')}</h2>
                            <div className="flex items-center space-x-4">
                                <div className="text-right hidden md:block">
                                    <div className="text-sm font-bold text-gray-700">{authUser.name}</div>
                                    <div className="text-xs text-gray-500">{authUser.role}</div>
                                </div>
                                <div className="w-9 h-9 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold">
                                    {authUser.name.charAt(0).toUpperCase()}
                                </div>
                                <button onClick={handleLogout} className="text-red-500 hover:bg-red-50 p-2 rounded-lg transition-colors ml-2" title="Keluar"><IconLogout /></button>
                            </div>
                        </header>

                        <main className="flex-1 overflow-x-hidden overflow-y-auto bg-gray-50/50 p-4 md:p-8 print:p-0 print:bg-white print:overflow-visible">
                            <div className="max-w-6xl mx-auto print:max-w-none print:mx-0 pb-12">
                                {activeTab === 'dashboard' && canOpen('dashboard') && <DashboardView orders={orders} setOrders={updateOrders} showToast={showToast} />}
                                {activeTab === 'antrean' && canOpen('antrean') && <AntreanProduksiView orders={orders} isTVMode={isTVMode} setIsTVMode={setIsTVMode} />}
                                {activeTab === 'karyawan' && canOpen('karyawan') && <KaryawanView employees={employees} setEmployees={updateEmployees} showToast={showToast} />}
                                {activeTab === 'input_order' && canOpen('input_order') && <InputOrderView orders={orders} setOrders={updateOrders} setActiveTab={setActiveTab} showToast={showToast} />}
                                {activeTab === 'pembelian_bahan' && canOpen('pembelian_bahan') && <PembelianBahanView orders={orders} setOrders={updateOrders} showToast={showToast} templates={templates} />}
                                {activeTab === 'produksi' && canOpen('produksi') && <ProduksiView orders={orders} setOrders={updateOrders} employees={employees} authUser={authUser} showToast={showToast} templates={templates} />}
                                {activeTab === 'laporan' && canOpen('laporan') && <LaporanView orders={orders} setOrders={updateOrders} employees={employees} setEmployees={updateEmployees} rekapKinerja={rekapKinerja} setRekapKinerja={updateRekapKinerja} invoices={invoices} setInvoices={updateInvoices} showToast={showToast} templates={templates} />}
                                {activeTab === 'biaya' && canOpen('biaya') && <BiayaView expenses={expenses} setExpenses={updateExpenses} showToast={showToast} templates={templates} />}
                                {activeTab === 'invoice' && canOpen('invoice') && <EnhancedInvoiceView invoices={invoices} setInvoices={updateInvoices} clients={clients} setClients={updateClients} employees={employees} showToast={showToast} templates={templates} />}
                                {activeTab === 'klien_instansi' && canOpen('klien_instansi') && <ClientsView clients={clients} setClients={updateClients} invoices={invoices} setInvoices={updateInvoices} showToast={showToast} templates={templates} />}
                                {activeTab === 'laporan_keuangan' && canOpen('laporan_keuangan') && <LaporanKeuanganView orders={orders} employees={employees} rekapKinerja={rekapKinerja} expenses={expenses} invoices={invoices} clients={clients} templates={templates} showToast={showToast} />}
                                {activeTab === 'laporan_order' && canOpen('laporan_order') && <LaporanOrderView orders={orders} employees={employees} templates={templates} showToast={showToast} />}
                                {activeTab === 'tracking_instansi' && canOpen('tracking_instansi') && <TrackingInstansiView orders={orders} templates={templates} showToast={showToast} />}
                                {activeTab === 'pengiriman' && canOpen('pengiriman') && <PengirimanView orders={orders} setOrders={updateOrders} showToast={showToast} templates={templates} riwayatPengiriman={riwayatPengiriman} setRiwayatPengiriman={updateRiwayatPengiriman} />}
                                {activeTab === 'pengaturan' && canOpen('pengaturan') && <TemplateView templates={templates} setTemplates={updateTemplates} showToast={showToast} />}
                                {activeTab === 'master_akun' && canOpen('master_akun') && <MasterAkunView accounts={accounts} setAccounts={updateAccounts} employees={employees} showToast={showToast} />}
                                {activeMenuAllowed === false && (
                                    <Card>
                                        <div className="text-center py-10 text-gray-500 font-bold">Menu ini tidak tersedia untuk akun Anda.</div>
                                    </Card>
                                )}
                            </div>
                        </main>
                    </div>
                    {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
