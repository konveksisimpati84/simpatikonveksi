                return Object.values(order?.progress || {}).some(stage => (stage?.workLogs || []).some(log => !log.isDeleted && (log.checkBefore || log.checkAfter)));
            };

            const getOrderStatusAfterMaterialPurchase = (order) => {
                if (order?.status === 'Terkirim' || order?.status === 'Siap Kirim' || String(order?.status || '').startsWith('Proses')) return order.status;
                return hasProductionStarted(order) ? order.status : 'Pembelian Bahan';
            };

            const addVendorPayment = (orderId, vendorName, batchDateKey) => {
                const batchKey = getMaterialBatchKey(vendorName, batchDateKey);
                const key = `${batchKey}__${orderId}`;
                const amount = parseFloat(paymentInputs[key]?.amount) || 0;
                const note = String(paymentInputs[key]?.note || '').trim();
                const payDate = paymentInputs[key]?.date || new Date().toISOString().slice(0, 10);
                const method = String(paymentInputs[key]?.method || 'Transfer').trim() || 'Transfer';
                if (amount <= 0) {
                    showToast("Isi nominal pembayaran termin terlebih dahulu.", "error");
                    return;
                }
                const now = new Date().toISOString();
                setOrders(prevOrders => prevOrders.map(o => {
                    if (String(o.id) !== String(orderId)) return o;
                    const vendorKey = normalizeVendorName(vendorName);
                    const nextPayments = { ...(o.materialPayments || {}) };
                    nextPayments[batchKey] = [
                        ...(nextPayments[batchKey] || []),
                        { id: `PAY-${Date.now()}`, date: payDate, amount, method, note, vendor: vendorKey, batchDateKey, createdAt: now }
                    ];
                    const checkOrder = { ...o, materialPayments: nextPayments };
                    const allSettled = areAllOrderMaterialsSettled(checkOrder);
                    const anyPurchased = Object.values(checkOrder.materialPurchasedVendors || {}).some(Boolean) || Object.values(checkOrder.materialPurchasedBatches || {}).some(Boolean);
                    return {
                        ...o,
                        materialPayments: nextPayments,
                        materialStatus: allSettled ? 'Selesai' : (anyPurchased ? 'Dibeli Sebagian' : (o.materialStatus === 'Belum' ? 'Direkap' : (o.materialStatus || 'Direkap'))),
                        materialPurchasedAt: allSettled ? now : o.materialPurchasedAt,
                        materialLastActionAt: now,
                        materialLastAction: allSettled ? 'Pembayaran Lunas' : 'Tambah Pembayaran Termin',
                        status: allSettled ? getOrderStatusAfterMaterialPurchase(o) : o.status
                    };
                }));
                setPaymentInputs(prev => ({ ...prev, [key]: { amount: '', note: '', date: '', method: 'Transfer' } }));
                showToast("Pembayaran termin berhasil dicatat.", "success");
            };

            const addVendorGroupPayment = (vendorName, batchDateKey, orderGroups = []) => {
                const batchKey = getMaterialBatchKey(vendorName, batchDateKey);
                const key = `${batchKey}__GROUP`;
                let amountLeft = safeMoney(paymentInputs[key]?.amount);
                const note = String(paymentInputs[key]?.note || '').trim();
                const payDate = paymentInputs[key]?.date || new Date().toISOString().slice(0, 10);
                const method = String(paymentInputs[key]?.method || 'Transfer').trim() || 'Transfer';
                if (amountLeft <= 0) {
                    showToast("Isi nominal pembayaran vendor terlebih dahulu.", "error");
                    return;
                }
                const now = new Date().toISOString();
                setOrders(prevOrders => prevOrders.map(order => {
                    const group = (orderGroups || []).find(g => String(g.orderId) === String(order.id));
                    if (!group || amountLeft <= 0) return order;
                    const orderTotal = (group.items || []).reduce((sum, item) => sum + getMaterialLineTotal(item), 0);
                    const paid = getVendorPaidTotal(order, vendorName, batchDateKey);
                    const remaining = Math.max(0, orderTotal - paid);
                    const applied = Math.min(remaining, amountLeft);
                    if (applied <= 0) return order;
                    amountLeft -= applied;
                    const nextPayments = { ...(order.materialPayments || {}) };
                    nextPayments[batchKey] = [
                        ...(nextPayments[batchKey] || []),
                        { id: `PAY-${Date.now()}-${order.id}`, date: payDate, amount: applied, method, note, vendor: normalizeVendorName(vendorName), batchDateKey, createdAt: now }
                    ];
                    const checkOrder = { ...order, materialPayments: nextPayments };
                    return {
                        ...order,
                        materialPayments: nextPayments,
                        materialStatus: areAllOrderMaterialsSettled(checkOrder) ? 'Selesai' : 'Dibeli Sebagian',
                        materialLastActionAt: now,
                        materialLastAction: 'Tambah Pembayaran Termin Vendor',
                        status: getOrderStatusAfterMaterialPurchase(order)
                    };
                }));
                setPaymentInputs(prev => ({ ...prev, [key]: { amount: '', note: '', date: '', method: 'Transfer' } }));
                showToast("Pembayaran termin vendor berhasil dicatat.", "success");
            };

            const deleteVendorPayment = (orderId, vendorName, batchDateKey, paymentId) => {
                const batchKey = getMaterialBatchKey(vendorName, batchDateKey);
                setOrders(prevOrders => prevOrders.map(o => {
                    if (String(o.id) !== String(orderId)) return o;

                    const total = (group.items || []).reduce((sum, item) => sum + getMaterialLineTotal(item), 0);
                    const paid = Object.values((group.items || []).reduce((acc, item) => {
                        const order = (orders || []).find(o => String(o.id) === String(item.orderId));
                        if (!order) return acc;
                        acc[item.orderId] = getVendorPaidTotal(order, group.vendor, group.batchDateKey);
                        return acc;
                    }, {})).reduce((sum, amount) => sum + amount, 0);
                    if (paid <= 0) return 'Belum Bayar';
                    return paid >= total ? 'Lunas' : 'Termin / Bayar Sebagian';
                };
                const vendorGroups = Object.values(groupedMaterials).filter(group => paymentStatusFilter === 'Semua' || getGroupPaymentStatus(group) === paymentStatusFilter).sort((a, b) => {
                    const vendorCompare = String(a.vendor).localeCompare(String(b.vendor));
                    if (vendorCompare !== 0) return vendorCompare;
                    return String(b.batchDateKey).localeCompare(String(a.batchDateKey));
                });

                if (vendorGroups.length === 0) {
                    return (
                        <Card className="text-center p-8 text-gray-500 italic border-dashed border-2">
                            <p>{searchTerm ? 'Tidak ada rekap vendor yang cocok dengan pencarian.' : 'Belum ada data rincian bahan yang diinput pada order aktif mana pun.'}</p>
                        </Card>
                    );
                }

                return (
                    <div className="space-y-6">
                        {vendorGroups.map(groupedVendor => {
                            const vendor = groupedVendor.vendor;
                            const items = groupedVendor.items;
                            const batchDateKey = groupedVendor.batchDateKey;
                            const totalEst = items.reduce((sum, item) => sum + getMaterialLineTotal(item), 0);
                            const formatRupiah = (num) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR' }).format(num);
                            const purchaseKey = `${vendor}|||${batchDateKey}`;
                            const noteNumber = `NOTA-${String(batchDateKey || '').replace(/-/g, '')}-${String(vendor || 'VENDOR').replace(/\s+/g, '-').toUpperCase()}`;
                            const orderGroups = Object.values(items.reduce((acc, item) => {
                                if (!acc[item.orderId]) {
                                    const order = (orders || []).find(o => String(o.id) === String(item.orderId));
                                    acc[item.orderId] = { order, orderId: item.orderId, client: item.client, type: item.type, designImage1: item.designImage1, items: [] };
                                }
                                acc[item.orderId].items.push(item);
                                return acc;
                            }, {}));
                            const paidTotal = orderGroups.reduce((sum, group) => sum + (group.order ? getVendorPaidTotal(group.order, vendor, batchDateKey) : 0), 0);
                            const remainingTotal = Math.max(0, totalEst - paidTotal);
                            const paymentStatus = paidTotal <= 0 ? 'Belum Bayar' : (remainingTotal <= 0 ? 'Lunas' : 'Termin / Bayar Sebagian');
                            const clients = [...new Set(orderGroups.map(group => group.client || '-'))].join(', ');
                            const productionTypes = [...new Set(orderGroups.map(group => group.type || '-'))].join(', ');
                            const isExpanded = !!expandedPurchaseKeys[purchaseKey];

                            return (
                                <Card key={`${vendor}-${batchDateKey}`} className="overflow-hidden p-0">
                                    <div className="p-4 overflow-x-auto">
                                        <table className="w-full text-sm text-left">
                                            <thead>
                                                <tr className="border-b-2 border-gray-200 text-gray-600 bg-gray-50">
                                                    <th className="p-3 font-semibold">Nomor Nota</th>
                                                    <th className="p-3 font-semibold">Tanggal</th>
                                                    <th className="p-3 font-semibold">Vendor</th>
                                                    <th className="p-3 font-semibold">Instansi / Customer</th>
                                                    <th className="p-3 font-semibold">Jenis Produksi</th>
                                                    <th className="p-3 font-semibold text-right">Total Tagihan</th>
                                                    <th className="p-3 font-semibold text-right">Total Dibayar</th>
                                                    <th className="p-3 font-semibold text-right">Sisa Pembayaran</th>
                                                    <th className="p-3 font-semibold text-center">Status Pembayaran</th>
                                                    <th className="p-3 font-semibold text-center">Aksi</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <tr className="border-b border-gray-100 align-top">
                                                    <td className="p-3 font-bold text-blue-700">{noteNumber}</td>
                                                    <td className="p-3">{formatMaterialBatchDate(batchDateKey)}</td>
                                                    <td className="p-3 font-bold text-gray-800">{vendor}</td>
                                                    <td className="p-3 text-gray-700 max-w-xs">{clients}</td>
                                                    <td className="p-3 text-gray-700 max-w-xs">{productionTypes}</td>
                                                    <td className="p-3 text-right font-black text-red-600">{formatRupiah(totalEst)}</td>
                                                    <td className="p-3 text-right font-bold text-green-700">{formatRupiah(paidTotal)}</td>
                                                    <td className={`p-3 text-right font-black ${remainingTotal <= 0 ? 'text-green-700' : 'text-orange-700'}`}>{formatRupiah(remainingTotal)}</td>
                                                    <td className="p-3 text-center"><Badge status={paymentStatus} /></td>
                                                    <td className="p-3">
                                                        <div className="flex flex-wrap gap-2 justify-center">
                                                            <button
                                                                onClick={() => setExpandedPurchaseKeys(prev => ({ ...prev, [purchaseKey]: !prev[purchaseKey] }))}
                                                                className="text-xs font-bold text-blue-700 bg-blue-50 hover:bg-blue-100 border border-blue-200 px-3 py-1.5 rounded-lg"
                                                            >
                                                                {isExpanded ? 'Sembunyikan Rincian' : 'Lihat Rincian'}
                                                            </button>
                                                            <button
                                                                onClick={() => printDaftarBelanjaVendor(vendor, items)}
                                                                className="text-xs font-bold text-slate-700 bg-white hover:bg-slate-50 border border-slate-200 px-3 py-1.5 rounded-lg flex items-center gap-1"
                                                            >
                                                                <IconPrinter /> Cetak Nota
                                                            </button>
                                                            <button
                                                                onClick={() => openDeletePurchaseConfirm(groupedVendor)}
                                                                className="text-red-600 bg-red-50 hover:bg-red-100 border border-red-200 p-1.5 rounded-lg"
                                                                title="Hapus nota"
                                                            >
                                                                <IconTrash />
                                                            </button>
                                                        </div>
                                                    </td>
                                                </tr>
                                            </tbody>
                                        </table>
                                        {isExpanded && (
                                            <div className="mt-4 space-y-4 bg-gray-50 border border-gray-200 rounded-lg p-4">
                                                <div className="bg-white border border-orange-200 rounded-lg p-4">
                                                    <div className="flex flex-col lg:flex-row lg:items-end gap-3">
                                                        <div className="flex-1">
                                                            <div className="text-sm font-black text-orange-900 mb-2">Pembayaran Termin Vendor / Nota</div>
                                                            <div className="grid grid-cols-1 md:grid-cols-4 gap-2">
                                                                <input type="date" className="w-full p-2 border rounded text-xs" value={paymentInputs[`${getMaterialBatchKey(vendor, batchDateKey)}__GROUP`]?.date || new Date().toISOString().slice(0, 10)} onChange={e => setPaymentInputs(prev => ({ ...prev, [`${getMaterialBatchKey(vendor, batchDateKey)}__GROUP`]: { ...(prev[`${getMaterialBatchKey(vendor, batchDateKey)}__GROUP`] || {}), date: e.target.value } }))} />
                                                                <input type="number" min="0" className="w-full p-2 border rounded text-xs text-right" placeholder="Nominal bayar vendor" value={paymentInputs[`${getMaterialBatchKey(vendor, batchDateKey)}__GROUP`]?.amount || ''} onChange={e => setPaymentInputs(prev => ({ ...prev, [`${getMaterialBatchKey(vendor, batchDateKey)}__GROUP`]: { ...(prev[`${getMaterialBatchKey(vendor, batchDateKey)}__GROUP`] || {}), amount: e.target.value } }))} />
                                                                <select className="w-full p-2 border rounded text-xs" value={paymentInputs[`${getMaterialBatchKey(vendor, batchDateKey)}__GROUP`]?.method || 'Transfer'} onChange={e => setPaymentInputs(prev => ({ ...prev, [`${getMaterialBatchKey(vendor, batchDateKey)}__GROUP`]: { ...(prev[`${getMaterialBatchKey(vendor, batchDateKey)}__GROUP`] || {}), method: e.target.value } }))}><option>Transfer</option><option>Tunai</option><option>QRIS</option><option>Debit</option><option>Lainnya</option></select>
                                                                <input type="text" className="w-full p-2 border rounded text-xs" placeholder="Catatan termin vendor" value={paymentInputs[`${getMaterialBatchKey(vendor, batchDateKey)}__GROUP`]?.note || ''} onChange={e => setPaymentInputs(prev => ({ ...prev, [`${getMaterialBatchKey(vendor, batchDateKey)}__GROUP`]: { ...(prev[`${getMaterialBatchKey(vendor, batchDateKey)}__GROUP`] || {}), note: e.target.value } }))} />
                                                            </div>
                                                        </div>
                                                        <button onClick={() => addVendorGroupPayment(vendor, batchDateKey, orderGroups)} className="bg-slate-700 hover:bg-slate-800 text-white px-4 py-2 rounded-lg text-xs font-bold">Tambah Termin Vendor</button>
                                                    </div>
                                                </div>
                                                {orderGroups.map(group => {
                                                    const order = group.order;
                                                    const batchPaymentKey = getMaterialBatchKey(vendor, batchDateKey);
                                                    const paymentKey = `${batchPaymentKey}__${group.orderId}`;
                                                    const payments = order ? getVendorPayments(order, vendor, batchDateKey) : [];
                                                    return (
                                                        <div key={group.orderId} className="bg-white border border-gray-200 rounded-lg p-3">
                                                            <div className="flex flex-col md:flex-row md:items-start md:justify-between gap-3 mb-3">
                                                                <div className="flex gap-3">
                                                                    <div className="w-16 h-14 rounded border border-gray-200 bg-white overflow-hidden flex items-center justify-center shrink-0">
                                                                        {group.designImage1 ? <img src={group.designImage1} className="w-full h-full object-cover" /> : <IconImage />}
                                                                    </div>
                                                                    <div>
                                                                        <div className="font-bold text-blue-600">{group.orderId}</div>
                                                                        <div className="text-xs font-semibold text-gray-700">{group.type || '-'}</div>
                                                                        <div className="text-xs text-gray-500">{group.client}</div>
                                                                    </div>
                                                                </div>
                                                                <button
                                                                    onClick={() => order && openMaterialModal(order)}
                                                                    className="text-xs font-bold text-blue-700 bg-blue-50 hover:bg-blue-100 border border-blue-200 px-3 py-1.5 rounded-lg"
                                                                >
                                                                    Edit
                                                                </button>
                                                            </div>
                                                            <div className="overflow-x-auto">
                                                                <table className="w-full text-xs text-left">
                                                                    <thead>
                                                                        <tr className="border-b border-gray-200 text-gray-500">
                                                                            <th className="py-2 pr-2">Bahan</th>
                                                                            <th className="py-2 pr-2">Qty</th>
                                                                            <th className="py-2 pr-2">Unit</th>
                                                                            <th className="py-2 pr-2 text-right">Harga</th>
                                                                            <th className="py-2 pr-2 text-right">Subtotal</th>
                                                                            <th className="py-2 pr-2">Catatan</th>
                                                                        </tr>
                                                                    </thead>
                                                                    <tbody>
                                                                        {group.items.map((item, itemIdx) => (
                                                                            <tr key={item.id || itemIdx} className="border-b border-gray-100">
                                                                                <td className="py-2 pr-2 font-bold text-gray-700">{item.name}</td>
                                                                                <td className="py-2 pr-2">{item.qty || '-'}</td>
                                                                                <td className="py-2 pr-2">{item.unit || '-'}</td>
                                                                                <td className="py-2 pr-2 text-right">{formatRupiah(item.price || 0)}</td>
                                                                                <td className="py-2 pr-2 text-right font-bold text-red-600">{formatRupiah(getMaterialLineTotal(item))}</td>
                                                                                <td className="py-2 pr-2">{item.note || '-'}</td>
                                                                            </tr>
                                                                        ))}
                                                                    </tbody>
                                                                </table>
                                                            </div>
                                                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-3 mt-4">
                                                                <div className="bg-green-50 border border-green-100 rounded-lg p-3 text-xs">
                                                                    <div className="font-black text-green-800 mb-2">Termin Pembayaran</div>
                                                                    {payments.length > 0 ? (
                                                                        <div className="space-y-2">
                                                                            {payments.map((pay, payIdx) => (
                                                                                <div key={pay.id || payIdx} className="flex items-start justify-between gap-2 bg-white border border-green-100 rounded p-2">
                                                                                    <span><span className="font-bold">Termin {payIdx + 1}:</span> {formatRupiah(pay.amount || 0)} ({pay.method || '-'}) {pay.date ? `- ${pay.date}` : ''} {pay.note ? `- ${pay.note}` : ''}</span>
                                                                                    <span className="flex gap-2 shrink-0">
                                                                                        <button onClick={() => editVendorPayment(group.orderId, vendor, batchDateKey, pay)} className="text-blue-600 font-bold">Edit</button>
                                                                                        <button onClick={() => deleteVendorPayment(group.orderId, vendor, batchDateKey, pay.id)} className="text-red-600 font-bold">Hapus</button>
                                                                                    </span>
                                                                                </div>
                                                                            ))}
                                                                        </div>
                                                                    ) : <div className="text-gray-500 italic">Belum ada termin pembayaran.</div>}
                                                                </div>
                                                                <div className="bg-orange-50 border border-orange-100 rounded-lg p-3 text-xs text-orange-800 font-bold">
                                                                    Pembayaran termin dicatat satu kali di level vendor/nota melalui panel "Pembayaran Termin Vendor" di atas rincian ini.
                                                                </div>
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        )}
                                    </div>
                                </Card>
                            )
                        })}
                    </div>
                );
            };

            return (
                <div className="space-y-6">
                    <div>
                        <h2 className="text-2xl font-bold text-gray-800">{activeTab === 'rekap_vendor' ? 'Rekap Pembelian Bahan' : 'Manajemen Pembelian Bahan'}</h2>
                        <p className="text-gray-500 text-sm mt-1">{activeTab === 'rekap_vendor' ? 'Rekap nota bahan per vendor/toko beserta termin pembayaran.' : 'Input pembelian bahan berdasarkan order produksi yang sudah masuk.'}</p>
                    </div>

                    <div className="flex gap-4 border-b border-gray-200 pb-2">
                        <button 
                            onClick={() => setActiveTab('daftar_order')}
                            className={`pb-2 px-1 font-bold text-sm border-b-2 transition-colors ${activeTab === 'daftar_order' ? 'border-blue-600 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700'}`}
                        >
                            Input Pembelian
                        </button>
                        <button 
                            onClick={() => setActiveTab('rekap_vendor')}
                            className={`pb-2 px-1 font-bold text-sm border-b-2 transition-colors flex items-center gap-1 ${activeTab === 'rekap_vendor' ? 'border-blue-600 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700'}`}
                        >
                            <IconBarChart /> Rekap Pembelian
                        </button>
                    </div>

                    <Card>
                        <div className="grid grid-cols-1 md:grid-cols-5 gap-3">
                            <div className="md:col-span-2">
                                <SearchField value={searchTerm} onChange={setSearchTerm} placeholder="Cari order, klien, barang, vendor, bahan, status..." />
                            </div>
                            <select className="w-full p-2.5 border border-gray-300 rounded-lg bg-white text-sm font-medium" value={statusFilter} onChange={e => setStatusFilter(e.target.value)}>
                                <option value="Semua">Semua Status Bahan</option>
                                <option value="Belum">Belum</option>
                                <option value="Direkap">Direkap</option>
                                <option value="Dibeli Sebagian">Dibeli Sebagian</option>
                                <option value="Selesai">Selesai</option>
                                <option value="Tidak Perlu">Tidak Perlu</option>
                            </select>
                            <select className="w-full p-2.5 border border-gray-300 rounded-lg bg-white text-sm font-medium" value={paymentStatusFilter} onChange={e => setPaymentStatusFilter(e.target.value)}>
                                <option value="Semua">Semua Pembayaran</option>
                                <option value="Belum Bayar">Belum Bayar</option>
                                <option value="Termin / Bayar Sebagian">Termin / Bayar Sebagian</option>
                                <option value="Lunas">Lunas</option>
                            </select>
                            <input type="date" className="w-full p-2.5 border border-gray-300 rounded-lg bg-white text-sm font-medium" value={dateFilter} onChange={e => setDateFilter(e.target.value)} title="Filter tanggal masuk, deadline, atau tanggal beli" />
                        </div>
                    </Card>

                    {activeTab === 'daftar_order' ? renderDaftarOrder() : renderRekapVendor()}

                    {selectedOrder && (
                        <div className="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-[100] p-4">
                            <div className="bg-white p-6 rounded-xl shadow-xl w-full max-w-5xl max-h-[95vh] flex flex-col">
                                <div className="flex justify-between items-start gap-4 border-b pb-4 mb-4 shrink-0">
                                    <div className="flex items-start gap-4">
                                        <div className="bg-gray-50 border border-gray-200 rounded-lg p-3">
                                            <div className="text-xs font-black text-gray-600 mb-2">Desain Produksi</div>
                                            {renderOrderDesignPreview(selectedOrder, false)}
                                        </div>
                                        <div>
                                        <h3 className="text-xl font-bold text-gray-900">Input Kebutuhan Bahan</h3>
                                        <p className="text-sm text-gray-600">ID: <span className="font-bold">{selectedOrder.id}</span> | {selectedOrder.client} ({selectedOrder.type} - {selectedOrder.total} pcs)</p>
                                        <p className="text-xs text-gray-500 mt-1">Desain diambil langsung dari gambar order.</p>
                                        </div>
                                    </div>
                                    <button onClick={() => setSelectedOrder(null)} className="text-gray-400 hover:text-gray-600 text-2xl">&times;</button>
                                </div>

                                <div className="flex-1 overflow-y-auto pr-2 space-y-4">
                                    {materials.map((mat, index) => !mat?.isDeleted && (
                                        <div key={mat.id} className="grid grid-cols-1 md:grid-cols-12 gap-3 items-end bg-gray-50 p-3 rounded-lg border border-gray-200">
                                            <div className="md:col-span-2">
                                                <label className="block text-xs font-bold text-gray-600 mb-1">Nama Bahan (Kain/Aksesoris)</label>
                                                <input 
                                                    type="text" 
                                                    list="material-name-suggestions"
                                                    className="w-full p-2 text-sm border rounded focus:ring-1 focus:ring-blue-500" 
                                                    placeholder="Cth: Kain Cotton Combed 30s Hitam"
                                                    value={mat.name} onChange={e => handleMaterialChange(index, 'name', e.target.value)} 
                                                />
                                            </div>
                                            <div className="md:col-span-2">
                                                <label className="block text-xs font-bold text-gray-600 mb-1">Warna / Spesifikasi</label>
                                                <input
                                                    type="text"
                                                    list="material-spec-suggestions"
                                                    className="w-full p-2 text-sm border rounded focus:ring-1 focus:ring-blue-500"
                                                    placeholder="Cth: Hitam, 30s, rib 1x1"
                                                    value={mat.spec || mat.color || ''} onChange={e => handleMaterialChange(index, 'spec', e.target.value)}
                                                />
                                            </div>
                                            <div className="md:col-span-2">
                                                <label className="block text-xs font-bold text-gray-600 mb-1">Vendor / Toko</label>
                                                <input 
                                                    type="text" 
                                                    list="material-vendor-suggestions"
                                                    className="w-full p-2 text-sm border rounded focus:ring-1 focus:ring-blue-500" 
                                                    placeholder="Cth: Toko Maju Jaya"
                                                    value={mat.vendor || ''} onChange={e => handleMaterialChange(index, 'vendor', e.target.value)} 
                                                />
                                            </div>
                                            <div className="md:col-span-1">
                                                <label className="block text-xs font-bold text-gray-600 mb-1">Jumlah</label>
                                                <input 
                                                    type="number" min="0" step="any"
                                                    className="w-full p-2 text-sm border rounded focus:ring-1 focus:ring-blue-500 text-center" 
                                                    placeholder="0"
                                                    value={mat.qty} onChange={e => handleMaterialChange(index, 'qty', e.target.value)} 
                                                />
                                            </div>
                                            <div className="md:col-span-1">
                                                <label className="block text-xs font-bold text-gray-600 mb-1">Satuan</label>
                                                <select 
                                                    className="w-full p-2 text-sm border rounded focus:ring-1 focus:ring-blue-500"
                                                    value={mat.unit} onChange={e => handleMaterialChange(index, 'unit', e.target.value)}
                                                >
                                                    <option value="Kg">Kg</option>
                                                    <option value="Roll">Roll</option>
                                                    <option value="Meter">Meter</option>
                                                    <option value="Yard">Yard</option>
                                                    <option value="Lusin">Lusin</option>
                                                    <option value="Gross">Gross</option>
                                                    <option value="Pcs">Pcs</option>
                                                    <option value="Pak">Pak</option>
                                                </select>
                                            </div>
                                            <div className="md:col-span-2">
                                                <label className="block text-xs font-bold text-gray-600 mb-1">Harga Satuan (Rp)</label>
                                                <input 
                                                    type="number" min="0"
                                                    className="w-full p-2 text-sm border rounded focus:ring-1 focus:ring-blue-500 text-right" 
                                                    placeholder="0"
                                                    value={mat.price} onChange={e => handleMaterialChange(index, 'price', e.target.value)} 
                                                />
                                            </div>
                                            <div className="md:col-span-1">
                                                <label className="block text-xs font-bold text-gray-600 mb-1">Tgl Beli</label>
                                                <input
                                                    type="date"
                                                    className="w-full p-2 text-sm border rounded focus:ring-1 focus:ring-blue-500"
                                                    value={mat.purchaseDate || ''} onChange={e => handleMaterialChange(index, 'purchaseDate', e.target.value)}
                                                />
                                            </div>
                                            <div className="md:col-span-1">
                                                <button 
                                                    onClick={() => removeMaterialRow(mat.id)}
                                                    className="w-full h-9 bg-red-100 hover:bg-red-200 text-red-600 flex items-center justify-center rounded transition-colors shrink-0"
                                                    title="Hapus Baris"
                                                >
                                                    <IconTrash />
                                                </button>
                                            </div>
                                            <div className="md:col-span-3">
                                                <label className="block text-xs font-bold text-gray-600 mb-1">Catatan</label>
                                                <input
                                                    type="text"
                                                    className="w-full p-2 text-sm border rounded focus:ring-1 focus:ring-blue-500"
                                                    placeholder="Catatan bahan / nota"
                                                    value={mat.note || ''} onChange={e => handleMaterialChange(index, 'note', e.target.value)}
                                                />
                                            </div>
                                            <div className="md:col-span-2">
                                                <label className="block text-xs font-bold text-gray-600 mb-1">Status Beli</label>
                                                <select
                                                    className="w-full p-2 text-sm border rounded focus:ring-1 focus:ring-blue-500"
                                                    value={mat.purchaseStatus || 'Sudah Dibeli'} onChange={e => handleMaterialChange(index, 'purchaseStatus', e.target.value)}
                                                >
                                                    <option value="Belum Dibeli">Belum Dibeli</option>
                                                    <option value="Sudah Dibeli">Sudah Dibeli</option>
                                                    <option value="Termin">Termin</option>
                                                </select>
                                            </div>
                                            <div className="md:col-span-7 text-right text-xs text-gray-600">
                                                Total baris: <span className="font-black text-red-600">{formatRupiah(getMaterialLineTotal(mat))}</span>
                                            </div>
                                        </div>
                                    ))}
                                    <datalist id="material-name-suggestions">
                                        {materialNameSuggestions.map((name, idx) => <option key={idx} value={name} />)}
                                    </datalist>
                                    <datalist id="material-vendor-suggestions">
                                        {vendorSuggestions.map((vendor, idx) => <option key={idx} value={vendor} />)}
                                    </datalist>
                                    <datalist id="material-spec-suggestions">
                                        {specSuggestions.map((spec, idx) => <option key={idx} value={spec} />)}
                                    </datalist>
                                    
                                    <button 
                                        onClick={addMaterialRow} 
                                        className="text-sm font-bold text-blue-600 bg-blue-50 px-4 py-2 rounded-lg hover:bg-blue-100 transition-colors w-full border border-dashed border-blue-300"
                                    >
                                        + Tambah Bahan Lainnya
                                    </button>

                                    <div className="flex w-full sm:w-auto gap-2">

                                    <button onClick={() => applyPurchaseDelete('return')} className="w-full px-4 py-2 font-bold text-orange-800 bg-orange-50 hover:bg-orange-100 border border-orange-200 rounded-lg transition-colors text-sm">Hapus dari Nota & Kembalikan ke Input Pembelian</button>

                </div>
            );
        };

        const BiayaView = ({ expenses, setExpenses, showToast, templates }) => {
            const emptyForm = { date: new Date().toISOString().slice(0, 10), type: 'Uang Keluar', category: '', amount: '', method: 'Tunai', party: '', note: '' };
            const [form, setForm] = useState(emptyForm);
            const [editId, setEditId] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');
            const [typeFilter, setTypeFilter] = useState('Semua');
            const [expandedIds, setExpandedIds] = useState({});
            const visibleExpenses = (expenses || []).filter(isVisibleRecord).filter(item => {
                if (typeFilter !== 'Semua' && item.type !== typeFilter) return false;
                return matchesSearch([item.date, item.type, item.category, item.amount, item.method, item.party, item.note], searchTerm);
            }).sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));
            const totalIn = visibleExpenses.filter(item => item.type === 'Uang Masuk').reduce((sum, item) => sum + safeMoney(item.amount), 0);
            const totalOut = visibleExpenses.filter(item => item.type === 'Uang Keluar').reduce((sum, item) => sum + safeMoney(item.amount), 0);

            const printReceipt = (item, title = 'KWITANSI') => {
                const safe = (value) => String(value ?? '-').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
                const receiptNo = item.id || `KW-${Date.now()}`;
                const amount = safeMoney(item.amount);
                const printContent = `<!DOCTYPE html><html><head><title>KWITANSI ${safe(receiptNo)}</title><style>@page{size:A5 landscape;margin:8mm}body{font-family:Arial,Helvetica,sans-serif;color:#10264a;margin:0;background:#fff}.sheet{width:100%;box-sizing:border-box;padding:10px 12px 8px}.top{display:flex;justify-content:space-between;align-items:flex-start}.brand img{max-height:48px;max-width:150px;object-fit:contain}.brand-text{line-height:.95}.brand-small{font-size:18px;font-weight:900;color:#111}.brand-main{font-size:38px;font-weight:900;color:#e31b23;font-style:italic;letter-spacing:-1px}.title{text-align:right}.title h1{font-size:32px;letter-spacing:8px;margin:4px 0 10px;color:#10264a}.no-row{font-size:14px}.line{border-bottom:3px solid #10264a;margin:14px 0 18px}.field{display:grid;grid-template-columns:150px 12px 1fr;gap:8px;align-items:end;font-size:14px;margin:12px 0}.dots{border-bottom:1.5px dotted #222;min-height:19px;padding:0 6px;color:#111}.amount-words{margin-left:170px;background:#eef1f5;border-bottom:1.5px dotted #222;min-height:25px;padding:6px 8px;font-size:12px;color:#111}.pay-lines{margin-left:170px}.pay-lines .dots{margin:12px 0}.bottom{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:20px;align-items:start}.rp-box{width:270px;height:42px;border:2px solid #10264a;display:grid;grid-template-columns:70px 1fr;transform:skewX(-10deg);overflow:hidden}.rp-label,.rp-value{display:flex;align-items:center;padding:0 14px;transform:skewX(10deg);font-size:19px;font-weight:900}.rp-label{border-right:2px solid #10264a}.rp-value{background:#f0f3f7;color:#111}.sign{text-align:center;font-size:13px}.date-line{border-bottom:1.5px dotted #10264a;display:inline-block;min-width:200px;text-align:left;color:#111}.receiver{margin-top:16px}.name-line{display:inline-block;min-width:210px;border-bottom:1.5px dotted #10264a;margin-top:46px;color:#111}</style></head><body><div class="sheet"><div class="top"><div class="brand">${templates?.companyLogo ? `<img src="${templates.companyLogo}" />` : `<div class="brand-text"><div class="brand-small">Konveksi</div><div class="brand-main">Simpati</div></div>`}</div><div class="title"><h1>KWITANSI</h1><div class="no-row">No. &nbsp;: <span class="dots" style="display:inline-block;min-width:160px">${safe(receiptNo)}</span></div></div></div><div class="line"></div><div class="field"><div>Telah terima dari</div><div>:</div><div class="dots">${safe(item.party || item.type || '-')}</div></div><div class="field"><div>Uang sejumlah</div><div>:</div><div class="dots">${formatRupiah(amount)}</div></div><div class="amount-words">${safe(terbilangRupiah(amount))}</div><div class="field"><div>Untuk pembayaran</div><div>:</div><div class="dots">${safe(item.category || '-')}</div></div><div class="pay-lines"><div class="dots">${safe(item.note || item.method || '-')}</div></div><div class="bottom"><div class="rp-box"><div class="rp-label">Rp.</div><div class="rp-value">${formatRupiah(amount).replace('Rp ', '')}</div></div><div class="sign"><div><span class="date-line">${safe(item.date || new Date().toISOString().slice(0,10))}</span></div><div class="receiver">Penerima,</div><div>( <span class="name-line">&nbsp;</span> )</div></div></div></div></body></html>`;
                const w = window.open('', '_blank');
                if (!w) return showToast("Gagal mencetak. Harap izinkan Pop-up di browser Anda!", "error");
                w.document.open(); w.document.write(printContent); w.document.close(); w.focus(); setTimeout(() => w.print(), 250);
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                const amount = safeMoney(form.amount);
                if (amount <= 0) return showToast("Nominal harus lebih dari 0.", "error");
                const now = new Date().toISOString();
                const row = { ...form, amount, id: editId || `EXP-${Date.now()}`, _syncUpdatedAt: now };
                setExpenses(prev => editId ? (prev || []).map(item => String(item.id) === String(editId) ? row : item) : [row, ...(prev || [])]);
                setForm(emptyForm); setEditId(null);
                showToast(editId ? "Data biaya diperbarui." : "Data biaya ditambahkan.", "success");
            };

            const handleDelete = (id) => {
                const now = new Date().toISOString();
                setExpenses(prev => (prev || []).map(item => String(item.id) === String(id) ? { ...item, isDeleted: true, deletedAt: now, _syncUpdatedAt: now } : item));
                showToast("Data biaya dihapus.", "success");
            };

            return (
                <div className="space-y-6">
                    <div><h2 className="text-2xl font-bold text-gray-800">Biaya</h2><p className="text-sm text-gray-500 mt-1">Catat uang masuk dan uang keluar operasional.</p></div>
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
                        <Card className="border-l-4 border-l-green-500"><h3 className="text-sm font-bold text-gray-500">Uang Masuk</h3><p className="text-2xl font-black text-green-700 mt-2">{formatRupiah(totalIn)}</p></Card>
                        <Card className="border-l-4 border-l-red-500"><h3 className="text-sm font-bold text-gray-500">Uang Keluar</h3><p className="text-2xl font-black text-red-700 mt-2">{formatRupiah(totalOut)}</p></Card>
                        <Card className="border-l-4 border-l-blue-500"><h3 className="text-sm font-bold text-gray-500">Saldo Biaya</h3><p className="text-2xl font-black text-blue-700 mt-2">{formatRupiah(totalIn - totalOut)}</p></Card>
                    </div>
                    <Card>
                        <form onSubmit={handleSubmit} className="grid grid-cols-1 md:grid-cols-4 gap-3">
                            <input type="date" className="p-2 border rounded" value={form.date} onChange={e => setForm({ ...form, date: e.target.value })} required />
                            <select className="p-2 border rounded" value={form.type} onChange={e => setForm({ ...form, type: e.target.value })}><option>Uang Masuk</option><option>Uang Keluar</option></select>
                            <input className="p-2 border rounded" placeholder="Kategori biaya" value={form.category} onChange={e => setForm({ ...form, category: e.target.value })} required />
                            <input type="number" min="0" className="p-2 border rounded text-right" placeholder="Nominal" value={form.amount} onChange={e => setForm({ ...form, amount: e.target.value })} required />
                            <select className="p-2 border rounded" value={form.method} onChange={e => setForm({ ...form, method: e.target.value })}><option>Tunai</option><option>Transfer</option><option>QRIS</option><option>Debit</option><option>Lainnya</option></select>
                            <input className="p-2 border rounded" placeholder="Penerima/pembayar" value={form.party} onChange={e => setForm({ ...form, party: e.target.value })} />
                            <input className="p-2 border rounded md:col-span-2" placeholder="Keterangan" value={form.note} onChange={e => setForm({ ...form, note: e.target.value })} />
                            <div className="md:col-span-4 flex justify-end gap-2"><button type="button" onClick={() => { setForm(emptyForm); setEditId(null); }} className="px-4 py-2 bg-gray-200 rounded font-bold">Reset</button><button className="px-4 py-2 bg-blue-600 text-white rounded font-bold">{editId ? 'Simpan Edit' : 'Simpan Biaya'}</button></div>
                        </form>
                    </Card>
                    <Card>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-3 mb-4"><SearchField value={searchTerm} onChange={setSearchTerm} placeholder="Cari tanggal, jenis, kategori, keterangan, nominal..." /><select className="p-3 border rounded-lg mt-5" value={typeFilter} onChange={e => setTypeFilter(e.target.value)}><option>Semua</option><option>Uang Masuk</option><option>Uang Keluar</option></select></div>
                        <div className="overflow-x-auto"><table className="w-full text-sm text-left"><thead className="bg-gray-50"><tr><th className="p-3">Tanggal</th><th className="p-3">Jenis</th><th className="p-3">Kategori</th><th className="p-3 text-right">Nominal</th><th className="p-3 text-center">Aksi</th></tr></thead><tbody>
                            {visibleExpenses.map(item => <React.Fragment key={item.id}><tr className="border-t"><td className="p-3">{item.date}</td><td className="p-3"><Badge status={item.type} /></td><td className="p-3 font-bold">{item.category}</td><td className={`p-3 text-right font-black ${item.type === 'Uang Masuk' ? 'text-green-700' : 'text-red-700'}`}>{formatRupiah(item.amount)}</td><td className="p-3"><div className="flex justify-center flex-wrap gap-2"><button onClick={() => setExpandedIds(prev => ({ ...prev, [item.id]: !prev[item.id] }))} className="text-xs font-bold text-blue-700 bg-blue-50 px-2 py-1 rounded">{expandedIds[item.id] ? 'Sembunyikan Rincian' : 'Lihat Rincian'}</button><button onClick={() => { setEditId(item.id); setForm({ date: item.date || emptyForm.date, type: item.type || 'Uang Keluar', category: item.category || '', amount: item.amount || '', method: item.method || 'Tunai', party: item.party || '', note: item.note || '' }); }} className="text-xs font-bold text-purple-700 bg-purple-50 px-2 py-1 rounded">Edit</button><button onClick={() => printReceipt(item, 'KWITANSI')} className="text-xs font-bold text-slate-700 bg-gray-50 px-2 py-1 rounded">Cetak</button><button onClick={() => handleDelete(item.id)} className="text-red-600 bg-red-50 p-1 rounded"><IconTrash /></button></div></td></tr>{expandedIds[item.id] && <tr className="bg-gray-50"><td colSpan="5" className="p-3 text-sm"><b>Metode:</b> {item.method || '-'} | <b>Penerima/Pembayar:</b> {item.party || '-'}<br/><b>Keterangan:</b> {item.note || '-'}</td></tr>}</React.Fragment>)}
                            {visibleExpenses.length === 0 && <tr><td colSpan="5" className="p-8 text-center text-gray-500 italic">Belum ada data biaya.</td></tr>}
                        </tbody></table></div>
                    </Card>
                </div>
            );
        };

        const InvoiceView = ({ invoices, setInvoices, employees, showToast, templates }) => {
            const emptyInvoice = { date: new Date().toISOString().slice(0, 10), customer: '', address: '', type: '', size: '', qty: '', price: '', marketing: '', discountPerPcs: '', discountPercent: '', paymentStatus: 'Belum Dibayar', paymentAmount: '', paymentMethod: 'Transfer', paymentNote: '', note: '', commissionType: 'Persen', commissionValue: '5' };
            const [form, setForm] = useState(emptyInvoice);
            const [editId, setEditId] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');
            const [statusFilter, setStatusFilter] = useState('Semua');
            const [expandedIds, setExpandedIds] = useState({});
            const marketingEmployees = (employees || []).filter(isVisibleRecord).filter(emp => emp.division === 'Marketing' || emp.salaryType === 'Marketing' || emp.salaryType === 'Campuran');
            const invoiceTotal = (inv) => {
                const subtotal = safeMoney(inv.qty) * safeMoney(inv.price);
                const discount = (safeMoney(inv.discountPerPcs) * safeMoney(inv.qty)) + (subtotal * safeMoney(inv.discountPercent) / 100);
                return { subtotal, discount, total: Math.max(0, subtotal - discount) };
            };
            const paidTotal = (inv) => (Array.isArray(inv.payments) ? inv.payments : []).reduce((sum, pay) => sum + safeMoney(pay.amount), 0);
            const commissionTotal = (inv) => inv.commissionType === 'Rupiah' ? safeMoney(inv.commissionValue) : invoiceTotal(inv).total * safeMoney(inv.commissionValue) / 100;
            const visibleInvoices = (invoices || []).filter(isVisibleRecord).filter(inv => {
                if (statusFilter !== 'Semua' && inv.paymentStatus !== statusFilter) return false;
                return matchesSearch([inv.id, inv.date, inv.customer, inv.marketing, inv.type, inv.paymentStatus, inv.note], searchTerm);
            }).sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));
            const totalInvoice = visibleInvoices.reduce((sum, inv) => sum + invoiceTotal(inv).total, 0);
            const totalPaid = visibleInvoices.reduce((sum, inv) => sum + paidTotal(inv), 0);
            const totalRemaining = Math.max(0, totalInvoice - totalPaid);

            const saveInvoice = (e) => {
                e.preventDefault();
                const calc = invoiceTotal(form);
                const firstPayment = safeMoney(form.paymentAmount) > 0 ? [{ id: `PAY-${Date.now()}`, date: form.date, amount: safeMoney(form.paymentAmount), method: form.paymentMethod, note: form.paymentNote }] : [];
                const payments = editId ? (form.payments || firstPayment) : firstPayment;
                const paid = payments.reduce((sum, pay) => sum + safeMoney(pay.amount), 0);
                const status = paid <= 0 ? 'Belum Dibayar' : (paid >= calc.total ? 'Lunas' : 'Termin');
                const row = { ...form, id: editId || `INV-${Date.now()}`, qty: safeMoney(form.qty), price: safeMoney(form.price), discountPerPcs: safeMoney(form.discountPerPcs), discountPercent: safeMoney(form.discountPercent), payments, paymentStatus: status, _syncUpdatedAt: new Date().toISOString() };
                setInvoices(prev => editId ? (prev || []).map(inv => String(inv.id) === String(editId) ? row : inv) : [row, ...(prev || [])]);
                setForm(emptyInvoice); setEditId(null); showToast(editId ? "Invoice diperbarui." : "Invoice dibuat.", "success");
            };
            const deleteInvoice = (id) => setInvoices(prev => (prev || []).map(inv => String(inv.id) === String(id) ? { ...inv, isDeleted: true, deletedAt: new Date().toISOString(), _syncUpdatedAt: new Date().toISOString() } : inv));
            const printInvoice = (inv) => {
                const calc = invoiceTotal(inv), paid = paidTotal(inv), remaining = Math.max(0, calc.total - paid);
                const printContent = `<!DOCTYPE html><html><head><title>Invoice ${inv.id}</title><style>@page{size:A4;margin:14mm}body{font-family:Arial;color:#111}.head{display:flex;justify-content:space-between;border-bottom:3px solid #111;padding-bottom:16px}.brand h1{color:#b91c1c;margin:0}.box{background:#f8fafc;border:1px solid #e5e7eb;padding:12px;border-radius:8px}table{width:100%;border-collapse:collapse;margin-top:20px}th,td{border:1px solid #ddd;padding:10px}th{background:#f3f4f6}.right{text-align:right}.total{font-size:20px;font-weight:900}.sign{margin-top:70px;text-align:right}</style></head><body><div class="head"><div class="brand">${templates?.companyLogo ? `<img src="${templates.companyLogo}" style="max-height:70px"/>` : ''}<h1>${templates?.companyName || 'SIMPATI KONVEKSI'}</h1><p>${templates?.companyContact || ''}</p></div><div><h2>INVOICE</h2><b>${inv.id}</b><p>${inv.date || '-'}</p></div></div><div class="box" style="margin-top:18px"><b>Kepada:</b><br/>${inv.customer || '-'}<br/>${inv.address || '-'}</div><table><thead><tr><th>Jenis Produksi</th><th>Size/Qty</th><th class="right">Harga/Pcs</th><th class="right">Subtotal</th></tr></thead><tbody><tr><td>${inv.type || '-'}</td><td>${inv.size || '-'} / ${inv.qty || 0} pcs</td><td class="right">${formatRupiah(inv.price)}</td><td class="right">${formatRupiah(calc.subtotal)}</td></tr></tbody></table><table style="width:45%;margin-left:auto"><tr><td>Subtotal</td><td class="right">${formatRupiah(calc.subtotal)}</td></tr><tr><td>Total Diskon</td><td class="right">${formatRupiah(calc.discount)}</td></tr><tr><td class="total">Total Akhir</td><td class="right total">${formatRupiah(calc.total)}</td></tr><tr><td>Sudah Dibayar</td><td class="right">${formatRupiah(paid)}</td></tr><tr><td>Sisa</td><td class="right">${formatRupiah(remaining)}</td></tr></table><p><b>Catatan:</b> ${inv.note || '-'}</p><div class="sign"><p>Hormat kami,</p><br/><br/><b>${templates?.companyName || 'Simpati Konveksi'}</b></div></body></html>`;
                const w = window.open('', '_blank'); if (!w) return showToast("Gagal mencetak. Harap izinkan Pop-up di browser Anda!", "error"); w.document.open(); w.document.write(printContent); w.document.close(); w.focus(); setTimeout(() => w.print(), 250);
            };

            const commissionRows = Object.values(visibleInvoices.reduce((acc, inv) => {
                const key = inv.marketing || 'Tanpa Marketing';
                if (!acc[key]) acc[key] = { marketing: key, invoices: 0, sales: 0, commission: 0 };
                acc[key].invoices += 1; acc[key].sales += invoiceTotal(inv).total; acc[key].commission += commissionTotal(inv);
                return acc;
            }, {}));

            return (

                    <div className="grid grid-cols-1 xl:grid-cols-2 gap-6">
