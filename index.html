                                                            <th className="py-2 px-3 text-right">Qty</th>
                                                            <th className="py-2 px-3 text-right">Harga/Pcs</th>
                                                            <th className="py-2 px-3 text-right">Subtotal</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        {(modalData.allItems||[]).map((item,idx) => {
                                                            const isSelected = modalData.selectedKeys?.has(getRekapItemKey(item));
                                                            return (
                                                                <tr key={`${item.orderId}-${item.stage}-${idx}`} className={`border-t ${isSelected?'bg-green-50':''}`}>
                                                                    <td className="py-2 px-3 text-center"><input type="checkbox" className="w-3.5 h-3.5 rounded" checked={!!isSelected} onChange={()=>toggleModalRekapItem(item)}/></td>
                                                                    <td className="py-2 px-3 font-bold text-blue-700">{item.orderId}<div className="text-gray-500 font-normal">{item.client} ({item.type})</div></td>
                                                                    <td className="py-2 px-3">{item.stageLabel||item.stage}</td>
                                                                    <td className="py-2 px-3">{item.sizes}</td>
                                                                    <td className="py-2 px-3 text-right font-bold">{item.qty} pcs</td>
                                                                    <td className="py-2 px-3 text-right">{formatRupiah(item.unitPrice||0)}</td>
                                                                    <td className="py-2 px-3 text-right font-black text-green-700">{formatRupiah(item.wageTotal||0)}</td>
                                                                </tr>
                                                            );
                                                        })}
                                                        <tr className="bg-green-100 font-bold border-t-2">
                                                            <td colSpan="4" className="py-2 px-3 text-right">Total Gaji Produksi</td>
                                                            <td className="py-2 px-3 text-right">{modalSelectedTotal} pcs</td>
                                                            <td></td>
                                                            <td className="py-2 px-3 text-right text-green-800">{formatRupiah(modalSelectedWage)}</td>
                                                        </tr>
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    )}

                                    {/* Rincian Gaji Harian */}
                                    {modalDailySalaryLogs.filter(log=>getDailySalaryLogTotal(log).daily>0).length>0 && (
                                        <div className="border border-indigo-200 rounded-lg overflow-hidden">
                                            <div className="bg-indigo-600 text-white px-4 py-2 flex items-center justify-between">
                                                <span className="font-black text-sm">Rincian Gaji Harian</span>
                                                <span className="text-sm font-bold bg-white/20 px-2 py-0.5 rounded">{formatRupiah(modalDailySalary)}</span>
                                            </div>
                                            <table className="w-full text-xs">
                                                <thead className="bg-indigo-50 text-indigo-900"><tr><th className="py-2 px-3 text-left">Tanggal</th><th className="py-2 px-3 text-left">Keterangan</th><th className="py-2 px-3 text-right">Hari Masuk</th><th className="py-2 px-3 text-right">Gaji Harian</th><th className="py-2 px-3 text-right">Subtotal</th></tr></thead>
                                                <tbody>
                                                    {modalDailySalaryLogs.filter(log=>getDailySalaryLogTotal(log).daily>0).map((log,idx)=>{const t=getDailySalaryLogTotal(log);return(<tr key={`daily-${idx}`} className="border-t"><td className="py-2 px-3">{log.date||'-'}</td><td className="py-2 px-3">{log.note||'Masuk Kerja'}</td><td className="py-2 px-3 text-right">{log.workDays||0} hari</td><td className="py-2 px-3 text-right">{formatRupiah(log.dailySalary)}</td><td className="py-2 px-3 text-right font-black text-indigo-700">{formatRupiah(t.daily)}</td></tr>);})}
                                                    <tr className="bg-indigo-100 font-bold border-t-2"><td colSpan="4" className="py-2 px-3 text-right">Total Gaji Harian</td><td className="py-2 px-3 text-right text-indigo-800">{formatRupiah(modalDailySalary)}</td></tr>
                                                </tbody>
                                            </table>
                                        </div>
                                    )}

                                    {/* Rincian Gaji Lembur */}
                                    {modalDailySalaryLogs.filter(log=>getDailySalaryLogTotal(log).overtime>0).length>0 && (
                                        <div className="border border-sky-200 rounded-lg overflow-hidden">
                                            <div className="bg-sky-600 text-white px-4 py-2 flex items-center justify-between">
                                                <span className="font-black text-sm">Rincian Gaji Lembur</span>
                                                <span className="text-sm font-bold bg-white/20 px-2 py-0.5 rounded">{formatRupiah(modalOvertimeSalary)}</span>
                                            </div>
                                            <table className="w-full text-xs">
                                                <thead className="bg-sky-50 text-sky-900"><tr><th className="py-2 px-3 text-left">Tanggal</th><th className="py-2 px-3 text-left">Keterangan</th><th className="py-2 px-3 text-right">Jumlah Lembur</th><th className="py-2 px-3 text-right">Nominal Lembur</th><th className="py-2 px-3 text-right">Subtotal</th></tr></thead>
                                                <tbody>
                                                    {modalDailySalaryLogs.filter(log=>getDailySalaryLogTotal(log).overtime>0).map((log,idx)=>{const t=getDailySalaryLogTotal(log);return(<tr key={`ot-${idx}`} className="border-t"><td className="py-2 px-3">{log.date||'-'}</td><td className="py-2 px-3">{log.note||'Lembur'}</td><td className="py-2 px-3 text-right">{log.overtimeCount||0}x</td><td className="py-2 px-3 text-right">{formatRupiah(log.overtimeRate)}</td><td className="py-2 px-3 text-right font-black text-sky-700">{formatRupiah(t.overtime)}</td></tr>);})}
                                                    <tr className="bg-sky-100 font-bold border-t-2"><td colSpan="4" className="py-2 px-3 text-right">Total Gaji Lembur</td><td className="py-2 px-3 text-right text-sky-800">{formatRupiah(modalOvertimeSalary)}</td></tr>
                                                </tbody>
                                            </table>
                                        </div>
                                    )}

                                    {/* Rincian Komisi Marketing */}
                                    {modalMarketingInvoices.length>0 && (
                                        <div className="border border-purple-200 rounded-lg overflow-hidden">
                                            <div className="bg-purple-600 text-white px-4 py-2 flex items-center justify-between">
                                                <span className="font-black text-sm">Rincian Komisi Marketing</span>
                                                <span className="text-sm font-bold bg-white/20 px-2 py-0.5 rounded">{formatRupiah(modalMarketingCommission)}</span>
                                            </div>
                                            <table className="w-full text-xs">
                                                <thead className="bg-purple-50 text-purple-900"><tr><th className="py-2 px-3 text-left">Invoice / Order</th><th className="py-2 px-3 text-left">Nama Klien</th><th className="py-2 px-3 text-right">Nilai Transaksi</th><th className="py-2 px-3 text-right">Komisi</th></tr></thead>
                                                <tbody>
                                                    {modalMarketingInvoices.map((inv,idx)=><tr key={`mkt-${idx}`} className="border-t"><td className="py-2 px-3 font-bold text-blue-700">{inv.id}<div className="text-gray-500 font-normal">{inv.date||'-'}</div></td><td className="py-2 px-3">{inv.customer||'-'}</td><td className="py-2 px-3 text-right">{formatRupiah(getInvoiceTotals(inv).total)}</td><td className="py-2 px-3 text-right font-black text-purple-700">{formatRupiah(getInvoiceCommissionTotal(inv))}</td></tr>)}
                                                    <tr className="bg-purple-100 font-bold border-t-2"><td colSpan="3" className="py-2 px-3 text-right">Total Komisi Marketing</td><td className="py-2 px-3 text-right text-purple-800">{formatRupiah(modalMarketingCommission)}</td></tr>
                                                </tbody>
                                            </table>
                                        </div>
                                    )}

                                    {/* Kasbon & Total Akhir */}
                                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                                        <div className="bg-orange-50 border border-orange-200 rounded-lg p-4">
                                            <h4 className="font-black text-orange-900 mb-3 text-sm">Potongan Kasbon</h4>
                                            {modalCashAdvanceSummary.remaining>0 ? (
                                                <div className="space-y-2 text-sm mb-3">
                                                    <div className="flex justify-between"><span className="text-gray-600">Sisa Kasbon Aktif</span><b className="text-red-700">{formatRupiah(modalCashAdvanceSummary.remaining)}</b></div>
                                                </div>
                                            ) : (
                                                <p className="text-sm text-gray-500 italic mb-3">Tidak ada kasbon aktif.</p>
                                            )}
                                            <label className="block text-xs font-bold text-gray-600 mb-1">Input Potongan Kasbon</label>
                                            <input type="number" min="0" className="w-full p-2 border rounded text-sm text-right" value={cashAdvanceDeduction} onChange={e=>setCashAdvanceDeduction(e.target.value)} placeholder="0" disabled={modalCashAdvanceSummary.remaining<=0}/>
                                            <label className="block text-xs font-bold text-gray-600 mb-1 mt-2">Catatan</label>
                                            <input type="text" className="w-full p-2 border rounded text-sm" value={cashAdvanceDeductionNote} onChange={e=>setCashAdvanceDeductionNote(e.target.value)} placeholder="Catatan potongan kasbon"/>
                                            {modalCashAdvanceSummary.remaining>0 && <div className="text-xs text-gray-500 mt-1">Maks: {formatRupiah(Math.min(modalGrossSalary, modalCashAdvanceSummary.remaining))}</div>}
                                        </div>
                                        <div className="bg-blue-50 border border-blue-200 rounded-lg p-4">
                                            <h4 className="font-black text-blue-900 mb-3 text-sm">Total Akhir</h4>
                                            <div className="space-y-1.5 text-sm">
                                                {modalSelectedWage>0 && <div className="flex justify-between"><span className="text-gray-600">Gaji Produksi</span><span className="font-bold text-green-700">{formatRupiah(modalSelectedWage)}</span></div>}
                                                {modalDailySalary>0 && <div className="flex justify-between"><span className="text-gray-600">Gaji Harian</span><span className="font-bold text-indigo-700">{formatRupiah(modalDailySalary)}</span></div>}
                                                {modalOvertimeSalary>0 && <div className="flex justify-between"><span className="text-gray-600">Gaji Lembur</span><span className="font-bold text-sky-700">{formatRupiah(modalOvertimeSalary)}</span></div>}
                                                {modalMarketingCommission>0 && <div className="flex justify-between"><span className="text-gray-600">Komisi Marketing</span><span className="font-bold text-purple-700">{formatRupiah(modalMarketingCommission)}</span></div>}
                                                <div className="flex justify-between border-t border-blue-200 pt-1.5"><span className="font-bold">Total Bruto</span><span className="font-black">{formatRupiah(modalGrossSalary)}</span></div>
                                                {modalDeduction>0 && <div className="flex justify-between"><span className="text-gray-600">Potongan Kasbon</span><span className="font-bold text-red-600">- {formatRupiah(modalDeduction)}</span></div>}
                                                <div className="flex justify-between border-t-2 border-blue-400 pt-2 text-base"><span className="font-black text-blue-900">Total Gaji Bersih</span><span className="font-black text-blue-700">{formatRupiah(Math.max(0,modalGrossSalary-modalDeduction))}</span></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div className="flex justify-end space-x-3 px-5 py-4 bg-gray-50 border-t border-gray-200">
                                    <button onClick={() => setModalData(null)} className="px-4 py-2 bg-gray-200 hover:bg-gray-300 rounded-lg text-sm font-bold text-gray-700">Batal</button>
                                    <button onClick={executeRekapAndPrint} disabled={!modalHasPrintableIncome} className={`px-4 py-2 rounded-lg text-sm font-black text-white flex items-center gap-2 ${!modalHasPrintableIncome ? 'bg-gray-300 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-700'}`}><IconPrinter /> Proses & Cetak</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {deleteRekapConfirmId && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-[100]">
                            <div className="bg-white p-6 rounded-xl w-80 shadow-xl">
                                <h3 className="font-bold mb-2">Batalkan Rekap?</h3>
                                <p className="text-sm text-gray-600 mb-4">Laporan ini akan dihapus dan pekerjaan karyawan yang terkait akan dikembalikan ke status "Belum Direkap".</p>
                                <div className="flex justify-end space-x-2">
                                    <button onClick={() => setDeleteRekapConfirmId(null)} className="px-4 py-2 bg-gray-200 rounded text-sm font-medium">Tutup</button>
                                    <button onClick={handleDeleteRekap} className="px-4 py-2 bg-red-600 text-white rounded text-sm font-medium">Batalkan Rekap</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            )
        };

        const RiwayatRekapKinerjaView = ({ orders, setOrders, employees, rekapKinerja, setRekapKinerja, showToast, authUser }) => {
            const [searchTerm, setSearchTerm] = useState('');
            const [deleteRekapConfirmId, setDeleteRekapConfirmId] = useState(null);
            const visibleEmployees = (employees || []).filter(isVisibleRecord);
            const getRekapShareLink = (rekap) => `${window.location.href.split('#')[0]}#rekap-gaji=${encodeURIComponent(rekap.id)}`;
            const visibleRekaps = (rekapKinerja || [])
                .filter(isVisibleRecord)
                .filter(rekap => authUser?.role !== 'Karyawan' || String(rekap.empId) === String(authUser.linkedEmpId || '') || (!authUser.linkedEmpId && normalizeText(rekap.empName) === normalizeText(authUser.name)))
                .filter(rekap => {
                    const emp = visibleEmployees.find(e => String(e.id) === String(rekap.empId));
                    const itemText = (rekap.items || []).map(item => `${item.orderId} ${item.client} ${item.type} ${item.stageLabel || item.stage} ${item.sizes}`).join(' ');
                    return matchesSearch([rekap.id, rekap.empName, emp?.name, rekap.division, rekap.dateProcessed, rekap.total, rekap.totalWage, itemText], searchTerm);
                })
                .sort((a, b) => String(b.id).localeCompare(String(a.id)));

            const copyRekapShareLink = async (rekap) => {
                const link = getRekapShareLink(rekap);
                try {
                    await navigator.clipboard.writeText(link);
                    showToast("Link preview gaji berhasil disalin.", "success");
                } catch (error) {
                    window.prompt("Salin link preview gaji:", link);
                    showToast("Silakan salin link dari kotak yang muncul.", "success");
                }
            };

            const handleDeleteRekap = () => {
                const rekapToDelete = (rekapKinerja || []).find(r => String(r.id) === String(deleteRekapConfirmId));
                if (!rekapToDelete) return;
                const logsToUnlock = (rekapToDelete.items || []).flatMap(item => 
                    (item.logIds || []).map(l => ({ orderId: item.orderId, stageId: l.stageId, logId: l.logId }))
                );
                setOrders(prevOrders => {
                    const newOrders = [...(prevOrders || [])];
                    logsToUnlock.forEach(target => {
                        const orderIndex = newOrders.findIndex(o => String(o.id) === String(target.orderId));
                        if (orderIndex > -1) {
                            const order = { ...newOrders[orderIndex] };
                            const stageData = { ...(order.progress?.[target.stageId] || {}) };
                            const workLogs = [...(stageData.workLogs || [])];
                            const logIndex = workLogs.findIndex(l => String(l.id) === String(target.logId));
                            if (logIndex > -1) {
                                const now = new Date().toISOString();
                                workLogs[logIndex] = { ...workLogs[logIndex], isReported: false, isReportedChangedAt: now, _syncUpdatedAt: now };
                            }
                            stageData.workLogs = workLogs;
                            order.progress = { ...(order.progress || {}), [target.stageId]: stageData };
                            order._syncUpdatedAt = new Date().toISOString();
                            newOrders[orderIndex] = order;
                        }
                    });
                    return newOrders;
                });
                const now = new Date().toISOString();
                setRekapKinerja(prev => (prev || []).map(r => String(r.id) === String(deleteRekapConfirmId) ? { ...r, isDeleted: true, deletedAt: now, _syncUpdatedAt: now } : r));
                setDeleteRekapConfirmId(null);
                showToast("Rekap dibatalkan, pekerjaan kembali ke laporan kinerja.", "success");
            };

            return (
                <div className="space-y-6">
                    <div>
                        <h2 className="text-2xl font-bold text-gray-800">Rekap Kinerja</h2>
                        <p className="text-sm text-gray-500 mt-1">Daftar rekap gaji produksi yang sudah dicetak.</p>
                    </div>
                    <Card>
                        <SearchField value={searchTerm} onChange={setSearchTerm} placeholder="Cari ID rekap, karyawan, order, instansi, tahap..." />
                    </Card>
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                        {visibleRekaps.map(rekap => {
                            const emp = visibleEmployees.find(e => String(e.id) === String(rekap.empId));
                            return (
                                <div key={rekap.id} className="bg-white border border-green-200 rounded-xl shadow-sm overflow-hidden">
                                    <div className="p-4 bg-green-50 border-b border-green-100 flex flex-col md:flex-row md:items-start md:justify-between gap-3">
                                        <div>
                                            <div className="text-xs text-gray-500 font-bold">ID: {rekap.id}</div>
                                            <h3 className="text-lg font-black text-gray-900">{rekap.empName || emp?.name || '-'}</h3>
                                            <div className="text-xs font-semibold text-green-800">{rekap.division || emp?.division || '-'}</div>
                                            <div className="text-xs text-gray-500 mt-1">Tanggal rekap: {rekap.dateProcessed}</div>
                                        </div>
                                        <div className="text-right">
                                            <div className="text-sm font-bold text-gray-800">{rekap.total || 0} pcs</div>
                                            <div className="text-lg font-black text-green-800">{formatRupiah(rekap.totalWage || 0)}</div>
                                        </div>
                                    </div>
                                    <div className="p-4 space-y-3">
                                        <div className="max-h-40 overflow-y-auto border border-gray-100 rounded-lg divide-y divide-gray-100">
                                            {(rekap.items || []).map((item, idx) => (
                                                <div key={`${rekap.id}-${idx}`} className="p-3 text-sm">
                                                    <div className="font-bold text-gray-800">{item.orderId} - {item.client}</div>
                                                    <div className="text-xs text-gray-500">{item.type} | {item.stageLabel || item.stage} | {item.sizes}</div>
                                                    <div className="text-xs font-bold text-green-700 mt-1">{item.qty || 0} pcs - {formatRupiah(item.wageTotal || 0)}</div>
                                                </div>
                                            ))}
                                        </div>
                                        <div className="flex flex-wrap justify-end gap-2">
                                            <a href={getRekapShareLink(rekap)} target="_blank" className="text-blue-600 hover:text-white hover:bg-blue-600 p-2 border border-blue-200 rounded bg-white flex items-center gap-1 text-xs font-bold transition-colors" title="Buka Preview"><IconDocument /> Buka</a>
                                            <button onClick={() => copyRekapShareLink(rekap)} className="text-green-700 hover:text-white hover:bg-green-600 p-2 border border-green-200 rounded bg-white flex items-center gap-1 text-xs font-bold transition-colors" title="Salin Link Share"><IconCheckCircle /> Salin Link</button>
                                            {authUser?.role !== 'Karyawan' && <button onClick={() => setDeleteRekapConfirmId(rekap.id)} className="text-red-500 hover:text-white hover:bg-red-500 p-2 border border-red-200 rounded bg-white flex items-center gap-1 text-xs font-bold transition-colors" title="Batalkan Rekap"><IconTrash /> Batal Rekap</button>}
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                    {visibleRekaps.length === 0 && (
                        <Card className="p-8 text-center text-gray-500 italic border-dashed border-2">
                            {searchTerm ? 'Tidak ada riwayat rekap yang cocok dengan pencarian.' : 'Belum ada riwayat rekap kinerja.'}
                        </Card>
                    )}
                    {deleteRekapConfirmId && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-[100] p-4">
                            <div className="bg-white p-6 rounded-xl w-full max-w-sm shadow-xl">
                                <h3 className="font-bold mb-2">Batalkan Rekap?</h3>
                                <p className="text-sm text-gray-600 mb-4">Laporan ini akan dibatalkan dan pekerjaan karyawan yang terkait kembali ke status belum direkap.</p>
                                <div className="flex justify-end space-x-2">
                                    <button onClick={() => setDeleteRekapConfirmId(null)} className="px-4 py-2 bg-gray-200 rounded text-sm font-medium">Tutup</button>
                                    <button onClick={handleDeleteRekap} className="px-4 py-2 bg-red-600 text-white rounded text-sm font-medium">Batalkan Rekap</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const RiwayatProduksiView = ({ orders, setOrders, showToast }) => {
            const [searchTerm, setSearchTerm] = useState('');
            const finishedOrders = (orders || []).filter(o => isVisibleOrder(o) && o?.isArchived);
            const filteredFinishedOrders = finishedOrders.filter(order => matchesSearch(orderSearchFields(order), searchTerm));

            return (
                <div className="space-y-6">
                    <h2 className="text-2xl font-bold text-gray-800">Riwayat Produksi Selesai</h2>
                    <p className="text-gray-600 mb-6">Berikut adalah daftar seluruh pesanan produksi yang telah 100% selesai dikerjakan, terkirim ke klien, dan sudah diarsipkan.</p>

                    <Card>
                        <div className="mb-4 max-w-lg">
                            <SearchField value={searchTerm} onChange={setSearchTerm} placeholder="Cari tanggal, ID order, klien, barang..." />
                        </div>
                        <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse">
                                <thead>
                                    <tr className="bg-gray-50 border-b border-gray-200">
                                        <th className="p-3 text-sm font-semibold text-gray-600">Tanggal Masuk</th>
                                        <th className="p-3 text-sm font-semibold text-gray-600">ID Order</th>
                                        <th className="p-3 text-sm font-semibold text-gray-600">Klien</th>
                                        <th className="p-3 text-sm font-semibold text-gray-600">Barang</th>
                                        <th className="p-3 text-sm font-semibold text-gray-600">Rincian</th>
                                        <th className="p-3 text-sm font-semibold text-gray-600">Total Terkirim</th>
                                        <th className="p-3 text-sm font-semibold text-gray-600 text-center">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {filteredFinishedOrders.map(order => {
                                        const sizesDetails = sortSizeKeys(Object.keys(order.sizes || {}))
                                            .map((size) => `${size}(${order.sizes[size]})`)
                                            .join(', ');
                                            
                                        return (
                                            <tr key={order.id} className="border-b border-gray-100 hover:bg-gray-50 transition-colors">
                                                <td className="p-3 text-sm text-gray-600">{order.date}</td>
                                                <td className="p-3 text-sm font-medium text-blue-600">{order.id}</td>
                                                <td className="p-3 text-sm font-bold text-gray-800">{order.client}</td>
                                                <td className="p-3 text-sm text-gray-600">{order.type}</td>
                                                <td className="p-3 text-sm text-gray-600">{sizesDetails}</td>
                                                <td className="p-3 text-sm font-bold text-green-600 bg-green-50/50">{order.total} pcs</td>
                                                <td className="p-3 text-center">
                                                    <button 
                                                        onClick={() => {
                                                            setOrders(prev => prev.map(o => String(o.id) === String(order.id) ? { ...o, isArchived: false } : o));
                                                            showToast("Order dikembalikan ke proses aktif.", "success");
                                                        }}
                                                        className="text-orange-600 hover:text-orange-800 bg-orange-50 hover:bg-orange-100 p-2 rounded-md transition-colors"
                                                        title="Batalkan Arsip / Kembalikan ke Proses"
                                                    >
                                                        <IconRestore />
                                                    </button>
                                                </td>
                                            </tr>
                                        )
                                    })}
                                    {filteredFinishedOrders.length === 0 && (
                                        <tr>
                                            <td colSpan="7" className="p-8 text-center text-gray-500 italic border border-dashed border-gray-200">
                                                {searchTerm ? 'Tidak ada riwayat produksi yang cocok dengan pencarian.' : 'Belum ada data produksi yang telah diarsipkan.'}
                                            </td>
                                        </tr>
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </Card>
                </div>

        };

        const LaporanOrderView = ({ orders, employees, templates, showToast }) => {

            const [searchTerm, setSearchTerm] = useState('');

                if (dateStart && orderDate < dateStart) return false;
                if (dateEnd && orderDate > dateEnd) return false;
                return matchesSearch([order.id, order.client, order.type, order.marketing, order.status, order.deadline, order.date], searchTerm);
            });
            const safeEmployees = (employees || []).filter(isVisibleRecord);
            const order = safeOrders.find(o => String(o.id) === String(selectedOrderId));
            const formatReportDate = (value) => value ? new Date(value).toLocaleString('id-ID', { dateStyle: 'short', timeStyle: 'short' }) : '-';

            const generateReportData = () => {
                if (!order) return [];
                let reportData = [];
                const stagesInfo = getActiveProductionStages(order).map(stage => ({ id: stage.id, label: stage.label }));
                
                stagesInfo.forEach(stage => {
                    const stageData = order.progress?.[stage.id];
                    if (stageData && stageData.workLogs) {
                        stageData.workLogs.forEach(log => {
                            const displayQty = log.checkAfter ? getWorkLogSubmittedQty(log) : getWorkLogTakenQty(log);
                            if (!log.isDeleted && displayQty > 0 && (log.checkBefore || log.checkAfter)) {
                                const emp = safeEmployees.find(e => String(e.id) === String(log.empId));
                                reportData.push({
                                    stage: stage.label,
                                    empName: emp ? emp.name : `Karyawan ID ${log.empId || '-'}`,
                                    sizes: log.checkAfter ? `${log.size} (Ambil ${getWorkLogTakenQty(log)} / Setor ${getWorkLogSubmittedQty(log)})` : `${log.size} (Ambil ${getWorkLogTakenQty(log)})`,
                                    total: displayQty,
                                    takenAt: log.takenAt,
                                    submittedAt: log.submittedAt,
                                    status: log.checkAfter ? 'Sudah Setor' : 'Sudah Ambil'

                });
                return reportData;
            };

            const reportData = generateReportData();

            const handlePrint = () => {
                const printContent = `
                <!DOCTYPE html>
                <html>
                <head>
                    <title>Laporan Detail Order - ${order.id}</title>
                    <style>
                        body { font-family: 'Arial', sans-serif; padding: 20px; color: #000; line-height: 1.5; }
                        .header { display: flex; align-items: center; justify-content: center; position: relative; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 20px; }
                        .header-logo { position: absolute; left: 0; top: 50%; transform: translateY(-50%); max-height: 60px; }
                        .header-text { text-align: center; }

                        .header p { margin: 5px 0 0 0; font-size: 14px; }
                        .info { margin-bottom: 20px; font-size: 14px; }
                        .info table td { padding: 2px 10px 2px 0; }
                        .data-table { width: 100%; border-collapse: collapse; margin-bottom: 30px; font-size: 12px; }
                        .data-table th, .data-table td { border: 1px solid #000; padding: 7px; text-align: left; }
                        .data-table th { background-color: #f3f4f6; text-align: center; }
                        .text-center { text-align: center; }
                        .font-bold { font-weight: bold; }
                        .footer { display: flex; justify-content: space-between; margin-top: 50px; font-size: 14px; text-align: center; padding: 0 40px; }
                        .signature { margin-top: 80px; font-weight: bold; text-decoration: underline; }
                    </style>
                </head>
                <body>
                    <div class="header">
                        ${templates?.companyLogo ? `<img src="${templates.companyLogo}" class="header-logo" />` : ''}
                        <div class="header-text">
                            <h1>${templates?.companyName || 'SIMPATI KONVEKSI'}</h1>
                            <p>Laporan Detail Pengerjaan Karyawan per Order</p>
                        </div>
                    </div>
                    <div class="info">
                        <table>
                            <tr><td class="font-bold">ID Order</td><td>: ${order.id}</td></tr>
                            <tr><td class="font-bold">Klien / Instansi</td><td>: ${order.client}</td></tr>
                            <tr><td class="font-bold">Jenis Barang</td><td>: ${order.type}</td></tr>
                            <tr><td class="font-bold">Total Order</td><td>: ${order.total} pcs</td></tr>
                            <tr><td class="font-bold">Tanggal Cetak</td><td>: ${new Date().toLocaleDateString('id-ID')}</td></tr>
                        </table>
                    </div>
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th style="width: 40px;">No.</th><th>Tahap Produksi</th><th>Nama Karyawan</th><th>Rincian Ukuran</th><th style="width: 80px;">Total</th><th>Status</th><th>Tanggal Ambil</th><th>Tanggal Setor</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${reportData.length > 0 ? reportData.map((item, idx) => `<tr><td class="text-center">${idx + 1}</td><td class="font-bold text-blue-800">${item.stage}</td><td>${item.empName}</td><td>${item.sizes}</td><td class="text-center font-bold">${item.total}</td><td>${item.status}</td><td>${formatReportDate(item.takenAt)}</td><td>${formatReportDate(item.submittedAt)}</td></tr>`).join('') : '<tr><td colspan="8" class="text-center italic">Belum ada data pengerjaan.</td></tr>'}
                        </tbody>
                    </table>
                    <div class="footer"><div><p>${templates.laporanSignatureLeft}</p><div class="signature">(...................................)</div></div></div>
                </body>
                </html>
                `;

                let printWindow = window.open('', '_blank');
                if (printWindow) {
                    printWindow.document.open();
                    printWindow.document.write(printContent);
                    printWindow.document.close();
                    printWindow.focus();
                    setTimeout(() => { printWindow.print(); }, 250);
                } else {
                    showToast("Gagal mencetak. Harap izinkan Pop-up di browser Anda!", "error");
                }
            };

            return (
                <div className="space-y-6">
                    <h2 className="text-2xl font-bold text-gray-800">Laporan Detail Per Order</h2>
                    <Card className="bg-blue-50 border-blue-100">
                        <div className="grid grid-cols-1 md:grid-cols-4 gap-3 mb-4">
                            <div className="md:col-span-2"><SearchField value={searchTerm} onChange={setSearchTerm} placeholder="Cari ID order, instansi, jenis, marketing, status..." /></div>
                            <div><label className="block text-xs font-bold text-blue-900 mb-1">Tanggal Awal</label><input type="date" className="w-full p-2 border border-blue-300 rounded-lg" value={dateStart} onChange={e => setDateStart(e.target.value)} /></div>
                            <div><label className="block text-xs font-bold text-blue-900 mb-1">Tanggal Akhir</label><input type="date" className="w-full p-2 border border-blue-300 rounded-lg" value={dateEnd} onChange={e => setDateEnd(e.target.value)} /></div>
                        </div>
                        <label className="block text-sm font-bold text-blue-900 mb-2">Pilih Order Produksi</label>
                        <select className="w-full md:w-1/2 p-2 border border-blue-300 rounded-lg focus:ring-blue-500 outline-none" value={selectedOrderId} onChange={e => setSelectedOrderId(e.target.value)}>
                            <option value="">-- Pilih ID Order --</option>
                            {filteredOrders.map(o => <option key={o.id} value={o.id}>{o.id} - {o.client} ({o.type})</option>)}
                        </select>
                    </Card>

                    {order && (
                        <Card>
                            <div className="flex justify-between items-center mb-6 border-b pb-4">
                                <div><h3 className="text-xl font-bold text-gray-800">{order.id}</h3><p className="text-sm text-gray-600">{order.client} | {order.type} ({order.total} pcs)</p></div>
                                {reportData.length > 0 && <button onClick={handlePrint} className="bg-blue-600 text-white px-5 py-2 rounded-lg font-medium flex gap-2"><IconPrinter /> Cetak</button>}
                            </div>
                            <div className="overflow-x-auto">
                                <table className="w-full text-left border-collapse">
                                    <thead><tr className="bg-gray-50 border-b">
                                        <th className="p-3 text-sm">Tahap Produksi</th><th className="p-3 text-sm">Nama Karyawan</th><th className="p-3 text-sm">Rincian Ukuran</th><th className="p-3 text-sm text-center">Jumlah</th><th className="p-3 text-sm">Status</th><th className="p-3 text-sm">Tanggal Ambil</th><th className="p-3 text-sm">Tanggal Setor</th>
                                    </tr></thead>
                                    <tbody>
                                        {reportData.map((item, idx) => (

                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </Card>
                    )}
                </div>
            );
        };

        const TrackingInstansiView = ({ orders, templates, showToast }) => {
            const [selectedClient, setSelectedClient] = useState('');
            const safeOrders = (orders || []).filter(isVisibleOrder);
            
            const activeOrders = safeOrders.filter(o => !o?.isArchived);
            const clients = [...new Set(activeOrders.map(o => o.client))];

            const clientOrders = activeOrders.filter(o => o.client === selectedClient);
            const customerTrackingLink = selectedClient ? `${window.location.href.split('#')[0]}#customer-tracking=${encodeURIComponent(selectedClient)}` : '';

            const copyCustomerTrackingLink = async () => {
                if (!customerTrackingLink) return;
                try {
                    await navigator.clipboard.writeText(customerTrackingLink);
                    showToast("Link customer berhasil disalin.", "success");
                } catch (error) {
                    window.prompt("Salin link tracking customer:", customerTrackingLink);
                    showToast("Silakan salin link dari kotak yang muncul.", "success");
                }
            };

            const getCompletedPerStage = (orderData, stageId, size) => {
                let total = 0;
                if (orderData.progress && orderData.progress[stageId] && orderData.progress[stageId].workLogs) {
                    orderData.progress[stageId].workLogs.forEach(log => {
                        if (!log.isDeleted && log.size === size && log.checkAfter) {
                            total += getWorkLogSubmittedQty(log);
                        }
                    });
                }
                return total;
            };

            const printTracking = () => {
                if (!selectedClient || clientOrders.length === 0) return;

                const currentDate = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });

                let ordersHtml = clientOrders.map(order => {
                    const activeStages = getActiveProductionStages(order);
                    const stageHeadersHtml = activeStages.map(stage => `<th>${stage.label}</th>`).join('');
                    let rowsHtml = sortSizeKeys(Object.keys(order.sizes || {})).map(size => {
                        const targetQty = order.sizes[size] || 0;
                        const stageCellsHtml = activeStages.map(stage => `<td>${getCompletedPerStage(order, stage.id, size)}</td>`).join('');
                        const shippedQty = (order.shipped && order.shipped[size]) || 0;

                        return `
                            <tr>
                                <td class="font-bold">${size}</td>
                                <td class="font-bold bg-gray">${targetQty}</td>
                                ${stageCellsHtml}
                                <td class="font-bold text-green">${shippedQty}</td>
                            </tr>
                        `;
                    }).join('');

                    return `
                        <div style="margin-bottom: 20px; page-break-inside: avoid;">
                            <div style="background-color: #f3f4f6; padding: 8px; border: 1px solid #000; border-bottom: none; font-weight: bold; font-size: 14px;">
                                ID Order: ${order.id} - ${order.type} | Target: ${order.total} pcs | Deadline: ${order.deadline}
                            </div>
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th>Ukuran</th>
                                        <th>Target</th>
                                        ${stageHeadersHtml}
                                        <th>Terkirim</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${rowsHtml}
                                </tbody>
                            </table>
                        </div>
                    `;
                }).join('');

                const printContent = `
                <!DOCTYPE html>
                <html>
                <head>
                    <title>Tracking Produksi - ${selectedClient}</title>
                    <style>
                        body { font-family: 'Arial', sans-serif; padding: 20px; color: #000; line-height: 1.5; }
                        .header { display: flex; align-items: center; justify-content: center; position: relative; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 20px; }
                        .header-logo { position: absolute; left: 0; top: 50%; transform: translateY(-50%); max-height: 60px; }
                        .header-text { text-align: center; }
                        .header h1 { margin: 0; font-size: 24px; text-transform: uppercase; color: #b91c1c; }
                        .header p { margin: 5px 0 0 0; font-size: 14px; }
                        .info { margin-bottom: 20px; font-size: 14px; }
                        .info table td { padding: 2px 10px 2px 0; }
                        .data-table { width: 100%; border-collapse: collapse; margin-bottom: 30px; font-size: 13px; text-align: center; }
                        .data-table th, .data-table td { border: 1px solid #000; padding: 6px; }
                        .data-table th { background-color: #e5e7eb; }
                        .font-bold { font-weight: bold; }
                        .bg-gray { background-color: #f9fafb; }
                        .text-green { color: #15803d; }
                        .footer { display: flex; justify-content: space-between; margin-top: 50px; font-size: 14px; text-align: center; padding: 0 40px; page-break-inside: avoid; }
                        .signature { margin-top: 80px; font-weight: bold; text-decoration: underline; }
                    </style>
                </head>
                <body>
                    <div class="header">
                        ${templates?.companyLogo ? `<img src="${templates.companyLogo}" class="header-logo" />` : ''}
                        <div class="header-text">
                            <h1>${templates?.companyName || 'SIMPATI KONVEKSI'}</h1>
                            <p>Laporan Tracking Produksi per Instansi</p>
                        </div>
                    </div>
                    
                    <div class="info">
                        <table>
                            <tr><td class="font-bold">Nama Klien / Instansi</td><td>: ${selectedClient}</td></tr>
                            <tr><td class="font-bold">Total Order Aktif</td><td>: ${clientOrders.length} Pesanan</td></tr>
                            <tr><td class="font-bold">Tanggal Cetak</td><td>: ${currentDate}</td></tr>
                        </table>
                    </div>

                    ${ordersHtml}

                    <div class="footer">
                        <div>
                            <p>${templates?.laporanSignatureLeft || 'Mengetahui, Admin / Mandor'}</p>
                            <div class="signature">(...................................)</div>
                        </div>
                        <div>
                            <p>${templates?.laporanSignatureRight || 'Pekerja / Karyawan'}</p>
                            <div class="signature">(...................................)</div>
                        </div>
                    </div>
                </body>
                </html>
                `;

                let printWindow = window.open('', '_blank');
                if (printWindow) {
                    printWindow.document.open();
                    printWindow.document.write(printContent);
                    printWindow.document.close();
                    printWindow.focus();
                    setTimeout(() => { printWindow.print(); }, 250);
                } else {
                    showToast("Gagal mencetak. Harap izinkan Pop-up di browser Anda!", "error");
                }
            };

            return (
                <div className="space-y-6">
                    <h2 className="text-2xl font-bold text-gray-800">Tracking Detail Instansi</h2>
                    <p className="text-gray-500 text-sm">Pantau jumlah barang yang telah selesai di masing-masing tahapan produksi secara *real-time* per ukuran.</p>

                    <Card className="bg-indigo-50 border-indigo-100 flex flex-col md:flex-row justify-between items-start md:items-end gap-4">
                        <div className="w-full md:w-1/2">
                            <label className="block text-sm font-bold text-indigo-900 mb-2">Pilih Instansi / Klien</label>
                            <select className="w-full p-2 border border-indigo-300 rounded-lg focus:ring-indigo-500 outline-none" value={selectedClient} onChange={e => setSelectedClient(e.target.value)}>
                                <option value="">-- Pilih Instansi --</option>
                                {clients.map(c => <option key={c} value={c}>{c}</option>)}
                            </select>
                        </div>
                        {selectedClient && clientOrders.length > 0 && (
                            <div className="flex flex-col sm:flex-row gap-2 w-full md:w-auto">
                                <a href={customerTrackingLink} target="_blank" className="bg-green-600 hover:bg-green-700 text-white px-5 py-2.5 rounded-lg font-bold flex items-center justify-center gap-2 transition-colors shadow-sm text-sm">
                                    Buka Link Customer
                                </a>
                                <button onClick={printTracking} className="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-lg font-bold flex items-center justify-center gap-2 transition-colors shadow-sm text-sm">
                                    <IconPrinter /> Cetak
                                </button>
                            </div>
                        )}
                    </Card>

                    {selectedClient && clientOrders.length > 0 && (
                        <Card className="border-green-100 bg-green-50">
                            <div className="flex flex-col lg:flex-row lg:items-end gap-4">
                                <div className="flex-1">
                                    <label className="block text-sm font-bold text-green-900 mb-2">Link Tracking untuk Customer</label>
                                    <input
                                        type="text"
                                        readOnly
                                        className="w-full p-3 border border-green-200 rounded-lg bg-white text-sm text-gray-700"
                                        value={customerTrackingLink}
                                        onFocus={e => e.target.select()}
                                    />
                                </div>
                                <button onClick={copyCustomerTrackingLink} className="bg-green-700 hover:bg-green-800 text-white px-5 py-3 rounded-lg font-bold text-sm">
                                    Salin Link
                                </button>
                            </div>
                            <p className="text-xs text-green-800 mt-3">Kirim link ini ke customer agar mereka bisa melihat update detail status order tanpa login admin.</p>
                        </Card>
                    )}

                    {selectedClient && clientOrders.length > 0 && (
                        <div className="space-y-6">
                            {clientOrders.map(order => {
                                const activeStages = getActiveProductionStages(order);
                                return (
                                <Card key={order.id} className="border-l-4 border-l-indigo-500">
                                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-4 border-b border-gray-100 pb-4">
                                        <div>
                                            <h3 className="text-xl font-bold text-gray-800">{order.id} - {order.type}</h3>
                                            <p className="text-sm text-gray-500 mt-1">Deadline: <span className="font-bold text-red-600">{order.deadline}</span></p>
                                        </div>
                                        <div className="mt-2 md:mt-0">
                                            <Badge status={order.status} />
                                            <span className="ml-2 font-bold text-indigo-600 bg-indigo-50 px-3 py-1 rounded-lg">Target: {order.total} pcs</span>
                                        </div>
                                    </div>

                                    <div className="overflow-x-auto">
                                        <table className="w-full text-sm text-center border border-gray-200">
                                            <thead className="bg-gray-100 border-b border-gray-200 text-gray-700">
                                                <tr>
                                                    <th className="p-3 border-r border-gray-200 w-24">Ukuran</th>
                                                    <th className="p-3 border-r border-gray-200 font-black">Target</th>
                                                    {activeStages.map(stage => (
                                                        <th key={stage.id} className="p-3 border-r border-gray-200 text-blue-700">{stage.label}</th>
                                                    ))}
                                                    <th className="p-3 bg-green-50 text-green-700 font-bold">Terkirim</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {sortSizeKeys(Object.keys(order.sizes || {})).map(size => {
                                                    const targetQty = order.sizes[size] || 0;
                                                    const shippedQty = (order.shipped && order.shipped[size]) || 0;

                                                    const getBgColor = (qty) => qty >= targetQty ? 'bg-green-50 font-bold text-green-700' : (qty > 0 ? 'text-gray-800 font-semibold' : 'text-gray-400');

                                                    return (
                                                        <tr key={size} className="border-b border-gray-200 hover:bg-gray-50 transition-colors">
                                                            <td className="p-3 border-r border-gray-200 font-bold text-gray-800 bg-gray-50">{size}</td>
                                                            <td className="p-3 border-r border-gray-200 font-black text-gray-900 bg-gray-100">{targetQty}</td>
                                                            {activeStages.map(stage => {
                                                                const stageQty = getCompletedPerStage(order, stage.id, size);
                                                                return <td key={stage.id} className={`p-3 border-r border-gray-200 ${getBgColor(stageQty)}`}>{stageQty}</td>;
                                                            })}
                                                            <td className={`p-3 border-l-2 border-green-200 ${getBgColor(shippedQty)}`}>{shippedQty}</td>
                                                        </tr>
                                                    )
                                                })}
                                            </tbody>
                                        </table>
                                    </div>
                                    <div className="mt-3 text-xs text-gray-500 italic text-right">
                                        * Angka menunjukkan jumlah barang yang sudah disetor melalui checklist "Setor" oleh karyawan di tahap tersebut.
                                    </div>
                                </Card>
                                );
                            })}
                        </div>
                    )}
                    
                    {selectedClient && clientOrders.length === 0 && (
                        <div className="p-8 text-center text-gray-500 bg-white rounded-xl shadow-sm border border-gray-100">
                            Tidak ada pesanan aktif untuk instansi ini.
                        </div>
                    )}
                </div>
            );
        };

        const CustomerTrackingView = ({ client, orders, templates }) => {
            const stageColorMap = {
                cutting: 'bg-blue-600',
                sablon: 'bg-yellow-500',
                jahit: 'bg-purple-600',
                kancing: 'bg-orange-500',
                finishing: 'bg-teal-600',
                terkirim: 'bg-green-600'
            };

            const clientOrders = (orders || []).filter(isVisibleOrder)
                .filter(o => !o?.isArchived && String(o?.client || '') === String(client || ''))
                .sort((a, b) => new Date(a.deadline || 0) - new Date(b.deadline || 0));

            const getStageTotal = (order, stageId) => {
                if (stageId === 'terkirim') {
                    return Object.values(order.shipped || {}).reduce((sum, qty) => sum + (parseInt(qty) || 0), 0);
                }
                return sortSizeKeys(Object.keys(order.sizes || {})).reduce((sum, size) => sum + getCompletedPerStage(order, stageId, size), 0);
            };

            const getStagePercent = (order, stageId) => {
                const total = parseInt(order.total) || 0;
                if (total <= 0) return 0;
                return Math.min(100, Math.round((getStageTotal(order, stageId) / total) * 100));
            };

            const getCustomerStages = (order) => [
                ...getActiveProductionStages(order).map(stage => ({ ...stage, color: stageColorMap[stage.id] || 'bg-blue-600' })),
                { id: 'terkirim', label: 'Terkirim', color: stageColorMap.terkirim }
            ];

            const getOverallProgressPercent = (order) => {
                if (order?.status === 'Terkirim') return 100;
                const stagesInfo = getCustomerStages(order);
                const totalStagePercent = stagesInfo.reduce((sum, stage) => sum + getStagePercent(order, stage.id), 0);
                return stagesInfo.length ? Math.min(100, Math.round(totalStagePercent / stagesInfo.length)) : 0;
            };

            return (
                <div className="min-h-screen bg-gray-50">
                    <header className="bg-slate-900 text-white px-4 py-5 print:hidden">
                        <div className="max-w-6xl mx-auto flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                            <div className="flex items-center gap-4">
                                {templates?.companyLogo ? (
                                    <img src={templates.companyLogo} alt="Logo" className="h-12 object-contain bg-white/5 p-1 rounded" />
                                ) : (
                                    <div className="w-12 h-12 rounded bg-red-600 flex items-center justify-center font-black">SK</div>
                                )}
                                <div>
                                    <h1 className="text-xl font-black tracking-wide">{templates?.companyName || 'SIMPATI KONVEKSI'}</h1>
                                    <p className="text-sm text-slate-300">Update Status Produksi</p>
                                </div>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-6xl mx-auto p-4 md:p-8 space-y-6">
                        <div className="bg-white border border-gray-200 rounded-xl p-5 shadow-sm">
                            <div className="flex flex-col md:flex-row md:items-end md:justify-between gap-4">
                                <div>
                                    <div className="text-xs font-bold text-blue-700 uppercase tracking-wide">Instansi / Customer</div>
                                    <h2 className="text-2xl font-black text-gray-900 mt-1">{client || '-'}</h2>
                                    <p className="text-sm text-gray-500 mt-1">Data diperbarui mengikuti catatan produksi terbaru.</p>
                                </div>
                                <div className="grid grid-cols-2 gap-3 text-sm">
                                    <div className="bg-blue-50 border border-blue-100 rounded-lg p-3">
                                        <div className="text-xs font-bold text-blue-700">Order Aktif</div>
                                        <div className="text-xl font-black text-blue-900">{clientOrders.length}</div>
                                    </div>
                                    <div className="bg-green-50 border border-green-100 rounded-lg p-3">
                                        <div className="text-xs font-bold text-green-700">Total Barang</div>
                                        <div className="text-xl font-black text-green-900">{clientOrders.reduce((sum, o) => sum + (parseInt(o.total) || 0), 0)} pcs</div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {clientOrders.length > 0 ? (
                            <div className="space-y-6">
                                {clientOrders.map(order => (
                                    <div key={order.id} className="bg-white border border-gray-200 rounded-xl shadow-sm overflow-hidden">
                                        <div className="p-5 flex flex-col lg:flex-row lg:items-center lg:justify-between gap-5">
                                            <div className="flex items-start gap-4">
                                                <div className="w-24 h-24 rounded-lg border border-gray-200 bg-gray-50 overflow-hidden flex items-center justify-center shrink-0">
                                                    {order.designImage1 ? (
                                                        <img src={order.designImage1} alt={`Desain 1 ${order.id}`} className="w-full h-full object-cover" />
                                                    ) : (
                                                        <div className="text-center text-gray-400 text-xs font-bold px-2">
                                                            <IconImage />
                                                            <div className="mt-1">Desain 1</div>
                                                        </div>
                                                    )}
                                                </div>
                                                <div>
                                                    <div className="flex flex-wrap items-center gap-2">
                                                        <h3 className="text-xl font-black text-gray-900">{order.id}</h3>
                                                        <Badge status={order.status} />
                                                    </div>
                                                    <p className="text-sm text-gray-600 mt-1">{order.type} - {order.total} pcs</p>
                                                    <p className="text-xs text-red-600 font-bold mt-1">Deadline: {order.deadline || '-'}</p>
                                                </div>
                                            </div>
                                            <div className="w-full lg:w-80 bg-gray-50 border border-gray-100 rounded-lg p-4">
                                                <div className="flex items-center justify-between mb-2">
                                                    <div className="text-xs font-bold text-gray-500 uppercase">Progress</div>
                                                    <div className="text-2xl font-black text-green-700">{getOverallProgressPercent(order)}%</div>
                                                </div>
                                                <div className="h-3 bg-gray-200 rounded-full overflow-hidden">
                                                    <div className="h-full bg-green-600" style={{ width: `${getOverallProgressPercent(order)}%` }}></div>
                                                </div>
                                                <div className="mt-3 text-xs font-bold text-gray-500">Status</div>
                                                <div className="mt-1"><Badge status={order.status} /></div>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        ) : (
                            <div className="bg-white border-2 border-dashed border-gray-200 rounded-xl p-10 text-center text-gray-500">
                                Tidak ada order aktif untuk instansi ini.
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const RekapGajiShareView = ({ rekapId, employees, rekapKinerja, templates }) => {
            const rekap = (rekapKinerja || []).filter(isVisibleRecord).find(r => String(r.id) === String(rekapId));
            const employee = (employees || []).filter(isVisibleRecord).find(emp => String(emp.id) === String(rekap?.empId));
            const formatReceiptMoney = (num) => formatRupiah(num || 0).replace(/\s/g, '');

            if (!rekap) {
                return (
                    <div className="min-h-screen bg-gray-50 flex items-center justify-center p-4">
                        <div className="bg-white border border-gray-200 rounded-xl shadow-sm p-8 max-w-md text-center">
                            <h1 className="text-xl font-black text-gray-900">Rekap Tidak Ditemukan</h1>
                            <p className="text-sm text-gray-500 mt-2">Link rekap gaji ini tidak tersedia atau rekap sudah dibatalkan.</p>
                        </div>
                    </div>
                );
            }

            const empName = employee?.name || rekap.empName || rekap.empId || '-';
            const division = employee?.division || rekap.division || '-';

            return (
                <div className="min-h-screen bg-gray-100 p-4">
                    <style>{`
                        @media print {
                            @page { size: 80mm 210mm; margin: 4mm; }
                            html, body { width: 72mm; background: #fff !important; }
                            body { margin: 0 auto !important; padding: 0 !important; }
                            .share-print-hidden { display: none !important; }
                            .share-receipt-wrap { padding: 0 !important; background: #fff !important; }
                            .share-receipt { width: 72mm !important; max-width: 72mm !important; box-shadow: none !important; border: none !important; padding: 0 !important; margin: 0 auto !important; }
                        }
                    `}</style>
                    <div className="share-print-hidden max-w-3xl mx-auto mb-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
                        <div>
                            <h1 className="text-xl font-black text-gray-900">Preview Rekap Gaji</h1>
                            <p className="text-sm text-gray-500">Karyawan hanya dapat melihat rekap gaji dari link ini.</p>
                        </div>
                        <button onClick={() => window.print()} className="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-lg font-bold flex items-center justify-center gap-2 text-sm">
                            <IconPrinter /> Cetak / Simpan PDF
                        </button>
                    </div>

                    <div className="share-receipt-wrap flex justify-center">
                        <div className="share-receipt bg-white shadow-xl border border-gray-200 p-4" style={{ width: '80mm', maxWidth: '100%' }}>
                            <div className="text-center border-b border-dashed border-black pb-2 mb-2">
                                {templates?.companyLogo && <img src={templates.companyLogo} className="mx-auto object-contain mb-1" style={{ maxHeight: 38, maxWidth: 64 }} />}
                                <h2 className="font-black uppercase leading-tight text-sm">{templates?.companyName || 'SIMPATI KONVEKSI'}</h2>
                                <p className="text-[11px] mt-1">Struk Gaji Produksi</p>
                            </div>

                            <div className="border-b border-dashed border-black pb-2 mb-2 text-[11px]">
                                <div className="flex justify-between gap-2"><span className="text-gray-600">Nama</span><span className="font-bold text-right">{empName}</span></div>
                                <div className="flex justify-between gap-2"><span className="text-gray-600">Divisi / Tahap</span><span className="font-bold text-right">{division}</span></div>
                                <div className="flex justify-between gap-2"><span className="text-gray-600">Tanggal Cetak</span><span className="font-bold text-right">{rekap.dateProcessed}</span></div>
                                <div className="flex justify-between gap-2"><span className="text-gray-600">ID Rekap</span><span className="font-bold text-right">{rekap.id}</span></div>
                            </div>

                            <table className="w-full border-collapse table-fixed text-[9.4px]">
                                <thead>
                                    <tr className="border-y border-dashed border-black">
                                        <th className="py-1 text-left" style={{ width: '6%' }}>No.</th>
                                        <th className="py-1 text-left" style={{ width: '30%' }}>Instansi<br /><span className="text-[8.6px] text-gray-500">(Jenis Produksi)</span></th>
                                        <th className="py-1 text-left" style={{ width: '24%' }}>Rincian Ukuran</th>
                                        <th className="py-1 text-right" style={{ width: '8%' }}>Jml</th>
                                        <th className="py-1 text-right" style={{ width: '15%' }}>Harga</th>
                                        <th className="py-1 text-right" style={{ width: '17%' }}>Gaji</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {(rekap.items || []).map((item, idx) => (
                                        <tr key={`${item.orderId}-${item.stage}-${idx}`} className="border-b border-dashed border-gray-300 align-top">
                                            <td className="py-1 pr-1 text-center">{idx + 1}</td>
                                            <td className="py-1 pr-1 break-words">
                                                <div className="font-bold">{item.client || '-'}</div>
                                                <div className="text-[8.6px] text-gray-500">({item.type || '-'})</div>
                                                <div className="text-[8.6px] text-gray-500">{item.stageLabel || item.stage || '-'}</div>
                                            </td>
                                            <td className="py-1 pr-1 break-words">{item.sizes || '-'}</td>
                                            <td className="py-1 pr-1 text-right font-bold">{item.qty || 0}</td>
                                            <td className="py-1 pr-1 text-right whitespace-nowrap text-[8.8px]">{formatReceiptMoney(item.unitPrice || 0)}</td>
                                            <td className="py-1 text-right whitespace-nowrap text-[8.8px] font-bold">{formatReceiptMoney(item.wageTotal || 0)}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>

                            <div className="border-y border-dashed border-black py-2 mt-2 text-[11px]">
                                <div className="flex justify-between gap-2"><span>Total Pcs</span><span className="font-bold">{rekap.total || 0} pcs</span></div>
                                <div className="flex justify-between gap-2 text-[13px] font-black mt-1"><span>Total Keseluruhan</span><span>{formatReceiptMoney(rekap.totalWage || 0)}</span></div>
                            </div>
                            <div className="text-center text-[9px] text-gray-500 mt-2">Simpan struk ini sebagai bukti rekap gaji produksi.</div>
                        </div>
                    </div>
                </div>
            );
        };

        const TemplateView = ({ templates, setTemplates, showToast }) => {
            const [localTemplates, setLocalTemplates] = useState(templates || initialTemplates);
            
            useEffect(() => {
                if (templates) setLocalTemplates(templates);
            }, [templates]);

            const handleChange = (e) => {
                const { name, value } = e.target;
                setLocalTemplates(prev => ({ ...prev, [name]: value }));
            };

            const handleLogoUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width, height = img.height;
                        if (height > 100) { width = Math.round(width * (100 / height)); height = 100; }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        setLocalTemplates(prev => ({ ...prev, companyLogo: canvas.toDataURL('image/png') }));
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                setTemplates(prev => ({...prev, ...localTemplates}));
                showToast("Pengaturan disimpan!", "success");
            };

            return (
                <div className="space-y-6 max-w-4xl">
                    <h2 className="text-2xl font-bold text-gray-800">Pengaturan Cetak</h2>
                    <form onSubmit={handleSubmit} className="space-y-6">
                        <Card>
                            <h3 className="font-bold border-b pb-2 mb-4">Kop Surat</h3>
                            <div className="mb-4">
                                <label className="block text-sm mb-1">Logo</label>
                                <div className="flex items-center gap-4">
                                    {localTemplates.companyLogo ? <img src={localTemplates.companyLogo} className="h-16" /> : <div className="w-16 h-16 border border-dashed flex items-center justify-center text-xs text-gray-400">No Logo</div>}
                                    <input type="file" accept="image/*" onChange={handleLogoUpload} className="text-sm border p-1 rounded" />
                                    {localTemplates.companyLogo && <button type="button" onClick={() => setLocalTemplates(prev => ({ ...prev, companyLogo: '' }))} className="text-red-500 border p-1 text-sm rounded">Hapus</button>}
                                </div>
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div><label className="block text-sm mb-1">Nama Perusahaan</label><input type="text" name="companyName" className="w-full p-2 border rounded" value={localTemplates.companyName || ''} onChange={handleChange} required /></div>
