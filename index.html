nge={e => setForm({ ...form, paymentAmount: e.target.value })}/><select className="p-2 border rounded" value={form.paymentMethod} onChange={e => setForm({ ...form, paymentMethod: e.target.value })}><option>Transfer</option><option>Tunai</option><option>QRIS</option><option>Debit</option></select><select className="p-2 border rounded" value={form.commissionType} onChange={e => setForm({ ...form, commissionType: e.target.value })}><option>Persen</option><option>Rupiah</option></select><input type="number" className="p-2 border rounded text-right" placeholder="Komisi marketing" value={form.commissionValue} onChange={e => setForm({ ...form, commissionValue: e.target.value })}/><input className="p-2 border rounded md:col-span-2" placeholder="Catatan invoice" value={form.note} onChange={e => setForm({ ...form, note: e.target.value })}/><div className="md:col-span-2 bg-blue-50 border border-blue-100 rounded p-3 text-sm">Subtotal: <b>{formatRupiah(invoiceTotal(form).subtotal)}</b> | Diskon: <b>{formatRupiah(invoiceTotal(form).discount)}</b> | Total: <b>{formatRupiah(invoiceTotal(form).total)}</b></div><div className="md:col-span-2 flex justify-end gap-2"><button type="button" onClick={() => { setForm(emptyInvoice); setEditId(null); }} className="px-4 py-2 bg-gray-200 rounded font-bold">Reset</button><button className="px-4 py-2 bg-blue-600 text-white rounded font-bold">{editId ? 'Simpan Edit' : 'Buat Invoice'}</button></div></form></Card>
                        <Card><div className="grid grid-cols-1 md:grid-cols-2 gap-3 mb-4"><SearchField value={searchTerm} onChange={setSearchTerm} placeholder="Cari customer, marketing, jenis, status..." /><select className="p-3 border rounded-lg mt-5" value={statusFilter} onChange={e => setStatusFilter(e.target.value)}><option>Semua</option><option>Belum Dibayar</option><option>Termin</option><option>Lunas</option></select></div><div className="overflow-x-auto"><table className="w-full text-sm"><thead className="bg-gray-50"><tr><th className="p-2 text-left">Invoice</th><th className="p-2 text-left">Customer</th><th className="p-2 text-right">Total</th><th className="p-2 text-center">Status</th><th className="p-2 text-center">Aksi</th></tr></thead><tbody>{visibleInvoices.map(inv => { const calc = invoiceTotal(inv); return <React.Fragment key={inv.id}><tr className="border-t"><td className="p-2 font-bold text-blue-700">{inv.id}<div className="text-xs text-gray-500">{inv.date}</div></td><td className="p-2">{inv.customer}<div className="text-xs text-gray-500">{inv.marketing || '-'}</div></td><td className="p-2 text-right font-black">{formatRupiah(calc.total)}</td><td className="p-2 text-center"><Badge status={inv.paymentStatus}/></td><td className="p-2"><div className="flex justify-center flex-wrap gap-1"><button onClick={() => setExpandedIds(prev => ({ ...prev, [inv.id]: !prev[inv.id] }))} className="text-xs bg-blue-50 text-blue-700 px-2 py-1 rounded">{expandedIds[inv.id] ? 'Sembunyikan Rincian' : 'Lihat Rincian'}</button><button onClick={() => { setEditId(inv.id); setForm({ ...emptyInvoice, ...inv, paymentAmount: '' }); }} className="text-xs bg-purple-50 text-purple-700 px-2 py-1 rounded">Edit</button><button onClick={() => printInvoice(inv)} className="text-xs bg-gray-50 text-slate-700 px-2 py-1 rounded">Cetak</button><button onClick={() => deleteInvoice(inv.id)} className="text-red-600 bg-red-50 p-1 rounded"><IconTrash /></button></div></td></tr>{expandedIds[inv.id] && <tr className="bg-gray-50"><td colSpan="5" className="p-3 text-xs">Jenis: <b>{inv.type}</b> | Size: {inv.size} | Qty: {inv.qty} | Dibayar: <b>{formatRupiah(paidTotal(inv))}</b> | Sisa: <b>{formatRupiah(Math.max(0, calc.total - paidTotal(inv)))}</b><br/>Catatan: {inv.note || '-'}</td></tr>}</React.Fragment>})}{visibleInvoices.length === 0 && <tr><td colSpan="5" className="p-6 text-center text-gray-500 italic">Belum ada invoice.</td></tr>}</tbody></table></div></Card>
                    </div>
                    <Card><h3 className="text-lg font-bold text-gray-800 mb-4">Laporan Komisi Marketing</h3><div className="overflow-x-auto"><table className="w-full text-sm text-left"><thead className="bg-gray-50"><tr><th className="p-3">Marketing</th><th className="p-3 text-right">Jumlah Invoice</th><th className="p-3 text-right">Total Penjualan</th><th className="p-3 text-right">Total Komisi</th><th className="p-3 text-center">Status</th></tr></thead><tbody>{commissionRows.map(row => <tr key={row.marketing} className="border-t"><td className="p-3 font-bold">{row.marketing}</td><td className="p-3 text-right">{row.invoices}</td><td className="p-3 text-right font-bold">{formatRupiah(row.sales)}</td><td className="p-3 text-right font-black text-purple-700">{formatRupiah(row.commission)}</td><td className="p-3 text-center"><Badge status="Belum Dibayar" /></td></tr>)}</tbody></table></div></Card>
                </div>
            );
        };

        const ClientsView = ({ clients, setClients, invoices = [], setInvoices, showToast, templates }) => {
            const emptyClient = { name: '', address: '', phone: '', pic: '', note: '' };
            const emptyDp = { date: new Date().toISOString().slice(0, 10), amount: '', method: 'Transfer', note: '', invoiceId: '', orderId: '' };
            const [form, setForm] = useState(emptyClient);
            const [editId, setEditId] = useState(null);
            const [selectedClient, setSelectedClient] = useState(null);
            const [dpForm, setDpForm] = useState(emptyDp);
            const [editDpId, setEditDpId] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');
            const safeClients = safeArray(clients);
            const safeInvoices = safeArray(invoices);
            const visibleClients = safeClients.filter(isVisibleRecord).filter(client => matchesSearch([client.name, client.address, client.phone, client.pic, client.note], searchTerm));
            const getClientDpRows = (client) => Array.isArray(client?.clientDpPayments) ? client.clientDpPayments.filter(isVisibleRecord) : [];
            const getClientInvoices = (client) => safeInvoices.filter(isVisibleRecord).filter(inv => normalizeText(inv.customer) === normalizeText(client?.name));
            const getClientSummary = (client) => {
                const dpRows = getClientDpRows(client);
                const dp = dpRows.reduce((sum, row) => sum + safeMoney(row.amount), 0);
                const poolDp = dpRows.filter(row => !row.invoiceId).reduce((sum, row) => sum + safeMoney(row.amount), 0);
                const invs = getClientInvoices(client);
                const invoiceTotal = invs.reduce((sum, inv) => sum + getInvoiceTotals(inv).total, 0);
                const paid = invs.reduce((sum, inv) => sum + getInvoicePaidTotal(inv), 0);
                const usedDp = invs.reduce((sum, inv) => sum + getInvoiceLinkedDpAmount(inv), 0);
                return { dp, poolDp, usedDp, saldoDp: Math.max(0, poolDp - usedDp), invoiceTotal, receivable: Math.max(0, invoiceTotal - paid) };
            };
            const printDpReceipt = (dp, clientName) => {
                const safe = (v) => String(v ?? '-').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
                const amount = safeMoney(dp.amount);
                const receiptNo = dp.id || `DP-${Date.now()}`;
                const printContent = `<!DOCTYPE html><html><head><title>Kwitansi DP ${safe(receiptNo)}</title><style>@page{size:A5 landscape;margin:8mm}body{font-family:Arial,Helvetica,sans-serif;color:#10264a;margin:0;background:#fff}.sheet{width:100%;box-sizing:border-box;padding:10px 12px 8px}.top{display:flex;justify-content:space-between;align-items:flex-start}.brand img{max-height:48px;max-width:150px;object-fit:contain}.brand-text{line-height:.95}.brand-small{font-size:18px;font-weight:900;color:#111}.brand-main{font-size:38px;font-weight:900;color:#e31b23;font-style:italic;letter-spacing:-1px}.title{text-align:right}.title h1{font-size:32px;letter-spacing:8px;margin:4px 0 10px;color:#10264a}.no-row{font-size:14px}.line{border-bottom:3px solid #10264a;margin:14px 0 18px}.field{display:grid;grid-template-columns:160px 12px 1fr;gap:8px;align-items:end;font-size:14px;margin:10px 0}.dots{border-bottom:1.5px dotted #222;min-height:19px;padding:0 6px;color:#111}.amount-words{margin-left:180px;background:#eef1f5;border-bottom:1.5px dotted #222;min-height:25px;padding:6px 8px;font-size:12px;color:#111}.pay-lines{margin-left:180px}.pay-lines .dots{margin:10px 0}.bottom{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:16px;align-items:start}.rp-box{width:270px;height:42px;border:2px solid #10264a;display:grid;grid-template-columns:70px 1fr;transform:skewX(-10deg);overflow:hidden}.rp-label,.rp-value{display:flex;align-items:center;padding:0 14px;transform:skewX(10deg);font-size:19px;font-weight:900}.rp-label{border-right:2px solid #10264a}.rp-value{background:#f0f3f7;color:#111}.sign{text-align:center;font-size:13px}.date-line{border-bottom:1.5px dotted #10264a;display:inline-block;min-width:200px;text-align:left;color:#111}.receiver{margin-top:16px}.name-line{display:inline-block;min-width:210px;border-bottom:1.5px dotted #10264a;margin-top:46px;color:#111}</style></head><body><div class="sheet"><div class="top"><div class="brand">${(templates||{}).companyLogo ? `<img src="${(templates||{}).companyLogo}" />` : `<div class="brand-text"><div class="brand-small">Konveksi</div><div class="brand-main">Simpati</div></div>`}</div><div class="title"><h1>KWITANSI DP</h1><div class="no-row">No. &nbsp;: <span class="dots" style="display:inline-block;min-width:160px">${safe(receiptNo)}</span></div></div></div><div class="line"></div><div class="field"><div>Diterima dari</div><div>:</div><div class="dots">${safe(clientName || '-')}</div></div><div class="field"><div>Uang sejumlah</div><div>:</div><div class="dots">${formatRupiah(amount)}</div></div><div class="amount-words">${safe(terbilangRupiah(amount))}</div><div class="field"><div>Untuk pembayaran</div><div>:</div><div class="dots">DP / Uang Muka${dp.orderId ? ' Order ' + safe(dp.orderId) : ''}${dp.invoiceId ? ' / Invoice ' + safe(dp.invoiceId) : ''}</div></div><div class="pay-lines"><div class="dots">Metode: ${safe(dp.method || '-')}${dp.note ? ' &nbsp;|&nbsp; ' + safe(dp.note) : ''}</div></div><div class="bottom"><div class="rp-box"><div class="rp-label">Rp.</div><div class="rp-value">${formatRupiah(amount).replace('Rp ', '').replace('Rp ', '')}</div></div><div class="sign"><div><span class="date-line">${safe(dp.date || new Date().toISOString().slice(0,10))}</span></div><div class="receiver">Penerima,</div><div>( <span class="name-line">&nbsp;</span> )</div></div></div></div></body></html>`;
                const w = window.open('', '_blank');
                if (!w) return showToast("Gagal mencetak. Harap izinkan Pop-up!", "error");
                w.document.open(); w.document.write(printContent); w.document.close(); w.focus(); setTimeout(() => w.print(), 250);
            };

            const saveClient = (e) => {
                e.preventDefault();
                const now = new Date().toISOString();
                const row = { ...form, id: editId || `CLI-${Date.now()}`, clientDpPayments: form.clientDpPayments || [], _syncUpdatedAt: now };
                setClients(prev => {
                    const list = Array.isArray(prev) ? prev : [];
                    return editId ? list.map(item => String(item.id) === String(editId) ? row : item) : [row, ...list];
                });
                setForm(emptyClient); setEditId(null); showToast(editId ? "Klien diperbarui." : "Klien ditambahkan.", "success");
            };
            const deleteClient = (id) => setClients(prev => (Array.isArray(prev) ? prev : []).map(item => String(item.id) === String(id) ? { ...item, isDeleted: true, deletedAt: new Date().toISOString(), _syncUpdatedAt: new Date().toISOString() } : item));
            const saveDp = (e) => {
                e.preventDefault();
                if (!selectedClient) return;
                const now = new Date().toISOString();
                const row = { ...dpForm, id: editDpId || `DP-${Date.now()}`, amount: safeMoney(dpForm.amount), _syncUpdatedAt: now };
                setClients(prev => (Array.isArray(prev) ? prev : []).map(client => {
                    if (String(client.id) !== String(selectedClient.id)) return client;
                    const rows = Array.isArray(client.clientDpPayments) ? client.clientDpPayments : [];
                    const nextRows = editDpId ? rows.map(item => String(item.id) === String(editDpId) ? row : item) : [row, ...rows];
                    return { ...client, clientDpPayments: nextRows, _syncUpdatedAt: now };
                }));
                if (row.invoiceId && setInvoices) {
                    setInvoices(prev => (Array.isArray(prev) ? prev : []).map(inv => String(inv.id) === String(row.invoiceId) ? { ...inv, invoiceDp: { id: row.id, date: row.date, amount: row.amount, method: row.method, note: row.note }, paymentStatus: getInvoicePaymentStatus({ ...inv, invoiceDp: row }), _syncUpdatedAt: now } : inv));
                }
                setDpForm(emptyDp); setEditDpId(null); showToast(editDpId ? "DP customer diperbarui." : "DP customer ditambahkan.", "success");
            };
            const deleteDp = (dpId) => {
                const now = new Date().toISOString();
                setClients(prev => (Array.isArray(prev) ? prev : []).map(client => {
                    if (String(client.id) !== String(selectedClient?.id)) return client;
                    return { ...client, clientDpPayments: (client.clientDpPayments || []).map(dp => String(dp.id) === String(dpId) ? { ...dp, isDeleted: true, deletedAt: now, _syncUpdatedAt: now } : dp), _syncUpdatedAt: now };
                }));
            };
            const activeClient = selectedClient ? visibleClients.find(c => String(c.id) === String(selectedClient.id)) || selectedClient : null;
            const activeSummary = getClientSummary(activeClient);
            return (
                <div className="space-y-6">
                    <div><h2 className="text-2xl font-bold text-gray-800">Klien / Instansi</h2><p className="text-sm text-gray-500 mt-1">Data customer, invoice, piutang, dan DP masuk.</p></div>
                    <Card><form onSubmit={saveClient} className="grid grid-cols-1 md:grid-cols-5 gap-3"><input className="p-2 border rounded" placeholder="Nama instansi/klien" value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} required/><input className="p-2 border rounded" placeholder="Alamat" value={form.address} onChange={e => setForm({ ...form, address: e.target.value })}/><input className="p-2 border rounded" placeholder="No HP/WA" value={form.phone} onChange={e => setForm({ ...form, phone: e.target.value })}/><input className="p-2 border rounded" placeholder="PIC" value={form.pic} onChange={e => setForm({ ...form, pic: e.target.value })}/><input className="p-2 border rounded" placeholder="Catatan" value={form.note} onChange={e => setForm({ ...form, note: e.target.value })}/><div className="md:col-span-5 flex justify-end gap-2"><button type="button" onClick={() => { setForm(emptyClient); setEditId(null); }} className="px-4 py-2 bg-gray-200 rounded font-bold">Reset</button><button className="px-4 py-2 bg-blue-600 text-white rounded font-bold">{editId ? 'Simpan Edit' : 'Tambah Klien'}</button></div></form></Card>
                    <Card><div className="mb-4 max-w-lg"><SearchField value={searchTerm} onChange={setSearchTerm} placeholder="Cari nama, alamat, HP, PIC, catatan..." /></div><div className="overflow-x-auto"><table className="w-full text-sm text-left"><thead className="bg-gray-50"><tr><th className="p-3">Nama</th><th className="p-3">PIC/HP</th><th className="p-3 text-right">Total DP</th><th className="p-3 text-right">Total Invoice</th><th className="p-3 text-right">Piutang</th><th className="p-3 text-center">Aksi</th></tr></thead><tbody>{visibleClients.map(client => { const s = getClientSummary(client); return <tr key={client.id} className="border-t"><td className="p-3 font-bold">{client.name}<div className="text-xs text-gray-500">{client.address || '-'}</div></td><td className="p-3">{client.pic || '-'}<div className="text-xs text-gray-500">{client.phone || '-'}</div></td><td className="p-3 text-right font-bold text-green-700">{formatRupiah(s.dp)}</td><td className="p-3 text-right font-bold text-blue-700">{formatRupiah(s.invoiceTotal)}</td><td className="p-3 text-right font-bold text-red-700">{formatRupiah(s.receivable)}</td><td className="p-3"><div className="flex justify-center gap-2 flex-wrap"><button onClick={() => setSelectedClient(client)} className="text-xs bg-green-50 text-green-700 px-2 py-1 rounded font-bold">DP Customer</button><button onClick={() => { setEditId(client.id); setForm(client); }} className="text-xs bg-purple-50 text-purple-700 px-2 py-1 rounded font-bold">Edit</button><button onClick={() => deleteClient(client.id)} className="text-red-600 bg-red-50 p-1 rounded"><IconTrash /></button></div></td></tr>; })}{visibleClients.length === 0 && <tr><td colSpan="6" className="p-6 text-center text-gray-500 italic">Belum ada data klien.</td></tr>}</tbody></table></div></Card>
                    {activeClient && <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-[100] p-4"><div className="bg-white rounded-xl shadow-xl p-6 w-full max-w-5xl max-h-[92vh] overflow-y-auto"><div className="flex justify-between border-b pb-3 mb-4"><div><h3 className="font-black text-lg">DP Customer</h3><p className="text-sm text-gray-500">{activeClient.name}</p></div><button onClick={() => { setSelectedClient(null); setDpForm(emptyDp); setEditDpId(null); }} className="text-2xl text-gray-400">&times;</button></div><div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4"><Card><h4 className="text-xs font-bold text-gray-500">Total DP Masuk</h4><p className="text-xl font-black text-green-700">{formatRupiah(activeSummary.dp)}</p></Card><Card><h4 className="text-xs font-bold text-gray-500">DP Dipakai Invoice</h4><p className="text-xl font-black text-orange-600">{formatRupiah(activeSummary.usedDp)}</p></Card><Card><h4 className="text-xs font-bold text-gray-500">Saldo DP Tersisa</h4><p className="text-xl font-black text-emerald-700">{formatRupiah(activeSummary.saldoDp)}</p></Card><Card><h4 className="text-xs font-bold text-gray-500">Piutang</h4><p className="text-xl font-black text-red-700">{formatRupiah(activeSummary.receivable)}</p></Card></div><form onSubmit={saveDp} className="grid grid-cols-1 md:grid-cols-3 gap-3 bg-gray-50 border rounded-lg p-4 mb-4"><input type="date" className="p-2 border rounded" value={dpForm.date} onChange={e => setDpForm({ ...dpForm, date: e.target.value })}/><input type="number" min="0" className="p-2 border rounded text-right" placeholder="Nominal DP" value={dpForm.amount} onChange={e => setDpForm({ ...dpForm, amount: e.target.value })} required/><select className="p-2 border rounded" value={dpForm.method} onChange={e => setDpForm({ ...dpForm, method: e.target.value })}><option>Transfer</option><option>Tunai</option><option>QRIS</option><option>Debit</option></select><input className="p-2 border rounded" placeholder="Nomor Order (opsional)" value={dpForm.orderId || ''} onChange={e => setDpForm({ ...dpForm, orderId: e.target.value })}/><select className="p-2 border rounded" value={dpForm.invoiceId} onChange={e => setDpForm({ ...dpForm, invoiceId: e.target.value })}><option value="">Tanpa invoice</option>{getClientInvoices(activeClient).map(inv => <option key={inv.id} value={inv.id}>{inv.id} — {getInvoicePaymentStatus(inv)}</option>)}</select><input className="p-2 border rounded" placeholder="Catatan DP" value={dpForm.note} onChange={e => setDpForm({ ...dpForm, note: e.target.value })}/><div className="md:col-span-3 flex justify-end gap-2"><button type="button" onClick={() => { setDpForm(emptyDp); setEditDpId(null); }} className="px-4 py-2 bg-gray-200 rounded font-bold">Reset</button><button className="px-4 py-2 bg-green-600 text-white rounded font-bold">{editDpId ? 'Simpan Edit' : 'Tambah DP'}</button></div></form><table className="w-full text-sm"><thead className="bg-gray-50"><tr><th className="p-3 text-left">Tanggal</th><th className="p-3 text-right">Nominal</th><th className="p-3">Metode</th><th className="p-3">Order</th><th className="p-3">Invoice</th><th className="p-3">Catatan</th><th className="p-3 text-center">Status</th><th className="p-3 text-center">Aksi</th></tr></thead><tbody>{getClientDpRows(activeClient).map(dp => { const dpLinked = !!(dp.invoiceId); return <tr key={dp.id} className="border-t"><td className="p-3 text-sm">{dp.date}</td><td className="p-3 text-right font-bold text-green-700">{formatRupiah(dp.amount)}</td><td className="p-3 text-sm">{dp.method || '-'}</td><td className="p-3 text-sm font-mono text-xs">{dp.orderId || '-'}</td><td className="p-3 text-sm font-mono text-xs">{dp.invoiceId || '-'}</td><td className="p-3 text-sm">{dp.note || '-'}</td><td className="p-3 text-center"><span className={`px-2 py-0.5 rounded-full text-xs font-bold ${dpLinked ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800'}`}>{dpLinked ? 'Terhubung Invoice' : 'Belum Terhubung'}</span></td><td className="p-3"><div className="flex justify-center gap-1 flex-wrap"><button onClick={() => printDpReceipt(dp, activeClient?.name)} className="text-xs font-bold text-slate-700 bg-gray-50 border border-gray-200 px-2 py-1 rounded">Cetak</button><button onClick={() => { setEditDpId(dp.id); setDpForm({ ...emptyDp, ...dp }); }} className="text-blue-600 bg-blue-50 p-1 rounded"><IconEdit /></button><button onClick={() => deleteDp(dp.id)} className="text-red-600 bg-red-50 p-1 rounded"><IconTrash /></button></div></td></tr>; })}</tbody></table></div></div>}
                </div>
            );
        };

        const EnhancedInvoiceView = ({ invoices, setInvoices, clients, setClients, employees, showToast, templates }) => {
            const newSize = () => ({ id: `SIZE-${Date.now()}-${Math.random()}`, size: '', qty: '', pricePerPcs: '', discountPerPcs: '', discountPercent: '' });
            const newItem = () => ({ id: `ITEM-${Date.now()}-${Math.random()}`, productionType: '', sizes: [newSize()] });
            const emptyInvoice = {
                date: new Date().toISOString().slice(0, 10),
                customer: '',
                address: '',
                marketing: '',
                invoiceItems: [newItem()],
                invoiceDp: { date: new Date().toISOString().slice(0, 10), amount: '', method: 'Transfer', note: '' },
                note: '',
                commissionType: 'Persen',

d-700 rounded font-bold">Hapus Jenis</button>}</div><div className="space-y-2">{(item.sizes || []).map(size => <div key={size.id} className="grid grid-cols-1 md:grid-cols-7 gap-2 items-center"><input className="p-2 border rounded" placeholder="Size" value={size.size || ''} onChange={e => patchSize(item.id, size.id, { size: e.target.value })}/><input type="number" className="p-2 border rounded text-right" placeholder="Qty" value={size.qty} onChange={e => patchSize(item.id, size.id, { qty: e.target.value })}/><input type="number" className="p-2 border rounded text-right" placeholder="Harga/pcs" value={size.pricePerPcs} onChange={e => patchSize(item.id, size.id, { pricePerPcs: e.target.value })}/><input type="number" className="p-2 border rounded text-right" placeholder="Diskon/pcs" value={size.discountPerPcs} onChange={e => patchSize(item.id, size.id, { discountPerPcs: e.target.value })}/><input type="number" className="p-2 border rounded text-right" placeholder="Diskon %" value={size.discountPercent} onChange={e => patchSize(item.id, size.id, { discountPercent: e.target.value })}/><div className="text-right font-black text-blue-700">{formatRupiah(getInvoiceSizeTotal(size).total)}</div>{(item.sizes || []).length > 1 && <button type="button" onClick={() => removeSize(item.id, size.id)} className="text-red-600 bg-red-50 p-2 rounded"><IconTrash /></button>}</div>)}</div><button type="button" onClick={() => addSize(item.id)} className="mt-3 text-sm font-bold text-blue-700 bg-blue-50 px-3 py-2 rounded">Tambah Size</button></div>)}<button type="button" onClick={addProductionItem} className="text-sm font-bold text-blue-700 bg-blue-50 px-3 py-2 rounded">Tambah Jenis Produksi</button>{availableDpForForm > 0 && <div className="bg-emerald-50 border border-emerald-200 rounded-lg p-4 space-y-2"><div className="flex items-center justify-between flex-wrap gap-2"><div className="text-sm font-bold text-emerald-800">Saldo DP Tersedia dari Pool Klien</div><button type="button" onClick={() => setForm({ ...form, linkedDpAmount: String(Math.min(availableDpForForm, currentInvoiceTotal)) })} className="text-xs font-bold bg-emerald-600 text-white px-3 py-1.5 rounded">Pakai DP Otomatis</button></div><div className="grid grid-cols-2 md:grid-cols-4 gap-3 text-sm"><div><div className="text-xs text-emerald-600 font-bold">Saldo Tersedia</div><div className="font-black text-emerald-700">{formatRupiah(availableDpForForm)}</div></div><div><div className="text-xs text-blue-600 font-bold">Total Invoice</div><div className="font-black text-blue-700">{formatRupiah(currentInvoiceTotal)}</div></div><div><div className="text-xs text-gray-600 font-bold mb-1">DP Dipakai</div><input type="number" min="0" max={Math.min(availableDpForForm, currentInvoiceTotal)} className="w-full p-1.5 border border-emerald-300 rounded text-right font-bold text-emerald-800" placeholder="0" value={form.linkedDpAmount || ''} onChange={e => setForm({ ...form, linkedDpAmount: e.target.value })}/></div><div><div className="text-xs text-orange-600 font-bold">Sisa Tagihan setelah DP</div><div className={`font-black ${Math.max(0, currentInvoiceTotal - safeMoney(form.linkedDpAmount || 0) - getInvoiceDpAmount(form) - getInvoicePayments(form).reduce((s,p)=>s+safeMoney(p?.amount),0)) > 0 ? 'text-orange-700' : 'text-green-700'}`}>{formatRupiah(Math.max(0, currentInvoiceTotal - safeMoney(form.linkedDpAmount || 0) - getInvoiceDpAmount(form) - getInvoicePayments(form).reduce((s,p)=>s+safeMoney(p?.amount),0)))}</div></div></div></div>}<div className="grid grid-cols-1 md:grid-cols-5 gap-3"><input type="number" className="p-2 border rounded text-right" placeholder="DP" value={form.invoiceDp?.amount || ''} onChange={e => setForm({ ...form, invoiceDp: { ...(form.invoiceDp || {}), amount: e.target.value } })}/><input type="date" className="p-2 border rounded" value={form.invoiceDp?.date || form.date} onChange={e => setForm({ ...form, invoiceDp: { ...(form.invoiceDp || {}), date: e.target.value } })}/><select className="p-2 border rounded" value={form.invoiceDp?.method || 'Transfer'} onChange={e => setForm({ ...form, invoiceDp: { ...(form.invoiceDp || {}), method: e.target.value } })}><option>Transfer</option><option>Tunai</option><option>QRIS</option><option>Debit</option></select><select className="p-2 border rounded" value={form.commissionType} onChange={e => setForm({ ...form, commissionType: e.target.value })}><option>Persen</option><option>Rupiah per Pcs</option><option>Rupiah</option></select><input type="number" className="p-2 border rounded text-right" placeholder="Komisi" value={form.commissionValue} onChange={e => setForm({ ...form, commissionValue: e.target.value })}/><input list="invoice-note-list" className="p-2 border rounded md:col-span-5" placeholder="Catatan invoice" value={form.note} onChange={e => setForm({ ...form, note: e.target.value })}/><datalist id="invoice-note-list">{[...new Set(safeInvoiceRows.filter(isVisibleRecord).map(inv=>String(inv.note||'').trim()).filter(Boolean))].sort().map((n,i)=><option key={i} value={n}/>)}</datalist></div><div className="bg-blue-50 border border-blue-100 rounded p-3 text-sm">Subtotal: <b>{formatRupiah(getInvoiceTotals(form).subtotal)}</b> | Diskon: <b>{formatRupiah(getInvoiceTotals(form).discount)}</b> | Total: <b>{formatRupiah(getInvoiceTotals(form).total)}</b> | Status: <b>{getInvoicePaymentStatus(form)}</b></div><div className="flex justify-end gap-2"><button type="button" onClick={resetForm} className="px-4 py-2 bg-gray-200 rounded font-bold">Reset</button><button className="px-4 py-2 bg-blue-600 text-white rounded font-bold">{editId ? 'Simpan Edit' : 'Buat Invoice'}</button></div></form></Card>
                    <Card><div className="grid grid-cols-1 md:grid-cols-3 gap-3 mb-4"><SearchField value={searchTerm} onChange={setSearchTerm} placeholder="Cari customer, marketing, jenis, status..." /><select className="p-3 border rounded-lg mt-5" value={statusFilter} onChange={e => setStatusFilter(e.target.value)}><option>Semua</option><option>Belum Dibayar</option><option>Termin</option><option>Lunas</option></select></div><div className="overflow-x-auto"><table className="w-full text-sm"><thead className="bg-gray-50"><tr><th className="p-2 text-left">Invoice</th><th className="p-2 text-left">Customer</th><th className="p-2 text-right">Pcs</th><th className="p-2 text-right">Total</th><th className="p-2 text-center">Status</th><th className="p-2 text-center">Aksi</th></tr></thead><tbody>{visibleInvoices.map(inv => { const totals = getInvoiceTotals(inv); return <React.Fragment key={inv.id}><tr className="border-t"><td className="p-2 font-bold text-blue-700">{inv.id}<div className="text-xs text-gray-500">{inv.date}</div></td><td className="p-2">{inv.customer}<div className="text-xs text-gray-500">{inv.marketing || '-'}</div></td><td className="p-2 text-right font-bold">{getInvoicePcsTotal(inv)}</td><td className="p-2 text-right font-black">{formatRupiah(totals.total)}</td><td className="p-2 text-center"><span className={`px-2 py-1 rounded-full text-xs font-bold ${statusClass(getInvoicePaymentStatus(inv))}`}>{getInvoicePaymentStatus(inv)}</span></td><td className="p-2"><div className="flex justify-center flex-wrap gap-1"><button onClick={() => setExpandedIds(prev => ({ ...prev, [inv.id]: !prev[inv.id] }))} className="text-xs bg-blue-50 text-blue-700 px-2 py-1 rounded">{expandedIds[inv.id] ? 'Sembunyikan' : 'Rincian'}</button><button onClick={() => { setEditId(inv.id); setForm({ ...emptyInvoice, ...inv, invoiceItems: getInvoiceItems(inv), invoiceDp: getInvoiceDp(inv) }); }} className="text-xs bg-purple-50 text-purple-700 px-2 py-1 rounded">Edit</button><button onClick={() => printInvoice(inv)} className="text-xs bg-gray-50 text-slate-700 px-2 py-1 rounded">Cetak</button><button onClick={() => deleteInvoice(inv.id)} className="text-red-600 bg-red-50 p-1 rounded"><IconTrash /></button></div></td></tr>{expandedIds[inv.id] && <tr className="bg-gray-50"><td colSpan="6" className="p-3 text-xs">DP: <b>{formatRupiah(getInvoiceDpAmount(inv))}</b> | Dibayar: <b>{formatRupiah(getInvoicePaidTotal(inv))}</b> | Sisa: <b>{formatRupiah(Math.max(0, totals.total - getInvoicePaidTotal(inv)))}</b> | Komisi: <b>{formatRupiah(getInvoiceCommissionTotal(inv))}</b><br/>{getInvoiceItems(inv).map(item => `${item.productionType || '-'}: ${(item.sizes || []).map(size => `${size.size || '-'} ${size.qty || 0}pcs`).join(', ')}`).join(' | ')}</td></tr>}</React.Fragment>; })}{visibleInvoices.length === 0 && <tr><td colSpan="6" className="p-6 text-center text-gray-500 italic">Belum ada invoice.</td></tr>}</tbody></table></div></Card>
                    <Card><h3 className="text-lg font-bold text-gray-800 mb-4">Laporan Komisi Marketing</h3><div className="overflow-x-auto"><table className="w-full text-sm text-left"><thead className="bg-gray-50"><tr><th className="p-3">Marketing</th><th className="p-3 text-right">Invoice</th><th className="p-3 text-right">Pcs</th><th className="p-3 text-right">Penjualan</th><th className="p-3 text-right">Komisi</th></tr></thead><tbody>{commissionRows.map(row => <tr key={row.marketing} className="border-t"><td className="p-3 font-bold">{row.marketing}</td><td className="p-3 text-right">{row.invoices}</td><td className="p-3 text-right">{row.pcs}</td><td className="p-3 text-right font-bold">{formatRupiah(row.sales)}</td><td className="p-3 text-right font-black text-purple-700">{formatRupiah(row.commission)}</td></tr>)}</tbody></table></div></Card>
                </div>
            );
        };

        const StableClientsView = ({ clients = [], setClients, invoices = [], showToast }) => {
            const emptyForm = { name: '', address: '', phone: '', pic: '', note: '' };
            const [form, setForm] = useState(emptyForm);
            const [editId, setEditId] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');
            const safeClients = Array.isArray(clients) ? clients : [];
            const safeInvoices = Array.isArray(invoices) ? invoices : [];
            const visibleClients = safeClients.filter(isVisibleRecord).filter(client => {
                const name = client.name || client.clientName || '-';
                return matchesSearch([name, client.address, client.phone, client.pic, client.note, client.notes], searchTerm);
            });
            const getClientName = (client) => client?.name || client?.clientName || '-';
            const getClientDpRows = (client) => [
                ...(Array.isArray(client?.clientDpPayments) ? client.clientDpPayments : []),
                ...(Array.isArray(client?.dpPayments) ? client.dpPayments : [])
            ].filter(isVisibleRecord);
            const getClientInvoices = (client) => safeInvoices.filter(isVisibleRecord).filter(inv => normalizeText(inv.customer || inv.clientName || inv.client) === normalizeText(getClientName(client)));
            const getClientSummary = (client) => {
                if (!client) return { totalDp: 0, totalInvoice: 0, piutang: 0 };
                const totalDp = getClientDpRows(client).reduce((sum, row) => sum + safeNumber(row?.amount), 0);
                const clientInvoices = getClientInvoices(client);
                const totalInvoice = clientInvoices.reduce((sum, inv) => {
                    try { return sum + safeNumber(getInvoiceTotals(inv).total); } catch (error) { return sum; }
                }, 0);
                const paid = clientInvoices.reduce((sum, inv) => {
                    try { return sum + safeNumber(getInvoicePaidTotal(inv)); } catch (error) { return sum; }
                }, 0);
                return { totalDp, totalInvoice, piutang: Math.max(0, totalInvoice - paid) };
            };
            const saveClient = (e) => {
                e.preventDefault();
                const now = new Date().toISOString();
                const row = { ...form, id: editId || `CLI-${Date.now()}`, name: form.name || form.clientName || '-', clientDpPayments: Array.isArray(form.clientDpPayments) ? form.clientDpPayments : [], _syncUpdatedAt: now };
                setClients(prev => {
                    const list = Array.isArray(prev) ? prev : [];
                    return editId ? list.map(item => String(item.id) === String(editId) ? row : item) : [row, ...list];
                });
                setForm(emptyForm);
                setEditId(null);
                showToast(editId ? 'Klien diperbarui.' : 'Klien ditambahkan.', 'success');
            };
            const deleteClient = (id) => {
                const now = new Date().toISOString();
                setClients(prev => (Array.isArray(prev) ? prev : []).map(item => String(item.id) === String(id) ? { ...item, isDeleted: true, deletedAt: now, _syncUpdatedAt: now } : item));
                showToast('Klien dihapus.', 'success');
            };
            return (
                <div className="space-y-6">
                    <div><h2 className="text-2xl font-bold text-gray-800">Klien / Instansi</h2><p className="text-sm text-gray-500 mt-1">Data klien tetap tampil aman walaupun belum ada invoice atau DP.</p></div>
                    <Card>
                        <form onSubmit={saveClient} className="grid grid-cols-1 md:grid-cols-5 gap-3">
                            <input className="p-2 border rounded" placeholder="Nama instansi/klien" value={form.name || ''} onChange={e => setForm({ ...form, name: e.target.value })} required />
                            <input className="p-2 border rounded" placeholder="Alamat" value={form.address || ''} onChange={e => setForm({ ...form, address: e.target.value })} />
                            <input className="p-2 border rounded" placeholder="No HP/WA" value={form.phone || ''} onChange={e => setForm({ ...form, phone: e.target.value })} />
                            <input className="p-2 border rounded" placeholder="PIC" value={form.pic || ''} onChange={e => setForm({ ...form, pic: e.target.value })} />
                            <input className="p-2 border rounded" placeholder="Catatan" value={form.note || ''} onChange={e => setForm({ ...form, note: e.target.value })} />
                            <div className="md:col-span-5 flex justify-end gap-2"><button type="button" onClick={() => { setForm(emptyForm); setEditId(null); }} className="px-4 py-2 bg-gray-200 rounded font-bold">Reset</button><button className="px-4 py-2 bg-blue-600 text-white rounded font-bold">{editId ? 'Simpan Edit' : 'Tambah Klien'}</button></div>
                        </form>
                    </Card>
                    <Card>
                        <div className="mb-4 max-w-lg"><SearchField value={searchTerm} onChange={setSearchTerm} placeholder="Cari nama, alamat, HP, PIC, catatan..." /></div>
                        <div className="overflow-x-auto"><table className="w-full text-sm text-left"><thead className="bg-gray-50"><tr><th className="p-3">Nama</th><th className="p-3">PIC/HP</th><th className="p-3 text-right">Total DP</th><th className="p-3 text-right">Total Invoice</th><th className="p-3 text-right">Piutang</th><th className="p-3 text-center">Aksi</th></tr></thead><tbody>
                            {visibleClients.map(client => { const s = getClientSummary(client); return <tr key={client.id || getClientName(client)} className="border-t"><td className="p-3 font-bold">{getClientName(client)}<div className="text-xs text-gray-500">{client.address || '-'}</div></td><td className="p-3">{client.pic || '-'}<div className="text-xs text-gray-500">{client.phone || '-'}</div></td><td className="p-3 text-right font-bold text-green-700">{formatRupiah(s.totalDp)}</td><td className="p-3 text-right font-bold text-blue-700">{formatRupiah(s.totalInvoice)}</td><td className="p-3 text-right font-bold text-red-700">{formatRupiah(s.piutang)}</td><td className="p-3"><div className="flex justify-center gap-2"><button onClick={() => { setEditId(client.id); setForm({ name: getClientName(client), address: client.address || '', phone: client.phone || '', pic: client.pic || '', note: client.note || client.notes || '', clientDpPayments: getClientDpRows(client) }); }} className="text-xs bg-purple-50 text-purple-700 px-2 py-1 rounded font-bold">Edit</button><button onClick={() => deleteClient(client.id)} className="text-red-600 bg-red-50 p-1 rounded"><IconTrash /></button></div></td></tr>; })}
                            {visibleClients.length === 0 && <tr><td colSpan="6" className="p-8 text-center text-gray-500 italic">Belum ada data klien.</td></tr>}
                        </tbody></table></div>
                    </Card>
                </div>
            );
        };

        const StableLaporanView = ({ orders = [], employees = [], rekapKinerja = [], setRekapKinerja, invoices = [], templates, showToast }) => {
            const [activeReportTab, setActiveReportTab] = useState('input');
            const [searchTerm, setSearchTerm] = useState('');
            const [dateFrom, setDateFrom] = useState('');
            const [dateTo, setDateTo] = useState('');
            const [employeeFilter, setEmployeeFilter] = useState('Semua');
            const [divisionFilter, setDivisionFilter] = useState('Semua');
            const [statusFilter, setStatusFilter] = useState('Semua');
            const [expandedIds, setExpandedIds] = useState({});
            const [showBulkModal, setShowBulkModal] = useState(false);
            const [deductions, setDeductions] = useState({});
            const safeOrders = safeArray(orders).filter(isVisibleOrder);
            const safeEmployees = safeArray(employees).filter(isVisibleRecord);
            const safeRekaps = safeArray(rekapKinerja).filter(isVisibleRecord);
            const safeInvoices = safeArray(invoices).filter(isVisibleRecord);
            const inRange = (value) => {
                if (!dateFrom && !dateTo) return true;
                if (!value) return true;
                const date = String(value).slice(0, 10);
                if (dateFrom && date < dateFrom) return false;
                if (dateTo && date > dateTo) return false;
                return true;
            };
            const getSalaryTypesList = (emp) => {
                try {
                    const list = safeArray(getEmployeeSalaryTypes(emp)).filter(Boolean);
                    return list.length > 0 ? list : [safeText(emp?.salaryType, 'Produksi')];
                } catch (error) {
                    return [safeText(emp?.salaryType, 'Produksi')];
                }
            };
            const getSalaryTypesText = (emp) => getSalaryTypesList(emp).join(', ') || 'Produksi';
            const getEmpProductionItems = (emp) => {
                const items = [];
                safeOrders.forEach(order => {
                    Object.entries(safeObject(order?.progress)).forEach(([stage, data]) => {
                        const logs = safeArray(data?.workLogs).filter(log => !log?.isDeleted && String(log?.empId) === String(emp?.id) && log?.checkAfter && inRange(log?.submittedAt || log?.takenAt || order?.date));
                        if (logs.length === 0) return;
                        const qty = logs.reduce((sum, log) => sum + safeNumber(log?.submittedQty ?? log?.qty), 0);
                        const stageLabel = safeArray(productionStageOptions).find(opt => opt.id === stage)?.label || stage;
                        let unitPrice = 0;
                        try { unitPrice = safeNumber(getProductionUnitPrice(order, stage)); } catch (error) { unitPrice = 0; }
                        items.push({ orderId: safeText(order?.id), client: safeText(order?.client), type: safeText(order?.type), marketing: safeText(order?.marketing), stage: stageLabel, qty, wage: qty * unitPrice, date: logs[0]?.submittedAt || logs[0]?.takenAt || order?.date });
                    });
                });
                return items;
            };
            const getEmpSummary = (emp) => {
                const productionItems = getEmpProductionItems(emp);
                const production = productionItems.reduce((sum, item) => sum + safeNumber(item.wage), 0);
                let dailyRows = [];
                try { dailyRows = getEmployeeDailySalaryLogs(emp).filter(row => !row.rekapId && inRange(row.date)); } catch (error) { dailyRows = []; }
                const daily = dailyRows.reduce((sum, row) => sum + safeNumber(getDailySalaryLogTotal(row).daily), 0);
                const overtime = dailyRows.reduce((sum, row) => sum + safeNumber(getDailySalaryLogTotal(row).overtime), 0);
                // TODO: koneksi data ini perlu disempurnakan nanti jika invoice marketing memakai relasi selain nama karyawan.
                const commission = safeInvoices.filter(inv => normalizeText(inv?.marketing) === normalizeText(emp?.name) && !inv?.commissionRekapId && inRange(inv?.date)).reduce((sum, inv) => {
                    try { return sum + safeNumber(getInvoiceCommissionTotal(inv)); } catch (error) { return sum; }
                }, 0);
                let kasbon = 0;
                try { kasbon = safeNumber(getEmployeeCashAdvanceSummary(emp).remaining); } catch (error) { kasbon = 0; }
                const gross = production + daily + overtime + commission;
                const deduction = Math.min(safeNumber(deductions[emp?.id]), kasbon, gross);
                return { productionItems, production, daily, overtime, commission, kasbon, gross, deduction, net: Math.max(0, gross - deduction), status: deduction > 0 ? (deduction >= kasbon ? 'Lunas / Sudah Dibayar' : 'Termin / Sebagian') : 'Belum Dibayar' };
            };
            const employeeRows = safeEmployees
                .filter(emp => employeeFilter === 'Semua' || String(emp.id) === String(employeeFilter))
                .filter(emp => divisionFilter === 'Semua' || emp.division === divisionFilter || getSalaryTypesText(emp).includes(divisionFilter))
                .map(emp => ({ emp, summary: getEmpSummary(emp) }))
                .filter(row => statusFilter === 'Semua' || row.summary.status === statusFilter)
                .filter(row => matchesSearch([row.emp.name, row.emp.division, getSalaryTypesText(row.emp), ...row.summary.productionItems.map(item => `${item.orderId} ${item.client} ${item.type} ${item.marketing} ${item.stage}`)], searchTerm));
            const totals = employeeRows.reduce((acc, row) => {
                acc.production += row.summary.production; acc.daily += row.summary.daily; acc.overtime += row.summary.overtime; acc.commission += row.summary.commission; acc.kasbon += row.summary.deduction; acc.gross += row.summary.gross; acc.net += row.summary.net;
                return acc;
            }, { production: 0, daily: 0, overtime: 0, commission: 0, kasbon: 0, gross: 0, net: 0 });
            const filteredRekaps = safeRekaps.filter(rekap => {
                const period = rekap.periodLabel || rekap.dateProcessed || rekap.createdAt || '';
                return matchesSearch([period, rekap.id, rekap.empName, rekap.division, rekap.note, rekap.totalWage, rekap.netSalary, ...(safeArray(rekap.employees).map(emp => `${emp.name} ${emp.division} ${emp.net}`))], searchTerm);
            });
            const rekapTotals = filteredRekaps.reduce((acc, rekap) => {
                const rows = safeArray(rekap.employees);
                if (rows.length > 0) {

                }

            }, { count: 0, employees: new Set(), net: 0, kasbon: 0, commission: 0 });
            const printBulkRekap = (rows = employeeRows, sum = totals) => {
                const period = `${dateFrom || 'Awal'} s/d ${dateTo || 'Sekarang'}`;

                const printContent = `<!DOCTYPE html><html><head><title>Rekap Gaji</title><style>@page{size:A4;margin:10mm}body{font-family:Arial;color:#111}.receipt{max-width:780px;margin:auto}.head{text-align:center;border-bottom:2px dashed #111;padding-bottom:10px;margin-bottom:12px}h1{font-size:20px;margin:0}.muted{font-size:12px;color:#555}table{width:100%;border-collapse:collapse;font-size:12px}th,td{border-bottom:1px dashed #bbb;padding:7px;text-align:right;vertical-align:top}th:first-child,td:first-child{text-align:left}.total{margin-top:12px;border-top:2px dashed #111;padding-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:13px}.total div{display:flex;justify-content:space-between}.strong{font-weight:900}</style></head><body><div class="receipt"><div class="head"><h1>${templates?.companyName || 'SIMPATI KONVEKSI'}</h1><div>REKAP GAJI KARYAWAN</div><div class="muted">Periode: ${period}</div></div><table><thead><tr><th>Karyawan</th><th>Produksi</th><th>Komisi</th><th>Harian</th><th>Lembur</th><th>Potongan</th><th>Bersih</th></tr></thead><tbody>${rowsHtml || '<tr><td colspan="7">Belum ada data.</td></tr>'}</tbody></table><div class="total"><div><span>Total Produksi</span><b>${formatRupiah(sum.production)}</b></div><div><span>Total Komisi</span><b>${formatRupiah(sum.commission)}</b></div><div><span>Total Harian</span><b>${formatRupiah(sum.daily)}</b></div><div><span>Total Lembur</span><b>${formatRupiah(sum.overtime)}</b></div><div><span>Total Potongan</span><b>${formatRupiah(sum.kasbon)}</b></div><div class="strong"><span>Total Dibayarkan</span><b>${formatRupiah(sum.net)}</b></div></div></div></body></html>`;
                const w = window.open('', '_blank'); if (!w) return showToast('Gagal mencetak. Harap izinkan Pop-up di browser Anda!', 'error');
                w.document.open(); w.document.write(printContent); w.document.close(); w.focus(); setTimeout(() => w.print(), 250);
            };
            const saveBulkRekap = () => {
                if (!setRekapKinerja) return showToast('Penyimpanan rekap belum tersedia.', 'error');
                const now = new Date().toISOString();
                const rows = employeeRows.map(row => ({ empId: row.emp.id, name: row.emp.name || '-', division: row.emp.division || '-', salaryTypes: getSalaryTypesText(row.emp), production: row.summary.production, commission: row.summary.commission, daily: row.summary.daily, overtime: row.summary.overtime, gross: row.summary.gross, deduction: row.summary.deduction, net: row.summary.net, kasbonRemaining: row.summary.kasbon }));
                // TODO: koneksi data ini perlu disempurnakan agar potongan kasbon massal bisa mengubah cashAdvances utama tanpa risiko pada data lama.
                const row = { id: `RKP-BULK-${Date.now()}`, type: 'bulk_salary_recap', periodStart: dateFrom || '', periodEnd: dateTo || '', periodLabel: `${dateFrom || 'Awal'} s/d ${dateTo || 'Sekarang'}`, employees: rows, productionSalary: totals.production, dailySalary: totals.daily, overtimeSalary: totals.overtime, marketingCommission: totals.commission, grossSalary: totals.gross, cashAdvanceDeduction: totals.kasbon, netSalary: totals.net, totalWage: totals.net, createdAt: now, dateProcessed: now.slice(0, 10), _syncUpdatedAt: now };
                setRekapKinerja(prev => [row, ...safeArray(prev)]);

            };
            const printRekap = (rekap) => {
                if (safeArray(rekap.employees).length > 0) {
                    const rows = safeArray(rekap.employees).map(emp => ({ emp: { name: emp.name, division: emp.division }, summary: { production: emp.production, commission: emp.commission, daily: emp.daily, overtime: emp.overtime, deduction: emp.deduction, net: emp.net } }));
                    printBulkRekap(rows, { production: rekap.productionSalary || 0, commission: rekap.marketingCommission || 0, daily: rekap.dailySalary || 0, overtime: rekap.overtimeSalary || 0, kasbon: rekap.cashAdvanceDeduction || 0, net: rekap.netSalary || 0 });
                    return;
                }
                printBulkRekap([{ emp: { name: rekap.empName || '-', division: rekap.division || '-' }, summary: { production: rekap.productionSalary || rekap.totalWage || 0, commission: rekap.marketingCommission || 0, daily: rekap.dailySalary || 0, overtime: rekap.overtimeSalary || 0, deduction: rekap.cashAdvanceDeduction || 0, net: rekap.netSalary ?? rekap.totalWage ?? 0 } }], { production: rekap.productionSalary || rekap.totalWage || 0, commission: rekap.marketingCommission || 0, daily: rekap.dailySalary || 0, overtime: rekap.overtimeSalary || 0, kasbon: rekap.cashAdvanceDeduction || 0, net: rekap.netSalary ?? rekap.totalWage ?? 0 });
            };
            return (
                <div className="space-y-6">
                    <div className="flex flex-col md:flex-row md:items-end md:justify-between gap-3"><div><h2 className="text-2xl font-bold text-gray-800">Laporan & Rekap Kinerja Karyawan</h2><p className="text-sm text-gray-500 mt-1">Rekap gaji produksi, harian, lembur, komisi, dan kasbon dalam satu tampilan.</p></div><button onClick={() => setShowBulkModal(true)} className="px-4 py-2 bg-blue-600 text-white rounded-lg font-bold text-sm">Rekap Seluruh Gaji</button></div>

                    <div className="grid grid-cols-1 md:grid-cols-7 gap-3"><Card><h3 className="text-xs font-bold text-gray-500">Karyawan</h3><p className="text-xl font-black">{employeeRows.length}</p></Card><Card><h3 className="text-xs font-bold text-gray-500">Produksi</h3><p className="text-lg font-black">{formatRupiah(totals.production)}</p></Card><Card><h3 className="text-xs font-bold text-gray-500">Harian</h3><p className="text-lg font-black">{formatRupiah(totals.daily)}</p></Card><Card><h3 className="text-xs font-bold text-gray-500">Lembur</h3><p className="text-lg font-black">{formatRupiah(totals.overtime)}</p></Card><Card><h3 className="text-xs font-bold text-gray-500">Komisi</h3><p className="text-lg font-black">{formatRupiah(totals.commission)}</p></Card><Card><h3 className="text-xs font-bold text-gray-500">Potongan</h3><p className="text-lg font-black">{formatRupiah(totals.kasbon)}</p></Card><Card><h3 className="text-xs font-bold text-gray-500">Bersih</h3><p className="text-lg font-black text-blue-700">{formatRupiah(totals.net)}</p></Card></div>
                    <Card><div className="grid grid-cols-1 md:grid-cols-6 gap-3 items-end"><input type="date" className="p-2 border rounded" value={dateFrom} onChange={e => setDateFrom(e.target.value)} /><input type="date" className="p-2 border rounded" value={dateTo} onChange={e => setDateTo(e.target.value)} /><select className="p-2 border rounded" value={employeeFilter} onChange={e => setEmployeeFilter(e.target.value)}><option>Semua</option>{safeEmployees.map(emp => <option key={emp.id} value={emp.id}>{emp.name}</option>)}</select><select className="p-2 border rounded" value={divisionFilter} onChange={e => setDivisionFilter(e.target.value)}><option>Semua</option>{[...new Set(safeEmployees.flatMap(emp => [emp.division, ...getSalaryTypesList(emp)]).filter(Boolean))].map(item => <option key={item}>{item}</option>)}</select><select className="p-2 border rounded" value={statusFilter} onChange={e => setStatusFilter(e.target.value)}><option>Semua</option><option>Belum Dibayar</option><option>Termin / Sebagian</option><option>Lunas / Sudah Dibayar</option></select><button type="button" onClick={() => { setDateFrom(''); setDateTo(''); setEmployeeFilter('Semua'); setDivisionFilter('Semua'); setStatusFilter('Semua'); setSearchTerm(''); }} className="p-2 bg-gray-200 rounded font-bold">Reset</button><div className="md:col-span-6"><SearchField value={searchTerm} onChange={setSearchTerm} placeholder="Cari nama, divisi, ID order, instansi, jenis produksi, marketing, catatan..." /></div></div></Card>
                    {activeReportTab === 'input' ? (
                        <Card><div className="overflow-x-auto"><table className="w-full text-sm"><thead className="bg-gray-50"><tr><th className="p-3 text-left">Karyawan</th><th className="p-3 text-right">Produksi</th><th className="p-3 text-right">Harian</th><th className="p-3 text-right">Lembur</th><th className="p-3 text-right">Komisi</th><th className="p-3 text-right">Bruto</th><th className="p-3 text-center">Status</th><th className="p-3 text-center">Aksi</th></tr></thead><tbody>{employeeRows.map(row => { const open = !!expandedIds[row.emp.id]; return <React.Fragment key={row.emp.id || row.emp.name}><tr className="border-t"><td className="p-3 font-bold">{row.emp.name || '-'}<div className="text-xs text-gray-500">{row.emp.division || '-'} / {getSalaryTypesText(row.emp)}</div></td><td className="p-3 text-right">{formatRupiah(row.summary.production)}</td><td className="p-3 text-right">{formatRupiah(row.summary.daily)}</td><td className="p-3 text-right">{formatRupiah(row.summary.overtime)}</td><td className="p-3 text-right">{formatRupiah(row.summary.commission)}</td><td className="p-3 text-right font-black">{formatRupiah(row.summary.gross)}</td><td className="p-3 text-center"><Badge status={row.summary.status} /></td><td className="p-3 text-center"><button onClick={() => setExpandedIds(prev => ({ ...prev, [row.emp.id]: !open }))} className="text-xs bg-blue-50 text-blue-700 px-2 py-1 rounded font-bold">{open ? 'Sembunyikan Rincian' : 'Lihat Rincian'}</button></td></tr>{open && <tr className="bg-gray-50"><td colSpan="8" className="p-3"><table className="w-full text-xs"><thead><tr><th className="p-2 text-left">Order</th><th className="p-2 text-left">Instansi</th><th className="p-2 text-left">Jenis</th><th className="p-2 text-left">Tahap</th><th className="p-2 text-right">Qty</th><th className="p-2 text-right">Gaji</th></tr></thead><tbody>{row.summary.productionItems.map((item, idx) => <tr key={`${item.orderId}-${idx}`} className="border-t"><td className="p-2 font-bold text-blue-700">{item.orderId}</td><td className="p-2">{item.client}</td><td className="p-2">{item.type}</td><td className="p-2">{item.stage}</td><td className="p-2 text-right">{item.qty}</td><td className="p-2 text-right">{formatRupiah(item.wage)}</td></tr>)}{row.summary.productionItems.length === 0 && <tr><td colSpan="6" className="p-4 text-center text-gray-500 italic">Belum ada rincian pekerjaan.</td></tr>}</tbody></table></td></tr>}</React.Fragment>; })}{employeeRows.length === 0 && <tr><td colSpan="8" className="p-8 text-center text-gray-500 italic">Belum ada data.</td></tr>}</tbody></table></div></Card>
                    ) : (
                        <div className="space-y-4"><div className="grid grid-cols-1 md:grid-cols-5 gap-3"><Card><h3 className="text-xs font-bold text-gray-500">Jumlah Rekap</h3><p className="text-xl font-black">{rekapTotals.count}</p></Card><Card><h3 className="text-xs font-bold text-gray-500">Total Karyawan</h3><p className="text-xl font-black">{rekapTotals.employees.size}</p></Card><Card><h3 className="text-xs font-bold text-gray-500">Gaji Bersih</h3><p className="text-xl font-black">{formatRupiah(rekapTotals.net)}</p></Card><Card><h3 className="text-xs font-bold text-gray-500">Potongan Kasbon</h3><p className="text-xl font-black">{formatRupiah(rekapTotals.kasbon)}</p></Card><Card><h3 className="text-xs font-bold text-gray-500">Komisi</h3><p className="text-xl font-black">{formatRupiah(rekapTotals.commission)}</p></Card></div><Card><div className="overflow-x-auto"><table className="w-full text-sm"><thead className="bg-gray-50"><tr><th className="p-3 text-left">Periode/Tanggal</th><th className="p-3 text-left">Rekap</th><th className="p-3 text-right">Karyawan</th><th className="p-3 text-right">Potongan</th><th className="p-3 text-right">Bersih</th><th className="p-3 text-center">Aksi</th></tr></thead><tbody>{filteredRekaps.map(rekap => <tr key={rekap.id} className="border-t"><td className="p-3">{rekap.periodLabel || rekap.dateProcessed || '-'}</td><td className="p-3 font-bold">{rekap.id || '-'}</td><td className="p-3 text-right">{safeArray(rekap.employees).length || 1}</td><td className="p-3 text-right">{formatRupiah(rekap.cashAdvanceDeduction || 0)}</td><td className="p-3 text-right font-black text-blue-700">{formatRupiah(rekap.netSalary ?? rekap.totalWage ?? 0)}</td><td className="p-3 text-center"><button onClick={() => printRekap(rekap)} className="text-xs bg-gray-50 text-slate-700 px-2 py-1 rounded font-bold">Cetak</button></td></tr>)}{filteredRekaps.length === 0 && <tr><td colSpan="6" className="p-8 text-center text-gray-500 italic">Belum ada rekap kinerja.</td></tr>}</tbody></table></div></Card></div>
                    )}
                    {showBulkModal && <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-[100] p-4"><div className="bg-white rounded-xl shadow-xl w-full max-w-6xl max-h-[92vh] overflow-y-auto"><div className="flex justify-between items-start border-b p-5"><div><h3 className="text-xl font-black">Rekap Seluruh Gaji Karyawan</h3><p className="text-sm text-gray-500">Periode {dateFrom || 'Awal'} s/d {dateTo || 'Sekarang'}</p></div><button onClick={() => setShowBulkModal(false)} className="text-2xl text-gray-400">&times;</button></div><div className="p-5 space-y-4"><div className="overflow-x-auto"><table className="w-full text-sm"><thead className="bg-gray-50"><tr><th className="p-2 text-left">Karyawan</th><th className="p-2 text-right">Produksi</th><th className="p-2 text-right">Komisi</th><th className="p-2 text-right">Harian</th><th className="p-2 text-right">Lembur</th><th className="p-2 text-right">Bruto</th><th className="p-2 text-right">Sisa Kasbon</th><th className="p-2 text-right">Potongan</th><th className="p-2 text-right">Bersih</th></tr></thead><tbody>{employeeRows.map(row => <tr key={row.emp.id || row.emp.name} className="border-t"><td className="p-2 font-bold">{row.emp.name || '-'}<div className="text-xs text-gray-500">{row.emp.division || '-'} / {getSalaryTypesText(row.emp)}</div></td><td className="p-2 text-right">{formatRupiah(row.summary.production)}</td><td className="p-2 text-right">{formatRupiah(row.summary.commission)}</td><td className="p-2 text-right">{formatRupiah(row.summary.daily)}</td><td className="p-2 text-right">{formatRupiah(row.summary.overtime)}</td><td className="p-2 text-right font-bold">{formatRupiah(row.summary.gross)}</td><td className="p-2 text-right">{row.summary.kasbon > 0 ? formatRupiah(row.summary.kasbon) : 'Tidak ada kasbon aktif'}</td><td className="p-2 text-right"><input type="number" min="0" max={Math.min(row.summary.kasbon, row.summary.gross)} className="w-28 p-1 border rounded text-right" value={deductions[row.emp.id] || ''} onChange={e => { const next = Math.min(safeNumber(e.target.value), row.summary.kasbon, row.summary.gross); setDeductions(prev => ({ ...prev, [row.emp.id]: next })); }} disabled={row.summary.kasbon <= 0 || row.summary.gross <= 0} /></td><td className="p-2 text-right font-black text-blue-700">{formatRupiah(row.summary.net)}</td></tr>)}{employeeRows.length === 0 && <tr><td colSpan="9" className="p-8 text-center text-gray-500 italic">Belum ada data karyawan.</td></tr>}</tbody></table></div><div className="grid grid-cols-2 md:grid-cols-6 gap-3"><Card><h4 className="text-xs font-bold text-gray-500">Produksi</h4><p className="font-black">{formatRupiah(totals.production)}</p></Card><Card><h4 className="text-xs font-bold text-gray-500">Komisi</h4><p className="font-black">{formatRupiah(totals.commission)}</p></Card><Card><h4 className="text-xs font-bold text-gray-500">Harian</h4><p className="font-black">{formatRupiah(totals.daily)}</p></Card><Card><h4 className="text-xs font-bold text-gray-500">Lembur</h4><p className="font-black">{formatRupiah(totals.overtime)}</p></Card><Card><h4 className="text-xs font-bold text-gray-500">Potongan</h4><p className="font-black">{formatRupiah(totals.kasbon)}</p></Card><Card><h4 className="text-xs font-bold text-gray-500">Bersih</h4><p className="font-black text-blue-700">{formatRupiah(totals.net)}</p></Card></div><div className="flex justify-end gap-2"><button onClick={() => printBulkRekap()} className="px-4 py-2 bg-gray-100 rounded font-bold">Cetak Rekap Gaji</button><button onClick={saveBulkRekap} className="px-4 py-2 bg-blue-600 text-white rounded font-bold">Simpan Rekap Gaji</button></div></div></div></div>}
                </div>
            );
        };

        const LaporanKeuanganView = ({ orders, employees, rekapKinerja, expenses = [], invoices = [], clients = [], templates, showToast }) => {
            const [period, setPeriod] = useState('');
            const [searchTerm, setSearchTerm] = useState('');
            const [employeeFilter, setEmployeeFilter] = useState('Semua');
            const [divisionFilter, setDivisionFilter] = useState('Semua');
            const [cashAdvanceStatusFilter, setCashAdvanceStatusFilter] = useState('Semua');
            const safeOrders = (Array.isArray(orders) ? orders : []).filter(isVisibleOrder);
            const safeFinanceEmployees = Array.isArray(employees) ? employees : [];
            const safeFinanceRekaps = Array.isArray(rekapKinerja) ? rekapKinerja : [];
            const safeFinanceInvoices = Array.isArray(invoices) ? invoices : [];
            const visibleEmployees = safeFinanceEmployees.filter(isVisibleRecord);
            const normalizedSearch = searchTerm.trim().toLowerCase();

            const formatDate = (value) => {
                if (!value) return '-';
                const date = new Date(value);
                if (isNaN(date.getTime())) return '-';
                return date.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
            };

            const isInPeriod = (value) => {
                if (!period) return true;
                if (!value) return false;
                const date = new Date(value);
                if (isNaN(date.getTime())) return false;
                return date.toISOString().slice(0, 7) === period;
            };

            const getMaterialDate = (order) => order.materialPurchasedAt || order.materialLastActionAt || order.materialPrintedAt || order.date;
            const getFinanceOrderMaterialTotal = (order) => getActiveMaterials(order).reduce((sum, item) => sum + getMaterialLineTotal(item), 0);
            const getOrderPaymentRows = (order) => {
                const rows = [];
                Object.entries(order.materialPayments || {}).forEach(([paymentKey, payments]) => {
                    const vendor = paymentKey.includes('|||') ? paymentKey.split('|||')[0] : paymentKey;
                    (Array.isArray(payments) ? payments : []).forEach((pay, idx) => {
                        rows.push({
                            id: `${order.id}-${paymentKey}-${pay.id || idx}`,
                            orderId: order.id,
                            date: pay.date || order.materialLastActionAt || order.date,
                            client: order.client || '-',
                            type: order.type || '-',
                            totalPcs: parseInt(order.total) || 0,
                            total: parseFloat(pay.amount) || 0,
                            vendors: [vendor],
                            materials: getActiveMaterials(order).filter(item => normalizeVendorName(item.vendor) === normalizeVendorName(vendor)),
                            isPayment: true,
                            paymentNote: pay.note || ''
                        });
                    });
                });
                return rows;
            };

            const allMaterialRows = safeOrders
                .filter(order => Array.isArray(order.materials) && getActiveMaterials(order).length > 0)
                .flatMap(order => {
                    const paymentRows = getOrderPaymentRows(order);
                    if (paymentRows.length > 0) return paymentRows;
                    if (order.materialStatus !== 'Selesai') return [];
                    return [{
                        id: order.id,
                        orderId: order.id,
                        date: getMaterialDate(order),
                        client: order.client || '-',
                        type: order.type || '-',
                        totalPcs: parseInt(order.total) || 0,
                        total: getFinanceOrderMaterialTotal(order),
                        vendors: [...new Set(getActiveMaterials(order).map(item => String(item.vendor || 'Tanpa Vendor').trim() || 'Tanpa Vendor'))],
                        materials: getActiveMaterials(order),
                        isPayment: false
                    }];
                });

            const allWageRows = safeFinanceRekaps
                .filter(isVisibleRecord)
                .map(rekap => {
                    const emp = visibleEmployees.find(e => String(e.id) === String(rekap.empId));
                    return {
                        id: rekap.id,
                        date: rekap.dateProcessed,
                        empId: rekap.empId,
                        empName: emp?.name || rekap.empName || rekap.empId || '-',
                        division: emp?.division || '-',
                        totalPcs: parseInt(rekap.total) || 0,
                        total: safeMoney(rekap.netSalary ?? rekap.totalWage),
                        grossSalary: safeMoney(rekap.grossSalary ?? rekap.totalWage),
                        cashAdvanceDeduction: safeMoney(rekap.cashAdvanceDeduction),
                        netSalary: safeMoney(rekap.netSalary ?? rekap.totalWage),
                        items: rekap.items || []
                    };
                });
            const allCashAdvanceRows = visibleEmployees.flatMap(emp => getEmployeeCashAdvances(emp).map(item => ({
                id: `${emp.id}-${item.id}`,
                empId: emp.id,
                empName: emp.name || '-',
                division: emp.division || '-',
                date: item.date,
                amount: getCashAdvanceAmount(item),
                deducted: getCashAdvanceDeducted(item),
                remaining: getCashAdvanceRemaining(item),
                status: normalizeCashAdvanceStatus(item),
                note: item.note || ''
            })));

            const materialRows = allMaterialRows.filter(row => {
                if (!isInPeriod(row.date)) return false;
                if (!normalizedSearch) return true;
                return [row.id, row.client, row.type, ...row.vendors, ...row.materials.map(item => item.name)].join(' ').toLowerCase().includes(normalizedSearch);
            });

            const wageRows = allWageRows.filter(row => {
                if (!isInPeriod(row.date)) return false;
                if (employeeFilter !== 'Semua' && String(row.empId) !== String(employeeFilter)) return false;
                if (divisionFilter !== 'Semua' && row.division !== divisionFilter) return false;
                if (!normalizedSearch) return true;
                return [row.id, row.empName, row.division, ...row.items.map(item => `${item.orderId} ${item.client} ${item.type}`)].join(' ').toLowerCase().includes(normalizedSearch);
            });
            const cashAdvanceRows = allCashAdvanceRows.filter(row => {
                if (!isInPeriod(row.date)) return false;
                if (employeeFilter !== 'Semua' && String(row.empId) !== String(employeeFilter)) return false;
                if (divisionFilter !== 'Semua' && row.division !== divisionFilter) return false;
                if (cashAdvanceStatusFilter !== 'Semua' && row.status !== cashAdvanceStatusFilter) return false;
                if (!normalizedSearch) return true;
                return [row.empName, row.division, row.date, row.amount, row.deducted, row.remaining, row.status, row.note].join(' ').toLowerCase().includes(normalizedSearch);
            });

            const totalMaterial = materialRows.reduce((sum, row) => sum + row.total, 0);
            const totalWage = wageRows.reduce((sum, row) => sum + row.netSalary, 0);
            const totalGrossWage = wageRows.reduce((sum, row) => sum + row.grossSalary, 0);
            const totalCashAdvanceDeductionInPeriod = wageRows.reduce((sum, row) => sum + row.cashAdvanceDeduction, 0);
            const totalCashAdvanceGiven = cashAdvanceRows.reduce((sum, row) => sum + row.amount, 0);
            const totalCashAdvanceDeducted = allCashAdvanceRows
                .filter(row => employeeFilter === 'Semua' || String(row.empId) === String(employeeFilter))
                .filter(row => divisionFilter === 'Semua' || row.division === divisionFilter)
                .filter(row => cashAdvanceStatusFilter === 'Semua' || row.status === cashAdvanceStatusFilter)
                .reduce((sum, row) => sum + row.deducted, 0);
            const totalCashAdvanceRemaining = allCashAdvanceRows
                .filter(row => employeeFilter === 'Semua' || String(row.empId) === String(employeeFilter))
                .filter(row => divisionFilter === 'Semua' || row.division === divisionFilter)
                .filter(row => cashAdvanceStatusFilter === 'Semua' || row.status === cashAdvanceStatusFilter)
                .reduce((sum, row) => sum + row.remaining, 0);
            const expenseRows = (expenses || []).filter(isVisibleRecord).filter(row => {
                if (!isInPeriod(row.date)) return false;
                if (!normalizedSearch) return true;
                return [row.date, row.type, row.category, row.amount, row.method, row.party, row.note].join(' ').toLowerCase().includes(normalizedSearch);
            });
            const invoiceRows = safeFinanceInvoices.filter(isVisibleRecord).filter(inv => {
                if (!isInPeriod(inv.date)) return false;
                if (!normalizedSearch) return true;
                return [inv.id, inv.date, inv.customer, inv.marketing, inv.type, inv.paymentStatus, inv.note, ...getInvoiceItems(inv).map(item => item.productionType)].join(' ').toLowerCase().includes(normalizedSearch);
            });
            const getInvoiceTotal = (inv) => getInvoiceTotals(inv).total;
            const getInvoicePaid = (inv) => getInvoiceCashInflow(inv);
            const getInvoiceCommission = (inv) => getInvoiceCommissionTotal(inv);
            const clientDpRows = (clients || []).filter(isVisibleRecord).flatMap(client => (Array.isArray(client.clientDpPayments) ? client.clientDpPayments : []).filter(isVisibleRecord).map(dp => ({ ...dp, clientName: client.name || '-' }))).filter(dp => {
                if (!isInPeriod(dp.date)) return false;
                if (dp.invoiceId) return false;
                if (!normalizedSearch) return true;
                return [dp.clientName, dp.date, dp.amount, dp.method, dp.note].join(' ').toLowerCase().includes(normalizedSearch);
            });
            const allClientDpRows = (clients || []).filter(isVisibleRecord).flatMap(client => (Array.isArray(client.clientDpPayments) ? client.clientDpPayments : []).filter(isVisibleRecord).map(dp => ({ ...dp, clientName: client.name || '-' }))).filter(dp => {
                if (!isInPeriod(dp.date)) return false;
                if (!normalizedSearch) return true;
                return [dp.clientName, dp.date, dp.amount, dp.method, dp.note, dp.orderId, dp.invoiceId].join(' ').toLowerCase().includes(normalizedSearch);
            }).sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));
            const totalInvoiceIncome = invoiceRows.reduce((sum, inv) => sum + getInvoicePaid(inv), 0);
            const totalInvoiceReceivable = invoiceRows.reduce((sum, inv) => sum + Math.max(0, getInvoiceTotal(inv) - getInvoicePaid(inv)), 0);
            const totalClientDpIncome = clientDpRows.reduce((sum, row) => sum + safeMoney(row.amount), 0);
            const totalManualIncome = expenseRows.filter(row => row.type === 'Uang Masuk').reduce((sum, row) => sum + safeMoney(row.amount), 0);
            const totalOperationalExpense = expenseRows.filter(row => row.type === 'Uang Keluar').reduce((sum, row) => sum + safeMoney(row.amount), 0);
            const totalMarketingCommission = invoiceRows.reduce((sum, inv) => sum + getInvoiceCommission(inv), 0);
            const totalIncomeAll = totalInvoiceIncome + totalClientDpIncome + totalManualIncome;
            const totalExpense = totalMaterial + totalWage + totalCashAdvanceGiven + totalOperationalExpense + totalMarketingCommission;
            const netBalance = totalIncomeAll - totalExpense;
            const materialBillingRows = safeOrders
                .filter(order => Array.isArray(order.materials) && getActiveMaterials(order).length > 0)
                .map(order => {
                    const billed = getFinanceOrderMaterialTotal(order);
                    const paid = Object.values(order.materialPayments || {}).flat().reduce((sum, pay) => sum + (parseFloat(pay?.amount) || 0), 0);
                    return { order, billed, paid, remaining: Math.max(0, billed - paid) };
                })
                .filter(row => row.billed > 0);
            const totalMaterialBill = materialBillingRows.reduce((sum, row) => sum + row.billed, 0);
            const totalVendorPaid = materialBillingRows.reduce((sum, row) => sum + row.paid, 0);
            const totalVendorDebt = materialBillingRows.reduce((sum, row) => sum + row.remaining, 0);
            const totalPaidOffPurchase = materialBillingRows.filter(row => row.remaining <= 0).reduce((sum, row) => sum + row.billed, 0);
            const totalUnpaidPurchase = materialBillingRows.filter(row => row.remaining > 0).reduce((sum, row) => sum + row.remaining, 0);

            const orderCostMap = new Map();
            materialRows.forEach(row => {
                const key = String(row.orderId || row.id);
                const existing = orderCostMap.get(key) || {
                    orderId: row.orderId || row.id,
                    client: row.client,
                    type: row.type,
                    totalPcs: row.totalPcs,
                    materialCost: 0,
                    wageCost: 0,
                    date: row.date
                };
                existing.materialCost += row.total;
                if (!existing.date || new Date(row.date || 0) > new Date(existing.date || 0)) existing.date = row.date;
                orderCostMap.set(key, existing);
            });
            wageRows.forEach(row => {
                (row.items || []).forEach(item => {
                    const key = String(item.orderId || '-');
                    const existing = orderCostMap.get(key) || {
                        orderId: item.orderId || '-',
                        client: item.client || '-',
                        type: item.type || '-',
                        totalPcs: 0,
                        materialCost: 0,
                        wageCost: 0,
                        date: row.date
                    };
                    existing.wageCost += parseInt(item.wageTotal) || 0;
                    if (!existing.date || new Date(row.date || 0) > new Date(existing.date || 0)) existing.date = row.date;
                    orderCostMap.set(key, existing);
                });
            });
            const orderCostRows = [...orderCostMap.values()]
                .map(row => ({ ...row, totalCost: row.materialCost + row.wageCost }))
                .sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));

            const vendorSummary = Object.values(materialRows.reduce((acc, row) => {
                if (row.isPayment) {
                    (row.vendors || ['Tanpa Vendor']).forEach(vendorName => {
                        const vendor = String(vendorName || 'Tanpa Vendor').trim() || 'Tanpa Vendor';
                        if (!acc[vendor]) acc[vendor] = { name: vendor, total: 0, items: 0 };
                        acc[vendor].total += row.total;
                        acc[vendor].items += 1;
                    });
                    return acc;
                }
                (row.materials || []).forEach(item => {
                    const vendor = String(item.vendor || 'Tanpa Vendor').trim() || 'Tanpa Vendor';
                    if (!acc[vendor]) acc[vendor] = { name: vendor, total: 0, items: 0 };
                    acc[vendor].total += getMaterialLineTotal(item);
                    acc[vendor].items += 1;
                });
                return acc;
            }, {})).sort((a, b) => b.total - a.total);

            const employeeSummary = Object.values(wageRows.reduce((acc, row) => {
                const key = String(row.empId || row.empName);
                if (!acc[key]) acc[key] = { name: row.empName, division: row.division, total: 0, pcs: 0, rekap: 0 };
                acc[key].total += row.total;
                acc[key].pcs += row.totalPcs;
                acc[key].rekap += 1;
                return acc;
            }, {})).sort((a, b) => b.total - a.total);

            const handlePrint = () => {
