                                <div><label className="block text-sm mb-1 font-semibold">Status</label><select className="w-full p-2 border rounded" value={newEmp.status} onChange={e => setNewEmp({...newEmp, status: e.target.value})}><option>Aktif</option><option>Nonaktif</option></select></div>
                                <div><label className="block text-sm mb-1 font-semibold">Tipe Gaji</label><select className="w-full p-2 border rounded" value={newEmp.salaryType} onChange={e => setNewEmp({...newEmp, salaryType: e.target.value})}><option>Produksi</option><option>Harian</option><option>Marketing</option><option>Campuran</option></select></div>
                                <div><label className="block text-sm mb-1 font-semibold">Nominal Gaji Harian</label><input type="number" min="0" className="w-full p-2 border rounded" value={newEmp.dailySalary} onChange={e => setNewEmp({...newEmp, dailySalary: e.target.value})} /></div>
                                <div className="md:col-span-2 flex justify-end"><button type="submit" className="bg-blue-600 text-white px-6 py-2 rounded">Simpan Data</button></div>
                            </form>
                        </Card>
                    )}

                    <Card>
                        <div className="mb-4 max-w-md">
                            <SearchField value={searchTerm} onChange={setSearchTerm} placeholder="Cari nama, divisi, no HP, status..." />
                        </div>
                        <table className="w-full text-left border-collapse">
                            <thead><tr className="bg-gray-50 border-b">
                                <th className="p-3 text-sm">Nama</th><th className="p-3 text-sm">Divisi</th><th className="p-3 text-sm">Tipe Gaji</th><th className="p-3 text-sm">Gaji Harian</th><th className="p-3 text-sm">Kasbon</th><th className="p-3 text-sm">Status</th><th className="p-3 text-sm text-center">Aksi</th>
                            </tr></thead>
                            <tbody>
                                {filteredEmployees.map(emp => {
                                    const kasbonSummary = getEmployeeCashAdvanceSummary(emp);
                                    return (
                                        <tr key={emp.id} className="border-b hover:bg-gray-50 transition-colors">
                                            <td className="p-3 text-sm font-medium text-gray-800">{emp.name}</td>
                                            <td className="p-3 text-sm text-gray-600">{emp.division}</td>
                                            <td className="p-3 text-sm text-gray-600">{emp.salaryType || 'Produksi'}</td>
                                            <td className="p-3 text-sm text-gray-600 font-bold">{formatRupiah(emp.dailySalary || 0)}</td>
                                            <td className="p-3 text-sm">
                                                <div className="font-bold text-red-700">{formatRupiah(kasbonSummary.remaining)}</div>
                                                <div className="text-xs text-gray-500">{kasbonSummary.advances.length} kasbon aktif</div>
                                            </td>
                                            <td className="p-3"><Badge status={emp.status || 'Aktif'} /></td>
                                            <td className="p-3 text-center">
                                                <div className="flex justify-center flex-wrap gap-2">
                                                    <button onClick={() => openCashAdvanceModal(emp)} className="text-orange-600 hover:text-orange-800 bg-orange-50 px-2 py-1.5 rounded text-xs font-bold" title="Kasbon Karyawan">Kasbon</button>
                                                    <button onClick={() => openDailySalaryModal(emp)} className="text-green-700 hover:text-green-900 bg-green-50 px-2 py-1.5 rounded text-xs font-bold" title="Gaji Harian">Gaji Harian</button>
                                                    <button onClick={() => setEditEmp({...emp, status: emp.status || 'Aktif'})} className="text-blue-500 hover:text-blue-700 bg-blue-50 p-1.5 rounded" title="Edit Karyawan"><IconEdit /></button>
                                                    <button onClick={() => setDeleteConfirmId(emp.id)} className="text-red-500 hover:text-red-700 bg-red-50 p-1.5 rounded" title="Hapus Karyawan"><IconTrash /></button>
                                                </div>
                                            </td>
                                        </tr>
                                    );
                                })}
                                {filteredEmployees.length === 0 && <tr><td colSpan="7" className="p-6 text-center text-gray-500 italic">{searchTerm ? 'Tidak ada karyawan yang cocok dengan pencarian.' : 'Belum ada data karyawan.'}</td></tr>}
                            </tbody>
                        </table>
                    </Card>

                    {activeCashAdvanceEmp && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-[100] p-4">
                            <div className="bg-white p-6 rounded-xl w-full max-w-5xl shadow-xl max-h-[92vh] overflow-y-auto">
                                <div className="flex justify-between items-start gap-4 border-b pb-4 mb-4">
                                    <div>
                                        <h3 className="font-bold text-lg text-gray-900">Kasbon Karyawan</h3>
                                        <p className="text-sm text-gray-600">{activeCashAdvanceEmp.name} - {activeCashAdvanceEmp.division}</p>
                                    </div>
                                    <button onClick={() => { setCashAdvanceEmp(null); resetCashAdvanceForm(); }} className="text-gray-400 hover:text-gray-600 text-2xl">&times;</button>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-5">
                                    <div className="bg-red-50 border border-red-100 rounded-lg p-4">
                                        <div className="text-xs font-bold text-red-700">Total Kasbon</div>
                                        <div className="text-xl font-black text-red-800">{formatRupiah(activeCashAdvanceSummary.total)}</div>
                                    </div>
                                    <div className="bg-green-50 border border-green-100 rounded-lg p-4">
                                        <div className="text-xs font-bold text-green-700">Total Sudah Dipotong</div>
                                        <div className="text-xl font-black text-green-800">{formatRupiah(activeCashAdvanceSummary.deducted)}</div>
                                    </div>
                                    <div className="bg-orange-50 border border-orange-100 rounded-lg p-4">
                                        <div className="text-xs font-bold text-orange-700">Sisa Kasbon</div>
                                        <div className="text-xl font-black text-orange-800">{formatRupiah(activeCashAdvanceSummary.remaining)}</div>
                                    </div>
                                </div>
                                <form onSubmit={saveCashAdvance} className="grid grid-cols-1 md:grid-cols-5 gap-3 bg-gray-50 border border-gray-200 rounded-lg p-4 mb-5">
                                    <div>
                                        <label className="block text-xs font-bold text-gray-600 mb-1">Tanggal Kasbon</label>
                                        <input required type="date" className="w-full p-2 border rounded text-sm" value={cashAdvanceForm.date} onChange={e => setCashAdvanceForm(prev => ({ ...prev, date: e.target.value }))} />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-gray-600 mb-1">Nominal Kasbon</label>
                                        <input required type="number" min="0" className="w-full p-2 border rounded text-sm text-right" value={cashAdvanceForm.amount} onChange={e => setCashAdvanceForm(prev => ({ ...prev, amount: e.target.value }))} />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-gray-600 mb-1">Status Kasbon</label>
                                        <select className="w-full p-2 border rounded text-sm" value={cashAdvanceForm.status} onChange={e => setCashAdvanceForm(prev => ({ ...prev, status: e.target.value }))}>
                                            <option>Belum Dipotong</option>
                                            <option>Dipotong Sebagian</option>
                                            <option>Lunas</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-gray-600 mb-1">Catatan Kasbon</label>
                                        <input type="text" className="w-full p-2 border rounded text-sm" value={cashAdvanceForm.note} onChange={e => setCashAdvanceForm(prev => ({ ...prev, note: e.target.value }))} />
                                    </div>
                                    <div className="flex items-end gap-2">
                                        <button type="submit" className="flex-1 bg-blue-600 hover:bg-blue-700 text-white rounded-lg p-2 text-sm font-bold">{editingCashAdvanceId ? 'Simpan Edit' : 'Tambah Kasbon'}</button>
                                        {editingCashAdvanceId && <button type="button" onClick={resetCashAdvanceForm} className="px-3 py-2 bg-gray-200 rounded-lg text-sm font-bold">Batal</button>}
                                    </div>
                                </form>
                                <div className="overflow-x-auto border border-gray-200 rounded-lg">
                                    <table className="w-full text-sm text-left">
                                        <thead className="bg-gray-50">
                                            <tr>
                                                <th className="p-3">Tanggal</th>
                                                <th className="p-3 text-right">Nominal</th>
                                                <th className="p-3 text-right">Sudah Dipotong</th>
                                                <th className="p-3 text-right">Sisa</th>
                                                <th className="p-3">Catatan</th>
                                                <th className="p-3 text-center">Status</th>
                                                <th className="p-3 text-center">Aksi</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {activeCashAdvanceSummary.advances.map(item => (
                                                <tr key={item.id} className="border-t border-gray-100">
                                                    <td className="p-3">{item.date || '-'}</td>
                                                    <td className="p-3 text-right font-bold text-red-700">{formatRupiah(getCashAdvanceAmount(item))}</td>
                                                    <td className="p-3 text-right font-bold text-green-700">{formatRupiah(getCashAdvanceDeducted(item))}</td>
                                                    <td className="p-3 text-right font-bold text-orange-700">{formatRupiah(getCashAdvanceRemaining(item))}</td>
                                                    <td className="p-3">{item.note || '-'}</td>
                                                    <td className="p-3 text-center"><Badge status={normalizeCashAdvanceStatus(item)} /></td>
                                                    <td className="p-3">
                                                        <div className="flex justify-center gap-2">
                                                            <button onClick={() => editCashAdvance(item)} className="text-blue-600 bg-blue-50 hover:bg-blue-100 p-1.5 rounded" title="Edit kasbon"><IconEdit /></button>
                                                            <button onClick={() => deleteCashAdvance(item.id)} className="text-red-600 bg-red-50 hover:bg-red-100 p-1.5 rounded" title="Hapus kasbon"><IconTrash /></button>
                                                        </div>
                                                    </td>
                                                </tr>
                                            ))}
                                            {activeCashAdvanceSummary.advances.length === 0 && <tr><td colSpan="7" className="p-6 text-center text-gray-500 italic">Belum ada kasbon.</td></tr>}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    )}

                    {activeDailySalaryEmp && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-[100] p-4">
                            <div className="bg-white p-6 rounded-xl w-full max-w-5xl shadow-xl max-h-[92vh] overflow-y-auto">
                                <div className="flex justify-between items-start gap-4 border-b pb-4 mb-4">
                                    <div>
                                        <h3 className="font-bold text-lg text-gray-900">Gaji Harian Karyawan</h3>
                                        <p className="text-sm text-gray-600">{activeDailySalaryEmp.name} - {activeDailySalaryEmp.division}</p>
                                    </div>
                                    <button onClick={() => { setDailySalaryEmp(null); resetDailySalaryForm(); }} className="text-gray-400 hover:text-gray-600 text-2xl">&times;</button>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-5">
                                    <div className="bg-green-50 border border-green-100 rounded-lg p-4"><div className="text-xs font-bold text-green-700">Total Gaji Harian & Lembur</div><div className="text-xl font-black text-green-800">{formatRupiah(activeDailySalaryTotal)}</div></div>
                                    <div className="bg-blue-50 border border-blue-100 rounded-lg p-4"><div className="text-xs font-bold text-blue-700">Jumlah Catatan</div><div className="text-xl font-black text-blue-800">{activeDailySalaryLogs.length}</div></div>
                                    <div className="bg-purple-50 border border-purple-100 rounded-lg p-4"><div className="text-xs font-bold text-purple-700">Nominal Default</div><div className="text-xl font-black text-purple-800">{formatRupiah(activeDailySalaryEmp.dailySalary || 0)}</div></div>
                                </div>
                                <form onSubmit={saveDailySalaryLog} className="grid grid-cols-1 md:grid-cols-6 gap-3 bg-gray-50 border border-gray-200 rounded-lg p-4 mb-5">
                                    <input required type="date" className="p-2 border rounded text-sm" value={dailySalaryForm.date} onChange={e => setDailySalaryForm(prev => ({ ...prev, date: e.target.value }))} />
                                    <input type="number" min="0" className="p-2 border rounded text-sm text-right" placeholder="Hari masuk" value={dailySalaryForm.workDays} onChange={e => setDailySalaryForm(prev => ({ ...prev, workDays: e.target.value }))} />
                                    <input type="number" min="0" className="p-2 border rounded text-sm text-right" placeholder="Nominal harian" value={dailySalaryForm.dailySalary} onChange={e => setDailySalaryForm(prev => ({ ...prev, dailySalary: e.target.value }))} />
                                    <input type="number" min="0" className="p-2 border rounded text-sm text-right" placeholder="Jumlah lembur" value={dailySalaryForm.overtimeCount} onChange={e => setDailySalaryForm(prev => ({ ...prev, overtimeCount: e.target.value }))} />
                                    <input type="number" min="0" className="p-2 border rounded text-sm text-right" placeholder="Nominal lembur" value={dailySalaryForm.overtimeRate} onChange={e => setDailySalaryForm(prev => ({ ...prev, overtimeRate: e.target.value }))} />
                                    <input className="p-2 border rounded text-sm" placeholder="Catatan" value={dailySalaryForm.note} onChange={e => setDailySalaryForm(prev => ({ ...prev, note: e.target.value }))} />
                                    <div className="md:col-span-6 flex justify-between items-center gap-2">
                                        <div className="text-sm font-bold text-gray-700">Total input: {formatRupiah(getDailySalaryLogTotal(dailySalaryForm).total)}</div>
                                        <div className="flex gap-2"><button type="button" onClick={resetDailySalaryForm} className="px-4 py-2 bg-gray-200 rounded font-bold text-sm">Reset</button><button className="px-4 py-2 bg-green-600 text-white rounded font-bold text-sm">{editingDailySalaryId ? 'Simpan Edit' : 'Tambah Gaji Harian'}</button></div>
                                    </div>
                                </form>
                                <div className="overflow-x-auto border border-gray-200 rounded-lg">
                                    <table className="w-full text-sm text-left">
                                        <thead className="bg-gray-50"><tr><th className="p-3">Tanggal</th><th className="p-3 text-right">Hari</th><th className="p-3 text-right">Gaji Harian</th><th className="p-3 text-right">Lembur</th><th className="p-3 text-right">Total</th><th className="p-3">Catatan</th><th className="p-3 text-center">Aksi</th></tr></thead>
                                        <tbody>
                                            {activeDailySalaryLogs.map(log => {
                                                const total = getDailySalaryLogTotal(log);
                                                return <tr key={log.id} className="border-t"><td className="p-3">{log.date}</td><td className="p-3 text-right">{log.workDays}</td><td className="p-3 text-right">{formatRupiah(total.daily)}</td><td className="p-3 text-right">{formatRupiah(total.overtime)}</td><td className="p-3 text-right font-black text-green-700">{formatRupiah(total.total)}</td><td className="p-3">{log.note || '-'}</td><td className="p-3"><div className="flex justify-center gap-2"><button onClick={() => editDailySalaryLog(log)} className="text-blue-600 bg-blue-50 hover:bg-blue-100 p-1.5 rounded"><IconEdit /></button><button onClick={() => deleteDailySalaryLog(log.id)} className="text-red-600 bg-red-50 hover:bg-red-100 p-1.5 rounded"><IconTrash /></button></div></td></tr>;
                                            })}
                                            {activeDailySalaryLogs.length === 0 && <tr><td colSpan="7" className="p-6 text-center text-gray-500 italic">Belum ada data gaji harian.</td></tr>}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    )}

                    {editEmp && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-[100] p-4">
                            <div className="bg-white p-6 rounded-xl w-full max-w-2xl shadow-xl max-h-[90vh] overflow-y-auto">
                                <h3 className="font-bold text-lg mb-4 border-b pb-2">Edit Data Karyawan</h3>
                                <form onSubmit={handleSaveEdit} className="space-y-4">
                                    <div><label className="block text-sm mb-1 font-semibold">Nama Karyawan</label><input required type="text" className="w-full p-2 border rounded focus:ring-blue-500" value={editEmp.name} onChange={e => setEditEmp({...editEmp, name: e.target.value})} /></div>
                                    <div>
                                        <label className="block text-sm mb-1 font-semibold">Divisi</label>
                                        <select className="w-full p-2 border rounded focus:ring-blue-500" value={editEmp.division} onChange={e => setEditEmp({...editEmp, division: e.target.value})}>
                                            <option>Cutting</option>
                                            <option>Sablon/Bordir</option>
                                            <option>Jahit</option>
                                            <option>Pasang Kancing</option>
                                            <option>Finishing</option>
                                            <option>Marketing</option>
                                        </select>
                                    </div>
                                    <div><label className="block text-sm mb-1 font-semibold">Nomor HP</label><input type="text" className="w-full p-2 border rounded focus:ring-blue-500" value={editEmp.phone} onChange={e => setEditEmp({...editEmp, phone: e.target.value})} /></div>
                                    <div><label className="block text-sm mb-1 font-semibold">Status Pekerja</label><select className="w-full p-2 border rounded focus:ring-blue-500" value={editEmp.status} onChange={e => setEditEmp({...editEmp, status: e.target.value})}><option>Aktif</option><option>Nonaktif</option></select></div>
                                    <div><label className="block text-sm mb-1 font-semibold">Tipe Gaji</label><select className="w-full p-2 border rounded focus:ring-blue-500" value={editEmp.salaryType || 'Produksi'} onChange={e => setEditEmp({...editEmp, salaryType: e.target.value})}><option>Produksi</option><option>Harian</option><option>Marketing</option><option>Campuran</option></select></div>
                                    <div><label className="block text-sm mb-1 font-semibold">Nominal Gaji Harian</label><input type="number" min="0" className="w-full p-2 border rounded focus:ring-blue-500" value={editEmp.dailySalary || ''} onChange={e => setEditEmp({...editEmp, dailySalary: e.target.value})} /></div>
                                    <div className="flex justify-end space-x-3 pt-4 border-t">
                                        <button type="button" onClick={() => setEditEmp(null)} className="px-4 py-2 bg-gray-200 rounded font-medium">Batal</button>
                                        <button type="submit" className="px-4 py-2 bg-blue-600 text-white rounded font-medium">Simpan Perubahan</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {deleteConfirmId && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-[100]">
                            <div className="bg-white p-6 rounded-xl w-80">
                                <h3 className="font-bold mb-2">Hapus?</h3>
                                <div className="flex justify-end space-x-2">
                                    <button onClick={() => setDeleteConfirmId(null)} className="px-4 py-2 bg-gray-200 rounded">Batal</button>
                                    <button onClick={executeDeleteKaryawan} className="px-4 py-2 bg-red-600 text-white rounded">Hapus</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const InputOrderView = ({ orders, setOrders, setActiveTab, showToast }) => {
            const allOrders = orders || [];
            const safeOrders = allOrders.filter(isVisibleOrder);
            const [newOrder, setNewOrder] = useState({ client: '', type: '', date: new Date().toISOString().split('T')[0], deadline: '', notes: '', designImage1: '', designImage2: '', marketing: '', processFlow: getDefaultOrderProcessFlow(), productionPrices: getDefaultProductionPrices() });
            const [sizeInputs, setSizeInputs] = useState([{ id: 1, label: 'S', qty: '' }, { id: 2, label: 'M', qty: '' }, { id: 3, label: 'L', qty: '' }, { id: 4, label: 'XL', qty: '' }]);
            // Ambil dan urutkan daftar instansi yang sudah pernah diinput sebelumnya
            const uniqueClients = [...new Set(safeOrders.map(o => o.client).filter(Boolean))].sort();
            
            // Ambil dan urutkan daftar jenis produksi (gabungan bawaan + histori sebelumnya)
            const defaultTypes = ['Kaos', 'Kemeja', 'Jaket', 'Wearpack', 'Wangki / Polo Shirt', 'Celana', 'Topi'];
            const uniqueTypes = [...new Set([...defaultTypes, ...safeOrders.map(o => o.type).filter(Boolean)])].sort();

            // Ambil dan urutkan daftar nama marketing yang sudah pernah diinput
            const uniqueMarketing = [...new Set(safeOrders.map(o => o.marketing).filter(Boolean))].sort();

            const totalQty = sizeInputs.reduce((sum, item) => sum + (parseInt(item.qty) || 0), 0);

            const handleSizeLabelChange = (index, val) => {
                const newSizes = [...sizeInputs];
                newSizes[index].label = val;
                setSizeInputs(newSizes);
            };

            const handleSizeQtyChange = (index, val) => {
                const newSizes = [...sizeInputs];
                newSizes[index].qty = val;
                setSizeInputs(newSizes);
            };

            const handleAddSize = () => setSizeInputs([...sizeInputs, { id: Date.now(), label: 'Custom', qty: '' }]);
            const toggleOrderProcess = (processId) => {
                setNewOrder(prev => {
                    const nextFlow = { ...getDefaultOrderProcessFlow(), ...(prev.processFlow || {}), [processId]: !(prev.processFlow || getDefaultOrderProcessFlow())[processId] };
                    if (!productionStageOptions.some(stage => nextFlow[stage.id])) {
                        showToast("Minimal pilih satu proses produksi.", "error");
                        return prev;
                    }
                    return { ...prev, processFlow: nextFlow };
                });
            };
            const updateProductionPrice = (stageId, value) => {
                setNewOrder(prev => ({ ...prev, productionPrices: { ...getDefaultProductionPrices(), ...(prev.productionPrices || {}), [stageId]: value } }));
            };

            const handleImageUpload = (e, imageField) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 500; 
                        let width = img.width, height = img.height;
                        if (width > MAX_WIDTH) { height = Math.round(height * (MAX_WIDTH / width)); width = MAX_WIDTH; }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        setNewOrder(prev => ({ ...prev, [imageField]: canvas.toDataURL('image/jpeg', 0.6) })); 
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if(totalQty <= 0) { showToast("Jumlah total tidak boleh kosong atau nol.", "error"); return; }
                
                const finalSizes = {};
                sizeInputs.forEach(item => {
                    const parsedQty = parseInt(item.qty) || 0;
                    if (parsedQty > 0) finalSizes[item.label || 'Custom'] = parsedQty;
                });

                let maxIdNum = 0;
                allOrders.forEach(o => {
                    if (o.id) {
                        const match = String(o.id).match(/ORD-(\d+)/);
                        if (match) {
                            const num = parseInt(match[1], 10);
                            if (!isNaN(num) && num > maxIdNum) {
                                maxIdNum = num;
                            }
                        }
                    }
                });
                
                let nextNum = maxIdNum + 1;
                let newOrderId = `ORD-${String(nextNum).padStart(3, '0')}`;
                
                while (allOrders.some(o => o.id === newOrderId)) {
                    nextNum++;
                    newOrderId = `ORD-${String(nextNum).padStart(3, '0')}`;
                }

                const orderToAdd = {
                    ...newOrder,
                    id: newOrderId,
                    sizes: finalSizes,
                    total: totalQty,
                    status: 'Pending',
                    processFlow: { ...getDefaultOrderProcessFlow(), ...(newOrder.processFlow || {}) },
                    productionPrices: { ...getDefaultProductionPrices(), ...(newOrder.productionPrices || {}) },
                    materialStatus: (newOrder.processFlow || getDefaultOrderProcessFlow()).materials === false ? 'Tidak Perlu' : 'Belum',
                    progress: {
                        cutting: { status: 'Belum', employees: [], workLogs: [] },
                        sablon: { status: 'Belum', employees: [], workLogs: [] },
                        jahit: { status: 'Belum', employees: [], workLogs: [] },
                        kancing: { status: 'Belum', employees: [], workLogs: [] },
                        finishing: { status: 'Belum', employees: [], workLogs: [] }
                    }
                };
                
                setOrders(prev => [orderToAdd, ...(prev||[])]);
                const selectedProcessLabels = orderProcessOptions.filter(opt => orderToAdd.processFlow[opt.id] !== false).map(opt => opt.label).join(', ');
                showToast("Order ditambahkan ke antrean!", "success");
                setActiveTab('produksi');
            };

            return (
                <div className="space-y-6 max-w-4xl">
                    <h2 className="text-2xl font-bold text-gray-800">Input Order Produksi</h2>

                    <Card>
                        <form onSubmit={handleSubmit} className="space-y-6">
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div><label className="block text-sm font-medium text-gray-700 mb-1">Tanggal Masuk</label><input required type="date" className="w-full p-2 border border-gray-300 rounded-lg focus:ring-blue-500" value={newOrder.date} onChange={e => setNewOrder({...newOrder, date: e.target.value})} /></div>
                                <div><label className="block text-sm font-medium text-gray-700 mb-1">Deadline Produksi</label><input required type="date" className="w-full p-2 border border-gray-300 rounded-lg focus:ring-blue-500" value={newOrder.deadline} onChange={e => setNewOrder({...newOrder, deadline: e.target.value})} /></div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Nama Instansi / Sekolah</label>
                                    <input required list="client-list" type="text" placeholder="Misal: SMP 1 Harapan" className="w-full p-2 border border-gray-300 rounded-lg focus:ring-blue-500" value={newOrder.client} onChange={e => setNewOrder({...newOrder, client: e.target.value})} />
                                    <datalist id="client-list">
                                        {uniqueClients.map((clientName, idx) => (
                                            <option key={idx} value={clientName} />
                                        ))}
                                    </datalist>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Jenis Produksi</label>
                                    <input required list="jenis-produksi-list" className="w-full p-2 border border-gray-300 rounded-lg focus:ring-blue-500" placeholder="Pilih atau ketik jenis produksi..." value={newOrder.type} onChange={e => setNewOrder({...newOrder, type: e.target.value})} />
                                    <datalist id="jenis-produksi-list">
                                        {uniqueTypes.map((type, idx) => (
                                            <option key={idx} value={type} />
                                        ))}
                                    </datalist>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Nama Marketing (Opsional)</label>
                                    <input list="marketing-list" type="text" className="w-full p-2 border border-gray-300 rounded-lg focus:ring-blue-500" placeholder="Nama sales/marketing..." value={newOrder.marketing || ''} onChange={e => setNewOrder({...newOrder, marketing: e.target.value})} />
                                    <datalist id="marketing-list">
                                        {uniqueMarketing.map((m, idx) => (
                                            <option key={idx} value={m} />
                                        ))}
                                    </datalist>
                                </div>
                            </div>

                            <div className="p-4 bg-gray-50 rounded-lg border border-gray-200">
                                <div className="flex justify-between items-center mb-3">
                                    <label className="block text-sm font-semibold text-gray-800">Input Ukuran dan Jumlah (Pcs)</label>
                                    <button type="button" onClick={handleAddSize} className="text-xs bg-blue-100 hover:bg-blue-200 text-blue-700 px-3 py-1 rounded-md font-medium transition-colors">+ Tambah Kolom Ukuran</button>
                                </div>
                                <div className="grid grid-cols-4 md:grid-cols-8 gap-4">
                                    {sizeInputs.map((size, index) => (
                                        <div key={size.id}>
                                            <input type="text" className="w-full text-xs text-center font-bold text-gray-700 mb-1 bg-transparent border-b border-gray-300 focus:border-blue-500 focus:outline-none" value={size.label} onChange={e => handleSizeLabelChange(index, e.target.value)} placeholder="Ukuran" />
                                            <input type="number" min="0" placeholder="0" className="w-full p-2 text-center border border-gray-300 rounded-lg focus:ring-blue-500" value={size.qty === 0 ? '' : size.qty} onChange={e => handleSizeQtyChange(index, e.target.value)} />
                                        </div>
                                    ))}
                                </div>
                                <div className="mt-4 flex justify-between items-center bg-white p-3 rounded border border-gray-200">
                                    <span className="font-medium text-gray-700">Total Keseluruhan:</span><span className="text-xl font-bold text-blue-600">{totalQty} Pcs</span>
                                </div>
                            </div>

                            <div className="p-4 bg-blue-50 rounded-lg border border-blue-100">
                                <label className="block text-sm font-semibold text-blue-900 mb-3">Alur Proses Order</label>
                                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2">
                                    {orderProcessOptions.map(process => {
                                        const checked = getOrderProcessFlow(newOrder)[process.id] !== false;
                                        return (
                                            <label key={process.id} className={`flex items-center gap-2 text-sm border rounded-lg p-3 cursor-pointer ${checked ? 'bg-white border-blue-300 text-blue-900' : 'bg-gray-50 border-gray-200 text-gray-500'}`}>
                                                <input type="checkbox" checked={checked} onChange={() => toggleOrderProcess(process.id)} />
                                                <span className="font-bold">{process.label}</span>
                                            </label>
                                        );
                                    })}
                                </div>
                            </div>

                            <div className="p-4 bg-green-50 rounded-lg border border-green-100">
                                <label className="block text-sm font-semibold text-green-900 mb-3">Harga Produksi per Pcs</label>
                                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                                    {productionStageOptions.filter(stage => getOrderProcessFlow(newOrder)[stage.id] !== false).map(stage => (
                                        <div key={stage.id}>
                                            <label className="block text-xs font-bold text-green-800 mb-1">{stage.label}</label>
                                            <input type="number" min="0" className="w-full p-2 border border-green-200 rounded-lg focus:ring-green-500 bg-white" placeholder="Rp / pcs" value={(newOrder.productionPrices || {})[stage.id] || ''} onChange={e => updateProductionPrice(stage.id, e.target.value)} />
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Gambar Desain Depan (Opsional)</label>
                                    <div className="border border-dashed border-gray-300 p-2 rounded-lg text-center relative hover:bg-gray-50 transition-colors">
                                        {newOrder.designImage1 ? (
                                            <div className="relative inline-block">
                                                <img src={newOrder.designImage1} className="max-h-32 rounded object-contain mx-auto" />
                                                <button type="button" onClick={() => setNewOrder({...newOrder, designImage1: ''})} className="absolute top-1 right-1 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs font-bold shadow-md">&times;</button>
                                            </div>
                                        ) : (
                                            <div className="py-4">
                                                <IconImage className="mx-auto text-gray-400 mb-1" />
                                                <span className="text-sm text-blue-600 font-medium">Unggah Desain 1</span>
                                            </div>
                                        )}
                                        <input type="file" accept="image/*" onChange={(e) => handleImageUpload(e, 'designImage1')} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" title="Klik untuk unggah gambar" />
                                    </div>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Gambar Desain Belakang (Opsional)</label>
                                    <div className="border border-dashed border-gray-300 p-2 rounded-lg text-center relative hover:bg-gray-50 transition-colors">
                                        {newOrder.designImage2 ? (
                                            <div className="relative inline-block">
                                                <img src={newOrder.designImage2} className="max-h-32 rounded object-contain mx-auto" />
                                                <button type="button" onClick={() => setNewOrder({...newOrder, designImage2: ''})} className="absolute top-1 right-1 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs font-bold shadow-md">&times;</button>
                                            </div>
                                        ) : (
                                            <div className="py-4">
                                                <IconImage className="mx-auto text-gray-400 mb-1" />
                                                <span className="text-sm text-blue-600 font-medium">Unggah Desain 2</span>
                                            </div>
                                        )}
                                        <input type="file" accept="image/*" onChange={(e) => handleImageUpload(e, 'designImage2')} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" title="Klik untuk unggah gambar" />
                                    </div>
                                </div>
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Catatan Tambahan Produksi</label>
                                <textarea rows="3" className="w-full p-2 border border-gray-300 rounded-lg focus:ring-blue-500" placeholder="Detail desain, warna sablon, bordir, dll..." value={newOrder.notes} onChange={e => setNewOrder({...newOrder, notes: e.target.value})}></textarea>
                            </div>

                            <div className="flex justify-end pt-4">
                                <button type="submit" className="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-lg font-bold text-lg shadow-md transition-colors">Simpan Order Masuk</button>
                            </div>
                        </form>
                    </Card>
                </div>
            );
        };

        const ProduksiView = ({ orders, setOrders, employees, authUser, showToast, templates }) => {
            const [selectedOrder, setSelectedOrder] = useState(null);
            const [activeStage, setActiveStage] = useState('cutting');
            const [searchTerm, setSearchTerm] = useState('');
            const [pendingWorkConfirm, setPendingWorkConfirm] = useState(null);
            const [pendingEmployeeConfirm, setPendingEmployeeConfirm] = useState(null);
            const [activeProductionTab, setActiveProductionTab] = useState('proses');
            const safeOrders = (orders || []).filter(isVisibleOrder);
            const visibleEmployees = (employees || []).filter(isVisibleRecord);
            const visibleEmployeeIds = new Set(visibleEmployees.map(e => String(e.id)));
            const filteredProductionOrders = safeOrders.filter(o => !o?.isArchived && matchesSearch(orderSearchFields(o), searchTerm));

            const isKaryawanMode = authUser?.role === 'Karyawan';
            const myEmpData = isKaryawanMode ? visibleEmployees.find(e => (
                String(e.id) === String(authUser.linkedEmpId || '') ||
                (!authUser.linkedEmpId && normalizeText(e.name) === normalizeText(authUser.name))
            )) : null;

            const stages = productionStageOptions.map((stage, index) => ({ ...stage, label: `${index + 1}. ${stage.label}` }));

            const myStageData = myEmpData ? stages.find(s => normalizeText(s.div) === normalizeText(myEmpData.division)) : null;
            const myEmployeeProblem = (() => {
                if (!isKaryawanMode) return '';
                if (!myEmpData) return 'Akun karyawan ini belum terhubung ke data karyawan. Admin perlu membuka Master Akun, edit akun ini, lalu pilih data karyawan yang sesuai.';
                if (normalizeText(myEmpData.status) === 'nonaktif') return 'Data karyawan untuk akun ini berstatus Nonaktif. Aktifkan kembali di menu Data Karyawan agar bisa input pekerjaan.';
                if (!myStageData) return `Divisi karyawan "${myEmpData.division || '-'}" belum cocok dengan tahapan produksi. Sesuaikan divisi di menu Data Karyawan.`;
                return '';
            })();

            useEffect(() => {
                if (isKaryawanMode && myStageData && activeStage !== myStageData.id) {
                    setActiveStage(myStageData.id);
                }
            }, [isKaryawanMode, myStageData, activeStage]);

            const getStageSizeTotals = (stageData, mode = 'taken') => {
                const totals = {};
                if (stageData && stageData.workLogs) {
                    stageData.workLogs.forEach(log => {
                        if (log.isDeleted) return;
                        const shouldCount = mode === 'completed' ? log.checkAfter : (log.checkBefore || log.checkAfter);
                        if (shouldCount) totals[log.size] = (totals[log.size] || 0) + (mode === 'completed' ? getWorkLogSubmittedQty(log) : getWorkLogEffectiveQty(log));
                    });
                }
                return totals;
            };

            const getMaxAllowed = (order, stageId, size) => {
                if (!order) return 0;
                const stagesOrder = getActiveProductionStageIds(order);
                const currentIndex = stagesOrder.indexOf(stageId);
                if (currentIndex <= 0) return order.sizes[size] || 0;
                for (let i = currentIndex - 1; i >= 0; i--) {
                    const prevStageId = stagesOrder[i];
                    const prevStageData = order.progress?.[prevStageId] || {};
                    const prevStageTotals = getStageSizeTotals(prevStageData, 'completed');
                    const hasOutput = Object.values(prevStageTotals).some(v => parseInt(v) > 0);
                    if (prevStageData?.status !== 'Belum' || hasOutput) {
                        return prevStageTotals[size] || 0;
                    }
                }
                return 0;
            };

            const recalculateOrderStatuses = (order) => {
                const newProgress = { ...order.progress };
                const stagesOrder = getActiveProductionStageIds(order);
                
                stagesOrder.forEach(stageId => {
                    const stageData = newProgress[stageId];
                    if (!stageData) return;
                    
                    let isAllSizesCompleted = true;
                    let totalCompletedAllSizes = 0;
                    Object.keys(order.sizes).forEach(size => {
                        const target = order.sizes[size];
                        let completedForSize = 0;
                        if (stageData.workLogs) {
                            stageData.workLogs.forEach(log => { if (!log.isDeleted && log.size === size && log.checkAfter) completedForSize += getWorkLogSubmittedQty(log); });
                        }
                        totalCompletedAllSizes += completedForSize;
                        if (completedForSize < target) isAllSizesCompleted = false;
                    });
                    if (totalCompletedAllSizes === 0) stageData.status = 'Belum';
                    else if (isAllSizesCompleted) stageData.status = 'Selesai';
                    else stageData.status = 'Proses';
                });

                let isFullyShipped = true;
                Object.keys(order.sizes).forEach(sz => { if ((order.shipped?.[sz] || 0) < order.sizes[sz]) isFullyShipped = false; });
                
                let overallStatus = order.materialStatus === 'Selesai' ? 'Pembelian Bahan' : 'Pending'; 
                if (isFullyShipped) overallStatus = 'Terkirim';
                else {
                    const stageLabel = (stageId) => productionStageOptions.find(stage => stage.id === stageId)?.label || stageId;
                    for (let i = stagesOrder.length - 1; i >= 0; i--) {
                        const stageId = stagesOrder[i];
                        const status = newProgress[stageId]?.status;
                        if (status === 'Selesai') {
                            overallStatus = i === stagesOrder.length - 1 ? 'Siap Kirim' : `Proses ${stageLabel(stagesOrder[i + 1])}`;
                            break;
                        }
                        if (status === 'Proses') {
                            overallStatus = `Proses ${stageLabel(stageId)}`;
                            break;
                        }
                    }
                }

                return { ...order, progress: newProgress, status: overallStatus };
            };

            const handleUpdateLog = (orderId, stageId, logId, value) => {
                setOrders(prevOrders => prevOrders.map(o => {
                    if (String(o.id) === String(orderId)) {
                        const stageData = o.progress[stageId];
                        const logs = stageData.workLogs || [];
                        const logToUpdate = logs.find(l => String(l.id) === String(logId));
                        if(!logToUpdate || logToUpdate.isDeleted) return o;

                        const size = logToUpdate.size;
                        let otherLogsTotal = 0;
                        logs.forEach(l => {
                            if (!l.isDeleted && l.size === size && String(l.id) !== String(logId) && (l.checkBefore || l.checkAfter)) otherLogsTotal += getWorkLogEffectiveQty(l);
                        });

                        const maxAllowedGlobal = getMaxAllowed(o, stageId, size);
                        const maxForThisLog = maxAllowedGlobal - otherLogsTotal;
                        let val = parseInt(value) || 0;
                        if (val > maxForThisLog) val = maxForThisLog;
                        
                        const now = new Date().toISOString();
                        const newLogs = logs.map(l => String(l.id) === String(logId) ? { ...l, qty: val, qtyUpdatedAt: now, _syncUpdatedAt: now } : l);
                        return recalculateOrderStatuses({ ...o, progress: { ...o.progress, [stageId]: { ...stageData, workLogs: newLogs } } });
                    }
                    return o;
                }));
            };

            const handleToggleEmployee = (orderId, stageId, empId, isChecked, actionAt = null) => {
                setOrders(prevOrders => prevOrders.map(o => {
                    if (String(o.id) === String(orderId)) {
                        const stageData = o.progress[stageId];
                        let newEmps = [...(stageData.employees || [])];
                        let newLogs = [...(stageData.workLogs || [])];
                        let employeeLinks = { ...(stageData.employeeLinks || {}) };
                        let removedEmployees = { ...(stageData.removedEmployees || {}) };
                        const now = actionAt || new Date().toISOString();
                        if (isChecked) {
                            if (!newEmps.some(id => String(id) === String(empId))) newEmps.push(empId);
                            employeeLinks[String(empId)] = now;
                            delete removedEmployees[String(empId)];
                        }
                        else {
                            newEmps = newEmps.filter(id => String(id) !== String(empId));
                            removedEmployees[String(empId)] = now;
                            newLogs = newLogs.map(l => {
                                if (String(l.empId) !== String(empId)) return l;
                                if (l.isReported) return l;
                                return { ...l, isDeleted: true, deletedAt: now, _syncUpdatedAt: now };
                            });
                        }
                        return recalculateOrderStatuses({ ...o, progress: { ...o.progress, [stageId]: { ...stageData, employees: newEmps, employeeLinks, removedEmployees, workLogs: newLogs } } });
                    }
                    return o;
                }));
                const empName = visibleEmployees.find(emp => String(emp.id) === String(empId))?.name || empId;
            };

            const handleAddLog = (orderId, stageId, empId, size) => {
                setOrders(prevOrders => prevOrders.map(o => {
                    if (String(o.id) === String(orderId)) {
                        const now = new Date().toISOString();
                        const newLog = { id: `wl-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`, empId, size, qty: 0, isReported: false, checkBefore: false, checkAfter: false, createdAt: now, _syncUpdatedAt: now };
                        const stageData = o.progress[stageId];
                        return recalculateOrderStatuses({ ...o, progress: { ...o.progress, [stageId]: { ...stageData, workLogs: [...(stageData.workLogs || []), newLog] } } });
                    }
                    return o;
                }));
                const empName = visibleEmployees.find(emp => String(emp.id) === String(empId))?.name || empId;
            };
            
            const formatWorkDate = (value, style = 'short') => value ? new Date(value).toLocaleString('id-ID', { dateStyle: style, timeStyle: 'short' }) : '-';

            const handleToggleLogCheck = (orderId, stageId, logId, checkType, isChecked, actionAt = null, qtyOverride = null) => {
                setOrders(prevOrders => prevOrders.map(o => {
                    if (String(o.id) === String(orderId)) {
                        const stageData = o.progress[stageId];
                        const logs = stageData.workLogs || [];
                        const logToUpdate = logs.find(l => String(l.id) === String(logId));
                        if (!logToUpdate || logToUpdate.isDeleted) return o;
                        const effectiveQty = qtyOverride !== null && qtyOverride !== undefined
                            ? (parseInt(qtyOverride) || 0)
                            : (checkType === 'checkAfter' ? getWorkLogSubmittedQty(logToUpdate) : getWorkLogTakenQty(logToUpdate));

                        if ((checkType === 'checkBefore' || checkType === 'checkAfter') && isChecked) {
                            if (effectiveQty <= 0) {
                                showToast("Isi jumlah pcs terlebih dahulu di popup konfirmasi.", "error");
                                return o;
                            }
                            if (checkType === 'checkBefore') {
                                const maxAllowed = getMaxAllowed(o, stageId, logToUpdate.size);
                                const otherTakenTotal = logs
                                    .filter(l => !l.isDeleted && String(l.id) !== String(logId) && l.size === logToUpdate.size && (l.checkBefore || l.checkAfter))
                                    .reduce((sum, l) => sum + getWorkLogEffectiveQty(l), 0);
                                if (otherTakenTotal + effectiveQty > maxAllowed) {
                                    showToast("Jumlah Ambil melebihi sisa stok ukuran ini.", "error");
                                    return o;
                                }
                            }
                            if (checkType === 'checkAfter' && effectiveQty > getWorkLogTakenQty(logToUpdate)) {
                                showToast("Jumlah Setor tidak boleh melebihi jumlah Ambil.", "error");
                                return o;
                            }
                        }

                        const newLogs = logs.map(l => {
                            if (String(l.id) === String(logId)) {
                                const now = actionAt || new Date().toISOString();
                                let updatedLog = { ...l, [checkType]: isChecked };
                                updatedLog._syncUpdatedAt = now;
                                if (isChecked && qtyOverride !== null && qtyOverride !== undefined && checkType === 'checkBefore') {
                                    updatedLog.qty = effectiveQty;
                                    updatedLog.qtyUpdatedAt = now;
                                }
                                if (isChecked && qtyOverride !== null && qtyOverride !== undefined && checkType === 'checkAfter') {
                                    updatedLog.submittedQty = effectiveQty;
                                    updatedLog.submittedQtyUpdatedAt = now;
                                }
                                if (checkType === 'checkBefore') updatedLog.checkBeforeChangedAt = now;
                                if (checkType === 'checkAfter') updatedLog.checkAfterChangedAt = now;
                                if (checkType === 'checkBefore' && isChecked) updatedLog.takenAt = now;
                                if (checkType === 'checkBefore' && !isChecked) {
                                    updatedLog.checkAfter = false;
                                    updatedLog.takenAt = null;
                                    updatedLog.submittedAt = null;
                                    updatedLog.submittedQty = null;
                                    updatedLog.checkAfterChangedAt = now;
                                }
                                if (checkType === 'checkAfter' && isChecked) updatedLog.submittedAt = now;
                                if (checkType === 'checkAfter' && !isChecked) {
                                    updatedLog.submittedAt = null;
                                    updatedLog.submittedQty = null;
                                }
                                return updatedLog;
                            }
                            return l;
                        });
                        return recalculateOrderStatuses({ ...o, progress: { ...o.progress, [stageId]: { ...stageData, workLogs: newLogs } } });
                    }
                    return o;

                const actionText = isChecked ? label : `Batal ${label}`;
            };

            const handleDeleteLog = (orderId, stageId, logId) => {
                setOrders(prevOrders => prevOrders.map(o => {
                    if (String(o.id) === String(orderId)) {
                        const stageData = o.progress[stageId];
                        const now = new Date().toISOString();

                        .sig-name { font-size: 12px; font-weight: bold; margin-top: 4px; min-height: 16px; }
                    </style>
                </head>
                <body>
                    <div class="container">
                        <div class="header">
                            <div class="header-left">
                                ${templates?.companyLogo ? `<img src="${templates.companyLogo}" style="max-height: 50px; object-fit: contain;" />` : ''}
                                <div>

                                    <p>${templates?.companyContact || ''}</p>

                        <div class="info-grid">

                    setTimeout(() => setActiveStage(activeStages[0].id), 0);
                }
                const effectiveActiveStage = activeStages.some(stage => stage.id === activeStage) ? activeStage : (activeStages[0]?.id || activeStage);
                const currentStageData = order.progress?.[effectiveActiveStage] || { status: 'Belum', employees: [], workLogs: [] };
                const activeStageInfo = activeStages.find(s => s.id === effectiveActiveStage) || stages.find(s => s.id === effectiveActiveStage);
                const stageEmployees = visibleEmployees.filter(e => normalizeText(e.division) === normalizeText(activeStageInfo?.div) && normalizeText(e.status) !== 'nonaktif');
                const currentTotals = getStageSizeTotals(currentStageData);

                const roleLabels = {
                    'cutting': 'Cutter',
                    'sablon': 'Penyablon/Pembordir',
                    'jahit': 'Penjahit',
                    'kancing': 'Pengancing',
                    'finishing': 'Finisher'
                };

                const logEmployeeIds = [...new Set((currentStageData.workLogs || []).filter(l => !l.isDeleted).map(l => l.empId).filter(Boolean))];
                const employeesToRender = isKaryawanMode 
                    ? ((currentStageData.employees || []).some(id => String(id) === String(myEmpData?.id)) ? [myEmpData.id] : [])
                    : [...new Set([...(currentStageData.employees || []), ...logEmployeeIds])].filter(empId => visibleEmployeeIds.has(String(empId)));

                return (
                    <div className="space-y-4">
                        <button onClick={() => setSelectedOrder(null)} className="text-blue-600 font-bold mb-4 flex items-center gap-1">&larr; Kembali ke Daftar Produksi</button>
                        
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 w-full">
                            <h2 className="text-2xl font-bold">Produksi: {order.id}</h2>
                            <div className="flex gap-2">
                                <button onClick={() => printLembarKerja(order)} className="bg-blue-100 hover:bg-blue-200 text-blue-800 px-4 py-2 rounded-lg font-bold flex items-center gap-2 transition-colors border border-blue-300 shadow-sm">
                                    <IconDocument /> Cetak SPK
                                </button>
                            </div>
                        </div>
                        
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                            <div className="col-span-1 space-y-4">
                                <Card className="bg-blue-50 border-blue-100">
                                    <h3 className="font-semibold text-blue-800 mb-2 border-b border-blue-200 pb-2">Info Order</h3>
                                    <p className="text-sm"><b>Klien:</b> {order.client}</p>
                                    <p className="text-sm"><b>Barang:</b> {order.type} ({order.total} pcs)</p>
                                    <p className="text-sm text-red-600"><b>Deadline:</b> {order.deadline}</p>
                                    {order.notes && <p className="text-xs bg-white p-2 rounded mt-2 border border-blue-100 italic">"{order.notes}"</p>}
                                    <div className="mt-4 space-y-2">
                                        {isKaryawanMode ? (
                                            <div className="bg-blue-600 text-white px-4 py-3 rounded-lg text-sm font-bold shadow-inner">
                                                Tugas Anda: {myStageData?.label || 'Divisi Tidak Ditemukan'}
                                            </div>
                                        ) : (
                                            activeStages.map(s => (
                                                <button key={s.id} onClick={() => setActiveStage(s.id)} className={`w-full text-left px-4 py-2 rounded text-sm font-medium ${activeStage === s.id ? 'bg-blue-600 text-white shadow-sm' : 'bg-white hover:bg-gray-100 border border-gray-200'}`}>
                                                    {s.label} <span className="float-right text-xs mt-0.5"><Badge status={order.progress?.[s.id]?.status || 'Belum'} /></span>
                                                </button>
                                            ))
                                        )}
                                    </div>
                                </Card>
                            </div>
                            
                            <div className="col-span-1 lg:col-span-2">
                                <Card>
                                    <h3 className="text-xl font-bold border-b pb-2 mb-4">Proses {activeStageInfo?.label || effectiveActiveStage}</h3>
                                    <div className="space-y-4">
                                        <div>
                                            <label className="block text-sm font-medium mb-2">Status Saat Ini</label>
                                            <Badge status={currentStageData.status} />
                                        </div>
                                        
                                        {!isKaryawanMode && (
                                            <div>
                                                <label className="block text-sm font-medium mb-2">Pilih Karyawan Aktif</label>
                                                <div className="grid grid-cols-2 md:grid-cols-3 gap-2">
                                                    {stageEmployees.map(emp => (
                                                        <label key={emp.id} className="flex items-center space-x-2 text-sm border p-2 rounded cursor-pointer hover:bg-gray-50">
                                                            <input type="checkbox" checked={(currentStageData.employees || []).some(id => String(id) === String(emp.id))} onChange={(e) => {
                                                                const checked = e.target.checked;
                                                                setPendingEmployeeConfirm({
                                                                    orderId: order.id,
                                                                    client: order.client,
                                                                    type: order.type,
                                                                    stageId: effectiveActiveStage,
                                                                    stageName: activeStageInfo?.label || effectiveActiveStage,
                                                                    empId: emp.id,
                                                                    empName: emp.name,
                                                                    isChecked: checked,
                                                                    actionAt: new Date().toISOString()
                                                                });
                                                            }} />
                                                            <span>{emp.name}</span>
                                                        </label>
                                                    ))}
                                                    {stageEmployees.length === 0 && <span className="text-xs text-red-500 col-span-full">Tidak ada karyawan di divisi ini. Tambahkan di menu Data Karyawan.</span>}
                                                </div>
                                            </div>
                                        )}

                                        {isKaryawanMode && employeesToRender.length === 0 && (
                                            <div className="text-center p-8 border-2 border-dashed border-gray-300 rounded-xl bg-gray-50 mt-6">
                                                <div className="w-16 h-16 bg-blue-100 text-blue-500 rounded-full flex items-center justify-center mx-auto mb-4">
                                                    <IconScissors />
                                                </div>
                                                <h4 className="text-lg font-bold text-gray-800 mb-2">Anda Belum Mengambil Tugas Ini</h4>
                                                <p className="text-sm text-gray-500 mb-6">Klik tombol di bawah untuk mulai mencatat pekerjaan Anda pada order ini.</p>
                                                <button 
                                                    onClick={() => handleToggleEmployee(order.id, effectiveActiveStage, myEmpData.id, true)} 
                                                    className="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-lg font-bold text-lg shadow-lg transition-transform active:scale-95"
                                                >
                                                    Ambil Pekerjaan Ini
                                                </button>
                                            </div>
                                        )}

                                        {employeesToRender.map(empId => {
                                            const emp = visibleEmployees.find(e => String(e.id) === String(empId)) || { id: empId, name: `Karyawan ID ${empId}` };
                                            const empLogs = (currentStageData.workLogs || []).filter(l => !l.isDeleted && String(l.empId) === String(empId));
                                            
                                            return (
                                                <div key={empId} className="bg-white border border-blue-200 rounded-lg overflow-hidden mt-4 shadow-sm">
                                                    <div className="bg-blue-50 p-3 font-bold text-blue-900 border-b border-blue-200 flex justify-between items-center">
                                                        <span>{isKaryawanMode ? "Tabel Input Pekerjaan Anda" : emp.name}</span>
                                                        <span className="text-xs bg-white px-3 py-1 rounded shadow-sm">Total Selesai: {empLogs.reduce((a, b) => a + (b.checkAfter ? getWorkLogSubmittedQty(b) : 0), 0)} pcs</span>
                                                    </div>
                                                    <div className="overflow-x-auto">
                                                        <table className="w-full text-sm text-left">
                                                            <thead className="bg-gray-50 border-b">
                                                                <tr>
                                                                    <th className="p-3 w-16">Size</th>
                                                                    <th className="p-3 w-32">Status (pcs)</th>
                                                                    <th className="p-3">Input Pekerjaan</th>
                                                                </tr>
                                                            </thead>
                                                            <tbody>
                                                                {sortSizeKeys(Object.keys(order.sizes || {})).map(size => {
                                                                    const maxAllowed = getMaxAllowed(order, effectiveActiveStage, size);
                                                                    const currentStageTotal = currentTotals[size] || 0;
                                                                    const empLogsForSize = empLogs.filter(l => l.size === size);
                                                                    const availableToAdd = maxAllowed - currentStageTotal;
                                                                    
                                                                    return (
                                                                        <tr key={size} className="border-b hover:bg-gray-50/50">
                                                                            <td className="p-3 text-center font-black text-gray-800 align-middle text-xl bg-gray-50/50 border-r border-gray-100">{size}</td>
                                                                            <td className="p-3 align-middle border-r border-gray-100 bg-gray-50/30">
                                                                                <div className="flex flex-col gap-1 text-[11px] font-medium w-full">
                                                                                    <div className="flex justify-between text-gray-600 border-b border-gray-200 pb-0.5"><span title="Target Masuk">Target:</span> <span className="font-bold text-sm">{maxAllowed}</span></div>
                                                                                    <div className="flex justify-between text-green-700 border-b border-green-100 pb-0.5"><span title="Sudah Dikerjakan/Masuk">Isi:</span> <span className="font-bold text-sm">{currentStageTotal}</span></div>
                                                                                    <div className="flex justify-between text-red-600"><span title="Sisa Belum Diambil">Sisa:</span> <span className="font-bold text-sm">{availableToAdd}</span></div>
                                                                                </div>
                                                                            </td>
                                                                            <td className="p-3">
                                                                                {empLogsForSize.map((log, i) => {
                                                                                    const otherLogsTotal = (currentStageData.workLogs || []).filter(l => !l.isDeleted && l.id !== log.id && l.size === size && (l.checkBefore || l.checkAfter)).reduce((sum, l) => sum + getWorkLogEffectiveQty(l), 0);
                                                                                    const maxForThisLog = maxAllowed - otherLogsTotal;
                                                                                    const takenQty = getWorkLogTakenQty(log);
                                                                                    const submittedQty = log.checkAfter ? getWorkLogSubmittedQty(log) : 0;
                                                                                    const effectiveQty = getWorkLogEffectiveQty(log);
                                                                                    return (
                                                                                        <div key={log.id} className="flex flex-wrap gap-2 items-center mb-2 bg-white border border-gray-300 p-2 rounded-lg shadow-sm">
                                                                                            <div className={`w-24 border rounded-md p-1.5 text-center font-black text-lg ${log.checkAfter ? 'border-green-300 bg-green-50 text-green-800' : 'border-gray-300 bg-gray-100 text-gray-700'}`} title="Jumlah dikunci. Isi atau ubah jumlah melalui popup Ambil/Setor.">{effectiveQty > 0 ? effectiveQty : '-'}</div> <span className="text-xs font-bold text-gray-500 mt-1">{log.checkAfter ? 'pcs setor' : 'pcs ambil'}</span>
                                                                                            <div className="flex gap-2 border-l-2 border-gray-200 pl-2 ml-1 flex-1 items-center flex-wrap">
                                                                                                <label className="flex items-center gap-1 text-sm font-bold cursor-pointer"><input type="checkbox" className="w-4 h-4 text-blue-600" checked={log.checkBefore} disabled={log.isReported} onChange={e => {
                                                                                                    const checked = e.target.checked;
                                                                                                    const actionAt = new Date().toISOString();
                                                                                                    setPendingWorkConfirm({
                                                                                                        title: checked ? 'Konfirmasi Ambil Pekerjaan' : 'Konfirmasi Tidak Jadi Ambil',
                                                                                                        description: checked ? 'Isi jumlah pcs di popup ini, lalu pastikan ukuran sudah benar sebelum pekerjaan dicatat.' : 'Status Ambil akan dibatalkan. Jika sudah Setor, status Setor juga ikut batal.',
                                                                                                        confirmLabel: checked ? 'Ya, Ambil' : 'Ya, Batalkan Ambil',
                                                                                                        confirmClass: checked ? 'bg-blue-600 hover:bg-blue-700' : 'bg-red-600 hover:bg-red-700',
                                                                                                        dateLabel: checked ? 'Tanggal Ambil' : 'Tanggal Batal Ambil',
                                                                                                        checkType: 'checkBefore',
                                                                                                        isChecked: checked,
                                                                                                        needsQty: checked,
                                                                                                        maxQty: maxForThisLog,
                                                                                                        qtyLabel: 'Jumlah Ambil',
                                                                                                        actionAt,
                                                                                                        orderId: order.id,
                                                                                                        client: order.client,
                                                                                                        type: order.type,
                                                                                                        stageId: effectiveActiveStage,
