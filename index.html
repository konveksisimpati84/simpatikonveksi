                const indexA = standardSizes.indexOf(String(a).toUpperCase().trim());
                const indexB = standardSizes.indexOf(String(b).toUpperCase().trim());
                if (indexA !== -1 && indexB !== -1) return indexA - indexB; 
                if (indexA !== -1) return -1; 
                if (indexB !== -1) return 1;

                const numB = parseInt(b);

        const getGeminiApiKey = () => {
            const configuredKey = "";
            if (configuredKey) return configuredKey;

            if (savedKey) return savedKey;
            const inputKey = window.prompt("Masukkan Gemini API Key untuk mengaktifkan fitur AI:");
            if (inputKey && inputKey.trim()) {
                localStorage.setItem('simpati_gemini_api_key', inputKey.trim());

            const match = String(dataUrl || '').match(/^data:(image\/[a-zA-Z0-9.+-]+);base64,(.+)$/);
            if (!match) return null;
            return { inlineData: { mimeType: match[1], data: match[2] } };
        };

        const generateGeminiContent = async (prompt, systemInstruction = "Anda adalah asisten AI cerdas untuk pabrik konveksi.", expectJson = false, imageDataUrls = []) => {
            const apiKey = getGeminiApiKey(); 
            if (!apiKey) throw new Error("API key Gemini belum diisi.");
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const imageParts = (imageDataUrls || []).map(dataUrlToInlinePart).filter(Boolean);
            const payload = {
                contents: [{ parts: [{ text: prompt }, ...imageParts] }],
                systemInstruction: { parts: [{ text: systemInstruction }] }
            };
            if (expectJson) {
                payload.generationConfig = { responseMimeType: "application/json" };
            }

            const delays = [1000, 2000, 4000];
            for (let attempt = 0; attempt <= 3; attempt++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    const result = await response.json();
                    const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (!text) throw new Error('No text in response');
                    return expectJson ? JSON.parse(text) : text;
                } catch (error) {
                    if (attempt === 3) {
                        console.error("Gemini API failed", error);
                        throw new Error("Gagal menghubungi AI.");
                    }
                    await new Promise(resolve => setTimeout(resolve, delays[attempt]));
                }
            }
        };

        const Card = ({ children, className = "" }) => (
            <div className={`bg-white p-6 rounded-xl shadow-sm border border-gray-100 ${className}`}>{children}</div>

            if (value === null || value === undefined) return '';
            if (Array.isArray(value)) return value.map(collectSearchText).join(' ');
            if (typeof value === 'object') return Object.values(value).map(collectSearchText).join(' ');
            return String(value);
        };

        const matchesSearch = (value, searchTerm) => {
            const keyword = String(searchTerm || '').trim().toLowerCase();
            if (!keyword) return true;
            return collectSearchText(value).toLowerCase().includes(keyword);
        };

        const normalizeText = (value) => String(value || '').trim().toLowerCase();
        const safeArray = (value) => Array.isArray(value) ? value : [];
        const safeObject = (value) => value && typeof value === 'object' && !Array.isArray(value) ? value : {};
        const safeNumber = (value) => {
            const number = Number(value);
            return Number.isFinite(number) ? number : 0;
        };
        const safeText = (value, fallback = '-') => value === null || value === undefined || value === '' ? fallback : String(value);

        const orderSearchFields = (order) => [
            order?.id,
            order?.client,
            order?.type,
            order?.status,
            order?.deadline,
            order?.date,
            order?.marketing,
            order?.notes,
            order?.total,
            order?.materialStatus,
            order?.sizes,
            (order?.materials || []).map(m => [m.name, m.spec, m.color, m.vendor, m.qty, m.unit, m.price, m.purchaseDate, m.note, m.purchaseStatus]),
            order?.materialPayments
        ];

        const isVisibleOrder = (order) => order && !order.isDeleted;
        const getActiveMaterials = (order) => (order?.materials || []).filter(item => item && !item.isDeleted);

        const getMaterialStatusLabel = (status) => {
            if (status === 'Selesai') return 'Sudah Dibeli';
            if (status === 'Dibeli Sebagian') return 'Dibeli Sebagian';
            if (status === 'Direkap' || status === 'Dicetak') return 'Sudah Direkap';
            if (status === 'Tidak Perlu') return 'Tidak Perlu Bahan';
            return 'Belum Dibeli';
        };

        const normalizeVendorName = (vendor) => String(vendor || 'Tanpa Vendor').trim() || 'Tanpa Vendor';
        const getMaterialQty = (item) => parseFloat(String(item?.qty ?? 0).replace(',', '.')) || 0;
        const getMaterialUnitPrice = (item) => parseFloat(String(item?.price ?? 0).replace(',', '.')) || 0;
        const getMaterialLineTotal = (item) => getMaterialQty(item) * getMaterialUnitPrice(item);
        const getMaterialBatchDateKey = (order, material) => {
            const rawDate = material?.purchaseDate || material?.materialBatchDate || order?.materialBatchDate || order?.materialPrintedAt || order?.materialLastActionAt || order?.date || order?.createdAt || new Date().toISOString();
            const parsed = new Date(rawDate);
            if (!isNaN(parsed.getTime())) return parsed.toISOString().slice(0, 10);
            return String(rawDate).slice(0, 10) || new Date().toISOString().slice(0, 10);
        };
        const getMaterialBatchKey = (vendorName, batchDateKey) => `${normalizeVendorName(vendorName)}|||${batchDateKey || ''}`;
        const getOrderMaterialTotal = (order) => getActiveMaterials(order).reduce((sum, item) => sum + getMaterialLineTotal(item), 0);
        const getVendorMaterialTotal = (order, vendorName, batchDateKey = '') => getActiveMaterials(order)
            .filter(item => normalizeVendorName(item.vendor) === normalizeVendorName(vendorName))
            .filter(item => !batchDateKey || getMaterialBatchDateKey(order, item) === batchDateKey)
            .reduce((sum, item) => sum + getMaterialLineTotal(item), 0);
        const getVendorPayments = (order, vendorName, batchDateKey = '') => {
            const payments = order?.materialPayments || {};
            const key = batchDateKey ? getMaterialBatchKey(vendorName, batchDateKey) : normalizeVendorName(vendorName);
            if (batchDateKey && Array.isArray(payments[key])) return payments[key];
            if (batchDateKey && Array.isArray(payments[normalizeVendorName(vendorName)])) return payments[normalizeVendorName(vendorName)];
            return Array.isArray(payments[key]) ? payments[key] : [];
        };
        const getVendorPaidTotal = (order, vendorName, batchDateKey = '') => getVendorPayments(order, vendorName, batchDateKey).reduce((sum, pay) => sum + (parseFloat(pay?.amount) || 0), 0);
        const getVendorRemainingPayment = (order, vendorName, batchDateKey = '') => Math.max(0, getVendorMaterialTotal(order, vendorName, batchDateKey) - getVendorPaidTotal(order, vendorName, batchDateKey));
        const isVendorMaterialPurchased = (order, vendorName, batchDateKey = '') => {
            if (batchDateKey) return !!order?.materialPurchasedBatches?.[getMaterialBatchKey(vendorName, batchDateKey)] || !!order?.materialPurchasedVendors?.[normalizeVendorName(vendorName)];
            return !!order?.materialPurchasedVendors?.[normalizeVendorName(vendorName)];
        };
        const isVendorMaterialSettled = (order, vendorName, batchDateKey = '') => isVendorMaterialPurchased(order, vendorName, batchDateKey) && getVendorRemainingPayment(order, vendorName, batchDateKey) <= 0;
        const getOrderMaterialVendors = (order) => [...new Set(getActiveMaterials(order).map(item => normalizeVendorName(item.vendor)))].filter(Boolean);
        const getOrderMaterialBatchKeys = (order) => [...new Set(getActiveMaterials(order).map(item => getMaterialBatchKey(item.vendor, getMaterialBatchDateKey(order, item))))].filter(Boolean);
        const areAllOrderMaterialsPurchased = (order) => {
            const batchKeys = getOrderMaterialBatchKeys(order);
            return batchKeys.length > 0 && batchKeys.every(key => !!order?.materialPurchasedBatches?.[key] || !!order?.materialPurchasedVendors?.[key.split('|||')[0]]);
        };
        const areAllOrderMaterialsSettled = (order) => {
            const batchKeys = getOrderMaterialBatchKeys(order);
            return batchKeys.length > 0 && batchKeys.every(key => {
                const [vendor, batchDateKey] = key.split('|||');
                return isVendorMaterialSettled(order, vendor, batchDateKey);
            });
        };

        const getWorkLogTakenQty = (log) => parseInt(log?.qty) || 0;
        const getWorkLogSubmittedQty = (log) => parseInt(log?.submittedQty ?? log?.qty) || 0;
        const getWorkLogEffectiveQty = (log) => log?.checkAfter ? getWorkLogSubmittedQty(log) : getWorkLogTakenQty(log);
        const isVisibleRecord = (record) => record && !record.isDeleted;

        const getCompletedPerStage = (orderData, stageId, size) => {
            let total = 0;
            if (orderData?.progress?.[stageId]?.workLogs) {
                orderData.progress[stageId].workLogs.forEach(log => {
                    if (!log.isDeleted && log.size === size && log.checkAfter) {
                        total += getWorkLogSubmittedQty(log);
                    }
                });
            }
            return total;
        };

        const getCustomerTrackingClientFromHash = () => {
            const hash = window.location.hash || '';
            const prefix = '#customer-tracking=';
            if (!hash.startsWith(prefix)) return '';
            try {
                return decodeURIComponent(hash.slice(prefix.length));
            } catch (error) {
                return '';
            }
        };

        const getRekapGajiIdFromHash = () => {
            const hash = window.location.hash || '';
            const prefix = '#rekap-gaji=';
            if (!hash.startsWith(prefix)) return '';
            try {
                return decodeURIComponent(hash.slice(prefix.length));
            } catch (error) {
                return '';
            }
        };

        const SearchField = ({ value, onChange, placeholder = "Cari data..." }) => (
            <div className="print:hidden">
                <label className="block text-xs font-bold text-gray-600 mb-1">Cari</label>
                <input
                    type="text"
                    className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-sm"
                    placeholder={placeholder}
                    value={value}
                    onChange={e => onChange(e.target.value)}
                />
            </div>
        );

        const Badge = ({ status }) => {
            if (!status) return null;
            let colors = "bg-gray-100 text-gray-800";
            if (status.includes('Selesai') || status === 'Aktif' || status === 'Lunas') colors = "bg-green-100 text-green-800";
            if (status.includes('Proses') || status === 'Pembelian Bahan' || status === 'Bahan Sudah Dibelanjakan') colors = "bg-blue-100 text-blue-800";
            if (status === 'Pending' || status === 'Pending / Belum Dikerjakan' || status === 'Belum Dibeli' || status === 'Belum Lunas' || status === 'Dibeli Sebagian' || status === 'Termin' || status === 'Bayar Sebagian / Termin' || status === 'Termin / Bayar Sebagian') colors = "bg-yellow-100 text-yellow-800";
            if (status === 'Belum Bayar') colors = "bg-red-100 text-red-800";
            if (status === 'Terkirim' || status === 'Sudah Dicetak' || status === 'Sudah Direkap') colors = "bg-purple-100 text-purple-800";
            if (status === 'Sudah Dibeli' || status === 'Dibeli & Dicetak') colors = "bg-green-100 text-green-800";
            const label = status === 'Pending' ? 'Pending / Belum Dikerjakan' : status;
            return <span className={`px-2 py-1 text-xs font-semibold rounded-full ${colors}`}>{label}</span>;
        };

        const safeMoney = (value) => {
            const num = parseFloat(value);
            return Number.isFinite(num) ? num : 0;
        };

        const getEmployeeCashAdvances = (employee) => {
            return Array.isArray(employee?.cashAdvances) ? employee.cashAdvances.filter(item => !item?.isDeleted) : [];
        };

        const getCashAdvanceAmount = (cashAdvance) => safeMoney(cashAdvance?.amount || cashAdvance?.nominal);
        const getCashAdvanceDeducted = (cashAdvance) => safeMoney(cashAdvance?.deductedAmount);
        const getCashAdvanceRemaining = (cashAdvance) => Math.max(0, getCashAdvanceAmount(cashAdvance) - getCashAdvanceDeducted(cashAdvance));

        const getEmployeeCashAdvanceSummary = (employee) => {
            const advances = getEmployeeCashAdvances(employee);
            const total = advances.reduce((sum, item) => sum + getCashAdvanceAmount(item), 0);
            const deducted = advances.reduce((sum, item) => sum + getCashAdvanceDeducted(item), 0);
            const remaining = advances.reduce((sum, item) => sum + getCashAdvanceRemaining(item), 0);
            return { advances, total, deducted, remaining };
        };

        const normalizeCashAdvanceStatus = (cashAdvance) => {
            const amount = getCashAdvanceAmount(cashAdvance);
            const deducted = getCashAdvanceDeducted(cashAdvance);
            if (amount > 0 && deducted >= amount) return 'Lunas';
            if (deducted > 0) return 'Dipotong Sebagian';
            return cashAdvance?.status || 'Belum Dipotong';
        };

        const getEmployeeSalaryTypes = (employee) => {
            if (Array.isArray(employee?.salaryTypes) && employee.salaryTypes.length > 0) return employee.salaryTypes;
            const legacyType = employee?.salaryType || 'Produksi';
            if (legacyType === 'Campuran') return ['Produksi', 'Harian'];
            return [legacyType];
        };

        const getEmployeeDailySalaryLogs = (employee) => {
            return Array.isArray(employee?.dailySalaryLogs) ? employee.dailySalaryLogs.filter(item => !item?.isDeleted) : [];
        };

        const getDailySalaryLogTotal = (log) => {
            const daily = safeMoney(log?.workDays) * safeMoney(log?.dailySalary);
            const overtime = safeMoney(log?.overtimeCount) * safeMoney(log?.overtimeRate);
            return { daily, overtime, total: daily + overtime };
        };

        const getInvoiceItems = (invoice) => {
            if (Array.isArray(invoice?.invoiceItems) && invoice.invoiceItems.length > 0) {
                return invoice.invoiceItems.map((item, itemIndex) => ({
                    ...item,
                    id: item.id || `ITEM-${itemIndex}`,
                    sizes: (Array.isArray(item.sizes) ? item.sizes : []).map((size, sizeIndex) => ({ ...size, id: size.id || `SIZE-${itemIndex}-${sizeIndex}` }))
                }));
            }
            if (!invoice) return [];
            return [{
                id: 'ITEM-0',
                productionType: invoice.type || '',
                sizes: [{
                    id: 'SIZE-0-0',
                    size: invoice.size || '',
                    qty: safeMoney(invoice.qty),
                    pricePerPcs: safeMoney(invoice.price),
                    discountPerPcs: safeMoney(invoice.discountPerPcs),
                    discountPercent: safeMoney(invoice.discountPercent)
                }]
            }];
        };

        const getInvoiceSizeTotal = (sizeRow) => {
            const subtotal = safeMoney(sizeRow?.qty) * safeMoney(sizeRow?.pricePerPcs);
            const discountPerPcs = safeMoney(sizeRow?.qty) * safeMoney(sizeRow?.discountPerPcs);
            const discountPercent = subtotal * safeMoney(sizeRow?.discountPercent) / 100;
            return { subtotal, discount: discountPerPcs + discountPercent, total: Math.max(0, subtotal - discountPerPcs - discountPercent) };
        };

        const getInvoiceTotals = (invoice) => {
            const rows = getInvoiceItems(invoice).flatMap(item => (Array.isArray(item.sizes) ? item.sizes : []).map(size => getInvoiceSizeTotal(size)));
            const subtotal = rows.reduce((sum, row) => sum + row.subtotal, 0);
            const discount = rows.reduce((sum, row) => sum + row.discount, 0);
            const total = rows.reduce((sum, row) => sum + row.total, 0);
            return { subtotal, discount, total };
        };

        const getInvoiceDp = (invoice) => invoice?.invoiceDp && typeof invoice.invoiceDp === 'object' ? invoice.invoiceDp : {};
        const getInvoiceDpAmount = (invoice) => safeMoney(getInvoiceDp(invoice).amount);
        const getInvoicePayments = (invoice) => Array.isArray(invoice?.payments) ? invoice.payments : (Array.isArray(invoice?.invoicePayments) ? invoice.invoicePayments : []);
        const getInvoiceLinkedDpAmount = (invoice) => safeMoney(invoice?.linkedDpAmount);
        // getInvoicePaidTotal includes linkedDpAmount (pool DP) for sisa tagihan & status
        const getInvoicePaidTotal = (invoice) => getInvoiceDpAmount(invoice) + getInvoicePayments(invoice).reduce((sum, pay) => sum + safeMoney(pay?.amount), 0) + getInvoiceLinkedDpAmount(invoice);
        // getInvoiceCashInflow excludes linkedDpAmount (for laporan keuangan, avoids double-count)
        const getInvoiceCashInflow = (invoice) => getInvoiceDpAmount(invoice) + getInvoicePayments(invoice).reduce((sum, pay) => sum + safeMoney(pay?.amount), 0);
        const getInvoicePcsTotal = (invoice) => getInvoiceItems(invoice).reduce((sum, item) => sum + (item.sizes || []).reduce((s, size) => s + safeMoney(size.qty), 0), 0);
        const getInvoicePaymentStatus = (invoice) => {
            const total = getInvoiceTotals(invoice).total;
            const paid = getInvoicePaidTotal(invoice);
            if (paid <= 0) return 'Belum Dibayar';
            return paid >= total ? 'Lunas' : 'Termin';
        };

        const getInvoiceCommissionTotal = (invoice) => {
            const type = String(invoice?.commissionType || 'Persen').toLowerCase();
            if (type.includes('pcs')) return getInvoicePcsTotal(invoice) * safeMoney(invoice?.commissionValue);
            if (type === 'rupiah') return safeMoney(invoice?.commissionValue);
            return getInvoicePaidTotal(invoice) * safeMoney(invoice?.commissionValue) / 100;
        };

        const Toast = ({ message, type, onClose }) => {
            if (!message) return null;
            const bgClass = type === 'error' ? 'bg-red-600' : 'bg-green-600';
            const icon = type === 'error' ? <IconAlertCircle /> : <IconCheckCircle />;
            return (
                <div className="fixed bottom-4 right-4 z-[110] toast-enter">
                    <div className={`${bgClass} text-white px-4 py-3 rounded-lg shadow-lg flex items-center gap-3`}>
                        {icon}
                        <span className="font-medium text-sm">{message}</span>
                        <button onClick={onClose} className="ml-4 opacity-75 hover:opacity-100 focus:outline-none">
                            &times;
                        </button>
                    </div>
                </div>
            );
        };

        const LoginView = ({ onLogin, accounts, templates, showToast }) => {
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');

            const handleSubmit = (e) => {
                e.preventDefault();
                const validAccounts = ((Array.isArray(accounts) && accounts.length > 0) ? accounts : initialAccounts).filter(isVisibleRecord);

                const user = validAccounts.find(u => 
                    String(u.username).trim().toLowerCase() === String(username).trim().toLowerCase() && 
                    String(u.password).trim() === String(password).trim()
                );
                
                if (user) {
                    onLogin(user);
                } else {
                    setError('Username atau password salah!');
                }
            };

            return (
                <div className="min-h-screen bg-slate-900 flex flex-col justify-center items-center p-4">
                    <div className="max-w-md w-full bg-white rounded-2xl shadow-2xl p-8 transform transition-all">
                        <div className="text-center mb-8">
                            {templates && templates.companyLogo ? (
                                <img src={templates.companyLogo} alt="Logo Perusahaan" className="mx-auto max-h-24 object-contain mb-4 drop-shadow-sm rounded-lg" />
                            ) : (
                                <>
                                    <div className="mx-auto w-16 h-16 bg-red-100 text-red-500 rounded-full flex items-center justify-center mb-4">
                                        <IconScissors />
                                    </div>
                                    <h1 className="text-3xl font-extrabold tracking-wider text-slate-800 mb-1">SIMPATI</h1>
                                </>
                            )}
                            <p className="text-gray-500 font-medium">{templates?.companySubtitle || "Sistem Manajemen Produksi Konveksi"}</p>
                        </div>
                        
                        {error && (
                            <div className="bg-red-50 text-red-600 p-3 rounded-lg mb-6 text-sm text-center border border-red-200 font-medium flex items-center justify-center gap-2">
                                <IconAlertCircle /> {error}
                            </div>
                        )}

                        <form onSubmit={handleSubmit} className="space-y-6">
                            <div>
                                <label className="block text-sm font-semibold text-gray-700 mb-2">Username</label>
                                <input
                                    type="text" required
                                    autoComplete="username"
                                    className="w-full p-3.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
                                    placeholder="Masukkan username"
                                    value={username} onChange={e => setUsername(e.target.value)}
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-semibold text-gray-700 mb-2">Password</label>
                                <input
                                    type="password" required
                                    autoComplete="current-password"
                                    className="w-full p-3.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
                                    placeholder="Masukkan password"
                                    value={password} onChange={e => setPassword(e.target.value)}
                                />
                            </div>
                            <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-lg transition-colors shadow-lg shadow-blue-200 mt-4 text-lg">
                                Masuk
                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        const DashboardView = ({ orders, setOrders, showToast }) => {
            const safeOrders = (orders || []).filter(isVisibleOrder);
            const totalOrders = safeOrders.filter(o => !o?.isArchived).length;
            const activeOrders = safeOrders.filter(o => !o?.isArchived && o?.status !== 'Terkirim' && o?.status !== 'Siap Kirim').length;
            const doneOrders = safeOrders.filter(o => !o?.isArchived && o?.status === 'Siap Kirim').length;
            const shippedOrders = safeOrders.filter(o => !o?.isArchived && o?.status === 'Terkirim').length;

            const [deleteConfirmId, setDeleteConfirmId] = useState(null);
            const [editOrder, setEditOrder] = useState(null);
            const [editSizeInputs, setEditSizeInputs] = useState([]);
            const [insight, setInsight] = useState("");
            const [isInsightLoading, setIsInsightLoading] = useState(false);
            const [searchTerm, setSearchTerm] = useState('');
            const dashboardOrders = safeOrders.filter(o => !o?.isArchived && matchesSearch(orderSearchFields(o), searchTerm));

            // Ambil dan urutkan daftar nama marketing untuk auto-typing di Edit Modal
            const uniqueMarketingDashboard = [...new Set(safeOrders.map(o => o.marketing).filter(Boolean))].sort();

            const executeDeleteOrder = () => {
                if (deleteConfirmId !== null && deleteConfirmId !== undefined) {
                    const now = new Date().toISOString();
                    setOrders(prev => prev.map(o => String(o.id) === String(deleteConfirmId) ? { ...o, isDeleted: true, deletedAt: now, _syncUpdatedAt: now } : o));
                    setDeleteConfirmId(null);
                    showToast("Order berhasil dihapus dan tidak akan muncul lagi di perangkat lain.", "success");
                }
            };

            const openEditModal = (order) => {
                setEditOrder({
                    ...order,
                    processFlow: getOrderProcessFlow(order),
                    productionPrices: { ...getDefaultProductionPrices(), ...(order.productionPrices || {}) }
                });
                const sortedKeys = sortSizeKeys(Object.keys(order.sizes || {}));
                const sizesArray = sortedKeys.map((label, index) => ({ id: Date.now() + index, label, qty: order.sizes[label] }));
                while(sizesArray.length < 4) {
                    sizesArray.push({ id: Date.now() + sizesArray.length, label: '', qty: '' });
                }
                setEditSizeInputs(sizesArray);
            };

            const handleImageUploadEdit = (e, imageField) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 500;
                        let width = img.width, height = img.height;
                        if (width > MAX_WIDTH) { height = Math.round(height * (MAX_WIDTH / width)); width = MAX_WIDTH; }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        setEditOrder(prev => ({ ...prev, [imageField]: canvas.toDataURL('image/jpeg', 0.6) })); 
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            };

            const toggleEditOrderProcess = (processId) => {
                setEditOrder(prev => {
                    if (!prev) return prev;
                    const currentFlow = getOrderProcessFlow(prev);
                    const nextFlow = { ...currentFlow, [processId]: currentFlow[processId] === false };
                    let nextMaterialStatus = prev.materialStatus;
                    if (processId === 'materials') {
                        if (nextFlow.materials === false && (!nextMaterialStatus || nextMaterialStatus === 'Belum')) nextMaterialStatus = 'Tidak Perlu';
                        if (nextFlow.materials !== false && nextMaterialStatus === 'Tidak Perlu') nextMaterialStatus = 'Belum';
                    }
                    return { ...prev, processFlow: nextFlow, materialStatus: nextMaterialStatus };
                });
            };

            const updateEditProductionPrice = (stageId, value) => {
                setEditOrder(prev => {
                    if (!prev) return prev;
                    return { ...prev, productionPrices: { ...getDefaultProductionPrices(), ...(prev.productionPrices || {}), [stageId]: value } };
                });
            };

            const handleSaveEditOrder = (e) => {
                e.preventDefault();
                const finalSizes = {};
                let total = 0;
                editSizeInputs.forEach(item => {
                    const parsedQty = parseInt(item.qty) || 0;
                    if (parsedQty > 0) {
                        finalSizes[item.label || 'Custom'] = parsedQty;
                        total += parsedQty;
                    }
                });
                if(total <= 0) { showToast("Jumlah total tidak boleh kosong.", "error"); return; }
                
                setOrders(prev => prev.map(o => {
                    if (String(o.id) === String(editOrder.id)) {
                        return {
                            ...o,
                            client: editOrder.client,
                            type: editOrder.type,
                            deadline: editOrder.deadline,
                            notes: editOrder.notes,
                            sizes: finalSizes,
                            total: total,
                            designImage1: editOrder.designImage1,
                            designImage2: editOrder.designImage2,
                            marketing: editOrder.marketing,
                            processFlow: { ...getDefaultOrderProcessFlow(), ...(editOrder.processFlow || {}) },
                            productionPrices: { ...getDefaultProductionPrices(), ...(editOrder.productionPrices || {}) },
                            materialStatus: editOrder.materialStatus || ((editOrder.processFlow || {}).materials === false ? 'Tidak Perlu' : o.materialStatus)
                        };
                    }
                    return o;
                }));
                
                setEditOrder(null);
                showToast("Data Order berhasil diperbarui!", "success");
            };

            const handleGenerateInsight = async () => {
                setIsInsightLoading(true);
                setInsight("");
                try {
                    const activeData = safeOrders.filter(o => !o?.isArchived).map(o => ({ id: o.id, status: o.status, deadline: o.deadline }));
                    const prompt = `Data: ${JSON.stringify(activeData)}. Berikan analisis 2 kalimat terkait deadline pabrik saya.`;
                    const res = await generateGeminiContent(prompt);
                    setInsight(res);
                } catch (error) {
                    showToast("AI Sedang Sibuk / API Key Kosong", "error");
                } finally {
                    setIsInsightLoading(false);
                }
            };

            return (
                <div className="space-y-6">
                    <div className="flex justify-between items-center">
                        <h2 className="text-2xl font-bold text-gray-800">Dashboard</h2>
                        <button onClick={handleGenerateInsight} disabled={isInsightLoading} className="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-2">
                            {isInsightLoading ? <div className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div> : <IconSparkles />} AI Insight
                        </button>
                    </div>

                    {insight && (
                        <div className="bg-indigo-50 border border-indigo-200 p-4 rounded-lg flex items-start gap-3">
                            <IconSparkles className="text-indigo-600" />
                            <p className="text-sm text-indigo-800">{insight}</p>
                        </div>
                    )}

                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <Card className="border-l-4 border-l-blue-500"><h3 className="text-gray-500 text-sm font-medium">Total Order Masuk</h3><p className="text-3xl font-bold text-gray-800 mt-2">{totalOrders}</p></Card>
                        <Card className="border-l-4 border-l-yellow-500"><h3 className="text-gray-500 text-sm font-medium">Sedang Diproses</h3><p className="text-3xl font-bold text-gray-800 mt-2">{activeOrders}</p></Card>
                        <Card className="border-l-4 border-l-green-500"><h3 className="text-gray-500 text-sm font-medium">Selesai Produksi</h3><p className="text-3xl font-bold text-gray-800 mt-2">{doneOrders}</p></Card>
                        <Card className="border-l-4 border-l-purple-500"><h3 className="text-gray-500 text-sm font-medium">Menunggu Diarsipkan</h3><p className="text-3xl font-bold text-gray-800 mt-2">{shippedOrders}</p></Card>
                    </div>

                    <Card>
                        <div className="flex flex-col md:flex-row md:items-end md:justify-between gap-4 mb-4">
                            <h3 className="text-lg font-bold text-gray-800">Progress Produksi Berjalan</h3>
                            <div className="w-full md:w-80">
                                <SearchField value={searchTerm} onChange={setSearchTerm} placeholder="Cari ID, klien, barang, status..." />
                            </div>
                        </div>
                        <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse">
                                <thead>
                                    <tr className="bg-gray-50 border-b border-gray-200">
                                        <th className="p-3 text-sm font-semibold text-gray-600">ID Order</th>
                                        <th className="p-3 text-sm font-semibold text-gray-600">Instansi/Klien</th>
                                        <th className="p-3 text-sm font-semibold text-gray-600">Barang</th>
                                        <th className="p-3 text-sm font-semibold text-gray-600">Status Saat Ini</th>
                                        <th className="p-3 text-sm font-semibold text-gray-600">Deadline</th>
                                        <th className="p-3 text-sm font-semibold text-gray-600 text-center">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {dashboardOrders.map(order => (
                                        <tr key={order.id} className="border-b border-gray-100 hover:bg-gray-50 transition-colors">
                                            <td className="p-3 text-sm font-medium text-blue-600">{order.id}</td>
                                            <td className="p-3 text-sm text-gray-800">{order.client}</td>
                                            <td className="p-3 text-sm text-gray-600">{order.type} ({order.total} pcs)</td>
                                            <td className="p-3"><Badge status={order.status} /></td>
                                            <td className="p-3 text-sm text-gray-600">{order.deadline}</td>
                                            <td className="p-3 text-center flex justify-center space-x-2">
                                                <button onClick={() => openEditModal(order)} className="text-blue-500 hover:text-blue-700 bg-blue-50 hover:bg-blue-100 p-1.5 rounded-md transition-colors" title="Edit Order">
                                                    <IconEdit />
                                                </button>
                                                <button onClick={() => setDeleteConfirmId(order.id)} className="text-red-500 hover:text-red-700 bg-red-50 hover:bg-red-100 p-1.5 rounded-md transition-colors" title="Hapus Order">
                                                    <IconTrash />
                                                </button>
                                                {order.status === 'Terkirim' && (
                                                    <button 
                                                        onClick={() => {
                                                            setOrders(prev => prev.map(o => String(o.id) === String(order.id) ? { ...o, isArchived: true } : o));
                                                            showToast("Order dipindahkan ke Riwayat!", "success");
                                                        }} 
                                                        className="text-purple-600 hover:text-purple-800 bg-purple-50 hover:bg-purple-100 p-1.5 rounded-md transition-colors" 
                                                        title="Arsipkan Order"
                                                    >
                                                        <IconArchive />
                                                    </button>
                                                )}
                                            </td>
                                        </tr>
                                    ))}
                                    {dashboardOrders.length === 0 && (
                                        <tr><td colSpan="6" className="p-4 text-center text-sm text-gray-500 italic">{searchTerm ? 'Tidak ada order yang cocok dengan pencarian.' : 'Tidak ada order yang sedang berjalan.'}</td></tr>
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </Card>

                    {editOrder && (
                        <div className="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-[100] p-4">
                            <div className="bg-white p-6 rounded-xl shadow-xl w-full max-w-4xl max-h-[95vh] overflow-y-auto">
                                <h3 className="text-xl font-bold text-gray-900 mb-4 border-b pb-2">Edit Data Order: {editOrder.id}</h3>
                                <form onSubmit={handleSaveEditOrder} className="space-y-4">
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div><label className="block text-sm mb-1 font-semibold">Nama Klien / Instansi</label><input required type="text" className="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500" value={editOrder.client} onChange={e => setEditOrder({...editOrder, client: e.target.value})} /></div>
                                        <div><label className="block text-sm mb-1 font-semibold">Jenis Barang</label><input required type="text" className="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500" value={editOrder.type} onChange={e => setEditOrder({...editOrder, type: e.target.value})} /></div>
                                        <div><label className="block text-sm mb-1 font-semibold">Tanggal Masuk</label><input required type="date" disabled className="w-full p-2 border rounded bg-gray-100 text-gray-500" value={editOrder.date} /></div>
                                        <div><label className="block text-sm mb-1 font-semibold">Deadline Produksi</label><input required type="date" className="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500" value={editOrder.deadline} onChange={e => setEditOrder({...editOrder, deadline: e.target.value})} /></div>
                                        <div>
                                            <label className="block text-sm mb-1 font-semibold">Nama Marketing</label>
                                            <input list="edit-marketing-list" type="text" className="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500" value={editOrder.marketing || ''} onChange={e => setEditOrder({...editOrder, marketing: e.target.value})} placeholder="Opsional" />
                                            <datalist id="edit-marketing-list">
                                                {uniqueMarketingDashboard.map((m, i) => <option key={i} value={m} />)}
                                            </datalist>
                                        </div>
                                    </div>

                                    <div className="p-4 bg-gray-50 rounded border">
                                        <label className="block font-bold mb-2 text-sm">Ubah Rincian Ukuran</label>
                                        <div className="grid grid-cols-4 md:grid-cols-8 gap-2">
                                            {editSizeInputs.map((s, i) => (
                                                <div key={s.id}>
                                                    <input type="text" className="w-full text-center text-xs font-bold bg-transparent border-b border-gray-300 outline-none focus:border-blue-500" value={s.label} onChange={e => {const n=[...editSizeInputs]; n[i].label=e.target.value; setEditSizeInputs(n)}} placeholder="Size"/>
                                                    <input type="number" min="0" className="w-full p-1 text-center border rounded mt-1 focus:ring-1 focus:ring-blue-500" value={s.qty === 0 ? '' : s.qty} onChange={e => {const n=[...editSizeInputs]; n[i].qty=e.target.value; setEditSizeInputs(n)}} placeholder="0"/>
                                                </div>
                                            ))}
                                        </div>
                                        <button type="button" onClick={() => setEditSizeInputs([...editSizeInputs, { id: Date.now(), label: '', qty: '' }])} className="text-xs text-blue-600 font-bold mt-2">+ Tambah Kolom</button>
                                    </div>

                                    <div className="p-4 bg-blue-50 rounded-lg border border-blue-100">
                                        <label className="block text-sm font-semibold text-blue-900 mb-3">Alur Proses Order</label>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2">
                                            {orderProcessOptions.map(process => {
                                                const checked = getOrderProcessFlow(editOrder)[process.id] !== false;
                                                return (
                                                    <label key={process.id} className={`flex items-center gap-2 text-sm border rounded-lg p-3 cursor-pointer ${checked ? 'bg-white border-blue-300 text-blue-900' : 'bg-gray-50 border-gray-200 text-gray-500'}`}>
                                                        <input type="checkbox" checked={checked} onChange={() => toggleEditOrderProcess(process.id)} />
                                                        <span className="font-bold">{process.label}</span>
                                                    </label>
                                                );
                                            })}
                                        </div>
                                    </div>

                                    <div className="p-4 bg-green-50 rounded-lg border border-green-100">
                                        <label className="block text-sm font-semibold text-green-900 mb-3">Harga Produksi per Pcs</label>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                                            {productionStageOptions.filter(stage => getOrderProcessFlow(editOrder)[stage.id] !== false).map(stage => (
                                                <div key={stage.id}>
                                                    <label className="block text-xs font-bold text-green-800 mb-1">{stage.label}</label>
                                                    <input type="number" min="0" className="w-full p-2 border border-green-200 rounded-lg focus:ring-green-500 bg-white" placeholder="Rp / pcs" value={(editOrder.productionPrices || {})[stage.id] || ''} onChange={e => updateEditProductionPrice(stage.id, e.target.value)} />
                                                </div>
                                            ))}
                                            {productionStageOptions.filter(stage => getOrderProcessFlow(editOrder)[stage.id] !== false).length === 0 && (
                                                <div className="text-sm text-green-800 font-semibold bg-white border border-green-100 rounded-lg p-3 sm:col-span-2 md:col-span-3">Belum ada tahap produksi yang dipilih.</div>
                                            )}
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">Ganti Desain Depan</label>
                                            <div className="border border-dashed border-gray-300 p-2 rounded text-center relative hover:bg-gray-50">
                                                {editOrder.designImage1 ? (
                                                    <div className="relative inline-block">
                                                        <img src={editOrder.designImage1} className="max-h-24 rounded object-contain mx-auto" />
                                                        <button type="button" onClick={() => setEditOrder({...editOrder, designImage1: ''})} className="absolute top-1 right-1 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs font-bold shadow-md">&times;</button>
                                                    </div>
                                                ) : (
                                                    <div className="py-2"><IconImage className="mx-auto text-gray-400 mb-1" /><span className="text-xs text-blue-600 font-medium">Unggah Desain 1</span></div>
                                                )}
                                                <input type="file" accept="image/*" onChange={(e) => handleImageUploadEdit(e, 'designImage1')} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
                                            </div>
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">Ganti Desain Belakang</label>
                                            <div className="border border-dashed border-gray-300 p-2 rounded text-center relative hover:bg-gray-50">
                                                {editOrder.designImage2 ? (
                                                    <div className="relative inline-block">
                                                        <img src={editOrder.designImage2} className="max-h-24 rounded object-contain mx-auto" />
                                                        <button type="button" onClick={() => setEditOrder({...editOrder, designImage2: ''})} className="absolute top-1 right-1 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs font-bold shadow-md">&times;</button>
                                                    </div>
                                                ) : (
                                                    <div className="py-2"><IconImage className="mx-auto text-gray-400 mb-1" /><span className="text-xs text-blue-600 font-medium">Unggah Desain 2</span></div>
                                                )}
                                                <input type="file" accept="image/*" onChange={(e) => handleImageUploadEdit(e, 'designImage2')} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
                                            </div>
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-sm font-semibold mb-1">Catatan Tambahan</label>
                                        <textarea rows="3" className="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500" value={editOrder.notes} onChange={e => setEditOrder({...editOrder, notes: e.target.value})}></textarea>
                                    </div>

                                    <div className="flex justify-end space-x-3 pt-4 border-t">
                                        <button type="button" onClick={() => setEditOrder(null)} className="px-5 py-2 font-medium text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">Batal</button>
                                        <button type="submit" className="px-5 py-2 font-medium bg-blue-600 text-white hover:bg-blue-700 rounded-lg transition-colors">Simpan Perubahan</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {deleteConfirmId && (
                        <div className="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-[100] transition-opacity">
                            <div className="bg-white p-6 rounded-xl shadow-xl max-w-sm w-full mx-4 transform transition-all">
                                <h3 className="text-lg font-bold text-gray-900 mb-2">Konfirmasi Hapus</h3>
                                <p className="text-gray-600 mb-6">Apakah Anda yakin ingin menghapus order ini dari semua tampilan dan perangkat?</p>
                                <div className="flex justify-end space-x-3">
                                    <button onClick={() => setDeleteConfirmId(null)} className="px-4 py-2 font-medium text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">Batal</button>
                                    <button onClick={executeDeleteOrder} className="px-4 py-2 font-medium bg-red-600 text-white hover:bg-red-700 rounded-lg transition-colors">Hapus</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const AntreanProduksiView = ({ orders, isTVMode, setIsTVMode }) => {
            const [isLocked, setIsLocked] = useState(false);
            const [searchTerm, setSearchTerm] = useState('');

            const safeOrders = (orders || []).filter(isVisibleOrder);
            const sortedOrders = [...safeOrders]
                .filter(o => !o?.isArchived && o?.status !== 'Terkirim')
                .filter(o => matchesSearch(orderSearchFields(o), searchTerm))
                .sort((a, b) => new Date(a.deadline || 0) - new Date(b.deadline || 0));

            const openTVModeFullscreen = async () => {
                setIsLocked(false);
                setIsTVMode(true);
                try {
                    if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
                        await document.documentElement.requestFullscreen();
                    }
                } catch (err) {
                    console.warn('Mode fullscreen tidak bisa dibuka otomatis:', err);
                }
            };

            const closeTVModeFullscreen = async () => {
                setIsLocked(false);
                setIsTVMode(false);
                try {
                    if (document.fullscreenElement && document.exitFullscreen) {
                        await document.exitFullscreen();
                    }
                } catch (err) {
                    console.warn('Mode fullscreen tidak bisa ditutup otomatis:', err);
                }
            };

            useEffect(() => {
                const handleFullscreenChange = () => {
                    if (!document.fullscreenElement && isTVMode) {
                        setIsLocked(false);
                        setIsTVMode(false);
                    }
                };

                document.addEventListener('fullscreenchange', handleFullscreenChange);
                return () => document.removeEventListener('fullscreenchange', handleFullscreenChange);
            }, [isTVMode, setIsTVMode]);

            const renderCards = (isDark = false) => {
                return sortedOrders.map((order, index) => {
                    const today = new Date();
                    today.setHours(0, 0, 0, 0); 
                    const deadlineDate = new Date(order.deadline || Date.now());
                    const diffTime = deadlineDate - today;
                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                    
                    let urgencyClass = isDark ? "border-slate-700 bg-slate-800" : "border-gray-200 bg-white";
                    let statusColor = isDark ? "text-slate-300" : "text-gray-500";
                    let titleColor = isDark ? "text-white" : "text-gray-800";
                    
                    if (order.status === 'Siap Kirim') {
                        urgencyClass = isDark ? "border-green-600 bg-green-900/30" : "border-green-400 bg-green-50";
                        statusColor = isDark ? "text-green-400" : "text-green-600";
                        titleColor = isDark ? "text-green-100" : "text-green-900";
                    } else if (diffDays <= 3) {
                        urgencyClass = isDark ? "border-red-600 bg-red-900/40 animate-tv-urgent" : "border-red-400 bg-red-50";
                        statusColor = isDark ? "text-red-300" : "text-red-600";
                        titleColor = isDark ? "text-red-100" : "text-red-900";
                    } else if (diffDays <= 7) {
                        urgencyClass = isDark ? "border-orange-500 bg-orange-900/30" : "border-orange-300 bg-orange-50";
                        statusColor = isDark ? "text-orange-300" : "text-orange-600";
                        titleColor = isDark ? "text-orange-100" : "text-orange-900";
                    }

                    return (
                        <div key={order.id} className={`p-4 rounded-xl border-2 shadow-sm flex flex-col md:flex-row gap-4 items-start md:items-center transition-all ${urgencyClass}`}>
                            <div className={`text-4xl font-black opacity-30 w-12 text-center shrink-0 ${isDark ? 'text-white' : 'text-gray-900'}`}>#{index + 1}</div>
                            
                            <div className={`w-20 h-20 md:w-24 md:h-24 shrink-0 rounded-lg border-2 flex items-center justify-center overflow-hidden bg-white ${isDark ? 'border-slate-600' : 'border-gray-200'}`}>
                                {order.designImage1 ? (
                                    <img src={order.designImage1} alt="Desain" className="w-full h-full object-cover" />
                                ) : order.designImage2 ? (
                                    <img src={order.designImage2} alt="Desain" className="w-full h-full object-cover" />
                                ) : (
                                    <IconImage className={`w-8 h-8 opacity-20 ${isDark ? 'text-black' : 'text-gray-800'}`} />
                                )}
                            </div>
                            
                            <div className="flex-1">
                                <div className="flex items-center gap-2 mb-1">
                                    <h3 className={`text-xl font-bold ${titleColor}`}>{order.client}</h3>
                                    <span className={`px-2 py-0.5 rounded text-xs font-bold ${isDark ? 'bg-black/50 text-white' : 'bg-gray-200 text-gray-800'}`}>
                                        {order.id}
                                    </span>
                                </div>
                                <p className={`text-sm font-medium ${isDark ? 'text-gray-300' : 'text-gray-700'}`}>
                                    {order.type} &bull; <span className="font-bold">{order.total} pcs</span>
                                </p>
                                {order.notes && (
                                    <p className={`mt-2 text-sm italic border-l-2 pl-2 py-0.5 ${isDark ? 'border-slate-500 text-slate-400' : 'border-gray-300 text-gray-500'}`}>
                                        "{order.notes}"
                                    </p>
                                )}
                            </div>

                            <div className="md:text-right shrink-0 min-w-[200px]">
                                <div className={`text-sm font-bold mb-1 ${statusColor}`}>
                                    Sisa Waktu: {diffDays < 0 ? 'TERLEWAT' : diffDays === 0 ? 'HARI INI' : `${diffDays} Hari`}
                                </div>
                                <div className={`text-2xl font-black ${titleColor}`}>{order.deadline}</div>
                                <div className="mt-2 inline-block">
                                    <Badge status={order.status} />
                                </div>
                            </div>
                        </div>
                    );
                });
            };

            if (isTVMode) {
                return (
                    <div className={`fixed inset-0 z-[100] bg-slate-950 overflow-y-auto hide-scrollbar text-white p-6 md:p-12 font-sans ${isLocked ? 'cursor-none' : ''}`}>
                        <div className="max-w-7xl mx-auto">
                            {!isLocked && (
                                <div className="flex justify-between items-end mb-8 border-b border-slate-800 pb-4">
                                    <div>
                                        <h1 className="text-4xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-300">
                                            ANTREAN PRODUKSI
                                        </h1>
                                        <p className="text-slate-400 mt-2 text-lg">Pabrik Simpati Konveksi &bull; Diurutkan berdasarkan deadline terdekat</p>
                                    </div>
                                    <div className="flex flex-col items-end gap-4">
                                        <div className="text-2xl font-bold text-slate-300 bg-slate-800 px-4 py-2 rounded-lg">
                                            {new Date().toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}
                                        </div>
                                        <div className="flex gap-2">
                                            <button 
                                                onClick={() => setIsLocked(true)}
                                                className="text-sm bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition-colors shadow-lg shadow-blue-900/50 flex items-center gap-2 font-bold"
                                            >
                                                <IconLock /> Kunci Layar TV
                                            </button>
                                            <button 
                                                onClick={closeTVModeFullscreen}
                                                className="text-sm bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-lg transition-colors border border-slate-700"
                                            >
                                                &times; Tutup TV Mode
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {isLocked && (
                                <div className="flex justify-between items-center mb-8">
                                    <h1 className="text-3xl font-black tracking-widest text-slate-500 uppercase">
                                        MONITOR PRODUKSI
                                    </h1>
                                    <button 
                                        onClick={() => setIsLocked(false)}
                                        className="opacity-10 hover:opacity-100 transition-opacity p-2 bg-slate-800 rounded-full cursor-pointer pointer-events-auto"
                                        title="Buka Kunci Layar"
                                    >
                                        <IconUnlock />
                                    </button>
                                </div>
                            )}

                            <div className="flex flex-wrap gap-4 md:gap-6 mb-6 text-sm font-bold text-slate-400 bg-slate-900 p-4 rounded-xl border border-slate-800">
                                <div className="flex items-center gap-2"><span className="w-3 h-3 rounded-full bg-red-600 animate-pulse"></span> Sangat Urgent (&lt; 3 Hari)</div>
                                <div className="flex items-center gap-2"><span className="w-3 h-3 rounded-full bg-orange-500"></span> Waspada (&lt; 7 Hari)</div>
                                <div className="flex items-center gap-2"><span className="w-3 h-3 rounded-full bg-slate-700"></span> Aman</div>
                                <div className="flex items-center gap-2"><span className="w-3 h-3 rounded-full bg-green-500"></span> Siap Kirim</div>
                            </div>

                            {sortedOrders.length > 0 ? (
                                <div className="flex flex-col gap-4 pb-20">
                                    {renderCards(true)}
                                </div>
                            ) : (
                                <div className="text-center py-20 text-slate-500 text-xl font-bold border-2 border-dashed border-slate-800 rounded-2xl">
                                    Tidak ada antrean order produksi saat ini.
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            return (
                <div className="space-y-6">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <h2 className="text-2xl font-bold text-gray-800">Monitor Antrean Produksi</h2>
                            <p className="text-gray-500 text-sm mt-1">Urutan prioritas pengerjaan berdasarkan target tanggal selesai.</p>
                        </div>
                        <button 
                            onClick={openTVModeFullscreen}
                            className="bg-slate-900 hover:bg-slate-800 text-white px-5 py-2.5 rounded-lg font-bold shadow-lg transition-colors flex items-center gap-2"
                        >
                            <IconMonitor /> Buka Mode Layar TV (Monitor)
                        </button>
                    </div>

                    <Card className="bg-blue-50/50">
                        <div className="mb-4">
                            <SearchField value={searchTerm} onChange={setSearchTerm} placeholder="Cari ID order, instansi, barang, status, deadline..." />
                        </div>
                        {sortedOrders.length > 0 ? (
                            <div className="flex flex-col gap-4">
                                {renderCards(false)}
                            </div>
                        ) : (
                            <div className="text-center py-10 text-gray-500 italic">{searchTerm ? 'Tidak ada antrean yang cocok dengan pencarian.' : 'Belum ada pesanan aktif.'}</div>
                        )}
                    </Card>
                </div>
            );
        };

        const KaryawanView = ({ employees, setEmployees, showToast }) => {
            const [showForm, setShowForm] = useState(false);
            const [newEmp, setNewEmp] = useState({ name: '', division: 'Cutting', phone: '', status: 'Aktif', salaryType: 'Produksi', dailySalary: '' });
            
            const [editEmp, setEditEmp] = useState(null);
            const [deleteConfirmId, setDeleteConfirmId] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');
            const [cashAdvanceEmp, setCashAdvanceEmp] = useState(null);
            const [cashAdvanceForm, setCashAdvanceForm] = useState({ date: new Date().toISOString().slice(0, 10), amount: '', note: '', status: 'Belum Dipotong' });
            const [editingCashAdvanceId, setEditingCashAdvanceId] = useState(null);
            const [dailySalaryEmp, setDailySalaryEmp] = useState(null);
            const [dailySalaryForm, setDailySalaryForm] = useState({ date: new Date().toISOString().slice(0, 10), workDays: '', dailySalary: '', overtimeCount: '', overtimeRate: '', note: '' });
            const [editingDailySalaryId, setEditingDailySalaryId] = useState(null);

            const safeEmployees = (employees || []).filter(isVisibleRecord);
            const filteredEmployees = safeEmployees.filter(emp => matchesSearch([emp.name, emp.division, emp.phone, emp.status], searchTerm));
            const activeCashAdvanceEmp = cashAdvanceEmp ? safeEmployees.find(emp => String(emp.id) === String(cashAdvanceEmp.id)) || cashAdvanceEmp : null;
            const activeCashAdvanceSummary = getEmployeeCashAdvanceSummary(activeCashAdvanceEmp);
            const activeDailySalaryEmp = dailySalaryEmp ? safeEmployees.find(emp => String(emp.id) === String(dailySalaryEmp.id)) || dailySalaryEmp : null;
            const activeDailySalaryLogs = getEmployeeDailySalaryLogs(activeDailySalaryEmp);
            const activeDailySalaryTotal = activeDailySalaryLogs.reduce((sum, log) => sum + getDailySalaryLogTotal(log).total, 0);

            const handleAdd = (e) => {
                e.preventDefault();
                const now = new Date().toISOString();
                setEmployees(prev => [...(prev||[]), { ...newEmp, id: Date.now(), _syncUpdatedAt: now }]);
                setShowForm(false);
                setNewEmp({ name: '', division: 'Cutting', phone: '', status: 'Aktif', salaryType: 'Produksi', dailySalary: '' });
                showToast("Karyawan ditambahkan!", "success");
            };

            const handleSaveEdit = (e) => {
                e.preventDefault();
                const now = new Date().toISOString();
                setEmployees(prev => prev.map(emp => String(emp.id) === String(editEmp.id) ? { ...editEmp, _syncUpdatedAt: now } : emp));
                setEditEmp(null);
                showToast("Data Karyawan diperbarui!", "success");
            };

            const executeDeleteKaryawan = () => {
                if(deleteConfirmId !== null && deleteConfirmId !== undefined) {
                    const now = new Date().toISOString();
                    const deletedEmployee = safeEmployees.find(emp => String(emp.id) === String(deleteConfirmId));
                    setEmployees(prev => (prev || []).map(emp => String(emp.id) === String(deleteConfirmId) ? { ...emp, isDeleted: true, deletedAt: now, _syncUpdatedAt: now } : emp));
                    setDeleteConfirmId(null);
                    showToast("Karyawan dihapus.", "success");
                }
            };

            const resetCashAdvanceForm = () => {
                setCashAdvanceForm({ date: new Date().toISOString().slice(0, 10), amount: '', note: '', status: 'Belum Dipotong' });
                setEditingCashAdvanceId(null);
            };

            const openCashAdvanceModal = (emp) => {
                setCashAdvanceEmp(emp);
                resetCashAdvanceForm();
            };

            const saveCashAdvance = (e) => {
                e.preventDefault();
                if (!activeCashAdvanceEmp) return;
                const amount = safeMoney(cashAdvanceForm.amount);
                if (amount <= 0) {
                    showToast("Nominal kasbon harus lebih dari 0.", "error");
                    return;
                }
                const now = new Date().toISOString();
                setEmployees(prev => (prev || []).map(emp => {
                    if (String(emp.id) !== String(activeCashAdvanceEmp.id)) return emp;
                    const currentAdvances = Array.isArray(emp.cashAdvances) ? emp.cashAdvances : [];
                    const nextAdvance = {
                        id: editingCashAdvanceId || `KAS-${Date.now()}`,
                        date: cashAdvanceForm.date || now.slice(0, 10),
                        amount,
                        note: String(cashAdvanceForm.note || '').trim(),
                        status: cashAdvanceForm.status || 'Belum Dipotong',
                        deductedAmount: editingCashAdvanceId
                            ? getCashAdvanceDeducted(currentAdvances.find(item => String(item.id) === String(editingCashAdvanceId)))
                            : 0,
                        updatedAt: now
                    };
                    nextAdvance.status = normalizeCashAdvanceStatus(nextAdvance);
                    const nextCashAdvances = editingCashAdvanceId
                        ? currentAdvances.map(item => String(item.id) === String(editingCashAdvanceId) ? { ...item, ...nextAdvance } : item)
                        : [...currentAdvances, { ...nextAdvance, createdAt: now }];
                    return { ...emp, cashAdvances: nextCashAdvances, _syncUpdatedAt: now };
                }));
                resetCashAdvanceForm();
                showToast(editingCashAdvanceId ? "Kasbon diperbarui." : "Kasbon ditambahkan.", "success");
            };

            const editCashAdvance = (cashAdvance) => {
                setEditingCashAdvanceId(cashAdvance.id);
                setCashAdvanceForm({
                    date: cashAdvance.date || new Date().toISOString().slice(0, 10),
                    amount: getCashAdvanceAmount(cashAdvance),
                    note: cashAdvance.note || '',
                    status: cashAdvance.status || normalizeCashAdvanceStatus(cashAdvance)
                });
            };

            const deleteCashAdvance = (cashAdvanceId) => {
                if (!activeCashAdvanceEmp) return;
                const now = new Date().toISOString();
                setEmployees(prev => (prev || []).map(emp => {
                    if (String(emp.id) !== String(activeCashAdvanceEmp.id)) return emp;
                    const nextCashAdvances = (emp.cashAdvances || []).map(item => String(item.id) === String(cashAdvanceId)
                        ? { ...item, isDeleted: true, deletedAt: now, _syncUpdatedAt: now }
                        : item
                    );
                    return { ...emp, cashAdvances: nextCashAdvances, _syncUpdatedAt: now };
                }));
                if (String(editingCashAdvanceId) === String(cashAdvanceId)) resetCashAdvanceForm();
                showToast("Kasbon dihapus.", "success");
            };

            const resetDailySalaryForm = () => {
                setDailySalaryForm({ date: new Date().toISOString().slice(0, 10), workDays: '', dailySalary: '', overtimeCount: '', overtimeRate: '', note: '' });
                setEditingDailySalaryId(null);
            };

            const openDailySalaryModal = (emp) => {
                setDailySalaryEmp(emp);
                setDailySalaryForm({ date: new Date().toISOString().slice(0, 10), workDays: '', dailySalary: emp.dailySalary || '', overtimeCount: '', overtimeRate: '', note: '' });
                setEditingDailySalaryId(null);
            };

            const saveDailySalaryLog = (e) => {
                e.preventDefault();
                if (!activeDailySalaryEmp) return;
                const now = new Date().toISOString();
                const row = {
                    id: editingDailySalaryId || `DAY-${Date.now()}`,
                    date: dailySalaryForm.date || now.slice(0, 10),
                    workDays: safeMoney(dailySalaryForm.workDays),
                    dailySalary: safeMoney(dailySalaryForm.dailySalary),
                    overtimeCount: safeMoney(dailySalaryForm.overtimeCount),
                    overtimeRate: safeMoney(dailySalaryForm.overtimeRate),
                    note: String(dailySalaryForm.note || '').trim(),
                    updatedAt: now
                };
                setEmployees(prev => (prev || []).map(emp => {
                    if (String(emp.id) !== String(activeDailySalaryEmp.id)) return emp;
                    const currentLogs = Array.isArray(emp.dailySalaryLogs) ? emp.dailySalaryLogs : [];
                    const nextLogs = editingDailySalaryId
                        ? currentLogs.map(item => String(item.id) === String(editingDailySalaryId) ? { ...item, ...row } : item)
                        : [{ ...row, createdAt: now }, ...currentLogs];
                    const nextTypes = [...new Set([...getEmployeeSalaryTypes(emp), 'Harian'])];
                    return { ...emp, dailySalary: row.dailySalary || emp.dailySalary || 0, salaryType: nextTypes.length > 1 ? 'Campuran' : nextTypes[0], salaryTypes: nextTypes, dailySalaryLogs: nextLogs, _syncUpdatedAt: now };
                }));
                resetDailySalaryForm();
                showToast(editingDailySalaryId ? "Gaji harian diperbarui." : "Gaji harian ditambahkan.", "success");
            };

            const editDailySalaryLog = (log) => {
                setEditingDailySalaryId(log.id);
                setDailySalaryForm({
                    date: log.date || new Date().toISOString().slice(0, 10),
                    workDays: log.workDays || '',
                    dailySalary: log.dailySalary || '',
                    overtimeCount: log.overtimeCount || '',
                    overtimeRate: log.overtimeRate || '',
                    note: log.note || ''
                });
            };

            const deleteDailySalaryLog = (logId) => {
                if (!activeDailySalaryEmp) return;
                const now = new Date().toISOString();
                setEmployees(prev => (prev || []).map(emp => {
                    if (String(emp.id) !== String(activeDailySalaryEmp.id)) return emp;
                    const nextLogs = (emp.dailySalaryLogs || []).map(item => String(item.id) === String(logId) ? { ...item, isDeleted: true, deletedAt: now, _syncUpdatedAt: now } : item);
                    return { ...emp, dailySalaryLogs: nextLogs, _syncUpdatedAt: now };
                }));
                if (String(editingDailySalaryId) === String(logId)) resetDailySalaryForm();
                showToast("Gaji harian dihapus.", "success");
            };

            return (
                <div className="space-y-6">
                    <div className="flex justify-between items-center">
                        <h2 className="text-2xl font-bold text-gray-800">Data Karyawan</h2>
                        <button onClick={() => setShowForm(!showForm)} className="bg-blue-600 text-white px-4 py-2 rounded-lg flex items-center gap-2 text-sm font-medium"><IconPlusCircle /> Tambah Karyawan</button>
                    </div>

                    {showForm && (
                        <Card className="bg-blue-50 border-blue-100">
                            <h3 className="font-bold text-blue-900 mb-3 border-b pb-2">Tambah Karyawan Baru</h3>
                            <form onSubmit={handleAdd} className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div><label className="block text-sm mb-1 font-semibold">Nama</label><input required type="text" className="w-full p-2 border rounded" value={newEmp.name} onChange={e => setNewEmp({...newEmp, name: e.target.value})} /></div>
                                <div>
                                    <label className="block text-sm mb-1 font-semibold">Divisi</label>
                                    <select className="w-full p-2 border rounded" value={newEmp.division} onChange={e => setNewEmp({...newEmp, division: e.target.value})}>
                                        <option>Cutting</option>
                                        <option>Sablon/Bordir</option>
                                        <option>Jahit</option>
                                        <option>Pasang Kancing</option>
                                        <option>Finishing</option>
                                        <option>Marketing</option>
                                    </select>
                                </div>
                                <div><label className="block text-sm mb-1 font-semibold">No HP</label><input type="text" className="w-full p-2 border rounded" value={newEmp.phone} onChange={e => setNewEmp({...newEmp, phone: e.target.value})} /></div>
