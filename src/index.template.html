    (function () {
        try {
            if (/^#[a-z-]+=/.test(location.hash || '')) return;
            var l = document.createElement('link'); l.rel = 'manifest'; l.href = '/manifest.webmanifest'; document.head.appendChild(l);
            if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
                window.addEventListener('load', function () { navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' }).catch(function () {}); });
            }
        } catch (e) { /* abaikan */ }
    })();
    </script>

    <!-- Link slip gaji (karyawan & driver): data rekap & pengaturan mulai diunduh sejak awal, bersamaan dengan aplikasi,
         agar halaman lebih cepat tampil di HP. Aplikasi memakai hasil ini bila cocok; bila gagal, aplikasi mengunduh sendiri seperti biasa.
         Alamat & kunci publik Supabase diisi otomatis saat build dari src/app.jsx. -->
    <script>
    (function () {
        try {
            var h = location.hash || '', U = '__SB_URL__', K = '__SB_KEY__', koleksi = '', id = '', kol = 'id', pakaiTpl = false;
            // [awalan link, daftar data, kolom pencocok, perlu pengaturan tampilan (logo/nama usaha)?]
            var jenis = [
                ['#rekap-gaji=', 'rekapKinerja', 'id', true],
                ['#driver-rekap-gaji=', 'driverRekapGaji', 'id', true],
                ['#dana=', 'danaOperasional', 'shareToken', true],
                ['#nota-vendor=', 'purchaseNotes', 'shareToken', true],
                ['#biaya=', 'expenses', 'shareToken', true],
                ['#invoice-share=', 'invoices', 'invoiceShareToken', false],
                ['#promosi-share=', 'bagiHasilPromosi', 'shareToken', false],
                ['#investor-share=', 'investors', 'shareToken', false],
                ['#marketing-share=', 'employees', 'marketingShareToken', false]
            ];
            for (var j = 0; j < jenis.length; j++) {
                if (h.indexOf(jenis[j][0]) === 0) { id = h.slice(jenis[j][0].length); koleksi = jenis[j][1]; kol = jenis[j][2]; pakaiTpl = jenis[j][3]; break; }
            }
            if (!koleksi || !window.fetch || !window.Promise) return;
            id = decodeURIComponent(id);
            if (!id) return;
            var hd = { apikey: K, Authorization: 'Bearer ' + K, 'Content-Type': 'application/json' };
            var json = function (r) { return r.ok ? r.json() : null; };
            // Fungsi share belum dipasang di Supabase: beri tahu aplikasi agar langsung memakai cara lama (tanpa mencoba lagi)
            var jsonRpc = function (r) { return r.ok ? r.json() : (r.status === 404 ? 'RPC_TIDAK_ADA' : null); };
            var kosong = function () { return null; };
            var kolom = ['companyLogoMini', 'companyName', 'companySubtitle', 'companyContact', 'companyAddress', 'showSignatureOnPrint', 'signatureSize', 'printMode', 'logoSize'];
            window.__shareAwal = {
                cocok: { kunci: koleksi + '|' + kol + '|' + id, p: fetch(U + '/rest/v1/rpc/share_cocok', { method: 'POST', headers: hd, body: JSON.stringify({ koleksi: koleksi, kolom: kol, nilai: id }) }).then(jsonRpc).catch(kosong) }
            };
            if (pakaiTpl) window.__shareAwal.tpl = { kunci: 'templates', kolom: kolom, p: fetch(U + '/rest/v1/app_data?id=eq.templates&select=' + kolom.map(function (k) { return k + ':data->' + k; }).join(','), { headers: hd }).then(json).then(function (d) { return Array.isArray(d) && d[0] ? d[0] : null; }).catch(kosong) };
        } catch (e) {}
    })();
    </script>
