    <!-- React & Tailwind (tiap library punya CDN cadangan kalau CDN utama gagal/diblokir). Versi dikunci agar tidak berubah sendiri. -->

    <!-- jsPDF — label export PDF -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" />
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Larger touch targets on mobile for small icon buttons */
        @media (max-width: 767px) {
            button { min-height: 36px; min-width: 36px; }
            /* Bottom tab bar safe area */
            .mobile-safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }
        }
        
        @media print {
            body { background-color: white; margin: 0; padding: 0; }
            @page {
                size: A4 portrait;
                margin: 1.2cm 1.5cm;
            }
            .print\:hidden { display: none !important; }

            /* Sembunyikan semua elemen di body, lalu tampilkan hanya jalur ke print area */
            body > *,
            #root > *,
            #root > * > * { visibility: hidden; }

            #quotation-print-area,
            #quotation-print-area * { visibility: visible; }

            #quotation-print-area {
                position: absolute !important;
                top: 0 !important;
                left: 0 !important;
                width: 100% !important;
                max-width: 100% !important;
                margin: 0 !important;
                padding: 12pt 0 !important;
                box-shadow: none !important;
                border: none !important;
                border-radius: 0 !important;
                background: white !important;
                font-size: 9.5pt !important;
                line-height: 1.45 !important;
                color: #1e293b !important;
                display: flex !important;
                flex-direction: column !important;
                min-height: calc(297mm - 2.4cm) !important;
            }
            #quotation-print-area .quo-spacer {
                flex-grow: 1 !important;
            }
            #quotation-print-area .quo-footer-block {
                page-break-inside: avoid !important;
                break-inside: avoid !important;
                flex-shrink: 0 !important;
            }
            #quotation-print-area * {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            #quotation-print-area table { font-size: 8.5pt !important; width: 100% !important; }
            #quotation-print-area th,
            #quotation-print-area td { padding: 5pt 6pt !important; }
            #quotation-print-area tbody tr { page-break-inside: avoid; }
            #quotation-print-area h1 { font-size: 14pt !important; }
            #quotation-print-area h2 { font-size: 11pt !important; }
            /* Grid syarat & ringkasan: font kompak */
            #quotation-print-area .text-\[11px\] { font-size: 8pt !important; }
            #quotation-print-area .text-xs { font-size: 8.5pt !important; }
            #quotation-print-area .text-base { font-size: 11pt !important; }

            /* ── Price List print area ── */
            #price-list-print-area,
            #price-list-print-area * { visibility: visible; }

            #price-list-print-area {
                display: flex !important;
                position: absolute !important;
                top: 0 !important; left: 0 !important;
                width: 100% !important;
                margin: 0 !important; padding: 0 !important;
                box-shadow: none !important;
                border: none !important;
                border-radius: 0 !important;
                background: white !important;
            }
            #price-list-print-area * {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            #price-list-print-area .pl-no-print { display: none !important; }
            #price-list-print-area .pl-page { box-shadow: none !important; border: none !important; margin: 0 !important; border-radius: 0 !important; max-width: 100% !important; width: 100% !important; min-height: 100vh !important; overflow: visible !important; }
            #price-list-print-area tbody tr { page-break-inside: avoid; }
        }

        @keyframes slideInUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .toast-enter { animation: slideInUp 0.3s ease-out forwards; }
        
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.5); }
            50% { box-shadow: 0 0 0 8px rgba(59, 130, 246, 0); }
        }
        .animate-pulse-glow { animation: pulse-glow 2s infinite; }
        
        @keyframes tv-urgent {
            0%, 100% { background-color: #7f1d1d; } 
            50% { background-color: #991b1b; } 
        }
        .animate-tv-urgent { animation: tv-urgent 2s infinite; }

        @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root">
        <div id="boot-fallback" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:#f3f4f6;font-family:Arial,sans-serif;">
            <div style="width:48px;height:48px;border:4px solid #cbd5e1;border-top-color:#2563eb;border-radius:50%;animation:boot-spin 0.8s linear infinite;"></div>
            <p style="margin-top:16px;color:#475569;font-size:14px;">Memuat aplikasi...</p>
        </div>
    </div>

    <script>
        window.__APP_BOOT_OK = false;
        function showBootError(msg) {
            if (window.__APP_BOOT_OK) return;
            var rootEl = document.getElementById('root');
            if (!rootEl) return;
            rootEl.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:#f8fafc;padding:24px;font-family:Arial,sans-serif;text-align:center;">' +
                '<div style="font-size:40px;margin-bottom:12px;">⚠️</div>' +
                '<h2 style="color:#dc2626;font-size:20px;font-weight:900;margin:0 0 8px;">Aplikasi Gagal Dimuat</h2>' +
                '<p style="color:#64748b;font-size:14px;margin:0 0 20px;max-width:420px;">Koneksi internet mungkin lambat/terblokir, atau perangkat kehabisan memori saat memuat aplikasi. Periksa koneksi internet Anda, lalu coba muat ulang.</p>' +
                '<button onclick="window.location.reload()" style="background:#2563eb;color:white;border:none;border-radius:8px;padding:12px 28px;font-size:15px;font-weight:700;cursor:pointer;">Muat Ulang</button>' +
                (msg ? '<div style="margin-top:16px;font-size:11px;color:#94a3b8;background:#f1f5f9;border-radius:6px;padding:8px;text-align:left;word-break:break-all;max-width:420px;">' + msg + '</div>' : '') +
                '</div>';
        }
        setTimeout(function() {
            if (window.__APP_BOOT_OK) return;
            if (typeof React === 'undefined' || typeof ReactDOM === 'undefined') {
                showBootError('Gagal memuat library aplikasi (React). Kemungkinan koneksi internet lambat atau terblokir.');
            } else {
                showBootError('Waktu muat terlalu lama (timeout). Cek koneksi internet Anda.');
            }
        }, 45000);
        if (typeof React === 'undefined' || typeof ReactDOM === 'undefined') {
            showBootError('Gagal memuat library aplikasi (React). Kemungkinan koneksi internet lambat atau terblokir.');
        }
    </script>

    <script>/*__APP_JS__*/</script>
</body>
</html>
